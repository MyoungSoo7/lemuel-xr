# ── 릴리스 선결 조건 ─────────────────────────────────────────────────────────
# ⚠️ `newchar_gates.py` 는 이 키를 읽지 않는다 — 게이트를 통과시키지도 막지도 않는다.
#    그 사실이 요점이다. 산문 한 줄로만 있으면 초록 앞에서 지워지므로, 릴리스 판단자가
#    한 파일에서 보게 만든다. AC 에는 넣지 않는다(남의 파일에 완료 판정을 묶지 않는다).
release_blockers:
  - id: rahab_designer_start_blockers
    note: >-
      designer 착수 차단 조건(seed §9). `docs/MVP-RAHAB.md` ·
      `docs/RAHAB-LOCKED-STRINGS.md` 둘이 미착수다.
      (`scripts/check_rahab_staging.py` 는 rev.10 에서 착수·실행됐다 — 이 줄이 rev.10
      직후까지 셋으로 세고 있었다. 차단 사유를 실제보다 하나 많게 셌다는 뜻이고,
      **차단 목록이 사실이 아니면 해제 판단도 사실이 아니다.**)
      이 파일이 존재한다는 사실을 "라합이 검사되고 있다"로 읽지 마라 —
      Scene 산출물 대상 게이트는 전부 BLOCKED 다.
    resolved: false
  - id: rahab_r1_latch_contract_outside_gate
    note: >-
      R1 래치 값 계약은 8키이고(seed §5 R1 표) 그중 7키가 newchar_gates.py 에
      yaml 키로 0회다(seed §10 C7). 나머지 하나인 id 만 :850 이 값을 대조하고,
      g2 는 그 id 존재만 본다 — 래치가 통째로 빠지거나 post_crisis_latch_scope 가
      mission 대신 session 으로 실려도 G2 는 초록이다. 이 미션은 수 2:15(높이·매달림)
      때문에 R1 위험이 가장 높은데, 그 축의 계약이 기계 검사 밖에 있다.
    resolved: false
  - id: rahab_exclusion_reverse_check_missing
    note: >-
      g0b 는 선언된 항목만 순회한다(newchar_gates.py:665). 배제장(verses-rahab.txt
      EXCLUDED)에 있는데 선언에 없는 절을 잡는 역방향 검사가 없다 — 그래서 여섯 절이
      rev.9 까지 사유 없이 떠 있었다(seed §10 C8). rev.10 이 선언에 채웠지만 그것은
      문서 통제일 뿐, 다음 판이 하나 더 빠뜨려도 잡을 수단은 여전히 없다.
    resolved: false
  - id: rahab_consent_delta_no_runtime
    note: >-
      동의 카드 6장의 거절 델타를 실행할 문법이 런타임에 없다(seed §10). kotlin 전문에서
      consent 는 0회다. 저작 트리는 동의를 선언하고 런타임은 읽지 않는다 —
      사용자 노출 층위의 R4 보호는 현재 0이다.
    resolved: false

# ── T1 신학 축 (2026-08-18) ────────────────────────────────────────────────────
# G5t 는 `safety_gates[].id: T1_*` 를 요구하거나, 없으면 여기에 부채를 등재하게 한다.
#
# 라합은 **등재가 아니라 선언**으로 간다. Scene 이 생기면서 축을 둘 자리가 생겼고,
# `theology_axis: {status: exempt}` 를 그대로 두면 G5t 가 FAIL 한다(축이 실재하는데
# 설정만 면제라고 적힌 상태 — 설정이 콘텐츠보다 늦은 것). 그래서 면제를 걷었다.
#
# 축은 `content/rahab/scene{1,2,5}.yml` 의 `T1_no_repentance_narrative_lint` 다.
# 토큰은 계열 7·8·9(낙인 소거 · 본문 밖 서사 · 공로화 인과) 7종으로, R2_R3 축에서
# **옮긴** 것이다 — 아래 `forbidden` 31종 합집합은 변하지 않는다. 옮긴 근거는
# `docs/THEOLOGY-REFERENCES.md` §라합: 여호수아 본문은 라합의 회개를 말하지 않으며
# 회개 서사는 4세기의 구성물이다. 그건 고난 귀속(R2)도 회복 압박(R3)도 아니라
# **본문 충실성** 문제다.
