# 라합(Theme 20) — 동결 seed `docs/SEED-RAHAB.md` rev.10 §7 의 입력을 옮긴 것.
#
# ⚠️ **이 파일이 있다고 라합이 검사된 것이 아니다.** `content/rahab/` 은 아직 없다.
#    Scene 산출물을 대상으로 하는 게이트는 전부 **BLOCKED(rc=2)** 로 떨어지며, 그것이
#    맞는 결과다. 지금 이 파일이 실제로 재는 것은 **설정 층위 네 게이트**뿐이다:
#      · G0b  — 배제 선언 29항이 `docs/verses-rahab.txt` 배제장에 실재하고 사용장에 부재한가
#      · G0e  — 배제 40항이 다른 인물 콘텐츠를 과차단하지 않는가
#      · G0c  — 토큰 31종 ↔ 예문 31개가 1:1 인가
#      · G0d  — 제품 말투 3문장이 토큰에 걸리는가(커버리지)
#    **BLOCKED 를 PASS 로 읽지 마라.** seed §9 의 designer 착수 차단 조건은 그대로다.
#
# 최상위 키는 `scripts/gates/ruth.yml` 과 같은 14개 + `release_blockers`.
character: rahab # REQUIRED_CFG (newchar_gates.py:463). 없으면 G0cfg FAIL → G0b·G0e·G9·G9d BLOCKED
ruleset: newchar-v5 # 토큰 규약 이후 인물 — legacy-baseline 면제 없음
scene_count: 5
test_identifier: "라합" # §5(c) — ForbiddenTokenConfigTest.kt 는 인물 식별자를 한국어로 남긴다

docs:
  mvp: docs/MVP-RAHAB.md
doc_min_lines:
  mvp: 420 # 룻 하한과 동일
# ⚠️ `docs/MVP-RAHAB.md` 는 **아직 없다** — designer 산출물이다. 그래서 g10 은 BLOCKED 다.
#    없는 문서를 선언하는 것이 함정임은 `scripts/gates/peter.yml:14-15` 가 경고한 그대로이나,
#    여기서는 **일부러 선언한다**: 이 항목이 비어 있으면 "MVP 문서가 필요 없다"로 읽히고,
#    BLOCKED 로 서 있으면 "필요한데 없다"로 읽힌다. 후자가 사실이다.

# ── G7 · G3d — R4 트리거 Scene / 위기 리마인더. 룻 선례대로 5개 Scene 전건.
#    헌장 §2.1-a 양방향 불변식: `trigger_categories` 를 가진 Scene 집합과 정확히 같아야 한다.
#    ⚠️ 그 불변식을 재는 게이트는 없다 — `trigger_categories` 는 newchar_gates.py 에 0회다.
#    검사는 `scripts/check_rahab_staging.py` 몫이고 그 파일은 **rev.10 에서 착수·실행됐다**
#    (b-doc·b-vocab·b-spell 초록). 다만 **문서 층위 대조일 뿐이다** — Scene yml 실값을 재는
#    b-yml 은 `content/rahab/` 부재로 BLOCKED 이므로, 런타임 값은 여전히 **미검사**다.
trigger_scenes: [1, 2, 3, 4, 5]
crisis_reminder_scenes: [1, 2, 3, 4, 5]

# ── G2 — R1 자해 리스너 id.
r1_listener_id: "R1_voice_self_harm_listener"

# ── G2v — 래치 **키의 값**. seed §10 C7("집행 수단은 지금 없다")에 대한 응답이다.
#    C7 이 지적한 형태 — 래치 3키가 통째로 빠지거나 `mission` 이 `session` 으로 잘못
#    실려도 G2 는 초록 — 를 이 게이트가 잰다. G2 는 `safety_gates[].id` 하나만 본다.
#
#    ⚠️ 라합에는 아직 `content/rahab/scene*.yml` 이 없다. 그래서 이 게이트는 오늘
#    **BLOCKED 다** — 계약은 선언됐고 잴 대상이 없다. 초록이 아니다.
#    Scene 파일이 생기는 순간 이 8키가 5/5 에서 값까지 대조된다.
#
#    정본 문서(`docs/RUTH-LOCKED-STRINGS.md` 같은 것)가 라합에는 없으므로 여기에
#    직접 적는다. 값의 상류는 `docs/SEED-RAHAB.md` §5 R1 의 8키 표다 — 그 표를
#    고치면 **이 블록도 같이 고쳐야 한다.** 둘이 어긋나는 것을 잡는 도구는 없다.
latch_contract:
  scene_keys:
    post_crisis_render_policy: suppress_all_captions_except_crisis_card
    post_crisis_latch_scope: mission
    crisis_card_position: terminal_screen
  gate_keys:
    enforced_at: always
    action: pause_fade_black_show_crisis_card
    persist_utterance: false
    crisis_resource_ref: crisis_resources.default

# ── G0b — 배제 자구 양방향 대조표. USED 24행 / EXCLUDED 31행.
verses_file: docs/verses-rahab.txt

# ── G5a-i·G5b·G5e·G6·G6d — 금지 토큰 **31종 = 룻 22 상속 + 라합 고유 9**.
#    룻 고유 자구에 묶인 것(사별 동반사망 3종 등)도 뺄 이유가 없어 그대로 둔다 —
#    라합 콘텐츠에 안 나오면 0건일 뿐이고, 0건은 과차단이 아니다(seed §7-1).
forbidden:
  # ── 룻 상속 22종 (scripts/gates/ruth.yml:25-53 과 자구 동일) ──
  # 계열 1 — 공로화 (헌장 §3-a)
  - "믿음이 좋아서"
  - "용기를 냈기 때문에"
  - "그만큼 헌신했으니"
  - "착해서"
  - "충성했으니"
  # 계열 2 — 섭리 설명 (헌장 §3-b · R2)
  - "하시려고 그 일을 허락"
  - "다 뜻이 있어"
  - "연단하시려고"
  # 계열 3 — 회복 압박 (R3)
  - "이제 그만 일어나"
  - "감사하면 회복"
  - "믿음으로 이겨내"
  - "빨리 잊고"
  # 계열 4 — 보상 프레이밍 (헌장 §3-c)
  - "결국 보상받았"
  - "참으니 복이"
  - "일곱 아들보다 귀한"
  # 계열 5 — 동반사망 (E1)
  - "나도 죽어"
  - "따라 죽"
  - "같이 묻히"
  # 계열 6 — 마감 줄 평가 어휘 (SR-2)
  - "곁을 지켰"
  - "물러섰지만"
  - "그래도 잘"
  - "덕분에"
  # ── 라합 고유 9종 (seed §7-1 표) ──
  # 계열 7 — 낙인 소거. 본문은 낙인을 씻지 않는다(약 2:25 가 정면으로 반박한다)
  - "과거를 씻고"
  - "새사람이 되어"
  - "더 이상 기생이"
  # 계열 8 — 본문 밖 서사
  - "직업을 버리고"
  # 계열 9 — 공로화 인과. 본문이 대는 이유는 숨김과 맹세다(seed §3-1)
  - "회개했기 때문에"
  - "믿었기 때문에"
  - "믿음 덕분에"
  # 계열 10 — R2 가스라이팅. §2-1 축이 미끄러지면 정확히 이 문장이 된다
  - "그래서 쓰임받았"
  - "쓰시려고 그 자리에"

# ⚠️ **토큰은 하한이지 방어선이 아니다.** 적대 감사가 31종을 전부 통과하면서 R2 를 위반하는
#    문장 7개를 만들었다(예: "그가 들은 것이 그를 그 자리에 서게 했습니다"). 바꿔쓰기는
#    무한하므로 그 7문장을 `exclusions` 로 등재하지 **않는다** — F-6.5 footer(§5-4)와
#    문장 단위 신학·정신건강 리뷰가 맡는 몫이다. **토큰 초록을 "R2 통과"로 읽지 마라.**
# ⚠️ 축 배타(에스더 계열 "드러낼 것인가"·"숨길 것인가" 등)는 여기 없다. `forbidden` 에
#    넣으면 아무것도 집행되지 않고(g0e 는 `_exclusion_entries` 만 훑는다), `exclusions` 에
#    넣으면 G0e 과차단에 걸린다 — 충돌처가 에스더·다니엘의 **축 문장 그 자체**라서 그게 옳다.
#    집행 수단은 인간 검토뿐이다(seed §7-4).

