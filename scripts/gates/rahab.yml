# ── G0d — 제품 말투(존댓말·완곡) 위험 문장이 토큰에 걸리는가 ──────────────────
# ⚠️ **커버리지 게이트다. 회피 탐지 게이트가 아니다.** 판정식은
#    `misses = [s for s in sents if not any(t in s for t in toks)]` — 예문이 토큰에
#    **걸려야** PASS 다. seed rev.3 이 이것을 읽지 않고 토큰 없는 문장으로 갈아 끼워
#    영구 FAIL 2/2 를 만들어 놓고 개선이라고 적은 이력이 있다. **문장을 고쳐 초록을
#    맞추지 마라** — 그러면 게이트가 자기 자신을 검사하게 된다.
polite_evasive_min: 3
polite_evasive:
  - "말씀드리기 조심스럽습니다만, 그분이 믿었기 때문에 그런 결과가 따라온 것으로 정리해 드릴 수 있겠습니다."
  - "지난 이야기는 접어 두고, 과거를 씻고 새 자리에 서게 된 과정을 중심으로 안내해 드리겠습니다."
  - "하나님이 쓰시려고 그 자리에 두신 것이라고 이해하시면 마음이 조금 편해지실 수 있습니다."
# 3번은 R2 계열로 **일부러** 넣었다. 가장 위험한 축(§2-1 미끄러짐)이 존댓말 상담 말투로
# 나왔을 때 토큰이 잡는지를 재는 자리다.

# ── 배제 선언 40항 (seed §7-3) ───────────────────────────────────────────────
#
# scope 배정: 절 참조로 잠글 수 있으면 `verse_ref`, 참조로 잠그면 과차단이 나는 것만
# `verse_text`, 성경 자구가 아닌 주장·표현은 `content_leaf`/`absent`.
# `content_leaf` 에 `excluded_only` 를 붙이는 조합은 명시적 설정 오류다(`:627-631`).
exclusions:
  # ── verse_ref 29항 · excluded_only ──────────────────────────────────────
  # 헤렘 전개 14 — `수 6:1-16` 범위 표기는 절별 표에 없어 g0b FAIL 이므로 절별로 펼친다.
  # 6:1·6:2 만은 펼치면 `수 6:17b`·`수 6:22` 등의 부분문자열이라 과차단 FAIL → 자구로 잠근다.
  - { value: "수 6:3", scope: verse_ref, expect: excluded_only }
  - { value: "수 6:4", scope: verse_ref, expect: excluded_only }
  - { value: "수 6:5", scope: verse_ref, expect: excluded_only }
  - { value: "수 6:6", scope: verse_ref, expect: excluded_only }
  - { value: "수 6:7", scope: verse_ref, expect: excluded_only }
  - { value: "수 6:8", scope: verse_ref, expect: excluded_only }
  - { value: "수 6:9", scope: verse_ref, expect: excluded_only }
  - { value: "수 6:10", scope: verse_ref, expect: excluded_only }
  - { value: "수 6:11", scope: verse_ref, expect: excluded_only }
  - { value: "수 6:12", scope: verse_ref, expect: excluded_only }
  - { value: "수 6:13", scope: verse_ref, expect: excluded_only }
  - { value: "수 6:14", scope: verse_ref, expect: excluded_only }
  - { value: "수 6:15", scope: verse_ref, expect: excluded_only }
  - { value: "수 6:16", scope: verse_ref, expect: excluded_only }
  # 헤렘 봉헌 명령 — rev.4 신설. §1 이 사유를 적고 verses-rahab.txt 에도 있었는데
  # **배제 선언에만 빠져 있었다**(rev.3 의 자기모순).
  - { value: "수 6:17a", scope: verse_ref, expect: excluded_only }
  # 헤렘 집행 4
  - { value: "수 6:18", scope: verse_ref, expect: excluded_only }
  - { value: "수 6:19", scope: verse_ref, expect: excluded_only }
  - { value: "수 6:20", scope: verse_ref, expect: excluded_only }
  - { value: "수 6:21", scope: verse_ref, expect: excluded_only }
  # 성 소각 / 자녀 사망 저주 / 전멸 소문 / 절단 불가
  - { value: "수 6:24", scope: verse_ref, expect: excluded_only }
  - { value: "수 6:26", scope: verse_ref, expect: excluded_only }
  - { value: "수 2:10", scope: verse_ref, expect: excluded_only }
  - { value: "히 11:31", scope: verse_ref, expect: excluded_only }
