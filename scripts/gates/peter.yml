# ── G0c — 토큰이 자기 예문을 잡는가 ────────────────────────────────────────
# 예문은 **제품 말투로 쓴 위험 문장**이고, 토큰 123종과 1:1 이다. 개수를 따로 선언해야
# 축약·줄임으로 원소가 사라지는 사고(㉞)를 게이트가 잡을 수 있다.
#
# 예문의 위험 축은 docs/MVP-PETER.md:414-415(§12.4 R2/R3 행)이 정의한 둘이다 —
#   (a) R2 — 부인·실패에 신적 의도(훈육·연단·겸손)를 부여하는 인과형 귀속
#   (b) R3 — 재발 방지를 스스로 다짐시키거나 자격·준비·용서를 회복의 선행조건으로 거는 압박
# docs/MVP-PETER.md:332("다짐하는 자가 아니라 호명받는 자") 가 이 인물이 피해야 할
# 문장형을 그대로 지목한다. 아래 예문은 그 두 축의 문장이다.
