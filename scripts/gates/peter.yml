# ── G0d — 제품 말투(존댓말·완곡) 위험 문장이 토큰에 걸리는가 ────────────────
# 순회 축은 토큰이 아니라 **문장**이다. 실제 LLM 이 낼 법한 정중한 회피형 위로를 먼저 쓰고,
# 토큰이 그걸 잡는지 본다 — 잡히도록 문장을 고치면 게이트가 자기 자신을 검사하게 된다.
#
# ✅ 2026-08-05 초록 — **문장은 한 글자도 고치지 않았다.** 아래 10문장 중 3문장이 115종
#    어디에도 안 걸리던 것을 content/ 쪽 토큰 123종으로 늘려 닫았다. 빨강 기록:
#      (1) "충분히 아파하셨으니 이제 스스로를 용서하셔도" — 목록은 `스스로를 용서하세/
#          하셔야/하십/하지 못하면/해야 합/해야죠` 6종으로 어미를 열거하면서
#          **허용형(-셔도)** 만 빠뜨렸다. 엘리야의 높임형 공백(정신 차리시고)과 같은 부류다.
#          → 하지만 허용형(`용서하셔도`)을 토큰으로 만들지 **않았다.** "이제 스스로를
#          용서하셔도 됩니다" 는 이 미션이 해야 하는 말이고, 위 문장의 가해성은 허용이
#          아니라 앞의 **애도 종료 선언**("충분히 아파하셨으니")에 있다. 그래서 새 축을
#          열었다 — `충분히 아파하셨`·`충분히 슬퍼하셨`·`충분히 우셨`(과거형 -셨 에서 절단).
#          "충분히 아파하셔도 됩니다" 는 그대로 통과한다(실측 확인).
#      (2) "다시는 그러지 않겠다고 … 약속해" — 약속형 토큰은 `넘어지지 않겠다고 약속하세`·
#          `부인하지 않겠다고 약속하세` 처럼 **목적어가 붙은 형태만** 선언돼 있어,
#          목적어를 생략한 일반형 다짐 유도가 통과한다. docs/MVP-PETER.md:332 가
#          "다짐하는 자가 아니라 호명받는 자" 로 지목한 바로 그 문장형이다.
#          → `약속해 보세`·`약속해 보시`·`스스로에게 약속`·`다짐해 보시` 추가로 닫았다.
#          `약속` 을 단독으로 막지 않은 이유는 이 미션이 21:15-17 의 재위임을 다루기
#          때문이다 — 하나님 쪽의 약속 서술까지 함께 막힌다.
#      (3) "준비가 되면 다시 부르실" — 선언된 `준비가 되면 부르` 는 두 어절이 **붙어 있을
#          때만** 잡는다. 사이에 부사 하나("다시")가 끼면 부분문자열 매칭이 끊긴다.
#          실 스캐너(ForbiddenTokenScanner)도 같은 의미론이라 **런타임도 못 잡는다** —
#          게이트가 느슨한 게 아니라 토큰 자체가 삽입어에 취약한 형태로 선언돼 있다.
#          `준비가 되면 다시 쓰` 는 선언돼 있는데 `준비가 되면 다시 부르` 는 없었다.
#          → `준비가 되면 다시 부르` 추가. 부사 삽입에 대한 근본 해법(어절 사이 유연 매칭)은
#          스캐너 쪽 변경이라 하지 않았다 — 여기서 고치면 런타임과 게이트가 어긋난다.
#    ⚠️ 이 초록의 유효기간은 이 10문장까지다. 새 위로 표면이 떠오르면 **문장을 먼저 여기
#       추가**하고, 빨개지면 그때 content/ 토큰을 늘린다(반대 순서는 자기 검사가 된다).
polite_evasive:
  - "그 밤의 일은 이제 그만 놓아주셔도 괜찮습니다."
  - "하나님이 당신을 연단하시려고 그 시간을 허락하신 것일 수도 있어요."
  - "충분히 아파하셨으니 이제 스스로를 용서하셔도 좋겠습니다."
  - "이런 아픔이 있어야 더 깊어진다고들 하지요."
  - "마음의 준비가 되면 다시 부르실 테니 조급해하지 않으셔도 됩니다."
  - "그때 실패했기 때문에 지금의 당신이 있는 거예요."
  - "이제는 자책을 내려놓으셔야 앞으로 나아가실 수 있어요."
  - "다시는 그러지 않겠다고 스스로에게 약속해 보시면 어떨까요?"
  - "죄책감이 사라진 뒤에 다시 시작하셔도 늦지 않습니다."
  - "예수께서 돌이켜 보셨기 때문에 그렇게 무너지신 거예요."

# ── G7 — R4 동의 카드 + 스킵 목적지가 실제로 있는 Scene ─────────────────────
# 출처는 콘텐츠가 아니라 **설계 문서**다. 콘텐츠에서 역산하면 "동의 카드가 있는 Scene 에
# 동의 카드가 있는가" 를 묻는 동어반복이 된다.
#   Scene 2 — docs/MVP-PETER.md:71,106,108 ("★ R4 동의 게이트", "진입 직전 명시적 동의
#             카드 … 건너뛰면 skip_summary 재생 후 Scene 4로 직행"), :416(§12.4 R4 행),
#             :508(§13 검수 체크리스트 첫 행)
#
# ⚠️ Scene 3(통곡·R1 최고 민감)은 **의도적으로 트리거가 아니다.** docs/MVP-PETER.md:147 —
#    "이 Scene은 Scene 2의 `consent_covers_scenes`로 이미 커버되어 있어 별도 동의 카드가
#    없다." 실측도 같다(scene3.yml 에 두 키 없음, scene2.yml 에 `consent_covers_scenes:
#    [2, 3]`). 설계가 커버 범위로 처리한 Scene 을 트리거로 선언하면 없는 결함을 만든다.
trigger_scenes: [2]

# ── G3d — 위기 리마인더 리터럴 키 ──────────────────────────────────────────
#   Scene 3 — docs/MVP-PETER.md:156 ("이 Scene 전체에 `crisis_reminder`(상시 오버레이,
#             닫기 가능)가 뜬다"), :413(§12.4 R1 행 "상시 노출(닫기 가능)")
#   Scene 5 — §6-1(마지막 Scene 은 이탈 지점이라 예외 없음) + docs/MVP-PETER.md:298
#             (§8.2 ⑤ "`crisis_reminder` 2종(Scene 3·5)" — 사람 검토 대상 목록이
#             두 Scene 을 명시적으로 지정한다)
# 실측: scene3.yml·scene5.yml 둘 다 리터럴 키 보유. 설계가 지정한 2개와 정확히 일치한다.
crisis_reminder_scenes: [3, 5]

# ── 미정의 = BLOCKED (판정 불가). 없는 것을 있는 척하지 않는다 ──────────────
# verses_file:            (없음) → G0b BLOCKED
# exclusions:             (없음) → G0b/G0e/G9/G9d BLOCKED
#     ㉝ 이후 형식: 원소마다 `value` + `scope`(verse_ref|verse_text|content_leaf) + `expect`.
#     scope 는 필수이고 기본값이 없다 — 어느 텍스트에 대고 재는지가 선언의 일부다.
#     ⚠️ 베드로는 다른 인물과 사정이 조금 다르다: 배제 문자열 **표 자체는 실재한다**
#        (docs/MVP-PETER.md:473-499 §12.8, [A]군 8종 + [B]군 12종). 그런데 [A]군의
#        정의가 "원문 대조표의 EXCLUDED 구간에 **실재해야** 한다"(:475)이고 그 대조표
#        (verses.txt 류)는 레포에 없다 — G0b 는 대조할 열이 없다. 표만 옮겨 적으면
#        G9/G9d 는 돌지만 G0b 가 요구하는 양방향(실재+부재) 검증은 영원히 성립하지 않는다.
#        어느 텍스트를 상대로 재는지가 정의의 일부라는 ㉝의 결론에 따라, 대조 원본이
#        생기기 전까지는 선언하지 않고 BLOCKED 로 남긴다. (별도 작업으로 보고함)
