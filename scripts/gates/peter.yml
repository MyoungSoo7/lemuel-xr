# 베드로 — /새인물 파이프라인 초안(≤70%, 인간 사인오프 대기).
#
# ⚠️ 이 설정은 seed 산출물이 아니라 **저작된 content/peter/scene*.yml 에서 실측해 역산한 것**이다.
#    seed 층 입력(배제 문자열 표·verses.txt·POLITE_EVASIVE·token_examples)은 존재하지 않는다.
#    그래서 해당 게이트는 BLOCKED 로 나온다 — 이건 "통과"가 아니라 "판정 불가"다.
character: peter
ruleset: newchar-v5 # 토큰 규약 이후 인물 — 면제 없음
scene_count: 5

docs:
  mvp: docs/MVP-PETER.md
doc_min_lines:
  mvp: 450
# content 문서(docs/MVP-PETER-CONTENT.md)는 **아직 없다.** 없는 문서를 선언하면
# 게이트가 없는 것을 검사하는 척하게 된다 — 작성 전까지 선언하지 않는다.

# content/peter/scene*.yml 의 lint_forbidden_tokens 합집합 **전량** 115종(실측).
# 부분집합을 적으면 G6/G6d/G9 가 나머지를 안 보면서 초록이 된다(vacuous green).
