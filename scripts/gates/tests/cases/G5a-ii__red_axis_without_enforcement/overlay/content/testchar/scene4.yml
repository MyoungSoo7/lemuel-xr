# Scene 4 — 탄식 라벨링 + R4 동의 (픽스처)
scene_id: testchar_scene4
mission_id: testchar
# 위기 래치 값은 Scene 전건의 계약이다 — overlay 가 Scene 을 통째로 갈아도 이 키는 남아야 한다(G2v).
post_crisis_latch_scope: mission
consent_card_id: card_testchar_s4_consent
skip_alternative_scene_id: testchar_scene5
narration_blocks:
  - id: nb_s4_lament
    speaker: system
    text_ko: ""
    default_path: static_curation
    default_text_ko: "무엇이 가장 무거우신가요."
    llm_optin_only: true
branches:
  - id: br_s4_lament
    decision_key: lament_label
    routes:
      - when: { lament_label: loneliness }
        next_scene_id: testchar_scene5
      - when: { lament_label: burnout }
        next_scene_id: testchar_scene5
safety_gates:
  - id: R3_all_laments_valid
    enforced_at: always
    description: "모든 탄식이 동등하게 유효하다."
  - id: R1_voice_self_harm_listener
    enforced_at: always
    action: pause_fade_black_show_crisis_card
    crisis_resource_ref: crisis_resources.default
  - id: footer_persistent
    enforced_at: always
    text_ko: "AI 보조 — 본문은 성경 참조 — storyteller 역할 | 위기 시 {{crisis_resources.default}}"
