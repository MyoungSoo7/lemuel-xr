# Scene 1 — 도입 (픽스처)
# 참고: 운영 위기 번호는 109 지만 본문엔 절대 하드코딩하지 않는다.
scene_id: testchar_scene1
mission_id: testchar
# 위기 래치 값은 Scene 전건의 계약이다 — overlay 가 Scene 을 통째로 갈아도 이 키는 남아야 한다(G2v).
post_crisis_latch_scope: mission
narration_blocks:
  - id: nb_s1_open
    speaker: scripture_caption
    text_ko: "그가 한 노간주 나무 아래에 앉아서 (테스트 본문 1)"
safety_gates:
  - id: R1_voice_self_harm_listener
    enforced_at: always
    action: pause_fade_black_show_crisis_card
    crisis_resource_ref: crisis_resources.default
  - id: footer_persistent
    enforced_at: always
    text_ko: "AI 보조 — 본문은 성경 참조 — storyteller 역할 | 위기 시 {{crisis_resources.default}}"
