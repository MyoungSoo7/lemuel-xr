# 엘리야 (Theme 12) — 머지된 baseline. 토큰 규약(§5)을 따르는 두 인물 중 하나.
#
# ⚠️ 이 설정은 seed 산출물이 아니라 **머지된 콘텐츠에서 실측해 역산한 것**이다.
#    seed 층 입력 중 배제 문자열 표·verses.txt 는 **여전히 존재하지 않는다** —
#    G0b/G0e/G9/G9d 는 그래서 BLOCKED 로 남는다. "통과"가 아니라 "판정 불가"다.
character: elijah
ruleset: newchar-v5 # 토큰 규약 이후 인물 — 면제 없음
scene_count: 5

docs:
  mvp: docs/MVP-ELIJAH.md
  content: docs/MVP-ELIJAH-CONTENT.md
doc_min_lines:
  mvp: 450
  content: 550

# content/elijah/scene*.yml 의 lint_forbidden_tokens **합집합 전량 45종**(파서 실측).
#
# 🔻 정정 이력 — 이전 값은 9종이었고 주석은 그걸 "합집합"이라 적었다. 실측하면 합집합은
#    45종이다(scene3 만 해도 18종). 즉 **부분집합을 전량이라 주장하던 설정**이었고,
#    G6/G6d/G9 는 나머지 36종을 안 보면서 초록이었다 — peter.yml 이 경고한 vacuous green
#    이 정작 머지된 baseline 에서 일어나고 있었다. 특히 높임형('정신 차리시고'·'싸우셔야'·
#    '도구로 쓰시')이 통째로 빠져 있었는데, 제품 말투는 대부분 높임형이다.
