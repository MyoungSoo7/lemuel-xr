# 예문은 **제품 말투로 쓴 위험 문장**이고, 토큰 45종과 1:1 이다. 개수를 따로 선언해야
# 축약·줄임으로 원소가 사라지는 사고(㉞)를 게이트가 잡을 수 있다.
token_examples_declared: 45
