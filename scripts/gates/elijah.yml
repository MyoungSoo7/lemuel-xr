# ── G0d — 제품 말투(존댓말·완곡) 위험 문장이 토큰에 걸리는가 ────────────────
# 순회 축은 토큰이 아니라 **문장**이다. 실제 LLM 이 낼 법한 정중한 회피형 위로를 먼저 쓰고,
# 토큰이 그걸 잡는지 본다 — 잡히도록 문장을 고치면 게이트가 자기 자신을 검사하게 된다.
#
# 실측 기록: 아래 10문장 중 5문장(정신 차리시고·싸우셔야·도구로 쓰시·의지가 약해서·
# 언제까지 쉬)은 **이전 9종 목록으로는 하나도 걸리지 않았다**. 합집합 45종으로 바꾼 뒤
# 전부 포착된다 — 부분집합이 만들던 공백의 크기가 이 5문장이다.
polite_evasive:
  - "지금은 힘드시겠지만 푹 쉬시면 빨리 회복하실 거예요."
  - "마음이 정리되시면 다시 사역으로 돌아가시면 좋겠습니다."
  - "이런 마음이 드는 게 믿음이 부족해서는 아니겠지만요."
  - "괜찮으시다면 그때 왜 도망치셨는지 여쭤봐도 될까요?"
  - "조금만 더 힘내시면 이번에도 다시 이겨내실 수 있습니다."
  - "이제 정신 차리시고 앞을 보셔야 할 때입니다."
  - "충분히 쉬셨으니 이제는 마음의 두려움과 싸우셔야 합니다."
  - "하나님이 이 시간을 통해 당신을 도구로 쓰시려는 것 같습니다."
  - "지금 못 일어나시는 게 의지가 약해서는 아니겠지만, 조금은 움직이셔야죠."
  - "언제까지 쉬실 계획인지 여쭤봐도 될까요?"

# ── G7 — R4 동의 카드 + 스킵 목적지가 실제로 있는 Scene ─────────────────────
# 출처는 콘텐츠가 아니라 **설계 문서**다. 콘텐츠에서 역산하면 "동의 카드가 있는 Scene 에
# 동의 카드가 있는가" 를 묻는 동어반복이 된다.
#   Scene 2 — docs/MVP-ELIJAH.md:69,106,409 ("R4 동의 게이트 필수", 왕상 19:4 자살사고 본문)
#   Scene 4 — docs/MVP-ELIJAH-CONTENT.md:126 (불 임팩트 강도 토글, R4)
trigger_scenes: [2, 4]

# ── G3d — 위기 리마인더 리터럴 키 ──────────────────────────────────────────
# Scene 5 는 이탈 지점(미션 종료)이다. 2026-08-05 에 content/elijah/scene5.yml 에
# `crisis_reminder` 키를 추가했다 — 문구는 새로 쓴 게 아니라
# backend/src/main/resources/scenarios/elijah.yml outro 에서 **이미 배포되어 나가는 값**이고,
# 저작층에만 같은 이름의 키가 없어 판정 불가였다.
#
# Scene 2(자살사고 본문, 왕상 19:4)는 이 미션의 R1 최고감도 지점이다. 여기에도 같은 키를
# 추가했다 — 문구는 그 파일 안에 이미 있던 `scene2_r2_footer` 상시 오버레이 문장 그대로다.
# 위기 자원 노출은 원래 되고 있었고 게이트가 찾는 **키 이름**만 없었다.
# Scene 2 의 리마인더는 `dismissible: false` 다(Scene 5 와 다른 점) — 이탈 지점이 아니라
# 본문 노출 중이라 닫을 수 있으면 안 된다.
crisis_reminder_scenes: [2, 5]

# ── 미정의 = BLOCKED (판정 불가). 없는 것을 있는 척하지 않는다 ──────────────
# verses_file:            (없음) → G0b BLOCKED
# exclusions:             (없음) → G0b/G0e/G9/G9d BLOCKED
#     ㉝ 이후 형식: 원소마다 `value` + `scope`(verse_ref|verse_text|content_leaf) + `expect`.
#     scope 는 필수이고 기본값이 없다 — 어느 텍스트에 대고 재는지가 선언의 일부다.
#     이 둘은 **채울 수 없다** — 배제 문자열 표도 verses.txt 도 레포에 없다.
#     지어내면 게이트가 없는 원본을 검사하는 척하게 된다.
