  # ── 2026-08-05 추가 — G0d 미포착 문장이 실증한 표층 공백 ──────────────────
  #    정중한 권유·허용 말투(`-시면`·`-셔도`)와 소급 정당화가 목록에 없었다.
  #    근거·과차단 실측은 content/ 쪽 같은 게이트 주석에 있다.
  - {
