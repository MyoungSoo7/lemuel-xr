# §5(c) — ForbiddenTokenConfigTest.kt 는 인물 식별자를 **한국어**로 남긴다(`// 야곱`).
test_identifier: "야곱"

# ── G0c — 토큰이 자기 예문을 잡는가 ────────────────────────────────────────
# 예문은 **제품 말투로 쓴 위험 문장**이고, 토큰 29종과 1:1 이다. 개수를 따로 선언해야
# 축약·줄임으로 원소가 사라지는 사고(㉞)를 게이트가 잡을 수 있다.
#
# 이 인물의 위험 축은 둘이다(content/jacob/scene1.yml:124-126 R2_R3_lint_forbidden 서술).
#   (R2) 라반 20년 = 속임의 대가라는 **인과응보 교훈화** — 속인 대가·그래서 겸손해·
#        너를/당신을 다듬·흉터도 축복
#   (R3) **화해 강요와 유예 프레이밍** — 용서해야·먼저 연락해·관계는 회복되어야·
#        관계도 회복될·언젠가는 가·아직은 때가 아닐
# 예문은 두 축 중 어디에 속하는 토큰인지에 맞춰 썼다.
token_examples_declared: 29
token_examples:
  # ── R3 화해 강요·유예 프레이밍 ──
  - {
      token: "관계는 회복되어야 하지",
      example: "그래도 결국 관계는 회복되어야 하지 않겠어요?",
    }
  - {
      token: "관계는 회복되어야 합",
      example: "가족이라면 관계는 회복되어야 합니다.",
    }
  - {
      token: "관계는 회복되어야죠",
      example: "지금은 어렵더라도 관계는 회복되어야죠.",
    }
  - {
      token: "관계도 회복될",
      example: "시간이 지나면 그 관계도 회복될 거예요.",
    }
  - { token: "먼저 연락해", example: "형님께 먼저 연락해 보시는 게 어떨까요?" }
  - {
      token: "아직은 때가 아닐",
      example: "아직은 때가 아닐 뿐이니 조금만 더 기다려 보세요.",
    }
  - {
      token: "언젠가는 가게 될",
      example: "지금 못 가셔도 언젠가는 가게 될 겁니다.",
    }
  - {
      token: "언젠가는 가셔야",
      example: "마음이 준비되시면 언젠가는 가셔야 하지 않을까요?",
    }
  - { token: "언젠가는 가야 합", example: "가족이니까 언젠가는 가야 합니다." }
  - { token: "언젠가는 가야죠", example: "그래도 언젠가는 가야죠." }
  - {
      token: "용서해야",
      example: "이제는 스스로를 용서해야 앞으로 나아가실 수 있어요.",
    }
  # ── R2 인과응보 교훈화 ──
  - {
      token: "그래서 겸손해지셨",
      example: "그 20년을 지나오셨고, 그래서 겸손해지셨습니다.",
    }
  - {
      token: "그래서 겸손해지신",
      example: "고생을 겪으셨기에 그래서 겸손해지신 겁니다.",
    }
  - {
      token: "그래서 겸손해진",
      example: "그 세월을 통과해서 그래서 겸손해진 사람이 된 거예요.",
    }
  - {
      token: "그래서 겸손해집",
      example: "사람은 한 번 무너져 봐야 그래서 겸손해집니다.",
    }
  - {
      token: "너를 다듬는",
      example: "그 고통은 너를 다듬는 하나님의 손길이다.",
    }
  - {
      token: "너를 다듬으려",
      example: "하나님이 너를 다듬으려 그 세월을 두신 거야.",
