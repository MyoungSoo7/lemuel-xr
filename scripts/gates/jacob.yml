# ── G0d — 제품 말투(존댓말·완곡) 위험 문장이 토큰에 걸리는가 ────────────────
# 순회 축은 토큰이 아니라 **문장**이다. 실제 LLM 이 낼 법한 정중한 회피형 위로를 먼저 쓰고,
# 토큰이 그걸 잡는지 본다 — 잡히도록 문장을 고치면 게이트가 자기 자신을 검사하게 된다.
#
# ✅ 2026-08-05 초록 — **문장은 한 글자도 고치지 않았다.** 아래 12문장은 그대로 두고
#    content/ 쪽 토큰을 25종 → 29종으로 늘려 닫았다. 무엇이 빨갰는지 기록해 둔다:
#      1) "먼저 손을 내미시는" — 화해 강요 축이 `먼저 연락해` 라는 표면 **하나만** 막고 있었다.
#         → `먼저 손을 내미`·`먼저 손을 내밀` 추가. '다가가다'·'문자라도 보내다' 는 아직 열려
#         있다 — 다음 라운드의 후보다(이 목록에 문장을 더 적는 것이 그 시작이다).
#      2) 절뚝임(창 32:31) 미화 — 이 미션의 중심 이미지인데 토큰은 `흉터도 축복` 하나뿐이었다.
#         → `훈장` 추가. MVP-JACOB.md:38,353 이 "회복은 원상복구가 아니다" 를 이 절뚝임으로
#         말하는 만큼 오용 표면도 여기 몰린다. '증거'·'표식' 은 일반어라 넣지 않았다.
#      3) 편애 정당화 — docs/MVP-JACOB.md:143 이 동의 카드 고지 소재로 "가족 안의 기만과
#         **편애**" 를 명시하는데 편애 축 토큰이 0개였다. → 편애라는 *소재* 가 아니라 그 문장이
#         쓰는 *장치* 인 소급 정당화(`지나고 보면`)를 막았다. 편애 자체는 이 미션이 다뤄야 하는
#         주제라 어휘를 막으면 미션이 자기 소재를 말할 수 없게 된다.
#    ⚠️ 이 초록의 유효기간은 이 12문장까지다. 게이트는 여기 적힌 표면만 검사한다 —
#       새 위로 표면이 떠오르면 **문장을 먼저 여기 추가**하고, 빨개지면 그때 토큰을 늘린다.
polite_evasive:
  - "형님께 먼저 연락해 보시는 게 어떨까요?"
  - "이제는 스스로를 용서해야 마음이 편해지실 거예요."
  - "시간이 지나면 그 관계도 회복될 겁니다."
  - "가족인데 언젠가는 가셔야 하지 않을까요?"
  - "하나님이 당신을 다듬으시려고 그 20년을 허락하신 거예요."
  - "그 세월을 지나오셨기에 그래서 겸손해지신 겁니다."
  - "라반에게 겪으신 일은 아버지를 속인 대가였는지도 모릅니다."
  - "남은 흉터도 축복으로 보이는 날이 올 거예요."
  - "아직은 때가 아닐 뿐이에요, 조금만 더 기다려 보세요."
  - "먼저 손을 내미시는 쪽이 결국 더 자유로워지십니다."
  - "그 절뚝임은 당신이 하나님과 씨름했다는 훈장입니다."
  - "부모님의 편애도 지나고 보면 다 뜻이 있었던 일입니다."

# ── G7 — R4 동의 카드 + 스킵 목적지가 실제로 있는 Scene ─────────────────────
# 출처는 콘텐츠가 아니라 **설계 문서**다. 콘텐츠에서 역산하면 "동의 카드가 있는 Scene 에
# 동의 카드가 있는가" 를 묻는 동어반복이 된다.
#   Scene 1 — docs/MVP-JACOB.md:140 ("진입 전 R4 동의 카드(`cc_jacob_family_deception`)
#             — Scene 1~4 전체를 커버", 3택 중 스킵 = `1_alt`)
#             docs/MVP-JACOB.md:12 (가해자 자리 고지를 Scene 1 진입 전 R4 카드로 한다)
#             docs/MVP-JACOB.md:503 (안전 체크리스트: "Scene 1 진입 시 R4 동의 카드 …
#             + 스킵(`1_alt`)" ☑ 설계 반영)
#   Scene 5 — docs/MVP-JACOB.md:216 ("진입 전 별도 R4 동의 카드(`cc_jacob_confrontation`)",
#             "스킵 시 `5_alt`")
#             docs/MVP-JACOB.md:504 (체크리스트 동일 항목 ☑ 설계 반영)
#
# ✅ 2026-08-05 초록. 그전까지 빨갰던 이유: content/jacob/scene1.yml 에 `consent_card_id`
#    는 있으나 `skip_alternative_scene_id` 리터럴 키가 **없었다**. 스킵 목적지 `1_alt` 는
#    동의 카드 옵션 안의 `target: 1_alt` 로만 존재했다 — 즉 **동의 카드는 띄우면서 게이트가
#    읽는 스킵 목적지 키는 비어 있는** 상태였고, Scene 5 는 두 키를 다 가졌다(비대칭).
#    → scene1 에 `skip_alternative_scene_id: 1_alt` 를 추가해 닫았다. 값은 새로 정하지
#      않았다 — 바로 위 옵션의 `target` 과 설계 문서(:140, :503)가 이미 `1_alt` 로 약속하고
#      있던 값을 게이트가 읽는 키 이름으로 옮겨 적은 것이다. 안전 판단이 아니라 표기 정정이라
#      사람 판단을 대신하지 않는다(G3d 의 `crisis_reminder` 키 정정과 같은 부류).
trigger_scenes: [1, 5]

# ── G3d — 위기 리마인더 리터럴 키 ──────────────────────────────────────────
# ✅ 2026-08-05 — 오래 적어 두었던 이름 부채가 닫혔다. 야곱만 `- id: R1_crisis_reminder`
#    였고, 그래서 여기에 `crisis_reminder_key: R1_crisis_reminder` 노브를 걸어 두고
#    "통일할 방향은 `crisis_reminder` 쪽이지만 저작 정본을 고치는 일이라 임의로 하지
#    않는다"고 적어 두었었다. 사용자 지시로 **저작층 쪽을 고쳐서** 닫았다 —
#    content/jacob/scene2.yml · scene5.yml 의 id 가 이제 `crisis_reminder` 이고
#    문구 키도 `crisis_reminder_text_ko` → `text_ko` 로 맞췄다. 따라서 노브는 필요 없다
#    (기본값 `crisis_reminder` 로 판정한다).
#
#    ⚠️ 바뀐 것은 **이름 둘뿐**이다. 문구·`enforced_at`·`crisis_resource_ref`·note 는
#       그대로다. 안전 문구를 새로 쓰거나 고친 변경이 아니다.
#
#    왜 `crisis_reminder` 쪽이 정본인가 — 이게 런타임 계약 키다:
#      · backend/src/main/resources/scenarios/*.yml 7종이 전부 `crisis_reminder:` 로 내보낸다
#      · 백엔드 테스트가 `extras["crisis_reminder"]` 를 단언한다(GameWebIT.kt:196,
#        CrisisTokenResolverTest.kt, ScenePayloadForbiddenTokenGateTest.kt:145)
#      · 저작층 7인물 중 6인물이 이미 같은 이름이었다
#    즉 노브 없이 도는 다른 도구(런타임·에디터·리뷰 스크립트)가 야곱만 놓치던 문제가
#    실제로 사라진 것이지, 게이트 설정만 초록으로 바꾼 게 아니다.
#
# Scene 목록의 출처는 콘텐츠 역산이 아니다 — 두 파일의 note 가 seed 사양을 그대로
# 인용한다: "seed §4-3 리터럴 그대로. CRISIS_REMINDER_SCENES = (2, 5) 중 하나."
# 즉 (2,5)는 설계가 정한 값이고 콘텐츠는 그걸 이행한 쪽이다.
crisis_reminder_scenes: [2, 5]

