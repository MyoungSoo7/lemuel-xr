# 야곱 — /새인물 파이프라인 초안(≤70%, 인간 사인오프 대기).
#
# ⚠️ 이 설정은 seed 산출물이 아니라 **저작된 content/jacob/scene*.yml 과 docs/MVP-JACOB.md
#    에서 실측해 역산한 것**이다. seed 층 입력 중 배제 문자열 표·verses.txt 는 **여전히
#    존재하지 않는다** — G0b/G0e/G9/G9d 는 그래서 BLOCKED 로 남는다. "통과"가 아니라
#    "판정 불가"다. G3d 도 옮겨올 원본이 없어 BLOCKED 다(하단 사유 참조).
#
# 🔴 이 인물은 FAIL 2건(G0d·G7)을 **의도적으로 남긴 상태**다. 둘 다 설정이 아니라
#    content/jacob/ 쪽 실제 결함이고, 여기서 설정을 다듬어 덮으면 게이트가 결함을 감춘다.
#      · G0d — 정중한 위로 12문 중 3문이 토큰 25종 어디에도 안 걸린다(화해 강요 대체 표면·
#        절뚝임 미화·편애 정당화). 토큰 선언의 공백이다.
#      · G7 — scene1 에 `consent_card_id` 는 있는데 `skip_alternative_scene_id` 가 없다.
#        동의하지 않은 사용자의 목적지가 선언 층위에 없다.
#    가짜 초록보다 진짜 빨강이 낫다. 수리는 사람 판단 + 별도 PR 이다.
character: jacob
ruleset: newchar-v5 # 토큰 규약 이후 인물 — 면제 없음
scene_count: 5

docs:
  mvp: docs/MVP-JACOB.md
doc_min_lines:
  mvp: 450
# content 문서(docs/MVP-JACOB-CONTENT.md)는 **아직 없다.** 없는 문서를 선언하면
# 게이트가 없는 것을 검사하는 척하게 된다 — 작성 전까지 선언하지 않는다.

# content/jacob/scene*.yml 의 lint_forbidden_tokens 합집합 **전량** 25종(실측).
# 부분집합을 적으면 G6/G6d/G9 가 나머지를 안 보면서 초록이 된다(vacuous green).
forbidden:
  - "관계는 회복되어야 하지"
  - "관계는 회복되어야 합"
  - "관계는 회복되어야죠"
  - "관계도 회복될"
  - "그래서 겸손해지셨"
  - "그래서 겸손해지신"
  - "그래서 겸손해진"
  - "그래서 겸손해집"
  - "너를 다듬는"
  - "너를 다듬으려"
  - "너를 다듬으시"
  - "너를 다듬으신"
  - "당신을 다듬는"
  - "당신을 다듬으려"
  - "당신을 다듬으시"
  - "당신을 다듬으신"
  - "먼저 연락해"
  - "속인 대가"
  - "아직은 때가 아닐"
  - "언젠가는 가게 될"
  - "언젠가는 가셔야"
  - "언젠가는 가야 합"
  - "언젠가는 가야죠"
  - "용서해야"
  - "흉터도 축복"

# §5(c) — ForbiddenTokenConfigTest.kt 는 인물 식별자를 **한국어**로 남긴다(`// 야곱`).
test_identifier: "야곱"

# ── G0c — 토큰이 자기 예문을 잡는가 ────────────────────────────────────────
# 예문은 **제품 말투로 쓴 위험 문장**이고, 토큰 25종과 1:1 이다. 개수를 따로 선언해야
# 축약·줄임으로 원소가 사라지는 사고(㉞)를 게이트가 잡을 수 있다.
#
# 이 인물의 위험 축은 둘이다(content/jacob/scene1.yml:124-126 R2_R3_lint_forbidden 서술).
#   (R2) 라반 20년 = 속임의 대가라는 **인과응보 교훈화** — 속인 대가·그래서 겸손해·
#        너를/당신을 다듬·흉터도 축복
#   (R3) **화해 강요와 유예 프레이밍** — 용서해야·먼저 연락해·관계는 회복되어야·
#        관계도 회복될·언젠가는 가·아직은 때가 아닐
# 예문은 두 축 중 어디에 속하는 토큰인지에 맞춰 썼다.
token_examples_declared: 25
token_examples:
  # ── R3 화해 강요·유예 프레이밍 ──
  - {
      token: "관계는 회복되어야 하지",
      example: "그래도 결국 관계는 회복되어야 하지 않겠어요?",
    }
  - {
      token: "관계는 회복되어야 합",
      example: "가족이라면 관계는 회복되어야 합니다.",
    }
  - {
      token: "관계는 회복되어야죠",
      example: "지금은 어렵더라도 관계는 회복되어야죠.",
    }
  - {
      token: "관계도 회복될",
      example: "시간이 지나면 그 관계도 회복될 거예요.",
    }
  - { token: "먼저 연락해", example: "형님께 먼저 연락해 보시는 게 어떨까요?" }
  - {
      token: "아직은 때가 아닐",
      example: "아직은 때가 아닐 뿐이니 조금만 더 기다려 보세요.",
    }
  - {
      token: "언젠가는 가게 될",
      example: "지금 못 가셔도 언젠가는 가게 될 겁니다.",
    }
  - {
      token: "언젠가는 가셔야",
      example: "마음이 준비되시면 언젠가는 가셔야 하지 않을까요?",
    }
  - { token: "언젠가는 가야 합", example: "가족이니까 언젠가는 가야 합니다." }
  - { token: "언젠가는 가야죠", example: "그래도 언젠가는 가야죠." }
  - {
      token: "용서해야",
      example: "이제는 스스로를 용서해야 앞으로 나아가실 수 있어요.",
    }
  # ── R2 인과응보 교훈화 ──
  - {
      token: "그래서 겸손해지셨",
      example: "그 20년을 지나오셨고, 그래서 겸손해지셨습니다.",
    }
  - {
      token: "그래서 겸손해지신",
      example: "고생을 겪으셨기에 그래서 겸손해지신 겁니다.",
    }
  - {
      token: "그래서 겸손해진",
      example: "그 세월을 통과해서 그래서 겸손해진 사람이 된 거예요.",
    }
  - {
      token: "그래서 겸손해집",
      example: "사람은 한 번 무너져 봐야 그래서 겸손해집니다.",
    }
  - {
      token: "너를 다듬는",
      example: "그 고통은 너를 다듬는 하나님의 손길이다.",
    }
  - {
      token: "너를 다듬으려",
      example: "하나님이 너를 다듬으려 그 세월을 두신 거야.",
    }
  - {
      token: "너를 다듬으시",
      example: "하나님이 너를 다듬으시려고 라반의 집으로 보내신 거야.",
    }
  - {
      token: "너를 다듬으신",
      example: "그 20년은 하나님이 너를 다듬으신 시간이야.",
    }
  - {
      token: "당신을 다듬는",
      example: "그 고생은 당신을 다듬는 과정이었습니다.",
    }
  - {
      token: "당신을 다듬으려",
      example: "하나님이 당신을 다듬으려 이 시간을 주신 겁니다.",
    }
  - {
      token: "당신을 다듬으시",
      example: "하나님이 당신을 다듬으시려고 그 20년을 허락하셨습니다.",
    }
  - {
      token: "당신을 다듬으신",
      example: "그 세월은 하나님이 당신을 다듬으신 기간입니다.",
    }
  - {
      token: "속인 대가",
      example: "라반에게 속으신 건 아버지를 속인 대가였을지도 모릅니다.",
    }
  - {
      token: "흉터도 축복",
      example: "남은 흉터도 축복이었다고 여기실 날이 올 거예요.",
    }

# ── G0d — 제품 말투(존댓말·완곡) 위험 문장이 토큰에 걸리는가 ────────────────
# 순회 축은 토큰이 아니라 **문장**이다. 실제 LLM 이 낼 법한 정중한 회피형 위로를 먼저 쓰고,
# 토큰이 그걸 잡는지 본다 — 잡히도록 문장을 고치면 게이트가 자기 자신을 검사하게 된다.
#
# 🔴 이 목록은 **일부러 red 다.** 아래 12문장은 이 미션의 상담 상황(가해자 자리에 선 사용자)
#    에서 LLM 이 가장 흔히 낼 위로 표면을 먼저 적은 것이고, 그중 3문장이 25종 어디에도
#    걸리지 않는다. 걸리지 않는 3문장을 지우거나 토큰이 잡히게 고쳐 쓰면 G0d 는 초록이
#    되지만, 그 초록은 **커버리지가 아니라 문장을 다듬은 결과**다(README ★★★).
#    미포착 3건은 토큰 선언(content/jacob/scene1.yml:150 25종)의 실제 공백이다:
#      1) "먼저 손을 내미시는" — 화해 강요 축은 `먼저 연락해` 라는 표면 **하나만** 막는다.
#         '손을 내밀다'·'다가가다'·'문자라도 보내다' 는 전부 열려 있다.
#      2) 절뚝임(창 32:31) 미화 — 이 미션의 중심 이미지인데 토큰은 `흉터도 축복` 하나뿐이다.
#         '훈장'·'증거'·'표식' 으로 바꾸면 그대로 통과한다. MVP-JACOB.md:38,353 이
#         "회복은 원상복구가 아니다" 를 이 절뚝임으로 말하는 만큼 오용 표면도 여기 몰린다.
#      3) 편애 정당화 — docs/MVP-JACOB.md:143 이 동의 카드 고지 소재로 "가족 안의 기만과
#         **편애**" 를 명시하는데, 25종에 편애 축 토큰이 **0개**다.
#    → 셋 다 content/ 쪽 토큰 목록을 사람이 판단해 늘려야 할 사안이다. 여기서 문장을 고쳐
#      덮지 않는다.
polite_evasive:
  - "형님께 먼저 연락해 보시는 게 어떨까요?"
  - "이제는 스스로를 용서해야 마음이 편해지실 거예요."
  - "시간이 지나면 그 관계도 회복될 겁니다."
  - "가족인데 언젠가는 가셔야 하지 않을까요?"
  - "하나님이 당신을 다듬으시려고 그 20년을 허락하신 거예요."
  - "그 세월을 지나오셨기에 그래서 겸손해지신 겁니다."
  - "라반에게 겪으신 일은 아버지를 속인 대가였는지도 모릅니다."
  - "남은 흉터도 축복으로 보이는 날이 올 거예요."
  - "아직은 때가 아닐 뿐이에요, 조금만 더 기다려 보세요."
  - "먼저 손을 내미시는 쪽이 결국 더 자유로워지십니다."
  - "그 절뚝임은 당신이 하나님과 씨름했다는 훈장입니다."
  - "부모님의 편애도 지나고 보면 다 뜻이 있었던 일입니다."

# ── G7 — R4 동의 카드 + 스킵 목적지가 실제로 있는 Scene ─────────────────────
# 출처는 콘텐츠가 아니라 **설계 문서**다. 콘텐츠에서 역산하면 "동의 카드가 있는 Scene 에
# 동의 카드가 있는가" 를 묻는 동어반복이 된다.
#   Scene 1 — docs/MVP-JACOB.md:140 ("진입 전 R4 동의 카드(`cc_jacob_family_deception`)
#             — Scene 1~4 전체를 커버", 3택 중 스킵 = `1_alt`)
#             docs/MVP-JACOB.md:12 (가해자 자리 고지를 Scene 1 진입 전 R4 카드로 한다)
#             docs/MVP-JACOB.md:503 (안전 체크리스트: "Scene 1 진입 시 R4 동의 카드 …
#             + 스킵(`1_alt`)" ☑ 설계 반영)
#   Scene 5 — docs/MVP-JACOB.md:216 ("진입 전 별도 R4 동의 카드(`cc_jacob_confrontation`)",
#             "스킵 시 `5_alt`")
#             docs/MVP-JACOB.md:504 (체크리스트 동일 항목 ☑ 설계 반영)
#
# 🔴 이 게이트는 **일부러 red 다.** 실측: content/jacob/scene1.yml:80 에 `consent_card_id`
#    는 있으나 `skip_alternative_scene_id` 리터럴 키가 **없다**. 스킵 목적지 `1_alt` 는
#    동의 카드 옵션 안의 `target: 1_alt`(scene1.yml:91) 로만 존재한다 — 즉 **동의 카드는
#    띄우면서 게이트가 읽는 스킵 목적지 키는 비어 있다.** 동의하지 않은 사용자가 갈 곳이
#    선언 층위에 없다는 뜻이고, 설계 문서(:140, :503)는 `1_alt` 를 스킵으로 약속하고 있다.
#    Scene 5(content/jacob/scene5.yml:182,187)는 두 키를 다 가진다 — 즉 같은 저작자가 한
#    Scene 에서만 빠뜨린 **비대칭**이다.
#    → content/ 를 고쳐 초록으로 만들지 않는다. 키를 어디에 어떤 이름으로 둘지는 사람이
#      판단할 사안이고, 여기서 조용히 메우면 게이트가 실제 결함을 감춘 게 된다.
trigger_scenes: [1, 5]

# ── G3d — 위기 리마인더 리터럴 키 ──────────────────────────────────────────
# 야곱은 **이름이 다르다**. 다른 인물은 `crisis_reminder` 인데 이 인물의 저작층은
# `- id: R1_crisis_reminder` 로 적혀 있다 (scene2.yml:79 · scene5.yml:189, 문구는
# `crisis_reminder_text_ko` 에 :81 / :191).
#
# 문구를 지어내지도, content/ 의 이름을 조용히 바꾸지도 않는다 — G3d 가 제공하는
# `crisis_reminder_key` 노브로 **저작층이 실제로 쓰는 이름**을 게이트에 알려준다.
# 검사 강도는 그대로다: 선언한 Scene 에 그 리터럴 키가 실재하는지 여전히 판정한다.
#
# Scene 목록의 출처도 콘텐츠 역산이 아니다 — 두 파일의 note 가 seed 사양을 그대로
# 인용한다: "seed §4-3 리터럴 그대로. CRISIS_REMINDER_SCENES = (2, 5) 중 하나."
# 즉 (2,5)는 설계가 정한 값이고 콘텐츠는 그걸 이행한 쪽이다.
#
# ⚠️ 남는 부채(사람 판단): 이름 불일치 자체는 결함이다. 인물마다 키 이름이 다르면
#    이런 노브 없이 도는 다른 도구(런타임·에디터·리뷰 스크립트)는 야곱만 놓친다.
#    통일할 방향은 `crisis_reminder` 쪽이지만 그건 저작 정본을 고치는 일이라 여기서
#    임의로 하지 않는다.
crisis_reminder_key: R1_crisis_reminder
crisis_reminder_scenes: [2, 5]

# ── 미정의 = BLOCKED (판정 불가). 없는 것을 있는 척하지 않는다 ──────────────
# verses_file:            (없음) → G0b BLOCKED
# exclusions:             (없음) → G0b/G0e/G9/G9d BLOCKED
#     ㉝ 이후 형식: 원소마다 `value` + `scope`(verse_ref|verse_text|content_leaf) + `expect`.
#     docs/MVP-JACOB.md:478 이 배제 대목 4건(창 29:21-25 / 34 / 35:22 / 38)을 `EXCLUSION-DECL`
#     마커와 함께 적고 있으나, ㉝ 이 요구하는 **배제 문자열 표**(문자열 + scope + expect)도
#     대조 대상인 **verses.txt** 도 레포에 없다. 장·절 번호만으로는 "어느 텍스트의 어느 열에
#     대고 재는지"가 정해지지 않으므로 선언을 만들 수 없다 — 지어내면 게이트가 없는 원본을
#     검사하는 척하게 된다.
