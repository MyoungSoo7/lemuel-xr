# 야곱 — /새인물 파이프라인 초안(≤70%, 인간 사인오프 대기).
#
# ⚠️ 이 설정은 seed 산출물이 아니라 **저작된 content/jacob/scene*.yml 과 docs/MVP-JACOB.md
#    에서 실측해 역산한 것**이다. seed 층 입력 중 배제 문자열 표·verses.txt 는 **여전히
#    존재하지 않는다** — G0b/G0e/G9/G9d 는 그래서 BLOCKED 로 남는다. "통과"가 아니라
#    "판정 불가"다. G3d 도 옮겨올 원본이 없어 BLOCKED 다(하단 사유 참조).
#
# ✅ 2026-08-05 — 오래 남아 있던 FAIL 2건(G0d·G7)이 **content/ 쪽을 고쳐서** 닫혔다.
#    아래 각 게이트 주석에 그때의 빨강 기록을 남겨 둔다 — 무엇이 왜 빨갰는지가 지금 목록의
#    근거이기 때문이다. 어느 쪽도 설정을 다듬어 덮은 것이 아니다:
#      · G0d — 미포착 3문(화해 강요 대체 표면·절뚝임 미화·소급 정당화)을 잡도록 content 의
#        토큰을 25종 → 29종으로 늘렸다. 문장은 한 글자도 고치지 않았다.
#      · G7 — scene1 에 `skip_alternative_scene_id: 1_alt` 를 넣었다. 새로 정한 목적지가
#        아니라 동의 카드 옵션의 `target` 과 MVP-JACOB.md:503 에 **이미 있던 값**을 게이트가
#        읽는 키 이름으로 옮겨 적은 것이다(scene5 만 갖고 있던 비대칭 해소).
#    남은 BLOCKED 4건(G0b/G0e/G9/G9d + G3d)은 그대로다 — 여전히 "통과"가 아니라 "판정 불가"다.
character: jacob
ruleset: newchar-v5 # 토큰 규약 이후 인물 — 면제 없음
scene_count: 5

docs:
  mvp: docs/MVP-JACOB.md
  content: docs/MVP-JACOB-CONTENT.md
doc_min_lines:
  mvp: 450
  content: 200
# content 문서는 2026-08-22 런타임 노출과 함께 작성됐다(그 전까지는 없어서 선언하지
# 않았다 — 없는 문서를 선언하면 게이트가 없는 것을 검사하는 척한다). 이제 실재하므로
# 선언한다: G10 이 분량 하한을, G6d/G9d 가 문서 안의 금칙·배제 인용 규율을 함께 본다.
# 하한 200 은 실측(약 250줄)보다 낮게 잡은 바닥이다 — 상한이 아니라 잘려 나감을 재는 선.
# ⚠️ 베드로·다니엘·에스더의 게이트에는 아직 이 선언이 없다. 세 문서 다 실재하는데
#    「아직 없다」는 옛 주석이 그대로 남아 있다 — 야곱만 고친 것이고, 나머지 셋은
#    같은 방식으로 선언을 채워 넣을 수 있는 미해소 건이다.

# content/jacob/scene*.yml 의 lint_forbidden_tokens 합집합 **전량** 29종(실측).
# 부분집합을 적으면 G6/G6d/G9 가 나머지를 안 보면서 초록이 된다(vacuous green).
