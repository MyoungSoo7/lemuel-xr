# ── G0d — 제품 말투(존댓말·완곡) 위험 문장이 토큰에 걸리는가 ────────────────
# 순회 축은 토큰이 아니라 **문장**이다. g0d(`newchar_gates.py:810-822`)는 순수
# 부분문자열 비교이므로 어간·활용을 보지 않는다 — 문장이 토큰을 **문자 그대로**
# 포함해야 한다. seed §7-2 는 rev.4 에서 이 대응이 깨져 있었고(확정 g0d FAIL)
# rev.6.4 에서 다시 쓴 판본이다. **문장을 고쳐 초록을 맞추지 마라** — 그러면
# 게이트가 자기 자신을 검사하게 된다.
polite_evasive:
  - "그만큼 헌신했으니 하나님이 자리를 주실 거예요."
  - "곁을 지켰으니 그래도 잘 하신 거예요."

# ── G7 — R4 동의 카드 + 스킵 목적지가 실제로 있는 Scene ─────────────────────
# 헌장 §2.1-a 양방향 불변식: `trigger_categories` 를 가진 Scene 집합과 정확히 같다.
# 룻은 5개 Scene 전건이 트리거를 진다(사별 2 · 빈곤 1 · 민족 라벨링 1 ·
# 성적 취약 정황 1 · 임신출산 1 = 6종). 커버 관계는 카드 3장이 진다 —
# 카드1 [1,2] · 카드2 [3,5] · 카드3 [4]. Scene 2·5 는 카드 정의를 갖지 않고
# 참조만 하지만 `consent_card_id` + `skip_alternative_scene_id` 두 키는 보유한다(G7).
trigger_scenes: [1, 2, 3, 4, 5]

# ── G3d — 위기 리마인더 리터럴 키 ──────────────────────────────────────────
# 전건이다. 마지막 Scene(베드로 판례) + 탄식층 Scene 2 + C 등급 Scene 4 만으로
# 좁히지 않았다 — 이 미션은 5개 Scene 전부가 트리거 Scene 이다.
crisis_reminder_scenes: [1, 2, 3, 4, 5]

# ── G0b — 배제 자구 양방향 대조표 ──────────────────────────────────────────
verses_file: docs/verses-ruth.txt

# ── 배제 선언 22항목 (seed §7-3 · AC 31 기대값 22) ─────────────────────────
#
# 2026-08-11 +2 — 룻 4:16·4:17 (E16·E17). 아래 「20」 을 말하는 문단은 그 이전
# 상태를 논한 것이며 논지는 그대로 유효하다(값 단위 선언 대 scope 이중 선언).
# 수만 20 → 22 로 옮겨 읽을 것.
#
# ⚠️ **seed §7-3 의 "선언 줄 수" 열과 AC 31 의 기대값이 서로 어긋난다 — 후자를 따랐다.**
#    표의 열대로 룻기 본문 자구 16종을 `verse_text` + `content_leaf` 두 줄씩 선언하면
#    항목 수는 16×2 + E1' 1 + E10 1 + 축배타 2 = **36** 이 된다. AC 31 은 `exclusions`
#    항목 수가 **정확히 20** 이어야 한다고 못박고, 그 20의 내역을 "단일 문자열 18 +
#    축 배타 2" 로 **값 단위**로 열거한다. 두 지시를 동시에 만족할 수 없다.
#    값 단위 20 을 택한 근거는 구현이다 — g9/g9d/g0e 는 `scope` 와 무관하게 **선언된
#    모든 값**을 훑으므로(`newchar_gates.py:1334-1365`·`:696-728`), 룻기 본문 자구에
#    `content_leaf` 짝을 더 달아도 새로 재는 것이 하나도 없다. 반면
#    `verse_text`/`excluded_only` 는 g0b 의 양방향 검사(배제장 실재 + 사용장 부재)를
#    추가로 요구하므로 **엄격하게 더 강하다.** 즉 20항목 선언은 36항목 선언과
#    검사 범위가 같고 항목 수만 AC 31 과 맞는다. 이 판단은 보고서에 이탈로 적었다.
#
# scope 배정 규칙(seed §7-3 조건부 표):
#   룻기 본문 자구        → verse_text / excluded_only  (16종)
#   룻기 밖 성경 자구     → content_leaf / absent       (E10 신 23:3)
#   비-성경 문자열·조각   → content_leaf / absent       (E1' · 축 배타 2종)
# `content_leaf` 에 `excluded_only` 를 붙이는 조합은 명시적 설정 오류다(`:627-631`).
exclusions:
  # ── 룻기 본문 자구 16종 — docs/verses-ruth.txt EXCLUDED 본문 열에 실재하고
  #    USED 본문 열에는 부재해야 한다. 자구는 docs/VERSES-RUTH-GAE.md 에서 복사했다.
  - {
      value: "나도 죽어 거기 묻힐 것이라",
      scope: verse_text,
      expect: excluded_only,
    } # E1 룻 1:17
  - {
      value: "나는 너희로 말미암아 더욱 마음이 아프도다",
      scope: verse_text,
      expect: excluded_only,
    } # E2 룻 1:13
  - {
      value: "여호와께서 나를 징벌하셨고",
      scope: verse_text,
      expect: excluded_only,
    } # E3 룻 1:21b
  - {
      value: "너를 건드리지 말라 하였느니라",
      scope: verse_text,
      expect: excluded_only,
    } # E4 룻 2:9
  - {
      value: "다른 밭에서 사람을 만나지 아니하는 것이 좋으니라",
      scope: verse_text,
      expect: excluded_only,
    } # E5 룻 2:22
  - {
      value: "새벽까지 그의 발치에 누웠다가",
      scope: verse_text,
      expect: excluded_only,
    } # E6 룻 3:14
  - {
      value: "여호와께서 그에게 임신하게 하시므로",
      scope: verse_text,
      expect: excluded_only,
    } # E7 룻 4:13
  - {
