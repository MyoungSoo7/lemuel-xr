# ── 선언하지 못한 축 배타 6종 (부채 — 사람 판단 필요) ────────────────────────
#   `드러낼 것인가`(4파일) · `숨길 것인가`(3) · `어디까지 협력`(3) ·
#   `어디서 멈출`(2) · `밝힐 용기`(1) · `타협의 선`(1)
#
#   전부 G0e 과차단 사전 스캔에 걸린다. 그리고 **G0e 가 옳다** — 충돌처가 전부
#   에스더·다니엘·베드로의 **축 문장 그 자체**다. 룻이 이 문자열을 배제하는 이유가
#   "저건 저 인물 것이다" 이므로, 다른 인물 콘텐츠에 실재하는 것은 결함이 아니라 설계다.
#   예외 노브를 만들어 G0e 를 침묵시키지 않았다(peter.yml 선례).
#   ⚠️ 그러므로 이 6종에 대해 "게이트가 통과했다"고 말하면 안 된다. 재지 않았다.
#   집행 수단은 §8-2 AC 20 인간 검토뿐이다.

# ── 릴리스 선결 조건 (seed §6 Q12) ─────────────────────────────────────────
# ⚠️ 이 키는 `newchar_gates.py` 가 읽지 않는다 — 게이트를 통과시키지도 막지도 않는다.
#    그 사실이 요점이다. §10-1 의 "출시 전에는 보강돼야 하나"가 산문 한 줄로만 있으면
#    27/27 초록 앞에서 지워진다. 릴리스 판단자가 한 파일에서 보게 만드는 것이 목적이며,
#    AC 에는 넣지 않는다(남의 파일에 완료 판정을 묶지 않는다).
release_blockers:
  - id: emotion_classifier_bereavement_lexicon
    note: "사별 특이형 동반사망 표현 4종이 EMOTION-CLASSIFIER 사전에 없다(§10-1). 게이트 27/27 초록과 무관하게 출시를 막는다."
    resolved: true
    resolved_at: "2026-08-06"
    resolved_by: >-
      4종이 docs/EMOTION-CLASSIFIER.md §3 사전과 application.yml 런타임 regex 양쪽에 들어갔고,
      두 사전이 어긋나면 CrisisKeywordDocContractTest 가 양방향으로 깨진다.
      등급은 2026-08-06 사용자 결정 그대로 — 따라 죽=critical(lockout) ·
      같이/함께 묻히=high(상단 배너) · 곁으로 가고 싶 / 고인 지시어+곁에 있고 싶=medium(하단 카드).
    caveat: >-
      medium 등급의 일상어 오탐(`마지막`·`혼자 살아`·`아무도 모를` 단독 토큰)은 2026-08-06
      사용자 결정으로 좁혀서 해소했다(EMOTION-CLASSIFIER.md §3 'medium 오탐 좁힘' 절).
      남은 것은 하나 — `마지막으로 정리` 는 "마지막으로 정리하겠습니다"가 너무 흔해서
      **의도적으로 재현율을 포기했다.** 즉 이 표현만 쓰는 사용자는 medium 에 안 걸린다.
      좁히기의 실패 방향이 오탐에서 미탐으로 바뀌었으므로 CrisisKeywordDocContractTest 는
      양방향으로 못박는다 — 일상어가 안 걸리는 것과 위험 형태가 여전히 걸리는 것 둘 다.
      medium 의 영향 범위는 그대로 safety_alerts 잡음 + 하단 카드로 한정된다
      (lockout 도 chatops 알림도 medium 에는 걸리지 않는다).

