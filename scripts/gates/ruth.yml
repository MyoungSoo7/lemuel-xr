# 룻(Theme 19) — /새인물 파이프라인 초안(≤70%, 인간 사인오프 대기).
#
# 이 설정은 콘텐츠에서 역산한 것이 아니라 **동결 seed(rev.6.4) §7 의 입력을 옮긴 것**이다.
# 최상위 키는 베드로와 동일한 14개(`scripts/gates/peter.yml` 실측) + `release_blockers`.
#
# ⚠️ 이 파일 하나로 "안전하다"가 증명되지 않는다.
#    (2026-08-11 정정 — 이 자리에는 "§8-1 AC 14건의 실행기는 **아직 없다**"고 적혀
#    있었다. 낡았다. `scripts/check_ruth_captions.py` 는 존재하고 13개 검사가 돈다
#    (AC 7·10·11·14·23·24·26·27·28·29·30·31·32 + AC 33). 2026-08-11 부터는
#    `scripts/ci_gates.py` 의 `captions:ruth` 러너로 CI 에서도 돈다. 남은 것은
#    AC 12 뿐이며 `scripts/check_ruth_biometrics.py` 는 실제로 없다.)
#    그래도 초록을 "안전"으로 읽지 마라 — 저 13건의 주장 범위는 「선언된 정본과
#    대상 파일이 어긋나지 않았다」 까지이고, 정본과 대상을 *같이* 고치면 통과한다.
character: ruth
ruleset: newchar-v5 # 토큰 규약 이후 인물 — 면제 없음
scene_count: 5

# ── G2v — 래치 **키의 값**을 5개 Scene 전건에서 잰다 (2026-08-11 신설).
#    값을 여기에 적지 않고 정본 문서를 가리킨다. 적으면 정본·이 설정·Scene 셋을
#    손으로 맞춰야 하고, 그게 이 게이트가 잡으려는 실패 그 자체다.
#    같은 계약을 `check_ruth_captions.py` AC 23 도 잰다 — 중복이지만 도는 자리가
#    다르다(AC 23 은 룻 전용 검사기, G2v 는 인물 공통 게이트). 라합·이후 인물이
#    쓰는 것은 G2v 쪽이다.
latch_contract:
  canon_doc: docs/RUTH-LOCKED-STRINGS.md
  canon_block: crisis_latch

docs:
  mvp: docs/MVP-RUTH.md
  content: docs/MVP-RUTH-CONTENT.md
doc_min_lines:
  mvp: 420
  content: 480 # 작성 시점 526줄. 엘리야(585줄/하한 550)와 같은 비율로 잡았다.
# CONTENT 문서 등재 이력 — 2026-08-11.
#
# 이 자리의 주석은 세 번 바뀌었다. ① "만들지 않았다(seed §6 폐기 항목)" → ②
# docs/MVP-RUTH-CONTENT.md 가 실제로 작성되면서 ①이 거짓이 됐고, 그때는 등재를
# 보류했다("등록하면 ci_gates 기준선이 흔들리는데 기준선 갱신은 사람이 판단할 일이다")
# → ③ 2026-08-11 사용자 승인으로 **등재한다.**
#
# ②의 논리가 틀렸다. 기준선 설계의 목적은 변경을 *피하는* 것이 아니라 *기록하는* 것이다.
# 흔들림이 싫어서 530줄짜리 안전 문서를 어떤 게이트의 사정권에도 두지 않는 쪽을 택하면,
# 그건 이 리포가 줄곧 경계해 온 형태 — 재지 않으면서 초록인 상태 — 그 자체가 된다.
#
# 실제로 등재해 보니 **기준선은 갱신할 필요가 없었다.** ②가 걱정한 드리프트는 일어나지
# 않았다 — 등재 직후 G6d 16건 · G9d 10건이 빨개졌으나 전부 *마커 규율 부채*였고
# (문서가 배제 자구·금지 토큰을 인용하면서 선언 마커를 안 달았다), 마커를 달자
# tally 가 기준선 [26,1,0] 과 같아졌다. 남은 FAIL 은 등재 이전과 같은 G0e 하나다.
# 즉 대가 없이 사정권만 넓어졌다. ②는 치르지도 않을 비용을 이유로 검사를 미룬 것이다.
#
# 등재로 실제로 늘어나는 사정권:
#   · G10  — 줄 수 하한(위 `doc_min_lines.content`).
#   · G6d  — 문서가 배제 자구를 적을 때 EXCLUSION-DECL 마커를 달았는가.
#   · G9d  — 같은 규율의 배제 선언 축.
# 늘어나지 **않는** 것: 문서 내용의 사실성. 게이트는 이 문서가 참인지 재지 않는다.
#
# (없는 문서를 선언하면 g10 이 GateBlocked 다 — peter.yml:14-15 가 같은 함정을 경고한다.
#  ②는 그 반대 방향의 함정이었다: 있는 문서를 선언하지 않아 검사 대상에서 빠져 있었다.)

# ── G5a-i·G5b·G5e·G6·G6d — content/ruth/scene*.yml 의 lint_forbidden_tokens
#    **합집합 전량 22종**. 개수는 하한이 아니라 합집합 동일성이다(seed §7-1).
#    부분집합을 적으면 G6/G6d/G9 가 나머지를 안 보면서 초록이 된다(vacuous green).
#    분포: scene1 4 · scene2 7 · scene3 3 · scene4 3(2종 중복) · scene5 7.
forbidden:
  # 계열 1 — 공로화 (헌장 §3-a)
  - "믿음이 좋아서"
  - "용기를 냈기 때문에"
  - "그만큼 헌신했으니"
  - "착해서"
  - "충성했으니"
  # 계열 2 — 섭리 설명 (헌장 §3-b · R2)
  - "하시려고 그 일을 허락"
  - "다 뜻이 있어"
  - "연단하시려고"
  # 계열 3 — 회복 압박 (R3)
  - "이제 그만 일어나"
  - "감사하면 회복"
  - "믿음으로 이겨내"
  - "빨리 잊고"
  # 계열 4 — 보상 프레이밍 (헌장 §3-c)
  - "결국 보상받았"
  - "참으니 복이"
  - "일곱 아들보다 귀한"
  # 계열 5 — 동반사망 (E1)
  - "나도 죽어"
  - "따라 죽"
  - "같이 묻히"
  # 계열 6 — 마감 줄 평가 어휘 (SR-2)
  - "곁을 지켰"
  - "물러섰지만"
  - "그래도 잘"
  - "덕분에"
  #   ↳ 막는 것은 **사람에게 공을 돌리는** 용법이다(예문 참조). 신에게 돌리는 `덕분에` 는
  #     이 시리즈의 축이라 런타임에서 면제된다 — `ForbiddenTokenScanner.PRECEDING_EXEMPTIONS`,
  #     신 호칭(하나님·여호와·주님…)이 바로 앞에 올 때만. `그분` 은 고인을 가리킬 수 있어 제외.
  #     (2026-08-05 사용자 결정: "덕분에는 신 덕분에고 인간 덕분에는 굳이 필요 없다")
  #     알려진 구멍: `덕분이에요`·`덕분입니다` 는 토큰이 `덕분에` 라 안 걸린다. 별건.

# ⚠️ 계열 7(축 배타)은 여기 없다. `forbidden` 이 아니라 `exclusions` 로 집행한다 —
#    g0e 는 `_exclusion_entries(c)` 만 훑고 `forbidden` 은 보지 않는다(seed §7-1 재채점 T11).
# ⚠️ 1-2자 어간(`잘`·`옳`·`용기`)을 올리지 않았다. §4-8 의 어간 목록은 설계 규칙이고,
#    `forbidden` 에는 3자 이상 표층형만 올린다. `옳` 은 헌장 §5-g 의 다말 절을 친다.

# §5(c) — ForbiddenTokenConfigTest.kt 는 인물 식별자를 **한국어**로 남긴다.
test_identifier: "룻"

# ── G0c — 토큰이 자기 예문을 잡는가 ────────────────────────────────────────
# 예문은 제품 말투로 쓴 **위험 문장**이고 토큰 22종과 1:1 이다.
