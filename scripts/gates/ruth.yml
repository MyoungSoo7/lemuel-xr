  - { value: "네 노년의 봉양자", scope: verse_text, expect: excluded_only } # E9-b 룻 4:15
  - { value: "일곱 아들보다 귀한", scope: verse_text, expect: excluded_only } # E9-c 룻 4:15
  - { value: "네게 상속자를 주사", scope: verse_text, expect: excluded_only } # E11 룻 4:12a
  - {
