  - { value: "네 남편이 죽은 후로", scope: verse_text, expect: excluded_only } # E15 룻 2:11a
  # ── DP7 로 2026-08-11 등재. 4:13-17 은 렌더 층위에 한 조각도 없는데 배제 선언은
  #    E7(4:13)·E8(4:14)·E9-a/b/c(4:15) 까지만 있었다. 4:16·4:17 은 같은 위험 계열
