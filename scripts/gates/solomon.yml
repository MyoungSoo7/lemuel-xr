# 솔로몬 (Theme 13) — 머지된 baseline. 토큰을 5개 Scene 에 미러링한다.
# 엘리야 설정과 같은 단서: seed 층 입력 중 배제 문자열 표·verses.txt 는 없으므로
# G0b/G0e/G9/G9d 는 BLOCKED(판정 불가)로 남는다.
character: solomon
ruleset: newchar-v5
scene_count: 5

docs:
  mvp: docs/MVP-SOLOMON.md
  content: docs/MVP-SOLOMON-CONTENT.md
doc_min_lines:
  mvp: 450
  content: 550

# content/solomon/scene*.yml 의 lint_forbidden_tokens **합집합 전량 22종**(파서 실측).
#
# 🔻 정정 이력 — 이전 값은 7종이었다. 합집합은 22종이고, 빠져 있던 15종에는 이 인물이
#    일부러 추가해 둔 높임형('욕심이 많으셔'·'깨달으셨으')과 교훈화 어휘('바르게 살아야 합'·
#    '교훈으로 삼아')가 통째로 들어 있었다. G6/G6d/G9 가 그 15종을 안 보면서 초록이었다
#    (peter.yml 이 경고한 vacuous green — 부분집합을 전량이라 적으면 생긴다).
#
# 런타임은 '이제 깨달았으니' 가 아니라 **'깨달았으'** 를 막는다(높임형 '깨달으셨으' 별도).
# ForbiddenTokenConfigTest 가 좁은 토큰이 활용만으로 뚫리는 걸 확인하고 바꾼 결과다.
forbidden:
  - "감사가 부족"
  - "교훈으로 삼는"
  - "교훈으로 삼아"
  - "교훈으로 삼으"
  - "교훈으로 삼을"
  - "깨달았으"
  - "깨달으셨으"
  - "다시 열심히"
  - "만족을 모르"
  - "믿음이 부족"
  - "바르게 사세"
  - "바르게 사십"
  - "바르게 살아라"
  - "바르게 살아야 하지"
  - "바르게 살아야 합"
  - "바르게 살아야죠"
  - "욕심이 많아서"
  - "욕심이 많으셔"
  - "욕심이 많으시"
  - "이제부터라도"
  - "허무를 극복"
  - "허무하지 않으려면"

test_identifier: "솔로몬"

# ── G0c — 토큰이 자기 예문을 잡는가 ────────────────────────────────────────
# 예문은 제품 말투로 쓴 위험 문장이고 토큰 22종과 1:1 이다. 개수를 따로 선언해야
# 축약·줄임으로 원소가 사라지는 사고(㉞)를 게이트가 잡는다.
token_examples_declared: 22
token_examples:
  - { token: "감사가 부족", example: "감사가 부족해서 공허한 겁니다." }
  - {
      token: "교훈으로 삼는",
      example: "이 허무를 교훈으로 삼는 게 지혜입니다.",
    }
  - {
      token: "교훈으로 삼아",
      example: "이 경험을 교훈으로 삼아 다르게 사세요.",
    }
  - { token: "교훈으로 삼으", example: "이 공허를 교훈으로 삼으시면 됩니다." }
  - { token: "교훈으로 삼을", example: "이 시간을 교훈으로 삼을 수 있습니다." }
  - { token: "깨달았으", example: "이제 깨달았으니 행동으로 옮기세요." }
  - { token: "깨달으셨으", example: "이제 깨달으셨으니 달라지셔야죠." }
  - { token: "다시 열심히", example: "마음을 다잡고 다시 열심히 살아 보세요." }
  - { token: "만족을 모르", example: "만족을 모르니까 늘 허무한 겁니다." }
  - { token: "믿음이 부족", example: "믿음이 부족해서 공허가 오는 거예요." }
  - { token: "바르게 사세", example: "남은 날은 바르게 사세요." }
  - { token: "바르게 사십", example: "이제부터 바르게 사십시오." }
  - { token: "바르게 살아라", example: "허무를 알았으면 바르게 살아라." }
  - {
      token: "바르게 살아야 하지",
      example: "이제는 바르게 살아야 하지 않겠어요?",
    }
  - {
      token: "바르게 살아야 합",
      example: "허무를 겪었으면 바르게 살아야 합니다.",
    }
  - { token: "바르게 살아야죠", example: "이제는 바르게 살아야죠." }
  - { token: "욕심이 많아서", example: "욕심이 많아서 채워지지 않는 겁니다." }
  - {
      token: "욕심이 많으셔",
      example: "욕심이 많으셔서 늘 부족하게 느끼시는 거예요.",
    }
  - { token: "욕심이 많으시", example: "욕심이 많으시면 만족이 어렵습니다." }
  - { token: "이제부터라도", example: "이제부터라도 다르게 살아 보세요." }
  - { token: "허무를 극복", example: "허무를 극복하는 방법을 알려드릴게요." }
  - {
      token: "허무하지 않으려면",
      example: "허무하지 않으려면 목표를 다시 세우세요.",
    }

# ── G0d — 제품 말투(존댓말·완곡) 위험 문장이 토큰에 걸리는가 ────────────────
# 순회 축은 토큰이 아니라 **문장**이다. 정중한 회피형 위로를 먼저 쓰고 토큰이 잡는지 본다.
# 이 인물의 위험 축은 둘이다 — (a) 공허의 원인을 사용자 탓으로 돌리는 귀속,
# (b) 허무를 '교훈' 으로 환산해 행동 개선을 요구하는 도구화.
#
# 실측 기록: 아래 8문장 중 6문장(깨달으셨으·교훈으로 삼으·욕심이 많으셔·이제부터라도·
# 바르게 사십·만족을 모르 축)은 **이전 7종 목록으로는 걸리지 않았다**.
polite_evasive:
  - "많이 가지셨는데도 공허하신 건 감사가 부족해서일 수 있어요."
  - "이제 깨달으셨으니 조금씩 달라지시면 좋겠습니다."
  - "이 허무를 교훈으로 삼으시면 남은 날이 달라질 거예요."
  - "욕심이 많으셔서 만족이 어려우신 걸 수도 있습니다."
  - "허무를 극복하실 방법을 함께 찾아볼까요?"
  - "이제부터라도 마음을 다잡고 다시 열심히 살아 보시면 어떨까요?"
  - "남은 날은 바르게 사십시오."
  - "만족을 모르시는 마음부터 살펴보셔야 합니다."

# ── G7 — R4 동의 카드 + 스킵 목적지가 실제로 있는 Scene ─────────────────────
# 출처는 콘텐츠가 아니라 **설계 문서**다(콘텐츠에서 역산하면 동어반복이 된다).
#   Scene 3 — docs/MVP-SOLOMON.md:72,119,391 (R4 mid — 영아 상실·칼 위협, skip→Scene 4)
#   Scene 4 — docs/MVP-SOLOMON.md:74,143,392 (R4 low~mid — 허무·공허, skip→Scene 5)
trigger_scenes: [3, 4]

# ── G3d — 위기 리마인더 리터럴 키 ──────────────────────────────────────────
# Scene 5 는 이탈 지점(미션 종료)이다. 2026-08-05 에 content/solomon/scene5.yml 에
# `crisis_reminder` 키를 추가했다 — 문구는 새로 쓴 게 아니라
# backend/src/main/resources/scenarios/solomon.yml outro 에서 **이미 나가는 값**이고,
# 저작층에만 같은 이름의 키가 없어 판정 불가였다.
#
# ⚠️ Scene 4(허무 정서)의 위기 문구도 런타임 solomon.yml:225 에 이미 있다. 다만 저작층
#    Scene 4 에는 리터럴 키가 없어 여기 선언하지 않았다 — 옮길지는 사람 판단이다.
crisis_reminder_scenes: [5]

# ── 미정의 = BLOCKED (판정 불가). 없는 것을 있는 척하지 않는다 ──────────────
# verses_file:  (없음) → G0b BLOCKED
# exclusions:   (없음) → G0b/G0e/G9/G9d BLOCKED
#     이 둘은 **채울 수 없다** — 배제 문자열 표도 verses.txt 도 레포에 없다.
#     지어내면 게이트가 없는 원본을 검사하는 척하게 된다.
