# 이 설정에 forbidden·token_examples·exclusions·test_identifier 가 없는 이유와,
# 그로 인한 BLOCKED 25건을 판정 가능하게 만드는 절차는 scripts/gates/README.md
# 의 "legacy-baseline 3인물의 BLOCKED 75건" 절에 실측과 함께 적혀 있다.
# 빈 목록을 채워 BLOCKED 를 없애는 것은 순회 0회를 초록으로 바꾸는 것일 뿐이다.
# moses — 토큰 규약(§5(a))·5-Scene 규약(§8-2)·상시 R1 리스너(§4 R1) **도입 이전**에 머지된 인물.
# 그래서 ruleset: legacy-baseline. 이 값은 스크립트 소스의 LEGACY_BASELINE 집합에
# 이름이 있어야만 허용된다(G0cfg). 신규 인물은 이 줄을 써도 즉시 FAIL 한다.
# legacy 게이트 결과는 PASS 가 아니라 BLOCKED(판정 유보)로 나온다. 부채는 --strict 로 본다.
character: moses
ruleset: legacy-baseline
scene_count: 6

docs:
  mvp: docs/MVP-MOSES.md
  content: docs/MVP-MOSES-CONTENT.md
doc_min_lines:
  mvp: 450
  content: 550

# ── T1 신학 축 (2026-08-18) ────────────────────────────────────────────────────
# G5t 는 `safety_gates[].id: T1_*` 를 요구하거나, 없으면 **여기에 부채를 등재**하게 한다.
# 등재는 PASS 가 아니라 BLOCKED(판정 유보)다 — 침묵과 구별하려고 적는 것이다.
theology_axis:
  status: exempt
  reason: >-
    신학 게이트 v1 미도입. 이 인물만 theology_ 접두 게이트 3건(scene2 1건·scene3 2건)을 이미 갖고 있으나 description 뿐이고 집행 수단이 없다 — T1_ 로 개칭하고 토큰을 채우는 것이 이 면제의 해소 조건이다.
