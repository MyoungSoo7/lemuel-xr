# 🔻 실측 주석 — docs/MVP-ESTHER.md:430 은 "71종, 세 게이트의 목록은 문자 그대로 동일"
#    이라고 적지만 파서로 세면 scene3 은 블록이 **3개**(71·12·71)고 합집합은 83종이다.
#    추가 12종은 scene3 의 `R2_mordecai_is_speaker_not_authority`(content/esther/scene3.yml:224)
#    가 따로 든 축이고 scene5(71종)에는 없다. 문서 §12.8 이 그 게이트를 사본에서 누락했다 —
#    문서 부채이지 설정 오류가 아니므로 여기 합집합 83종을 그대로 둔다(문서 수정은 별도 PR).

# ── G0c — 토큰이 자기 예문을 잡는가 ────────────────────────────────────────
# 예문은 **제품 말투로 쓴 위험 문장**이고, 토큰 83종과 1:1 이다. 개수를 따로 선언해야
# 축약·줄임으로 원소가 사라지는 사고(㉞)를 게이트가 잡을 수 있다.
#
# 이 인물의 위험 축은 넷이다(docs/MVP-ESTHER.md:359 표 · scene3.yml 게이트 주석):
#   (a) R3 개시 압박 — "결국은 말해야"·"입을 열어야"·"용기를 내"·"침묵하면 안"
#   (b) R2 목적론적 의미부여 — "이 때를 위해"·"예비된 자리"·"우연이 아"·"에도 뜻이 있"
#   (c) R2 모르드개 권위화 + 4:14 후반절 위협의 사용자 재적용 — "모르드개의 말이 옳았"·
#       "당신의 집도 멸망"·"말하지 않으면 모두 죽"
#   (d) 2장 후궁 징집 서사의 미화 — "미모로" (docs/MVP-ESTHER.md:397 DP6: 성적 착취
#       트리거 강도만으로 전면 배제된 축이라, 예문도 그 미화형을 그대로 적는다)
