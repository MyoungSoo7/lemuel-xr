  #    정중한 권유·허용 말투(`-시면`·`-셔도`)와 소급 정당화가 목록에 없었다.
  #    근거·과차단 실측은 content/ 쪽 같은 게이트 주석에 있다.
  - { token: "용기를 내시", example: "조금만 용기를 내시면 길이 열릴 거예요." }

# ── G0d — 제품 말투(존댓말·완곡) 위험 문장이 토큰에 걸리는가 ────────────────
# 순회 축은 토큰이 아니라 **문장**이다. 실제 LLM 이 낼 법한 정중한 회피형 위로를 먼저 쓰고,
# 토큰이 그걸 잡는지 본다 — 잡히도록 문장을 고치면 게이트가 자기 자신을 검사하게 된다.
#
# ✅ 2026-08-05 초록 — **문장은 한 글자도 고치지 않았다.** 빨강 기록: 아래 6번 문장
#    ("조금만 용기를 내시면 …")이 82종 어디에도 안 걸렸다. §12.8 감사가 어간형 `용기를 내` 를
#    부정형 과차단 때문에 어미 8종(내세·내십·내셔야·내야 합·내야죠·낼·냈·내어)으로 쪼갰는데
#    그 8종에 **연결어미 `-시면`(용기를 내시면)이 빠져** 있었다. "용기 내라는 말이 제일
#    부담스러워"(docs/MVP-ESTHER.md:44)가 이 미션의 최우선 R3 축인데 그 축의 존댓말
#    권유형이 뚫려 있었다는 뜻이다.
#    → content/esther/scene3.yml·scene5.yml 에 `용기를 내시` 를 추가해 닫았다(83종).
#      어간 `용기를 내` 로 되돌리지 않았다 — §12.8 이 되살린 "용기를 내지 않아도 됩니다" 가
#      다시 막힌다. '-시-' 삽입형까지만 넓히는 것이 두 요구를 다 만족하는 최소 변경이다.
polite_evasive:
  - "많이 망설여지시겠지만, 지금 이 자리에 계신 것도 우연이 아닐 거예요."
  - "언젠가는 말해야 할 순간이 올 텐데, 그때를 조금씩 준비해 보시면 어떨까요?"
  - "무섭더라도 한 번은 두려움을 넘어야 합니다 — 넘고 나면 훨씬 가벼워지실 거예요."
  - "지금 말씀하지 않으시면 나중에 후회하게 되실까 걱정됩니다."
  - "당신이 그 자리에 있는 데는 이유가 있다고 생각해요."
  - "조금만 용기를 내시면 생각보다 잘 풀릴 수도 있어요."
  - "이 고난은 의미가 있는 시간이었다고 언젠가 느끼시게 될 거예요."
  - "지나고 보면 모르드개의 말이 옳았다고 느끼실지도 모릅니다."
  - "결국은 말하게 되실 텐데, 마음의 준비만 미리 해 두시면 좋겠습니다."
  - "지금은 힘드시겠지만 이 자리도 그냥 주어진 게 아니라고 믿어요."

# ── G7 — R4 동의 카드 + 스킵 목적지가 실제로 있는 Scene ─────────────────────
# 출처는 콘텐츠가 아니라 **설계 문서**다. 콘텐츠에서 역산하면 "동의 카드가 있는 Scene 에
# 동의 카드가 있는가" 를 묻는 동어반복이 된다.
#   Scene 1 — docs/MVP-ESTHER.md:105 (Pre-Scene 0 동의 카드 `esther_scene1_edict_warning`
#             + 건너뛰기 대체 라우트 `s1_alt_summary`), :262 ("Scene 1: R4 동의 게이트 필수"),
#             :363 (§12.4 위험 대응표 R4 행), :482 (§13 출판 전 체크리스트)
#
# 문서가 R4 로 지정한 Scene 은 **1 뿐**이다. Scene 4 는 같은 표에서 R4 가 아니라
# R1(4:16 "죽으면 죽으리이다" 자해 근접 표현, :364)로 지정돼 있어 이 게이트의 대상이 아니다 —
# R1 은 상시 리스너·dwell_limit 이 수단이고 동의 카드가 아니다. 넣으면 없는 요구를 지어내는 게 된다.
trigger_scenes: [1]

# ── G3d — 위기 리마인더 리터럴 키 ──────────────────────────────────────────
# 🔻 이 항목은 "content 에 원본이 없다" 는 전제로 BLOCKED 를 남기려던 것이었으나,
#    파서로 실측하니 **전제가 틀렸다.** 확인 명령은 newchar_gates.py 의 판정식 그대로다:
#      present = key in yaml_keys(d) or key in {str(v) for v in collect_key(d,'id')}   (:947)
#    즉 G3d 는 `crisis_reminder:` **키** 형태와 `- id: crisis_reminder` **id 값** 형태를
#    둘 다 받는다. 에스더 콘텐츠는 후자를 5개 Scene 전부에 이미 갖고 있다(문구 포함):
#      scene1.yml:166 · scene2.yml:131 · scene3.yml:370 · scene4.yml:108 · scene5.yml:319
#      text_ko: "AI 보조 — 본문은 성경 참조 | 지금 힘드시면 {{crisis_resources.default}}"
#    (엘리야·솔로몬은 키 형태라 5만 선언했지만, 그건 저 두 인물의 저작층 사정이다.)
#
# 그래서 여기서 새로 지어낸 안전 문구는 **한 글자도 없다.** content/ 는 건드리지 않았고,
# 이미 저작돼 있는 5개 Scene 을 가리키기만 한다. 판정이 가능한데 BLOCKED 로 두면
# "판정 불가" 라는 주석 자체가 거짓이 되므로 전량 선언한다.
crisis_reminder_scenes: [1, 2, 3, 4, 5]

# ── 미정의 = BLOCKED (판정 불가). 없는 것을 있는 척하지 않는다 ──────────────
# verses_file:            (없음) → G0b BLOCKED
# exclusions:             (없음) → G0b/G0e/G9/G9d BLOCKED
#     ㉝ 이후 형식: 원소마다 `value` + `scope`(verse_ref|verse_text|content_leaf) + `expect`.
#     scope 는 필수이고 기본값이 없다 — 어느 텍스트에 대고 재는지가 선언의 일부다.
#     이 둘은 **채울 수 없다** — 배제 문자열 표도 verses.txt 도 레포에 없다.
#     docs/MVP-ESTHER.md:255 이 배제 구간을 산문으로 적지만(1장·2장·6장·9장 등), 그건
#     "어느 텍스트 열에 대고 재는가" 가 없는 서술이라 ㉝ 의 매핑으로 옮길 수 없다.
#     지어내면 게이트가 없는 원본을 검사하는 척하게 된다.
