  - "아직 준비가 안 되셔서 하나님이 잠시 미루시는 것일 수도 있어요."
  - "지금 흘리신 눈물이 헛되지 않을 거예요."
  - "기다리는 동안 당신은 자라고 계셨던 거예요."
  - "하나님께 능하지 못한 일이 없으니, 당신의 기도에도 응답이 올 것입니다."
  - "사라도 웃었기 때문에 추궁을 받았으니, 의심은 조심하시는 게 좋겠습니다."
  - "그 사백 년도 결국 당신을 준비시키려는 시간이었을 거예요."
  - "포기하지 않으시면 결국 받으실 거예요."
  - "이 지연에도 분명 이유가 있을 거예요." # 🔴 미포착 — 위 주석 참조. 고치지 말 것

# ── G7 — R4 동의 카드 + 스킵 목적지가 실제로 있는 Scene ─────────────────────
# 출처는 콘텐츠가 아니라 **설계 문서**다. 콘텐츠에서 역산하면 "동의 카드가 있는 Scene 에
# 동의 카드가 있는가" 를 묻는 동어반복이 된다.
#   Scene 5 — docs/MVP-ABRAHAM.md:63, 208, 213-214, 218, 391
#             (R4 진입 전 동의 카드 `abraham_scene5_birth_warning`, 강도 low_mid,
#              skip 목적지는 **같은** Scene 5 — 별도 scene5_alt.yml 없음)
#
# 문서가 Scene 레벨 R4 를 배정한 Scene 은 이 하나뿐이다. 나머지 4개를 넣지 않은 근거:
#   Scene 1 — :130 "R4 Pre-Scene 0 미션 동의 게이트(진입 전 1회)". **미션 진입** 게이트이지
#             Scene 트리거가 아니고, 스킵 목적지라는 개념 자체가 없다(스킵 = 미플레이).
#             선언하면 문서가 요구하지 않은 키를 요구하는 red 가 된다 — 그래서 넣지 않는다.
#   Scene 2 — :145 "R4 없음(민감도 낮음)" — 문서가 명시적으로 배제
#   Scene 3 — R4 배정 없음. 안전 수단은 R1 위기 카드 + dwell limit 이다(:166)
#   Scene 4 — R4 배정 없음. 이 미션 최대 R2 위험 지점이지만(:12, :194-197) 처리 수단은
#             절 블록 잠금 + 토큰 게이트이지 동의 카드가 아니다
#
# ⚠️ 이 인물에게 "이삭 번제(시험)" Scene 은 **존재하지 않는다** — :14-17 과 :108(E1) 이 그
#    사건을 제품 안전선으로 전면 배제했고, Scene 5 의 '이삭' 은 출생(창 21:1-7)이다.
#    그 장면을 R4 트리거로 찾다가 없다고 red 를 내면 **배제 자체를 결함으로 오독**하게 된다.
trigger_scenes: [5]

# ── G3d — 위기 리마인더 리터럴 키 ──────────────────────────────────────────
# g3d 는 파서가 본 **키 집합 또는 `id` 값 집합**에 `crisis_reminder` 가 있는지를 본다
# (`key in yaml_keys(d) or key in {... collect_key(d, "id")}`). 아브라함 콘텐츠는 이 값을
# 키가 아니라 **`- id: crisis_reminder` 항목**으로 들고 있다:
#   content/abraham/scene3.yml · scene4.yml · scene5.yml (셋 다 `- id: crisis_reminder`)
# 그래서 판정이 가능하고, 없는 안전 문구를 새로 지어내 콘텐츠에 넣을 필요가 없다.
# (키 이름만 대조하면 "0개"로 보인다 — 그 실측은 g3d 의 판정 규칙과 다르다.)
#
# 근거:
#   Scene 3 — docs/MVP-ABRAHAM.md:166 "… + `crisis_reminder` 상시 노출" (설계 문서가 지정)
#   Scene 5 — 이탈 지점(미션 종료, :63·:208). R4 동의 카드 본문에도 위기 자원이 있다(:226)
#   Scene 4 — 2026-08-05 추가. 설계 문서가 배정한 자리는 아니지만 그 문서 자신이 이 Scene 을
#             **이 미션의 단일 최대 R2 위험 지점**(:12, :194 — 창 18:14)이라고 두 번 적는다.
#             비대칭이 근거였다: 위험이 가장 큰 Scene 만 상시 리마인더가 없었다.
#             문구는 scene3·scene5 와 문자 그대로 동일 — 새 안전 문구를 지어내지 않았다.
#             ※ 이 항목은 사용자 지시로 추가했다(2026-08-05). 이 파일이 스스로 판단해
#               선언한 것이 아니다 — 아래 Scene 1·2 원칙은 그대로 유효하다.
#
# ⚠️ Scene 1·2 에는 이 항목이 없다. 문서도 그 둘에 위기 리마인더를 배정하지 않았고, 위험
#    등급도 mid 미만이다. 여기 선언하지 않는다(없는 요구를 만들어 red 를 내지 않는다).
crisis_reminder_scenes: [3, 4, 5]

# ── 미정의 = BLOCKED (판정 불가). 없는 것을 있는 척하지 않는다 ──────────────
# verses_file:  (없음) → G0b BLOCKED
# exclusions:   (없음) → G0b/G0e/G9/G9d BLOCKED
#     ㉝ 이후 형식: 원소마다 `value` + `scope`(verse_ref|verse_text|content_leaf) + `expect`.
#     scope 는 필수이고 기본값이 없다 — 어느 텍스트에 대고 재는지가 선언의 일부다.
#     이 둘은 **채울 수 없다** — 배제 문자열 표도 verses.txt 도 레포에 없다.
#     지어내면 게이트가 없는 원본을 검사하는 척하게 된다.
#
#     아브라함의 `exclusions` 부재는 그 위에 **문서화된 설계 판단**이 하나 더 얹혀 있다:
#     docs/MVP-ABRAHAM.md:117-121 — 배제 대상이 아동 위해 이미지라 "문자열을 옮겨 적는 행위
#     자체가 노출"이라고 판단해 정본을 seed 에만 두었고, 그래서 이 파일에 exclusions 키가
#     없고 G0b·G0e·G9·G9d 가 BLOCKED 로 나온다고 문서가 **먼저** 적어 두었다.
#     실질 방어선은 §12.6 항목 7 의 인간 검토다. BLOCKED 를 통과로 읽지 않는다.
