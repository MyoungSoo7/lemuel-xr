#    것이다. 런타임 스캐너(ForbiddenTokenScanner.kt — 같은 정규화 + indexOf)도 같은 이유로
#    못 잡았으므로 구멍은 문장이 아니라 콘텐츠의 토큰 선언에 있었다.
