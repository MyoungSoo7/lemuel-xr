#
# ⚠️ 이 설정은 seed 산출물이 아니라 **저작된 content/abraham/scene*.yml 과 설계 문서
#    docs/MVP-ABRAHAM.md 에서 실측해 역산한 것**이다. seed 층 입력 중 배제 문자열 표·verses.txt
#    는 **여전히 없다** — G0b/G0e/G9/G9d 는 그래서 BLOCKED 로 남는다. "통과"가 아니라
#    "판정 불가"다(그 부재는 사고가 아니라 문서화된 설계 판단이다 — 파일 끝 주석 참조).
character: abraham
ruleset: newchar-v5 # 토큰 규약 이후 인물 — 면제 없음
scene_count: 5

docs:
  mvp: docs/MVP-ABRAHAM.md
doc_min_lines:
  mvp: 450
# content 문서(docs/MVP-ABRAHAM-CONTENT.md)는 **아직 없다.** 없는 문서를 선언하면
