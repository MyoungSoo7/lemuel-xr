# ── G0c — 토큰이 자기 예문을 잡는가 ────────────────────────────────────────
# 예문은 **제품 말투로 쓴 위험 문장**이고, 토큰 168종과 1:1 이다. 개수를 따로 선언해야
# 축약·줄임으로 원소가 사라지는 사고(㉞)를 게이트가 잡을 수 있다.
#
# 예문의 위험 축은 이 인물이 실제로 들고 있는 4개 게이트를 그대로 따른다(scene yml 실측):
#   공통 117종 `R2_R3_lint_forbidden`                    — 지연 정당화·보상 서사·성과 압박
#   scene3 +19종 `R2_reason_not_transferred_to_user`     — 사백 년의 이유를 사용자에게 전이
#   scene4 +17종 `R2_gen18_14_no_second_person_transfer` — 창 18:14 의 2인칭 전이
#   scene4 +15종 `R2_no_doubt_equals_rebuke_framing`     — "의심하면 책망받는다" 평면화
#
# ⚠️ 토큰이 반말인 항목(`너의 때`·`네 일도`·`이 사백 년은 너` 등)은 예문도 반말이다 —
#    존댓말로 바꾸면 토큰이 예문을 못 잡아 **false red** 가 난다. 높임형 커버리지를 재는
#    자리는 여기가 아니라 문장 축으로 도는 G0d 다(⑩ 이 순회 축을 바꾼 이유).
