# jesus — 게이트 신설 2026-08-22.
#
# 신설 당시 이 인물은 **저작 계층이 없었다** — `content/jesus/scene*.yml` 도,
# `docs/MVP-JESUS-CONTENT.md` 도 없이 `Character.JESUS` 와 `scenarios/jesus.yml` 만으로
# 열려 있었고, 그래서 게이트 대부분이 PASS 가 아니라 **BLOCKED(판정 불가)** 로 나왔다.
# 그게 이 파일의 목적이었다 — 그때까지 예수는 `scripts/gates/` 에 이름조차 없어서
# `ContentSafetyGateEnforcementTest` 의 인물 명부(T1 커버리지)에서도 **통째로 빠져
# 있었다.** 침묵은 통과가 아니다.
#
# 2026-08-22: 저작 계층 7 Scene + `docs/MVP-JESUS-CONTENT.md` 를 채워
# 단계 역전을 해소했다. BLOCKED 27 → 7. 남은 7건은 아래 네 항목
# (`exclusions` · `token_examples` · `polite_evasive` · `latch_contract`)이 비어 있어서다.
# 같은 날 `theology_axis: {status: exempt}` 를 걷었다 — content 가 T1 축을 선언했으므로
# 그 면제가 스스로 적어 둔 해소 조건이 충족됐다. 면제를 남겨 두면 G5t 가 FAIL 한다.
#
# legacy-baseline 을 쓰지 않는다. 그 면제는 joseph·moses·david 세 인물의 것이고, 그들은
# 적어도 저작 계층을 갖고 있다. 예수의 부채는 그보다 크므로 면제로 덮지 않고
# newchar-v5 로 재서 BLOCKED 27건을 그대로 인쇄한다.
#
# `forbidden` 은 손으로 옮겨 적지 않았다 — `scenarios/jesus.yml` 의
# `safety_gates[].lint_forbidden_tokens` 를 그대로 기계 추출했다(README 의 전사 사고 ㉞ 참조).

