#    아니라 제품 말투로 쓴 위험 문장), trigger_scenes·crisis_reminder_scenes 의 출처는
#    콘텐츠가 아니라 docs/MVP-DANIEL.md 다 — 콘텐츠에서 역산하면 동어반복이 된다.
#    seed 층 입력 중 **배제 문자열 표·verses.txt 는 여전히 존재하지 않는다** —
#    G0b/G0e/G9/G9d 는 그래서 BLOCKED 로 남는다. "통과"가 아니라 "판정 불가"다.
