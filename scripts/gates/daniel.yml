# ── G0c — 토큰이 자기 예문을 잡는가 ────────────────────────────────────────
# 예문은 **제품 말투로 쓴 위험 문장**이고, 위 forbidden 90종과 1:1 이다. 개수를 따로
# 선언해야 축약·줄임으로 원소가 사라지는 사고(㉞)를 게이트가 잡을 수 있다.
#
# 예문의 위험 축은 이 인물의 축을 따른다(docs/MVP-DANIEL.md:449-455 표):
#   (a) R2 고난 인과정당화 — 표적 수사에 근거가 없었다는 6:4 를 '연단·훈련·뜻' 으로 환산
#   (b) R3 회복·담대 압박 — "담대해져야 한다"·"버텨내야 한다"(docs/MVP-DANIEL.md:453)
#   (c) R3 결과 보장 — 마무리 문구가 보호·응답을 약속하는 것(disputed_point 7)
#   (d) 에스더(16) 축 오용 — "숨기는 것은 부끄럽다"·"믿음이 있으면 드러내라" 공개 압박
#       (docs/MVP-DANIEL.md:352 — 이 미션의 축은 숨김/드러냄이 아니라 경계 설정이다)
