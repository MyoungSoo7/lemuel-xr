# ── G0d — 제품 말투(존댓말·완곡) 위험 문장이 토큰에 걸리는가 ────────────────
# 순회 축은 토큰이 아니라 **문장**이다. 실제 LLM 이 낼 법한 정중한 회피형 위로를 먼저 쓰고,
# 토큰이 그걸 잡는지 본다 — 잡히도록 문장을 고치면 게이트가 자기 자신을 검사하게 된다.
#
# ✅ 2026-08-05 초록 — **문장은 한 글자도 고치지 않았다.** 아래 12문장 중 2문장이 90종
#    어디에도 안 걸리던 것을 content/ 쪽 토큰 92종으로 늘려 닫았다. 무엇이 빨갰는지 남긴다:
#
#    (1) "조금 더 담대해지시면 두려움이 줄어들 거예요."
#        목록에는 담대해져·담대해지면·담대해지세·담대해지셔야·담대해지십 이 있는데
#        **'담대해지시면'(-시- 삽입 높임형)만 빠졌다.** '담대해지면' 은 막고 '담대해지시면'
#        은 통과한다 — 제품 말투는 대부분 높임형이므로 실사용 표층형이 뚫려 있는 셈이다.
#        docs/MVP-DANIEL.md:453 이 R3 대표 위험구로 지목한 바로 그 어휘축이다.
#        → content/daniel/scene1~3,5 의 R2_R3 축에 '담대해지시' 를 추가해 닫았다.
#          부정형 위로("담대해지지 않아도 괜찮습니다")는 그대로 통과한다(실측 확인).
#
#    (2) "이 일에도 분명 하나님의 뜻이 있을 거예요."
#        목록의 '뜻' 계열은 고난에는 뜻이 / 고난에도 뜻이 / 뜻이 있어서 그 /
#        뜻이 있으니 견디 / 다 뜻이 있는 법 뿐이다. **'고난' 이라는 단어를 쓰지 않고
#        '이 일에도 … 뜻이 있을' 로 돌려 말하면 R2 인과정당화가 그대로 나간다.**
#        → '뜻이 있을' 같은 넓은 토큰은 **쓰지 않았다.** content/daniel/scene4.yml 자신의
#          주석이 '뜻이 있' 을 어간에서 끊으면 "뜻이 있다고 말하지 않겠습니다" 를 삼킨다고
#          기록해 두었기 때문이다. 대신 같은 파일의 선례('반드시 이유가 있' = 부사+단정)를
#          따라 '분명 하나님의 뜻이' 를 추가해 닫았다.
#          ⚠️ 과차단은 여전히 G0e 로 재지 못한다(exclusions 부재 → BLOCKED). 대신 별도로
#          측정했다: 10인물 렌더 본문·런타임 시나리오 7종·MVP 문서 전량에서 충돌 0건,
#          스캐너 복제 시뮬레이션에서 보호 대상 위로 14문 과차단 0건. 정식 게이트는 아니다.
