theology_footer_refs:
  - citation_id: D5_candidate
    source: "다니엘서 6장 장르 논쟁(역사 기술 vs 궁정 설화) — 확정 서지 미확보(seed §12)"
    note: "보수적 정통 입장(역사 기술)에 서되 논쟁의 존재를 명시한다(disputed_point 5)."
    anchor_block: nb_s5_mission_end_6_23
  - disputed_points:
      - id: D4
        summary: "6:22 '천사'의 신원 — 피조된 천사 vs 신현(theophany)"
        handling: "확정 서술하지 않는다. 자막은 본문 어휘('그의 천사')를 그대로 쓴다."
      - id: D5
        summary: "6장의 장르 — 역사 기술 vs 궁정 설화"
        handling: "보수적 정통 입장(역사 기술)에 서되 논쟁의 존재를 명시한다."
      - id: D6
        summary: "단 6:24 배제 결정 — 아동을 포함한 집단 처형 본문을 MVP 에서 완전 배제한 사유"
        handling: "정직 기록. 은폐가 아니라 트리거 허용선 밖이라는 scoping. 세부는 docs/MVP-DANIEL.md §12.6 참조."
      - id: D7
        summary: "1인칭 배역(사용자 = 다니엘)의 신학적 부담 — '나도 저렇게 지켜져야 한다'는 기대로 읽힐 위험"
        handling: "마무리 문구 12종 어디에도 결과 보장 서술을 두지 않는다. 미션은 선택 구조를 체험시키지 결과를 약속하지 않는다."
    handling: "전체 disputed_points 목록(7건)은 docs/MVP-DANIEL.md §12.6 참조."
