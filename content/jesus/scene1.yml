# Scene 1 — 성육신 · 말씀이 육신이 되어 (60초, 도입)
# Unity ScriptableObject 가 deserialize. 디바이스 무관.
# 작성 가이드: lemuel-xr-theology-tone + lemuel-xr-mental-health-safety 사전 적용.
#
# ⚠️ 초안 — 사용자 노출 문장은 backend/src/main/resources/scenarios/jesus.yml scene 1 의
#    `static_monologue` 원문이다. **없던 대본을 지어낸 것이 아니다.**
#    새로 쓴 것은 XR 무대(환경·NPC·인터랙션·전환)뿐이다.
#    lemuel-theology-reviewer + lemuel-mental-health-safety 사후검토 필요.
#
# ⚠️ 이 Scene 이 T1(이단 신학) 축을 짊어진다. 성육신이 영지주의가 정확히 부정하는
#    지점이기 때문이다 — 육체를 감옥으로, 물질 창조를 실패로 보는 프레임은 "말씀이
#    육신이 되어" 와 정면으로 충돌한다. 위반이 일어날 자리에 게이트를 둔다.
#    (scripts/gates/jesus.yml 의 theology_axis exempt 는 이 파일이 생기는 시점에
#     해소하기로 그 면제 자신이 적어 두었다 — 해소했다.)
# ⚠️ 토큰 출처: 아래 8종은 scenarios/job.yml 의 T1 축과 같은 목록이며 전부 이미
#    런타임 전역 목록(application.yml, 688종)에 있는 표층형이다. 저작층에서 발명하지 않았다.

scene_id: jesus_scene1
scene_name: incarnation
mission_id: jesus
version: 1.0.0
duration_seconds_target: 60

environment:
  space_id: bethlehem_stable_night
  background_model: env_bethlehem_manger_night
  lighting:
    type: single_low_lamp
    color_temperature_kelvin: 2700
    note: "광원 하나, 낮은 위치. 아기 쪽에서 위로 퍼지지 않는다 — 후광 연출을 쓰지 않는다."
  ambient_sound:
    - id: night_stable_breath
      gain_db: -30
      spatial: true
    - id: distant_town_sparse
      gain_db: -34
      spatial: true
  user_position: [0.0, 1.40, 0.0]
  user_facing: [0.0, -0.2, 1.0] # 시선을 약간 아래로 — 구유는 낮은 곳에 있다
  camera_locomotion: disabled

npcs:
  - id: manger_child
    voice_id: null
    position: [0.0, 0.55, 1.1]
    note: "얼굴을 정면 클로즈업하지 않는다. 성상(icon) 논쟁을 무대에 올리지 않기 위한 연출 결정이며, 신학적 판정이 아니다."

narration_blocks:
  - id: nb_s1_word_became_flesh
    speaker: narrator
    text_ko: "말씀이 육신이 되어 우리 가운데 거하셨습니다. 요셉의 저장도, 모세의 인도도, 다윗의 돌도 — 이 아기 앞에서 한 이야기의 여러 장(章)이 됩니다. 하늘이 낮은 구유로 내려왔습니다."
    audio_clip_id: aud_s1_word_became_flesh_ko
    start_at_seconds: 5.0
    duration_seconds: 18.0
    hidden_until_event: null
    source_of_record: "scenarios/jesus.yml :: scenes[id=1].extras.static_monologue"
  - id: nb_s1_scripture_jn114
    speaker: scripture_caption
    text_ko: "말씀이 육신이 되어 우리 가운데 거하시매 우리가 그의 영광을 보니 아버지의 독생자의 영광이요 은혜와 진리가 충만하더라 (요 1:14)"
    audio_clip_id: aud_s1_scripture_jn114_ko
    start_at_seconds: 28.0
    duration_seconds: 14.0
    hidden_until_event: null
    scripture_ref: jn-1:14

interactions:
  - id: ix_s1_watch
    type: dwell_presence
    target_assets: []
    gesture: none
    presentation:
      no_progress_indicator: true
    validation_rules:
      - rule: optional_no_pressure
        timeout_seconds: 55
        on_timeout: treat_as_complete
skippable_after_seconds: 3 # 조용한 도입이 지루한 사용자 보호 (런타임 skippable_after_sec 와 동일)

branches: []

safety_gates:
  - id: T1_no_heterodox_theology
    enforced_at: always
    description: "이단 신학 표층형 금지 — 영지주의 이원론(육체=감옥·물질 창조=실패·비밀 지식)·뉴에이지(우주 에너지·파동)·번영신학 역방향. 성육신 Scene 이 이 축을 지는 이유는 '말씀이 육신이 되어' 가 영지주의가 부정하는 바로 그 지점이기 때문이다."
    axis_note: "T1 은 R1~R5(정신건강)와 별개 이름공간이다. 기준은 합신/웨스트민스터/개혁주의 (scenarios/jesus.yml 머리말 §신학 기준)."
    # ⚠️ 주장 범위: 표층형 8종. 동의어 재작성은 못 막는다.
    #    특히 **그리스도론 이단(가현설·양자론·아리우스)은 이 8종에 없다.**
    #    성육신 Scene 에서 가장 위험한 것이 정작 이 목록의 범위 밖이라는 뜻이다.
    #    그건 사람 검토와 LLM 시스템 프롬프트가 맡는다 — 이 게이트가 그것까지 본다고 읽지 마라.
    lint_forbidden_tokens:
      - "갇혀 있는 감옥"
      - "창조는 실패"
      - "나의 신성"
      - "감춰진 비밀 지식"
      - "영혼의 무덤"
      - "우주의 에너지"
      - "긍정의 파동"
      - "당사자의 실패를 증명"
  - id: docetism_visual_guard
    enforced_at: always
    description: "가현설 회피 — 아기를 반투명·발광체로 렌더하지 않는다. 육신을 실제 물질로 그린다. 후광·광휘 연출 금지."
    enforcement: reviewer_only
    note: >-
      ⚠️ 이 게이트는 **집행 수단이 없다.** 렌더링 결정은 토큰으로 표현되지 않고 이 리포에
      셰이더를 검사하는 기계 검사도 없다. enforcement: structural 로 적고 기존 테스트 이름을
      붙이면 그 테스트는 이 파일에 대해 공회전한다(토큰 0종). 사람 검토가 볼 자리로 남긴다.
      지금 근거로 남길 수 있는 사실만: 광원 1종·색온도 2700K·후광 자산 0건.
  - id: R1_voice_self_harm_listener
    enforced_at: always
    action: pause_fade_black_show_crisis_card
    crisis_resource_ref: crisis_resources.default
  - id: R4_pre_scene0_consent_required
    enforced_at: before_scene_enter
    description: "Pre-Scene 0 동의 게이트 — 십자가·죽음 서사 사전 고지 + 위기 자원 {{crisis_resources.default}}"
  - id: R5_ai_optout_respected
    enforced_at: always
    description: "이 Scene 은 전부 정적 본문 낭독 — opt-out 영향 없음."
  - id: footer_persistent
    enforced_at: always
    text_ko: "AI 보조 — 본문은 성경 참조 — storyteller 역할 | 위기 시 {{crisis_resources.default}}"

next_scene_id: jesus_scene2
transition:
  type: fade_to_black
  fade_out_seconds: 0.8
  fade_in_seconds: 1.2

theology_footer_refs:
  - citation_id: JS1_candidate
    source: "요한복음 1:14 성육신 주해 — 확정 서지 미확보(드릴다운 필요)"
    note: "'거하셨다'(σκηνόω, 장막을 치다)는 임재의 어휘다. 이 미션의 정점(Scene 7 생명의 강)과 같은 축이다."
    anchor_block: nb_s1_scripture_jn114
  - disputed_points:
      - "성탄 서사의 세부(마리아의 지위·동정녀 탄생 이해의 폭)는 교파 간 이견이 크다. 본 미션은 요 1:14 한 절에서 멈추고 성탄 서사를 무대에 올리지 않는다."
    handling: "다루지 않는 것을 다룬 것처럼 적지 않는다. 이 Scene 은 구유와 요 1:14 뿐이다."
