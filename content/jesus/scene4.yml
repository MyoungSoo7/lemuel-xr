# Scene 4 — 길이요 진리요 생명 · 갈림길에서 (120초) ★ 핵심 인터랙션
# Unity ScriptableObject 가 deserialize. 디바이스 무관.
# 작성 가이드: lemuel-xr-theology-tone + lemuel-xr-mental-health-safety 사전 적용.
#
# ⚠️ 초안 — 사용자 노출 문장은 scenarios/jesus.yml scene 4 의 `context_line` ·
#    `options[].label` · `teaching_note` 원문이다. 새로 쓴 것은 XR 무대뿐이다.
#    lemuel-theology-reviewer + lemuel-mental-health-safety 사후검토 필요.
#
# ⚠️ 이 Scene 은 미션에서 LLM 이 관여하는 두 곳 중 하나다(다른 하나는 Scene 7).
#    런타임 헤더: "Scene 4·7 응답은 LLM 생성(사전 캐시), 나머지는 정적 본문 낭독."
#    즉 생성은 오프라인이고 전달 시점에는 캐시다 — 그래서 default_path 는 static_curation 이고
#    llm_optin_only 가 true 다. opt-out 사용자도 같은 9종 캐시로 서사가 완결된다.
# ⚠️ 이 Scene 은 안전 축(토큰 lint)을 선언하지 않는다. 축은 위반이 일어나는 자리에만 둔다.

scene_id: jesus_scene4
scene_name: way_truth_life
mission_id: jesus
version: 1.0.0
duration_seconds_target: 120

environment:
  space_id: upper_room_lamp_night
  background_model: env_upper_room_night
  lighting:
    type: lamp_cluster_low
    color_temperature_kelvin: 2900
  ambient_sound:
    - id: room_close_quiet
      gain_db: -32
      spatial: false
  user_position: [0.0, 1.20, 0.0] # 앉은 눈높이 — 다락방은 앉아 있는 자리다
  user_facing: [0.0, 0.0, 1.0]
  camera_locomotion: disabled

npcs:
  - id: jesus_speaking
    voice_id: jesus_v1
    position: [0.0, 1.25, 1.8]
  - id: thomas_asking
    voice_id: thomas_v1
    position: [-0.9, 1.20, 1.4]
    note: "도마를 의심하는 인물로 연출하지 않는다. 질문한 사람이고, 그 질문이 요 14:6 을 끌어냈다."

narration_blocks:
  - id: nb_s4_context_thomas
    speaker: narrator
    text_ko: "'주여 주께서 어디로 가시는지 우리가 알지 못하거늘 그 길을 어찌 알겠사옵나이까' (요 14:5) 하는 도마에게"
    audio_clip_id: aud_s4_context_thomas_ko
    start_at_seconds: 5.0
    duration_seconds: 14.0
    hidden_until_event: null
    source_of_record: "scenarios/jesus.yml :: scenes[id=4].extras.context_line"
  - id: nb_s4_scripture_jn146
    speaker: scripture_caption
    text_ko: "예수께서 이르시되 내가 곧 길이요 진리요 생명이니 나로 말미암지 않고는 아버지께로 올 자가 없느니라 (요 14:6)"
    audio_clip_id: aud_s4_scripture_jn146_ko
    start_at_seconds: 22.0
    duration_seconds: 16.0
    hidden_until_event: null
    scripture_ref: jn-14:6
  - id: nb_s4_teaching_note
    speaker: system
    text_ko: "세 단어는 서로 다른 세 길이 아니라 *한 분* 의 세 얼굴입니다. 어느 결핍으로 오든 같은 분께 도착합니다."
    audio_clip_id: aud_s4_teaching_note_ko
    start_at_seconds: 96.0
    duration_seconds: 16.0
    hidden_until_event: option_selected_or_timeout
    source_of_record: "scenarios/jesus.yml :: scenes[id=4].extras.teaching_note"
    note: "선택 *뒤* 에 나온다. 먼저 나오면 선택이 무의미해지고, 뒤에 나오면 어느 선택도 틀리지 않았다는 판정이 된다."

interactions:
  - id: ix_s4_pick_one
    type: pick_one
    target_assets: [ui_card_the_way, ui_card_the_truth, ui_card_the_life]
    gesture: gaze_dwell_or_pinch
    presentation:
      options_order_fixed: true
      no_correct_answer_marker: true # 정답 표시·점수 없음 — teaching_note 가 그 이유를 말한다
    haptic:
      intensity: 0.2
      duration_ms: 120
    validation_rules:
      - rule: required_optional
        timeout_seconds: 50
        on_timeout: auto_advance
        voice_prompt_id: null
        description: "선택하지 않아도 진행된다. 재촉 음성 프롬프트 없음."
      - rule: track_micro_signals
        records: [option_selected, time_to_select_seconds]

branches:
  - id: br_s4_iam
    triggered_by_event: [option_selected, branch_timeout]
    decision_key: iam_key
    default_path: static_curation # 전달 시점에는 캐시다. opt-out 사용자도 같은 텍스트를 받는다.
    llm_optin_only: true # 캐시 미스 시의 실시간 생성만 opt-in 대상이다
    cache_matrix_note: "iam_key 3종 × faith_tone 3단 = 9 패턴 사전 캐시 (런타임 monologue_cache_keys)."
    routes:
      - when: { iam_key: the_way }
        option_label_ko: "길 — 어디로 가야 할지 모를 때"
        monologue_cache_key: jesus.s4.iam.way
        scripture_ref: jn-14:6
        reference_ref: jn-14:4
      - when: { iam_key: the_truth }
        option_label_ko: "진리 — 무엇이 참인지 흔들릴 때"
        monologue_cache_key: jesus.s4.iam.truth
        scripture_ref: jn-14:6
        reference_ref: jn-8:32
      - when: { iam_key: the_life }
        option_label_ko: "생명 — 살아갈 힘이 없을 때"
        monologue_cache_key: jesus.s4.iam.life
        scripture_ref: jn-14:6
        reference_ref: jn-10:10
      - when: { iam_key: null }
        monologue_cache_key: jesus.s4.iam.way
        note: >-
          미선택·타임아웃 폴백. 되묻지 않는다. 폴백을 '길' 로 둔 것은 도마의 질문이
          길에 관한 것이었기 때문이다(요 14:5) — 임의 선택이 아니라 본문 순서다.
    source_of_record: "scenarios/jesus.yml :: scenes[id=4].extras.options / monologue_cache_keys"

safety_gates:
  - id: exclusivity_not_weaponized
    enforced_at: always
    description: >-
      요 14:6 의 유일성을 사용자를 정죄하는 도구로 쓰지 않는다. 본문은 도마의 *질문에 대한
      답* 으로 주어졌다. 타종교 신자·비신자를 지목해 배제를 선언하는 서술 금지 —
      유일성은 그리스도의 충분성에 관한 진술이지 청중을 향한 판정 문장이 아니다.
    enforcement: reviewer_only
    note: >-
      집행 수단 없음. 이 리포에 정죄 어조를 판정하는 기계 검사가 없다.
      현재 근거로 남길 수 있는 사실만: 이 파일의 사용자 노출 문장에 2인칭 판정문이 0건이고,
      teaching_note 는 세 선택 전부를 같은 도착지로 보낸다.
    theology_basis: "scenarios/jesus.yml 머리말 §신학 기준 — 특수구속·유일성(포용주의·다원주의·만인구원 배제). 유일성을 유지하되 정죄 도구화를 막는다."
  - id: R1_voice_self_harm_listener
    enforced_at: always
    action: pause_fade_black_show_crisis_card
    crisis_resource_ref: crisis_resources.default
  - id: R5_ai_optout_respected
    enforced_at: br_s4_iam
    description: "9종 캐시가 전부 사전 존재. opt-out 사용자도 동일 서사 완결 — 실시간 생성만 opt-in."
  - id: footer_persistent
    enforced_at: always
    text_ko: "AI 보조 — 본문은 성경 참조 — storyteller 역할 | 위기 시 {{crisis_resources.default}}"

next_scene_id: jesus_scene5
transition:
  type: fade_to_black
  fade_out_seconds: 0.8
  fade_in_seconds: 1.2

theology_footer_refs:
  - citation_id: JS4_candidate
    source: "요한복음 14:6 주해 — 확정 서지 미확보(드릴다운 필요)"
    note: "세 술어(길·진리·생명)를 병렬 속성이 아니라 한 인격의 자기 진술로 읽는 것이 이 Scene 의 인용 범위다."
    anchor_block: nb_s4_scripture_jn146
  - disputed_points:
      - "복음을 들을 기회가 없었던 이들의 운명(운명론·미전도자 문제)은 개혁주의 내부에서도 진술의 폭이 있다."
    handling: >-
      이 미션은 그 질문에 답하지 않는다. 요 14:6 을 인용하되 적용 판정을 내리지 않는다.
      답하지 않는 것을 답한 것처럼 적지 않는다.
