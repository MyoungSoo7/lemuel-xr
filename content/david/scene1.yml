# Scene 1 — 양치는 베들레헴 (수금 연주, 시편 작가)
# Unity ScriptableObject 가 deserialize. 디바이스 무관 (자산은 manifests/{device}/scene1-v1.0.0.json 참조).
# 작성 가이드: lemuel-xr-theology-tone + lemuel-xr-mental-health-safety 사전 적용.

scene_id: david_scene1
scene_name: bethlehem_shepherd
mission_id: david
version: 1.0.0
duration_seconds_target: 90

environment:
  space_id: bethlehem_field_sunset
  background_model: env_bethlehem_field_sunset
  lighting:
    type: warm_sunset_low_angle
    color_temperature_kelvin: 3200
    sun_angle_degrees: 12
  ambient_sound:
    - id: sheep_distant_baa_pan
      gain_db: -20
      spatial: true
    - id: wind_through_grass_loop
      gain_db: -16
      spatial: true
    - id: field_insects_dusk
      gain_db: -22
      spatial: true
  shader_features:
    - gpu_instanced_grass_wind
    - distant_sheep_lod_imposter
  user_position: [0.0, 1.10, 0.0]
  user_facing: [0.0, 0.0, 1.0]
  camera_locomotion: disabled
  user_seated_on_stone: true
  ui_overlays:
    - id: scene1_r2_footer
      position: bottom_left
      style: small_persistent
      text_ko: "믿음과 능력은 적이 아니다 | AI 보조 — 본문은 성경 참조 | 위기 시 1577-0199"

npcs:
  - id: david_self
    voice_id: david_v1
    position: [0.0, 1.10, 0.0]
    initial_animation: seated_on_stone_idle
    note: "사용자가 다윗 — first-person. 내면 독백만"
  - id: sheep_flock_12
    voice_id: silent
    count: 12
    formation: scattered_grazing
    formation_origin: [3.0, 0.6, 6.0]
    initial_animation: grazing_idle
    visual_traits: [wool_dusty, calm]
    note: "Galaxy XR / Web 폴백은 6마리로 축소"

narration_blocks:
  - id: nb_s1_opening
    speaker: narrator
    text_ko: "여기 베들레헴 들판에 한 소년이 있다. 8 형제 중 막내. 들에서 양을 지키는 자. 해가 지면 그는 수금을 들고 노래한다."
    audio_clip_id: aud_s1_opening_ko
    start_at_seconds: 0.0
    duration_seconds: 12.0
    hidden_until_event: null
  - id: nb_s1_lyre_fade_in
    speaker: system
    text_ko: ""
    audio_clip_id: null
    start_at_seconds: 12.0
    duration_seconds: 2.0
    hidden_until_event: null
  - id: nb_s1_psalm_string_1
    speaker: psalm_text
    text_ko: "여호와는 나의 목자시니 내게 부족함이 없으리로다 (시 23:1)"
    audio_clip_id: aud_s1_psalm_1_ko_soft
    start_at_seconds: 0.0
    duration_seconds: 6.0
    hidden_until_event: lyre_string_touched_1
  - id: nb_s1_psalm_string_2
    speaker: psalm_text
    text_ko: "그가 나를 푸른 풀밭에 누이시며 (시 23:2a)"
    audio_clip_id: aud_s1_psalm_2_ko_soft
    start_at_seconds: 0.0
    duration_seconds: 6.0
    hidden_until_event: lyre_string_touched_2
  - id: nb_s1_psalm_string_3
    speaker: psalm_text
    text_ko: "잔잔한 물 가로 인도하시는도다 (시 23:2b)"
    audio_clip_id: aud_s1_psalm_3_ko_soft
    start_at_seconds: 0.0
    duration_seconds: 6.0
    hidden_until_event: lyre_string_touched_3
  - id: nb_s1_psalm_string_4
    speaker: psalm_text
    text_ko: "내가 사망의 음침한 골짜기로 다닐지라도 해를 두려워하지 않을 것은 (시 23:4a)"
    audio_clip_id: aud_s1_psalm_4_ko_soft
    start_at_seconds: 0.0
    duration_seconds: 8.0
    hidden_until_event: lyre_string_touched_4
  - id: nb_s1_psalm_string_5
    speaker: psalm_text
    text_ko: "주께서 나와 함께 하심이라 (시 23:4b)"
    audio_clip_id: aud_s1_psalm_5_ko_soft
    start_at_seconds: 0.0
    duration_seconds: 6.0
    hidden_until_event: lyre_string_touched_5
  - id: nb_s1_david_inner
    speaker: david_inner
    text_ko: "이 노래는 내가 들에서 외울 줄 안다. 양들이 듣는 것 같지 않아도, 양들은 듣는다."
    audio_clip_id: aud_s1_david_inner_ko
    start_at_seconds: 70.0
    duration_seconds: 9.0
    hidden_until_event: null
  - id: nb_s1_extend_prompt
    speaker: ui_prompt
    text_ko: "이 노래를 더 들으시겠어요? [예 / 다음으로]"
    audio_clip_id: aud_s1_extend_prompt_ko
    start_at_seconds: 0.0
    duration_seconds: 4.0
    hidden_until_event: lyre_timeout_60s

interactions:
  - id: ix_s1_touch_lyre_string
    type: grab
    target_assets: [model_lyre, lyre_string_1, lyre_string_2, lyre_string_3, lyre_string_4, lyre_string_5]
    gesture: finger_brush_string
    haptic:
      intensity: 0.25
      duration_ms: 80
    validation_rules:
      - rule: any_order_5_strings
        records: [lyre_string_order, hesitation_seconds, repeat_count]
        emits_event_on_each: lyre_string_touched_{n}
        emits_event_on_all_5: lyre_5_strings_complete
      - rule: skip_button_after_3s
        position: top_right
        style: small_fade_in
        on_press: jump_to_scene2
        design_intent: "평온이 지루함으로 느껴지는 사용자 보호"
      - rule: timeout_extend_prompt
        timeout_seconds: 60
        on_timeout: emit_event_lyre_timeout_60s
        voice_prompt_max_repeat: 1
        on_extend_yes: extend_30s_then_auto_advance
        on_extend_no: jump_to_scene2

branches:
  - id: br_s1_lyre_order
    triggered_by_event: lyre_5_strings_complete
    decision_key: lyre_string_order
    backend_endpoint: "POST /api/game/david/scene/1/decide"
    body_template:
      lyre_string_order: "{{array}}"
      hesitation_seconds: "{{hesitation}}"
    routes:
      - when: { first_touched: 4 }
        note_ko: "사망의 음침한 골짜기 줄 먼저 — 정서 신호 (medium intensity)"
        carry_to_scene6: { lyre_first_string: 4 }
      - when: { first_touched: 1 }
        note_ko: "목자 신뢰 줄 먼저 — 신뢰 신호"
        carry_to_scene6: { lyre_first_string: 1 }
      - when: { first_touched_any: [2, 3, 5] }
        note_ko: "평온/동행 줄 먼저"
        carry_to_scene6: { lyre_first_string: "{{first}}" }

safety_gates:
  - id: R2_belief_and_capacity_not_enemies
    enforced_at: always
    overlay_ref: scene1_r2_footer
    description: "Scene 1·3 영구 footer — '믿음과 능력은 적이 아니다' (D1 장석정 2022 기반)"
  - id: R4_pre_scene_consent_required
    enforced_at: before_scene_enter
    description: "Pre-Scene 0 consent gate (작음·모욕·정체성·두려움·일어섬 사전 고지)"
  - id: R3_no_psalm_completion_pressure
    enforced_at: ix_s1_touch_lyre_string
    description: "5 줄 다 안 건드려도 진행 가능 — 'extend' 거부도 정당"
  - id: R5_ai_optout_respected
    enforced_at: always
    description: "AI 보조 footer 영구 노출, opt-out 시 시편 본문 텍스트는 동일 노출 (TTS 만 비활성)"
  - id: footer_persistent
    enforced_at: always
    text_ko: "AI 보조 — 본문은 성경 참조 | 위기 시 1577-0199"

next_scene_id: david_scene2
transition:
  type: fade_to_black
  fade_out_seconds: 0.8
  fade_in_seconds: 1.2

theology_footer_refs:
  - citation_id: D2
    source: "하나님 나라와 언약관점으로 본 시편 신학연구"
    note: "시편은 다윗 언약의 노래이자 목자 다윗의 노래 — Scene 1 은 왕이 되기 전 다윗의 시인 정체성 토대"
    anchor_block: nb_s1_psalm_string_1
  - scripture_refs:
      - ref: "시편 23:1"
        translation: krv
        anchor_block: nb_s1_psalm_string_1
      - ref: "시편 23:2"
        translation: krv
        anchor_block: nb_s1_psalm_string_2
      - ref: "시편 23:4"
        translation: krv
        anchor_block: nb_s1_psalm_string_4
  - disputed_points:
      - "시편 23편 저작권 — 다윗 단독 vs 후대 편집"
    handling: "전통적 다윗 저작 입장 채택 (보수 개신교 톤) 하되 학문적 이견 존재 명시"
  - clinical_note:
      - "Pargament Religious Coping — 시편 23편은 호스피스·임종 환자 위로 본문으로 임상 사용 빈도 최고"
      - "본 Scene 은 '3000년 시인의 평온' 톤으로 reframing — 장례식 연상으로 미끄러지지 않게 큐레이션"
