# Scene 6 — 결말·회복 메시지 (30초)
# 진입 시 입력 감정 × Scene 4 의 5돌 선택 패턴 × first_stone_emotion × faith_tone 으로 매칭.
# 150 조합 사전 캐싱 (LLM 0 회 목표).

scene_id: david_scene6
scene_name: closure_recovery
mission_id: david
version: 1.0.0
duration_seconds_target: 30

environment:
  space_id: dark_meditation_void_with_4_stones
  background_model: env_meditation_dark_fog
  lighting:
    type: soft_volumetric_fog_low_key
    color_temperature_kelvin: 3200
    overall_brightness: 0.15
  ambient_sound:
    - id: deep_ambient_drone_60hz
      gain_db: -16
      spatial: false
      fade_to_silence_at_seconds: 25
  user_position: [0.0, 1.10, 0.0]
  user_facing: [0.0, -0.2, 1.0]
  camera_locomotion: disabled
  user_palm_visible_with_4_stones: true
  note: "사용자 손에 남은 4 개 돌 — Scene 4 에서 5 개 골랐고 Scene 5 에서 1 개 사용. 손바닥 위에 떠 있음."

npcs: []

narration_blocks:
  - id: nb_s6_scripture_centered
    speaker: scripture_text_only
    text_ko: "네 사람이 다 보고 작은 것을 통하여 큰 것을 살리시는 분을 알리라\n(삼상 17:46~47 요약)"
    audio_clip_id: aud_s6_samuel_17_46_47_ko_soft
    audio_clip_id_optout: null
    start_at_seconds: 0.0
    duration_seconds: 10.0
    presentation: center_fade_in
    note: "R5 AI opt-out 사용자에게도 동일 노출 — 텍스트는 항상, 음성은 옵션"
  - id: nb_s6_silent_dwell
    speaker: system
    text_ko: ""
    audio_clip_id: null
    start_at_seconds: 10.0
    duration_seconds: 5.0
    note: "10 초 정적 (실제 정적 5 초 + dwell 5 초) — 사용자가 본문과 손 안의 4 돌을 바라봄"
  - id: nb_s6_recovery_phrase
    speaker: recovery_text
    text_ko: "{{matched_recovery_phrase_ko}}"
    audio_clip_id: "{{matched_recovery_audio_id}}"
    start_at_seconds: 15.0
    duration_seconds: 12.0
    presentation: bottom_fade_in
    hidden_until_event: scripture_dwell_complete

interactions: []

branches:
  - id: br_s6_recovery_match
    triggered_by_event: scene_enter
    decision_key: matched_recovery_phrase
    backend_endpoint: "POST /api/game/david/complete"
    lookup_keys:
      - entry_emotion
      - faith_tone
      - first_stone_emotion_from_scene4
      - stone_diversity_from_scene4
      - mockery_response_from_scene2
      - identity_choice_from_scene3
    cache_strategy: pre_cached_150_entries
    cache_combinations: "10 entry_emotion × 3 faith_tone × 5 first_stone = 150"
    recovery_phrases_ko_balanced:
      smallness_inferiority: "작다는 것은 약함이 아니다. 누구의 옷을 입지 않은 자유다."
      family_misunderstood: "엘리압의 말은 다윗을 멈추지 못했다. 너의 사명을 멈출 자도 없다."
      fear: "5 개의 돌은 5 개의 감정이었다. 너의 두려움도 가지고 가도 된다."
      identity_confusion: "사울의 갑옷이 무거우면 벗어도 된다. 너에게 익숙한 것이 너의 무기다."
      big_challenge_ahead: "거인이 너를 보고 비웃었다. 너의 작음을 함께 가지고 일어서라."
      lonely: "광야의 밤이 너에게 노래를 가르쳤다. 너의 외로움은 너를 잃지 않게 한 자리다."
      angry: "분노 돌도 주머니에 넣었다. 분노가 너를 지키는 신호가 될 수도 있다."
      sad: "수금의 줄은 슬픔에서도 운다. 슬픔을 밀어내지 않은 자에게서 노래가 나온다."
      unworthy: "8 형제 중 막내였다. 자리가 너를 만들지 않는다."
      exhausted: "오늘 한 돌만 주머니에 넣어도 충분하다. 다음 거인이 올 때 주머니엔 여전히 돌이 있다."
    faith_tone_variants:
      example_emotion: fear
      strong: "여호와는 너의 두려움을 함께 가지고 골리앗 앞에 서게 하셨다. 두려움은 너의 적이 아니라 너의 동행자다. (삼상 17:45)"
      balanced: "5 개의 돌은 5 개의 감정이었다. 너의 두려움도 가지고 가도 된다. 다윗은 두려움을 부정하지 않고 던지지도 않고 주머니에 넣은 자였다."
      soft: "3000 년 전 소년의 이야기는 두려움을 가진 채로 한 걸음 디딘 것이 자유의 시작이라 봤다. 두려움이 0 이 되어야 일어서는 게 아니다."
    persisted_stones_logic:
      action: update_users_persisted_stones_jsonb
      payload: "remaining_4_stones from Scene 4 selection minus Scene 5 first_stone"
      next_mission_effect: "다음 다윗 미션 입장 시 시냇가에 다시 나타남 — '다윗은 매번 5개의 돌을 챙긴다'"
      ai_optout_alternative: "R5 — opt-out 사용자도 persisted_stones 저장은 동일 (정적 데이터)"
    ai_optout_branch:
      condition: "users.allow_ai_response == false"
      override_combinations: "10 entry_emotion × 3 faith_tone = 30 only (first_stone 분기 제거)"
      fallback_when_no_emotion: "Psalm 27:14 fixed scripture: 너는 여호와를 바랄지어다 강하고 담대하며 여호와를 바랄지어다"

safety_gates:
  - id: R3_no_recovery_pressure
    enforced_at: nb_s6_recovery_phrase
    description: "모든 회복 문구는 '지금 회복하지 못해도 괜찮다' 톤"
  - id: no_user_instrumentalization
    enforced_at: nb_s6_recovery_phrase
    description: "'하나님이 너를 도구로 쓰셨다' 같은 도구화 표현 차단 — '너의 결정이 의미를 가졌다' 주체성 인정 톤"
  - id: R5_optout_text_still_shown
    enforced_at: nb_s6_scripture_centered
    description: "AI opt-out 사용자에게도 본문 텍스트는 동일 노출, TTS 음성만 비활성"
  - id: footer_persistent
    enforced_at: always
    text_ko: "AI 보조 — 본문은 성경 참조 | 위기 시 {{crisis_resources.default}}"

next_scene_id: null
transition_to_outro: true
transition:
  type: fade_to_black
  fade_out_seconds: 3.0
  fade_in_seconds: 0.0
  return_to: main_screen

post_complete_bridge:
  endpoint: "GET /api/track-a/psalm-bridge?session_id={{id}}"
  note_ko: "시편 23편 일기 (트랙 A) 자연 연결 — Scene 1 의 5 줄과 호응"

theology_footer_refs:
  - citation_id: D2
    source: "하나님 나라와 언약관점으로 본 시편 신학연구 — 시편 작가 다윗"
    note: "남은 4 돌의 지속성 메타포는 '다윗은 매번 돌을 챙긴다' — 시인 정체성의 항상성"
    anchor_block: nb_s6_recovery_phrase
  - scripture_refs:
      - ref: "사무엘상 17:46~47"
        translation: krv
        anchor_block: nb_s6_scripture_centered
      - ref: "시편 27:14"
        translation: krv
        anchor_block: ai_optout_branch
        note_ko: "R5 AI opt-out 사용자용 정적 폴백 — 신학 사전 검증 통과한 본문"
  - disputed_points:
      - "'persisted_stones' 의 다음 미션 노출은 정서 메타포 — 신학적 주장 아님"
    handling: "UI/UX 표현 명시 — 신학적 dogma 로 오인되지 않게"
