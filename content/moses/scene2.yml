# Scene 2 — 떨기나무 발견 (60초, 경외 진입)
# 신발 벗기 제스처 (1.5초 dwell + fallback 버튼). 떨기나무 불꽃은 추상적 빛 — 실사풍 회피.
# Coqui XTTS 사전 캐시 (떨기나무 voice_id = bush_v1, 절제된 내레이터 톤).

scene_id: moses_scene2
scene_name: burning_bush_discovery
mission_id: moses
version: 1.0.0
duration_seconds_target: 60

environment:
  space_id: midian_wilderness_dusk_with_bush
  background_model: env_midian_wilderness_dusk_dark
  lighting:
    type: dusk_low_key_with_bush_glow
    color_temperature_kelvin: 2900
    sun_angle_degrees: -3
    shadow_intensity: 0.70
    additional_dynamic_light:
      id: bush_flame_dynamic
      color: warm_gold
      intensity_base: 1.0
      intensity_on_dwell: 1.3
      flicker_amplitude: 0.15
      flicker_hz: 7
  ambient_sound:
    - id: low_freq_wilderness_wind_attenuated
      gain_db: -20
      spatial: true
    - id: bush_flame_crackle_low
      gain_db: -18
      spatial: true
      panning: front_center
      reverb_long: true
    - id: silence_layer_pad
      gain_db: -30
      spatial: false
  shader_features:
    - particle_abstract_flame_no_realistic
    - custom_shader_warm_glow_halo
  user_position: [0.0, 1.20, 0.0]
  user_facing: [0.0, 0.0, 1.0]
  user_posture: seated_then_auto_align_standing_on_approach
  camera_locomotion: dwell_triggered_only

npcs:
  - id: moses_self
    voice_id: silent
    position: [0.0, 1.20, 0.0]
    initial_animation: seated_holding_staff
    on_approach_animation: auto_align_standing
    visual_traits: [shepherd_garment_worn, long_round_staff_in_hand]
  - id: burning_bush
    voice_id: bush_v1
    position: [0.0, 1.60, 8.0]
    initial_animation: fade_in_5s_flame_particles
    visual_traits: [abstract_warm_flame_particle_system, no_anthropomorphic_face]
    voice_tone: restrained_narrator
    design_intent: "theology-tone §1 — 불꽃 안에 직접적 인격 표현 회피, 영지주의·뉴에이지 어휘 차단"

narration_blocks:
  - id: nb_s2_bush_fade_in_silent
    speaker: system
    text_ko: ""
    audio_clip_id: null
    start_at_seconds: 0.0
    duration_seconds: 5.0
    hidden_until_event: null
    note: "떨기나무 fade-in 5초 — 순수 시각적 경외, 자막 없음"
  - id: nb_s2_dwell_intensify
    speaker: system
    text_ko: ""
    audio_clip_id: null
    start_at_seconds: 5.0
    duration_seconds: 15.0
    hidden_until_event: bush_dwelled_1s
    note: "1초 응시 → 불꽃 intensity +30%, 지팡이 햅틱 약 500ms"
  - id: nb_s2_bush_verse_ex_3_2
    speaker: burning_bush
    text_ko: "떨기나무에 불이 있으나\n불에 사라지지 아니하더라 (출 3:2)"
    audio_clip_id: aud_s2_bush_ex_3_2_ko
    start_at_seconds: 20.0
    duration_seconds: 8.0
    hidden_until_event: null
  - id: nb_s2_approach_prompt
    speaker: ui_caption
    text_ko: "가까이 가서 보시겠어요?\n(앉은 자리에서 시선을 떨기나무로 1.5초 유지하면 다가갑니다.)"
    audio_clip_id: null
    start_at_seconds: 30.0
    duration_seconds: 8.0
    hidden_until_event: null
  - id: nb_s2_bush_verse_ex_3_5
    speaker: burning_bush
    text_ko: "이리로 가까이 오지 말라.\n네 발에서 신을 벗으라.\n네가 선 곳은 거룩한 땅이니라 (출 3:5)"
    audio_clip_id: aud_s2_bush_ex_3_5_ko
    start_at_seconds: 40.0
    duration_seconds: 10.0
    hidden_until_event: user_approached
  - id: nb_s2_bush_calling_name
    speaker: burning_bush
    text_ko: "모세야 모세야 (출 3:4)"
    audio_clip_id: aud_s2_bush_calling_name_ko
    start_at_seconds: 52.0
    duration_seconds: 4.0
    hidden_until_event: shoes_removed
    spatial_3d_panning: left_right_both_simultaneous
  - id: nb_s2_response_subtitle
    speaker: subtitle_only
    text_ko: "내가 여기 있나이다 (출 3:4)"
    audio_clip_id: null
    start_at_seconds: 56.0
    duration_seconds: 4.0
    hidden_until_event: user_head_lifted

interactions:
  - id: ix_s2_bush_gaze_dwell
    type: head_gaze_dwell
    target_assets: [burning_bush]
    gesture: head_ray_dwell_1500ms
    fallback_gesture_web: mouseover_1s
    fallback_gesture_visionpro: eye_gaze_1000ms
    haptic:
      intensity: 0.2
      duration_ms: 500
      trigger: on_dwell_1s
    validation_rules:
      - rule: dwell_to_approach
        dwell_seconds: 1.5
        on_success: auto_locomotion_fade
        fade_to_black_seconds: 0.4
        teleport_target_distance_meters: 2.0
        emit_event: user_approached
      - rule: no_dwell_after_30s
        on_timeout: show_pause_or_continue_buttons
        buttons_ko: ["잠시 멈춤", "다음으로"]
        design_intent: "R3 강요하지 않음 — 응시 안 하면 강제 진행 X"
  - id: ix_s2_remove_shoes_gesture
    type: hand_to_target_dwell
    target_assets: [user_feet_outline_anchor]
    gesture: hand_down_to_feet_dwell_1500ms
    fallback_gesture_web: click_button_remove_shoes
    fallback_button_ko: "신을 벗다"
    fallback_button_appears_after_seconds: 10
    haptic:
      intensity: 0.15
      duration_ms: 80
      trigger: on_gesture_complete
    validation_rules:
      - rule: dwell_to_remove_shoes
        dwell_seconds: 1.5
        on_success: play_shoes_removal_animation
        animation_duration_seconds: 0.8
        emit_event: shoes_removed
        design_intent: "몸이 기억하는 경외 — 단순 클릭이 아닌 제스처. 못 하는 사용자는 버튼 폴백"
  - id: ix_s2_head_lift
    type: head_orientation_change
    target_assets: [burning_bush]
    gesture: head_pitch_up_5_degrees
    haptic:
      intensity: 0.0
      duration_ms: 0
    validation_rules:
      - rule: detect_head_lift
        on_success: fade_in_response_subtitle
        emit_event: user_head_lifted
        design_intent: "부름을 들음 — passive 가 아닌 수용의 자세"

branches: []

safety_gates:
  - id: R2_persistent_footer
    enforced_at: always
    overlay_ref: scene1_r2_footer
    description: "Scene 1·3·4 동등하게 우상단 영구 노출 (Scene 2 는 시각적 충격 없음, R4 별도 prompt 없음)"
  - id: R3_no_force_approach
    enforced_at: ix_s2_bush_gaze_dwell
    description: "응시 안 하면 강제 진행 X — 잠시 멈춤/다음으로 버튼"
  - id: R3_gesture_button_fallback
    enforced_at: ix_s2_remove_shoes_gesture
    description: "신발 벗기 제스처 못 하는 사용자 — 10초 후 '신을 벗다' 버튼 노출"
  - id: theology_no_anthropomorphic_theophany
    enforced_at: burning_bush.npc_design
    description: "불꽃 안 직접적 인격 표현 회피 (theology-tone §1) — 추상적 빛 + 절제된 내레이터 톤"
  - id: footer_persistent
    enforced_at: always
    text_ko: "AI 보조 — 본문은 성경 참조 | 위기 시 {{crisis_resources.default}}"

next_scene_id: moses_scene3
transition:
  type: fade_to_black
  fade_out_seconds: 0.8
  fade_in_seconds: 1.2

theology_footer_refs:
  - citation_id: M1
    source: "한국개혁신학 2022 Vol.75 — 구약성서 성육신 관련 논의 (학술지 출처 확보, drill-down 후보)"
    note: "현현 (theophany) 의 인격성 — 떨기나무는 동행의 인장 (Scene 4 표적과 cross-reference)"
    anchor_block: nb_s2_bush_verse_ex_3_2
  - disputed_points:
      - "출 3:14 'I am who I am' (E.J. Young, 영원불변·자존성) vs 'I will be who I will be' (Walter Brueggemann, 관계적·미래지향) — Scene 3 카드 ② 응답 footer 에서 한 줄로 노출"
      - "출 4:24~26 (모세 아들 할례 사건) — 본 미션 범위 밖 (Zipporah 행위·피 남편·할례 신학 분쟁이 너무 커 MVP 범위 초과)"
    handling: "본 Scene 은 이름 부름만 다루고, '스스로 있는 자' 직접 노출은 Scene 3 카드 ②"
