      - "모르드개의 경고대로"
      - "당신의 집도 멸망"
      - "당신 집도 멸망"
      - "가족까지 잃게 됩"
      - "가족까지 잃게 될"
      - "말하지 않으면 모두 죽"
      - "말하지 않으면 아무도 살"
  - id: R3_silence_is_also_deliverance
    enforced_at: nb_s3_mordecai_reply_4_14
    description:
      "'다른 데로 말미암아 놓임과 구원을 얻으려니와' 절반은 본문이 스스로를 방어하는
      문장이다(seed §4-1) — 말하지 않기로 한 사용자에게 '그러면 아무도 못 산다'고 말할 근거가
      본문에 없다. mandatory_clause 로 위 narration_blocks 에 고정, 생략 시 반려."
    # 이 축의 집행 수단은 토큰이 아니다. 토큰 lint 는 *쓰면 안 되는 문자열* 만 막고, 이 축이
    # 요구하는 것은 반대다 — 특정 절반절이 본문에 *반드시 남아 있을 것*. 금칙어를 채우면
    # "선언은 R3, 집행은 다른 축" 인 카고컬트가 된다. 그래서 structural 로 선언하고,
    # 무엇을 기계로 확인하면 되는지 아래에 파일 구조 그대로 적는다(직접 대조 확인함).
    enforcement: structural
    structural_check:
      "narration_blocks 의 nb_s3_mordecai_reply_4_14 가 mandatory_clause 키를 갖고 그 값이
      '다른 데로 말미암아 놓임과 구원을 얻으려니와' 이며, 같은 블록의 text_ko 가 그 문자열을
      실제로 포함할 것(선언만 있고 본문에서 빠지면 반려 — 선언·본문 두 곳 동시 확인이 이
      게이트의 핵심이다). 또한 br_s3_disclose_choice 의 routes 3개(nondisclosure·gather_first·
      speak_now)가 모두 비어 있지 않은 static_text_ko 를 갖고, nondisclosure 가 routes[0] 이며
      (seed §5-0 3항 — 침묵이 맨 앞), card_order_policy=shuffle_per_session ·
      card_render_style=flat_siblings 로 진행 막대·단계 UI 가 금지돼 있고, 분기 서브트리에
      score/scoring/correct/rank/ranking/best_choice/정답 류 키가 0건일 것."
