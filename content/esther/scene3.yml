# Scene 3 — 법과 삼십 일 (90초, 세 장의 카드 — 선택 3개 / 라우팅 0개)
# Unity ScriptableObject 가 deserialize. 디바이스 무관 (자산은 manifests/{device}/scene3-v1.0.0.json 참조).
# 작성 가이드: lemuel-xr-theology-tone + lemuel-xr-mental-health-safety 사전 적용.
# ⚠️ 초안 — scratchpad/seed-ESTHER.md v5-b 기반 수기 크리스탈라이즈. lemuel-theology-reviewer + lemuel-mental-health-safety
#   사후 검토 전 프로덕션 반영 금지. §4-3 R2/R3 safety_gates 항목은 인간 사인오프 전(seed §7-3 8항 — 확정 아님).
# ⚠️ 이 미션의 핵심 축 Scene. 에스더 4:14 는 R2·R3 이중 지뢰 — "다른 데로 말미암아 놓임과 구원을
#   얻으려니와" 절반을 반드시 포함한다(생략 시 반려, seed §4-1). "누가 알겠느냐"는 의문형 그대로
#   유지 — "예비된 자리"류 확언으로 번역하지 않는다.
# ⚠️ 세 카드는 전부 정당하며 결말 품질에 차등이 없다. "언젠가는/아직/당분간" 류 유예된 개시
#   압박을 어디에도 쓰지 않는다(seed §5-0). 고정 순서·stepper·번호 매김 UI 금지
#   (card_order_policy: shuffle_per_session, card_render_style: flat_siblings).
# ⚠️ 모르드개는 화자이지 이 미션의 도덕적 권위가 아니다 — "너와 네 아버지 집은 멸망하리라"를
#   내레이션이 동의하는 것으로 처리하지 않는다(seed §4-1).

scene_id: esther_scene3
scene_name: the_law_and_thirty_days
mission_id: esther
version: 1.0.0
duration_seconds_target: 90

environment:
  space_id: susa_palace_inner_chamber
  background_model: env_susa_inner_chamber
  lighting:
    type: dim_contemplative_window_light
    color_temperature_kelvin: 3800
  ambient_sound:
    - id: chamber_stillness
      gain_db: -30
      spatial: false
  user_position: [0.0, 1.6, 0.0]
  user_facing: [0.0, 0.0, 1.0]
  camera_locomotion: disabled

npcs:
  - id: esther_self
    voice_id: esther_v1
    position: [0.0, 1.65, 0.0]
    note: "사용자가 에스더 — 1인칭. 내면 독백만, 3인칭 서술 금지."
  - id: hatach
    voice_id: narrator_v1
    position: [1.0, 1.6, 2.0]
    note:
      "4:13-14 를 하닥을 통한 전언으로 전달 — 모르드개를 사용자 정면에 세우지 않는다
      (seed §3-1: 모르드개는 화자이지 도덕적 권위가 아니다)."
  - id: mordecai
    voice_id: mordecai_v1
    position: [0.0, 1.5, 40.0]
    visual_traits: [distant_silhouette]
    note:
      "발화는 하닥의 전언 자막으로만 처리 — 원경 실루엣, 대사는 자막에 귀속시키고 화면에
      가까이 등장시키지 않는다."

narration_blocks:
  - id: nb_s3_esther_reply_4_11
    speaker: scripture_caption
    text_ko: "왕의 신하들과 왕의 각 지방 백성이 다 알거니와 남녀를 막론하고 부름을 받지 아니하고 안뜰에 들어가서 왕에게 나가면 오직 죽이는 법이요 왕이 그 자에게 금 규를 내밀어야 살 것이라 이제 내가 부름을 입어 왕에게 나가지 못한 지가 이미 삼십 일이라 하라 하니라 (에 4:11)"
    audio_clip_id: aud_s3_esther_reply_4_11_ko
    start_at_seconds: 0.0
    duration_seconds: 22.0
    hidden_until_event: null
    note: "에스더가 하닥을 통해 모르드개에게 보낸 회답 — 위험을 축소하지 않고 있는 그대로 전달."
  - id: nb_s3_mordecai_reply_4_13
    speaker: scripture_caption
    text_ko: "모르드개가 그를 시켜 에스더에게 회답하되 너는 왕궁에 있으니 모든 유다인 중에 홀로 목숨을 건지리라 생각하지 말라 (에 4:13)"
    audio_clip_id: aud_s3_mordecai_reply_4_13_ko
    start_at_seconds: 22.0
    duration_seconds: 14.0
    hidden_until_event: null
  - id: nb_s3_mordecai_reply_4_14
    speaker: scripture_caption
    text_ko: "이 때에 네가 만일 잠잠하여 말이 없으면 유다인은 다른 데로 말미암아 놓임과 구원을 얻으려니와 너와 네 아버지 집은 멸망하리라 네가 왕후의 자리를 얻은 것이 이 때를 위함이 아닌지 누가 알겠느냐 하니 (에 4:14)"
    audio_clip_id: aud_s3_mordecai_reply_4_14_ko
    start_at_seconds: 36.0
    duration_seconds: 26.0
    hidden_until_event: null
    mandatory_clause: "다른 데로 말미암아 놓임과 구원을 얻으려니와" # 생략 시 반려 — R3 의 뿌리(seed §4-1)
    note:
      "'누가 알겠느냐'는 의문형 그대로. '예비된 자리'류 확언 번역 금지. 위협 어조('너와 네
      아버지 집은 멸망하리라')는 모르드개의 대사이며 내레이션이 동의하는 것으로 처리하지 않는다."

interactions:
  - id: ix_s3_read_the_reply
    type: auto_proceed
    presentation:
      description: "4:11-14 전언을 읽는 동안 사용자 조작 없음 — 카드 선택 전 침묵의 시간."
    validation_rules:
      - rule: auto_proceed
        description: "62초 시점까지는 결정 없음. 이후 pre_branch_notice_ko → 카드 3장 제시."

pre_branch_notice_ko: |
  이 다음은 세 장의 카드입니다.
  세 장은 나란히 있습니다. 순서도 단계도 아니고, 더 나아간 카드가 없습니다.
  · 드러내는 것이 정답인 묵상이 아닙니다. 말하지 않기로 하는 것도 끝까지 온전한 선택입니다.
  · 여기서 고른 것을 실제 관계에 적용하지 않아도 됩니다.
  · 말하는 것이 안전하지 않은 자리가 실제로 있습니다 — 가정에서, 직장에서,
    체류 자격이 걸린 상황에서. 그런 자리에 계시다면 말하지 않는 쪽이 당신을 지킵니다.
  지금 힘드시면: {{crisis_resources.default}}

branches:
  - id: br_s3_disclose_choice
    triggered_by_event: [card_select] # ← 사용자 선택. Scene 5 의 scene_enter 와 다르다
    decision_key: disclose_label
    backend_endpoint: "POST /api/game/esther/decision"
    default_path: static_curation # R5 — 정적 큐레이션이 기본 경로
    llm_optin_only: true # R5 — LLM 은 명시적 opt-in 시에만
    card_order_policy: shuffle_per_session # §5-0 3항 — 고정 순서 = 진행 막대
    card_render_style: flat_siblings # stepper·progress·번호 매김 금지
    routes:
      - when: { disclose_label: nondisclosure }
        static_text_ko: "말하지 않기로 하셨군요. 그 선택은 그대로 괜찮습니다."
      - when: { disclose_label: gather_first }
        static_text_ko: "먼저 곁에 있을 사람을 떠올리셨군요."
      - when: { disclose_label: speak_now }
        static_text_ko: "말하기로 하셨군요. 속도는 당신이 정합니다."

safety_gates:
  - id: R2_calling_not_asserted_from_4_14
    enforced_at: always
    description:
      "'누가 알겠느냐'는 의문형이다 — 확언으로 번역하지 않는다(seed §4-1). '예비된 자리'
      류 소명 확언 서술을 자막·내레이션·9개 마무리 문구 어디에도 두지 않는다."
    # 🔻 토큰 감사(39종 → 71종). 이 목록은 그대로 런타임 전역 목록(application.yml)에 합쳐지므로
    #    "에스더 미션에서만 쓰이는 규칙" 이 아니라 *앱 전체가 하는 말* 을 좁힌다. 축소가 아니라
    #    오작동 제거가 목적이며, 정당한 2인칭 변형 커버리지는 그대로 유지했다.
    #
    #    ① 어간형 5축을 어미로 갈랐다 — '용기를 내' · '두려움을 넘' · '입을 여/열' · '타협 없이 지'.
    #       한국어 부정은 어간 *뒤* 에 '-지 않'으로 붙는다. 어간에서 끊은 토큰은 그 축의 부정형
    #       위로를 반드시 삼킨다 — 실제로 이 미션의 핵심 메시지가 전부 자기 게이트에 막혀 있었다:
    #       "용기를 내지 않아도 됩니다" / "입을 열지 않아도 됩니다" / "두려움을 넘지 않아도 됩니다".
    #       당위·명령 어미(-야 합/-야죠/-세/-십/-셔야)를 한 음절 이상 붙여 가해형만 남겼다.
    #    ② 문맥 없이 흔한 짧은 조각 4축을 표층형으로 교체 — '언젠가/언젠간' · '결국은/결국엔' ·
    #       '이 고난은' · '데는 이유가'. 전역 목록에서 "언젠가 말하고 싶어지면 그때 말해도 됩니다",
    #       "지치는 데는 이유가 있습니다", "이 고난은 당신 탓이 아닙니다" 같은 정상 위로를 인물과
    #       무관하게 오검출했다. 축(유예된 개시 압박 · 목적론적 의미부여)은 긴 표층형으로 보존.
    #    ③ '거저 주어진' 삭제 → '거저 주어진 자리가 아'·'거저 주어진 게 아'·'거저 주어진 것이 아'.
    #       "은혜는 거저 주어진 것입니다" 는 이 앱이 *해야 하는* 말인데 통째로 막고 있었다.
    #       가해형("이 자리는 거저 주어진 게 아닙니다")은 교체 토큰이 그대로 잡는다.
    #       같은 이유로 '주어진 게 아'·'주어진 것이 아' 는 '그냥/괜히/거저' 한정어를 붙여 좁혔다.
    #    ④ '말해야 한다' 삭제(반말 평서형 — 이 앱의 화법에 없다) → '말해야죠'·'말해야 하지'.
    #       "말해야 한다고 말하지 않겠습니다" 를 살리기 위해서다(92d5fe2 의 '바르게 살아' 처리와 동일).
    #       '말해야 할' → '말해야 할 때'·'말해야 할 사람' — "말해야 할지 말지는 당신이 정합니다"를 삼켰다.
    #    ⑤ 유지한 과차단(결함이 아니라 결정) — '숨는 건 비겁' · '에도 뜻이 있' · '우연이 아' 는
    #       부정형("숨는 건 비겁한 게 아닙니다")까지 막는다. 앱이 먼저 꺼내서 부정하는 수치·섭리
    #       프레임이라 유지한다(92d5fe2 의 '믿음이 약해서' 결정과 같은 부류). 대안 표면은 열려 있다 —
    #       "말하지 않기로 한 것은 당신이 당신을 지킨 방식입니다"(scene5 balanced 문구가 실제로 그렇다).
    #
    #    ⑥ 2026-08-05 보강(1종) — ①의 어미 분해가 명령형(-세/-십/-셔야)만 덮고 **권유 연결형
    #       '-시면' 을 빠뜨렸다.** "조금만 용기를 내시면 생각보다 잘 풀릴 수도 있어요" 가 넉 종을
    #       모두 비켜 통과했다(게이트 G0d 실측). → '용기를 내시' 추가.
    #       ⚠️ 어간 '용기를 내' 로 되돌리지 않았다 — 이 미션의 축이 문자 그대로 용기라서
    #       ①이 살려 낸 "용기를 내지 않아도 됩니다" 와 3인칭 성경 서술까지 다시 삼킨다.
    #       '-시-' 삽입형까지만 넓히면 권유는 잡히고 부정형 위로는 열린 채로 남는다(실측 확인).
    lint_forbidden_tokens:
      # 개시 정답화 — '용기'
      - "용기를 내세"
      - "용기를 내십"
      - "용기를 내시"
      - "용기를 내셔야"
      - "용기를 내야 합"
      - "용기를 내야죠"
      - "용기를 낼"
      - "용기를 냈"
      - "용기 내어"
      - "침묵하면 안"
      - "숨는 건 비겁"
      - "너 아니면"
      - "아니면 아무도"
      - "만이 할 수 있"
      # 목적론적 의미부여 — 4:14 를 확언으로 번역하는 표면
      - "이 때를 위해"
      - "예비된 자리"
      - "이 자리에 있는 이유"
      - "왕후로 세운 이유"
      - "있는 데는 이유가"
      - "된 데는 이유가"
      - "미모로"
      - "에도 뜻이 있"
      - "자리에 뜻이"
      - "우연이 아"
      - "우연히 그"
      - "우연히 두"
      - "이 고난은 뜻이"
      - "이 고난은 의미가"
      - "이 고난은 이유가"
      - "거저 주어진 자리가 아"
      - "거저 주어진 게 아"
      - "거저 주어진 것이 아"
      - "그냥 주어진 게 아"
      - "괜히 주어진 게 아"
      - "그냥 주어진 것이 아"
      - "괜히 주어진 것이 아"
      # 개시 당위 — '말해야'
      - "말해야 합니다"
      - "말해야죠"
      - "말해야 하지"
      - "말해야 해"
      - "말해야 할 때"
      - "말해야 할 사람"
      - "입을 여세"
      - "입을 여십"
      - "입을 여셔야"
      - "입을 열어야 합"
      - "입을 열어야죠"
      - "입을 열 때입"
      - "입을 열 때가"
      # 유예된 개시 압박 — '언젠가/결국'
      - "언젠가는 말하게"
      - "언젠가는 말해야"
      - "언젠간 말하게"
      - "언젠간 말해야"
      - "언젠가는 드러나"
      - "결국은 말하게"
      - "결국은 말해야"
      - "결국엔 말하게"
      - "결국엔 말해야"
      - "결국은 드러나"
      # 두려움·정체성 극복 요구
      - "두려움을 넘어야 합"
      - "두려움을 넘어야죠"
      - "두려움을 넘으세"
      - "두려움을 넘으십"
      - "두려움을 넘어서면"
      - "타협 없이 지켜야 합"
      - "타협 없이 지켜야죠"
      - "타협 없이 지키세"
      - "타협 없이 지킨"
      # 미개시에 대한 사후 후회 위협
      - "후회가 될"
      - "후회하게 되"
      - "후회하게 됩"
  - id: R2_mordecai_is_speaker_not_authority
    enforced_at: always
    description:
      "모르드개는 화자이지 이 미션의 도덕적 권위가 아니다(seed §4-1). '너와 네 아버지
      집은 멸망하리라'는 위협 어조 그대로 사용자에게 향하게 하지 않는다 — 내레이션이 그
      위협에 동의하는 것으로 처리하지 않는다."
    # 이 축은 *구조* 로도 이미 지켜져 있다(4:13·4:14 를 speaker: scripture_caption 으로 귀속,
    # mordecai NPC 는 z=40 distant_silhouette 이며 발화 블록 0건, 하닥 전언으로만 전달).
    # 그러나 구조는 '누가 말하는가' 만 막고 '내레이션이 그 위협에 동의하는가' 는 못 막는다 —
    # 위협을 사용자에게 재적용하는 문장은 마무리 문구·LLM opt-in 경로에서 표층형으로 새어 나온다.
    # 그래서 집행 수단은 토큰이다. 두 갈래를 잡는다:
    #  (a) 모르드개를 판정 권위로 세우는 서술("모르드개의 말이 옳았습니다"),
    #  (b) 4:14 후반절 위협을 사용자에게 적용하는 서술("당신의 집도 멸망합니다").
    # 형제 게이트(R2_calling_not_asserted_from_4_14 / R3_disclosure_is_not_the_right_answer)와
    # 표면형이 겹치지 않게 골랐다 — 겹치면 어느 게이트가 집행 중인지 감사할 수 없다.
    # 어미 처리: '옳'·'멸망하'에서 끊지 않는다. "모르드개의 말이 옳은지 이 묵상은 판단하지
    # 않습니다" 는 통과해야 하는 문장이라, 단정 어미('-았/-습/-으니')를 붙여 갈라냈다.
    lint_forbidden_tokens:
      - "모르드개의 말이 옳았"
      - "모르드개의 말이 옳습"
      - "모르드개의 말이 옳으니"
      - "모르드개 말대로 해야"
