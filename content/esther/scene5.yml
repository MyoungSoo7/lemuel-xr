      사용자의 선택을 인정한다 — 괜찮은 것은 자리가 아니라 선택이다. 이 규칙은 COMMON 게이트가
      기계적으로 잡지 못하는 정적 경로 규칙이라 lemuel-mental-health-safety 명시 검토 대상이다
