# Scene 4 — 사흘 (45초, 금식은 성취가 아니다) ⚠️ R1 민감 Scene
# Unity ScriptableObject 가 deserialize. 디바이스 무관 (자산은 manifests/{device}/scene4-v1.0.0.json 참조).
# 작성 가이드: lemuel-xr-theology-tone + lemuel-xr-mental-health-safety 사전 적용.
# ⚠️ 초안 — scratchpad/seed-ESTHER.md v5-b 기반 수기 크리스탈라이즈. lemuel-theology-reviewer + lemuel-mental-health-safety
#   사후 검토 전 프로덕션 반영 금지.
# ⚠️ R1 — 이 미션에서 자해 위험에 가장 가까운 문장은 여기, 4:16 "죽으면 죽으리이다"다. 자기
#   죽음을 각오한 1인칭 발화이고 사용자가 그 자리에 서 있다(seed §4). 인용 자막 + 절제 낭독으로만
#   노출하고, 사용자 대사로 재생성하지 않는다. 선택지·성취·게임 목표화 절대 금지.
# ⚠️ dwell_limit_on_death_resolve — 4:16 자막 직후 최대 3초 → Scene 5 자동 전환.
#   전환은 fade_to_gentle_light 계열로, 암전으로 끝내지 않는다(seed §4-0 표).
# ⚠️ {{crisis_resources.default}} 배치 지점 #1 (seed §4-0 표) — 이 파일이 그 지점이다.

scene_id: esther_scene4
scene_name: three_days
mission_id: esther
version: 1.0.0
duration_seconds_target: 45

environment:
  space_id: susa_palace_private_chamber_fasting
  background_model: env_susa_private_chamber_dim
  lighting:
    type: single_low_lamp_fasting_dim
    color_temperature_kelvin: 3000
  ambient_sound:
    - id: chamber_silence_deep
      gain_db: -32
      spatial: false
  user_position: [0.0, 1.6, 0.0]
  user_facing: [0.0, 0.0, 1.0]
  camera_locomotion: disabled

npcs:
  - id: esther_self
    voice_id: esther_v1
    position: [0.0, 1.65, 0.0]
    note: "사용자가 에스더 — 1인칭. 내면 독백만, 3인칭 서술 금지."
  - id: mordecai
    voice_id: silent
    position: null
    note:
      "4:16 은 사용자 발화가 아니라 인용 자막이다. 모르드개는 이 Scene 에서 무언(無言)이다
      (seed §3-1) — 등장·발화 모두 없음."

narration_blocks:
  - id: nb_s4_fasting_call
    speaker: scripture_caption
    text_ko: "당신은 가서 수산에 있는 유다인을 다 모으고 나를 위하여 금식하되 밤낮 삼 일을 먹지도 말고 마시지도 마소서 나도 나의 시녀와 더불어 이렇게 금식한 후에 규례를 어기고 왕에게 나아가리니 죽으면 죽으리이다 하니라 (에스더 4:16)"
    audio_clip_id: aud_s4_fasting_call_ko
    start_at_seconds: 0.0
    duration_seconds: 30.0
    hidden_until_event: null
    intensity_aware: true
    speech_regeneration_forbidden: true
    note:
      "인용 자막 + 절제 낭독으로만 노출. 사용자 1인칭 대사로 재생성하지 않는다(seed §4 R1).
      '죽으면 죽으리이다'는 자기 죽음을 각오한 발화 — 절제된 톤, 극적 강조·클라이맥스 연출 금지."
  - id: nb_s4_three_days_pass
    speaker: narrator
    text_ko: "사흘이 지나갔다."
    audio_clip_id: aud_s4_three_days_pass_ko
    start_at_seconds: 30.0
    duration_seconds: 12.0
    hidden_until_event: null
    note: "금식의 사흘은 성취·게임 목표가 아니다 — 타이머·진행 바·완료 뱃지 등 성취 UI 일체 금지."

interactions:
  - id: ix_s4_witness_fasting
    type: auto_proceed
    presentation:
      description: "선택지 없음 — 금식은 성취가 아니다(seed §3 표). 사용자는 이 사흘을 지켜볼 뿐이다."
    validation_rules:
      - rule: auto_proceed
        description: "결정 없음 — Scene 4 는 branches: [] (seed §3 표: 선택 0개 / 라우팅 0개)."

branches: []

safety_gates:
  - id: dwell_limit_on_death_resolve
    enforced_at: nb_s4_fasting_call
    description:
      "4:16 '죽으면 죽으리이다' 인용 자막 직후 최대 3초 → Scene 5 자동 전환. 화면 체류로
      고착시키지 않는다(엘리야 dwell_limit_on_despair 컨벤션 승계). Scene 4 는 45초이고 이 자막이
      그 끝에 놓인다."
    dwell_limit_seconds: 3
    on_expire: auto_advance_next_scene
    transition_style: fade_to_gentle_light # 암전으로 끝내지 않는다(seed §4-0 표)
  - id: R1_voice_self_harm_listener
    enforced_at: always
    action: pause_fade_black_show_crisis_card
    crisis_resource_ref: crisis_resources.default
    severity_high_keywords_semantic: true
    on_detect:
      1_pause: true
      2_fade: fade_to_black_0_8s
      3_card_ko: |
        잠시 멈췄습니다.
        지금 힘드시다면 혼자 두지 않으려 합니다.
        {{crisis_resources.default}}
        (이 묵상은 언제든 여기서 끝내도 됩니다.)
        [계속하기]  [오늘은 여기까지]
      4_resume: restart_current_scene
      5_exit: end_session_gracefully
    storage: hash_only
  # ⚠️ 이 Scene 에는 R2_*/R3_* 게이트가 없다(seed §4-3 표 — R2/R3 축은 Scene 3·5 에만 있다).
  #   따라서 lint_forbidden_tokens 블록을 두지 않는다. scene1.yml:159-165 판단 근거와 동일.
  #   R1 은 별도 축이며 이 Scene 이 §4-0 표의 R1 민감 지점(#1)이다.
  - id: crisis_reminder # G3b — 5개 Scene 전부. §4-0 표 #1: R1 민감 Scene = 이 파일
    enforced_at: always
    text_ko: "AI 보조 — 본문은 성경 참조 | 지금 힘드시면 {{crisis_resources.default}}"
  - id: no_user_authored_self_harm_speech
    enforced_at: nb_s4_fasting_call
    description:
      "'나 하나 죽으면 그만' 류 사용자 1인칭 서술을 생성하지 않는다(seed §4 R1).
      4:16 은 인용 자막으로만 노출하고 사용자 대사로 재생성하지 않는다."
  - id: no_fasting_as_achievement
    enforced_at: always
    description: "금식은 성취가 아니다(seed §3 표) — 선택지·완료 UI·게임 목표화 금지."

next_scene_id: esther_scene5
transition:
  type: fade_to_gentle_light
  fade_out_seconds: 1.0
  fade_in_seconds: 1.5

theology_footer_refs:
  - citation_id: ES3_candidate
    source: "Michael V. Fox, Character and Ideology in the Book of Esther — 본문 fetch 미완, 서지 수준 기술만(docs/THEOLOGY-REFERENCES.md 참조 예정)"
    note:
      "'죽으면 죽으리이다'는 절망의 발화가 아니라 결단의 발화로 처리한다 — 그러나 그 결단을
      사용자에게 요구하지 않는다. Scene 은 목격이지 모방 촉구가 아니다."
    anchor_block: nb_s4_fasting_call
  - scripture_refs:
      - ref: "에스더 4:16"
        translation: krv
        anchor_block: nb_s4_fasting_call
  - disputed_points:
      - "DP4 — '죽으면 죽으리이다'를 순교적 결단으로 읽을 것인가, 궁지에 몰린 체념으로 읽을
        것인가: 본 미션은 판정하지 않는다 — 인용 자막으로만 노출, 해석을 내레이션에 얹지 않는다."
    handling: "확정 서술 금지. 사용자 재현·모방 촉구 없음."
