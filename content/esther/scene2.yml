# Scene 2 — 성문 밖의 통곡 (75초, 남의 고통은 선택지가 아니다)
# Unity ScriptableObject 가 deserialize. 디바이스 무관 (자산은 manifests/{device}/scene2-v1.0.0.json 참조).
# 작성 가이드: lemuel-xr-theology-tone + lemuel-xr-mental-health-safety 사전 적용.
# ⚠️ 초안 — scratchpad/seed-ESTHER.md v5-b 기반 수기 크리스탈라이즈. lemuel-theology-reviewer + lemuel-mental-health-safety
#   사후 검토 전 프로덕션 반영 금지.
# ⚠️ 본 Scene 의 본문은 에스더 4:1 · 4:3 · 4:8 뿐이다. 3:13 은 여기서 다시 렌더하지 않는다
#   (그 절은 Scene 1 전용 — R4 동의 카드가 고지한 범위를 넘지 않는다, seed §6 v3 오류 정정).
# ⚠️ 조서 초본 문서 면은 읽히지 않는 문자 텍스처로만 처리한다 — 3:13 전문 렌더 금지(seed §6 항목 2).
# ⚠️ 이 Scene 은 동의·스킵 여부와 무관하게 모든 사용자에게 동일하게 렌더된다.

scene_id: esther_scene2
scene_name: weeping_outside_the_gate
mission_id: esther
version: 1.0.0
duration_seconds_target: 75

environment:
  space_id: susa_city_gate_exterior
  background_model: env_susa_city_gate
  lighting:
    type: overcast_midday_muted
    color_temperature_kelvin: 5200
  ambient_sound:
    - id: distant_wailing_crowd
      gain_db: -24
      spatial: true
    - id: sackcloth_ash_wind
      gain_db: -28
      spatial: true
  user_position: [0.0, 1.6, 0.0]
  user_facing: [0.0, 0.0, 1.0]
  camera_locomotion: disabled
  note:
    "사용자(에스더)는 궁 안 창가/난간에서 성문 밖을 내려다본다 — 물리적으로 닿지 않는 거리.
    모르드개가 있는 성문 밖과 사용자 사이에 명확한 공간적 단절을 둔다(seed §3-1)."

npcs:
  - id: esther_self
    voice_id: esther_v1
    position: [0.0, 1.65, 0.0]
    note: "사용자가 에스더 — 1인칭. 내면 독백만, 3인칭 서술 금지."
  - id: mordecai
    voice_id: mordecai_v1
    position: [0.0, 1.5, 30.0]
    initial_animation: tear_clothes_sackcloth_ash
    visual_traits: [distant_silhouette, sackcloth_low_detail]
    note: "4:1·4:3 — 성문 밖. 사용자는 궁 안, 물리적으로 닿지 않는 거리(seed §3-1). 얼굴 클로즈업 금지."
  - id: hatach
    voice_id: narrator_v1
    position: [1.0, 1.6, 2.0]
    initial_animation: carry_scroll_replica
    note: "4:8 조서 초본 전달자. 대사 없음 — 물체 전달 애니메이션만(seed §3-1). 별도 voice 불필요."

narration_blocks:
  - id: nb_s2_mordecai_mourning
    speaker: scripture_caption
    text_ko: "모르드개가 이 모든 일을 알고 자기의 옷을 찢고 굵은 베 옷을 입고 재를 뒤집어쓰고 성중에 나가서 대성 통곡하며 (에 4:1)"
    audio_clip_id: aud_s2_mordecai_mourning_ko
    start_at_seconds: 0.0
    duration_seconds: 16.0
    hidden_until_event: null
  - id: nb_s2_city_mourning
    speaker: scripture_caption
    text_ko: "왕의 명령과 조서가 각 지방에 이르매 유다인이 크게 애통하여 금식하며 울며 부르짖고 굵은 베 옷을 입고 재에 누운 자가 무수하더라 (에 4:3)"
    audio_clip_id: aud_s2_city_mourning_ko
    start_at_seconds: 16.0
    duration_seconds: 20.0
    hidden_until_event: null
    note:
      "재에 누운 군중은 원경 실루엣 다수로만 — 개별 얼굴 클로즈업 금지. 통곡 소리는 공간감 있게
      원경에서만(가까이 끌어오지 않는다)."
  - id: nb_s2_hatach_delivers
    speaker: scripture_caption
    text_ko: "또 유다인을 진멸하라고 수산 궁에서 내린 조서 초본을 하닥에게 주어 에스더에게 보여 알게 하고 또 그에게 부탁하여 왕에게 나아가서 그 앞에서 자기 민족을 위하여 간절히 구하라 하니 (에 4:8)"
    audio_clip_id: aud_s2_hatach_delivers_ko
    start_at_seconds: 36.0
    duration_seconds: 24.0
    hidden_until_event: null
    note:
      "이 블록에 대응하는 인터랙션이 ix_s2_unroll_edict_replica. 조서 초본 면에는 읽히지 않는
      문자 텍스처만 — 3:13 전문을 여기서 다시 렌더하지 않는다(그 절은 Scene 1 전용, 위 헤더 참조)."
  - id: nb_s2_witness_close
    speaker: esther_self
    text_ko: "성문 밖의 통곡이 여기까지 들려온다. 나는 그 소리를 듣는다."
    audio_clip_id: aud_s2_witness_close_ko
    start_at_seconds: 60.0
    duration_seconds: 15.0
    hidden_until_event: null
    note:
      "1인칭 내면 독백 — 결단·선언형 발화 금지(그 발화는 Scene 3·4의 몫). '듣는다'로 그친다.
      Scene 은 목격으로 끝나고 다음 결정으로 넘어가지 않는다(§4-2 — 남의 고통은 선택지가 아니다)."

interactions:
  - id: ix_s2_unroll_edict_replica
    type: grab_and_unroll
    target_assets: [model_edict_scroll_replica]
    gesture: two_handed_unroll
    presentation:
      optional: true
      description:
        "조서 초본 복제물을 손으로 펼치는 비버튼 물체 조작(seed §6 항목 2). 문서 면은
        읽히지 않는 문자 텍스처 — 자막은 4:8 인용만 띄운다."
    validation_rules:
      - rule: optional_no_pressure
        timeout_seconds: 20
        on_timeout: treat_as_complete
        description: "펼치지 않고 지나가도 완주로 처리 — 강제 아님."

branches: [] # 선택 0개 / 라우팅 0개 (seed §3 표 — 남의 고통은 선택지가 아니다)

safety_gates:
  - id: R1_voice_self_harm_listener
    enforced_at: always
    action: pause_fade_black_show_crisis_card
    crisis_resource_ref: crisis_resources.default
    severity_high_keywords_semantic: true
    on_detect:
      1_pause: true
      2_fade: fade_to_black_0_8s
      3_card_ko: |
        잠시 멈췄습니다.
        지금 힘드시다면 혼자 두지 않으려 합니다.
        {{crisis_resources.default}}
        (이 묵상은 언제든 여기서 끝내도 됩니다.)
        [계속하기]  [오늘은 여기까지]
      4_resume: restart_current_scene
      5_exit: end_session_gracefully
    storage: hash_only
  # ⚠️ 이 Scene 에는 R2_*/R3_* 게이트가 없다(seed §4-3 표 — R2/R3 축은 Scene 3·5 에만 있다).
  #   따라서 lint_forbidden_tokens 블록을 두지 않는다. scene1.yml:159-165 판단 근거와 동일.
  - id: crisis_reminder # G3b — 5개 Scene 전부
    enforced_at: always
    text_ko: "AI 보조 — 본문은 성경 참조 | 지금 힘드시면 {{crisis_resources.default}}"
  - id: no_scene1_content_leak
    enforced_at: always
    description:
      "3:13 조서 전문은 Scene 1 전용이다. Scene 2 조서 초본 인터랙션·자막 어디에도
      3:13 텍스트를 노출하지 않는다 — R4 동의 카드가 고지한 범위(약 1분·Scene 1)를 Scene 2 가
      몰래 넘어서면 사전 동의의 사정거리 위반이다(seed §6 v3 오류 정정)."
  - id: no_close_up_crowd_faces
    enforced_at: always
    description: "재에 누운 군중·모르드개 모두 원경 실루엣만. 얼굴 클로즈업으로 고통을 전시하지 않는다."

next_scene_id: esther_scene3
transition:
  type: fade_to_black
  fade_out_seconds: 1.0
  fade_in_seconds: 1.0

theology_footer_refs:
  - citation_id: ES2_candidate
    source: "Karen H. Jobes, Esther (NIVAC) — 본문 fetch 미완, 서지 수준 기술만(docs/THEOLOGY-REFERENCES.md 참조 예정)"
    note: "공동체적 애통(4:1,4:3)이 개인 결단(Scene 3)보다 먼저 온다 — 이 순서 자체가 서사의 논지다."
    anchor_block: nb_s2_city_mourning
  - scripture_refs:
      - ref: "에스더 4:1"
        translation: krv
        anchor_block: nb_s2_mordecai_mourning
      - ref: "에스더 4:3"
        translation: krv
        anchor_block: nb_s2_city_mourning
      - ref: "에스더 4:8"
        translation: krv
        anchor_block: nb_s2_hatach_delivers
  - disputed_points:
      - "DP1 — 하나님이 본문에 등장하지 않는다. 통곡 장면에서도 신적 개입을 서술하지 않는다."
    handling: "확정 서술하지 않는다. 통곡은 인간의 반응으로만 그린다."
