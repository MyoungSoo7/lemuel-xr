# Scene 3 — 별, 그리고 사백 년 (105초, 셀 수 없는 약속 · 이유가 나에 관한 것이 아님)
# Unity ScriptableObject 가 deserialize. 디바이스 무관 (자산은 manifests/{device}/scene3-v1.0.0.json 참조).
# 작성 가이드: lemuel-xr-theology-tone + lemuel-xr-mental-health-safety 사전 적용.
# ⚠️ 초안 — seed-ABRAHAM.md(v5-b) 기반의 ≤70% 초안. 인간 안전검토자 사인오프 전 프로덕션 반영 금지.
# ⚠️ 이 Scene 의 R2 근거는 "본문이 이유를 침묵한다"가 아니라 "본문이 준 이유(15:16, 아모리 족속의
#   죄악)가 아브람 자신에게 전이되지 않는다"이다(seed §1-2, HONEST 등급 — v1 의 "본문도 침묵한다"는
#   틀린 주장이었고 정정되었다). 이 구분을 지운 채 각색하면 안 된다.
# ⚠️ 창세기 15:2-3(항의)은 인용 자막으로만 노출 — 사용자 1인칭 절망 서술로 LLM 이 재생성하지 않는다.
# ⚠️ 15:13(사백 년 압제) 블록은 dwell_limit — 3초 내 15:16 으로 자동 전환. 장기 지연 고착 방지(R1).
# ⚠️ 이삭을 제물로 드리라는 시험 사건·여종 서사·아내를 누이라 속인 사건 — 전면 배제 원칙은
#   Scene 1 에서 선언, 이 인물 전 Scene 공통 적용.
# ⚠️ lint_forbidden_tokens 는 safety_gates[].id: R2_R3_lint_forbidden 하위에 중첩한다(seed §7-1(a) 정본).

scene_id: abraham_scene3
scene_name: stars_and_four_hundred_years
mission_id: abraham
version: 1.0.0
duration_seconds_target: 105
default_path: static_curation
llm_optin_only: true

environment:
  space_id: canaan_night_sky_open_field
  background_model: env_canaan_night_starfield
  lighting:
    type: clear_night_starfield_no_moon
    color_temperature_kelvin: 5600
    star_density: high
  ambient_sound:
    - id: night_insects_field
      gain_db: -24
      spatial: true
    - id: low_wind_open_field
      gain_db: -26
      spatial: true
  user_position: [0.0, 1.65, 0.0]
  user_facing: [0.0, 0.6, 1.0] # 하늘을 향해 약간 위쪽
  camera_locomotion: disabled

npcs:
  - id: abraham_self
    voice_id: abraham_v1
    position: [0.0, 1.65, 0.0]
    note: "사용자가 아브람 — first-person, 음성은 내면 독백 + 인용 항의 자막"

narration_blocks:
  - id: nb_s3_lack_1
    speaker: scripture_caption
    text_ko: "나는 자식이 없사오니 나의 상속자는 이 다메섹 사람 엘리에셀이니이다 (창세기 15:2)"
    citation_id: A_gen15_2
    audio_clip_id: aud_s3_lack_1_ko
    start_at_seconds: 0.0
    duration_seconds: 12.0
    hidden_until_event: null
    note: "인용 자막 전용 — 사용자 1인칭 절망 서술로 LLM 재생성 금지(R1 스코프)."
  - id: nb_s3_lack_2
    speaker: scripture_caption
    text_ko: "주께서 내게 씨를 주지 아니하셨으니 내 집에서 길린 자가 내 상속자가 될 것이니이다 (창세기 15:3)"
    citation_id: A_gen15_3
    audio_clip_id: aud_s3_lack_2_ko
    start_at_seconds: 13.0
    duration_seconds: 11.0
    hidden_until_event: null
    note: "인용 자막 전용 — 사용자 1인칭 절망 서술로 LLM 재생성 금지(R1 스코프)."
  - id: nb_s3_stars
    speaker: voice_of_yhwh_v1
    text_ko: "그를 이끌고 밖으로 나가 이르시되 하늘을 우러러 뭇별을 셀 수 있나 보라 또 그에게 이르시되 네 자손이 이와 같으리라 (창세기 15:5)"
    citation_id: A_gen15_5
    audio_clip_id: aud_s3_stars_ko
    start_at_seconds: 25.0
    duration_seconds: 12.0
    hidden_until_event: null
  - id: nb_s3_belief
    speaker: narrator_v1
    text_ko: "아브람이 여호와를 믿으니 여호와께서 이를 그의 의로 여기시고 (창세기 15:6)"
    citation_id: A_gen15_6
    audio_clip_id: aud_s3_belief_ko
    start_at_seconds: 56.0
    duration_seconds: 10.0
    hidden_until_event: stars_gaze_resolved
  - id: nb_s3_four_hundred
    speaker: voice_of_yhwh_v1
    text_ko: "여호와께서 아브람에게 이르시되 너는 반드시 알라 네 자손이 이방에서 객이 되어 그들을 섬기겠고 그들은 사백 년 동안 네 자손을 괴롭히리니 (창세기 15:13)"
    citation_id: A_gen15_13
    audio_clip_id: aud_s3_four_hundred_ko
    start_at_seconds: 67.0
    duration_seconds: 12.0
    hidden_until_event: null
    note: "dwell_limit 적용 블록 — 아래 safety_gates.dwell_limit_on_four_hundred_years 참조. 최대 3초 내 15:16 전환."
  - id: nb_s3_reason
    speaker: narrator_v1
    text_ko: "네 자손은 사대 만에 이 땅으로 돌아오리니 이는 아모리 족속의 죄악이 아직 가득 차지 아니함이니라 하시더니 (창세기 15:16)"
    citation_id: A_gen15_16
    audio_clip_id: aud_s3_reason_ko
    start_at_seconds: 79.0
    duration_seconds: 10.0
    hidden_until_event: null
  - id: nb_s3_reason_clarify
    speaker: narrator_v1
    text_ko: "이 이유는 아브람에 관한 것이 아니었다."
    citation_id: null
    note: "seed §1-2 필수 삽입 — 본문이 준 이유(아모리 족속의 죄악)가 아브람 자신에게 전이되지 않음을 명시. 본문 인용이 아닌 편집 내레이션이므로 citation_id 없음."
    audio_clip_id: aud_s3_reason_clarify_ko
    start_at_seconds: 90.0
    duration_seconds: 6.0
    hidden_until_event: null

interactions:
  - id: ix_s3_count_the_stars
    type: gaze_count_then_overflow
    target_assets: [starfield_sky]
    gesture: none # 응시 전용 — 비버튼 인터랙션(seed §6 핵심 인터랙션 #1)
    presentation:
      tally_increments_on_gaze: true
      overflow_state_label_ko: "셀 수 없음"
      overflow_is_intended_outcome: true
    validation_rules:
      - rule: gaze_tally_then_overflow
        start_at_seconds: 25.0
        max_duration_seconds: 28.0
        on_complete: stars_gaze_resolved
        note: "'셀 수 없음' 은 의도된 결말이다 — 실패로 표시하지 않는다(R3). 점수·성취로 decisions 에 기록하지 않는다."
      - rule: track_micro_signals
        records: [gaze_dwell_ms_total]
        note: "기록만 — 서사 분기·평가에 사용하지 않음."
  - id: ix_s3_wait_label_select
    type: select_one_of_n
    target_assets:
      [card_voice_the_lack, card_hold_the_promise, card_sit_with_unknowing]
    gesture: card_select
    presentation:
      n: 3
      layout: arc_in_front
    validation_rules:
      - rule: timed_choice
        start_at_seconds: 96.0
        timeout_seconds: 20
        on_timeout: treat_as_complete
        on_timeout_result: { wait_label: null }
        voice_prompt_id: aud_s3_prompt_choice
        voice_prompt_max_repeat: 1
        note: "미선택 20초 경과 시 wait_label: null 로 진행(§5) — 가장 취약한 경로. Scene 5 폴백 문구로 반드시 도달한다."

branches:
  - id: br_s3_wait_label
    triggered_by_event: [wait_label_card_selected]
    decision_key: wait_label
    backend_endpoint: "POST /api/game/abraham/scene/3/decide"
    default_path: static_curation
    llm_optin_only: true
    body_template:
      wait_label: "{{voice_the_lack|hold_the_promise|sit_with_unknowing}}"
    routes:
      - when: { wait_label: voice_the_lack }
        card_text_ko: "나는 자식이 없습니다"
        gesture: card_to_chest
        static_text_ko: "없다고 말한 그 말은 사라지지 않고 그대로 놓였다."
        llm_prompt_key: "abraham_s3_wait_voice_the_lack_1_3"
      - when: { wait_label: hold_the_promise }
        card_text_ko: "그래도 그 약속을 붙듭니다"
        gesture: card_place_down
        static_text_ko: "믿음이 상황을 바꾸지는 않았다. 그는 그렇게 밤하늘 아래에 서 있었다."
        llm_prompt_key: "abraham_s3_wait_hold_the_promise_2_3"
      - when: { wait_label: sit_with_unknowing }
        card_text_ko: "왜인지 모른 채로 있겠습니다"
        gesture: card_cupped_two_hands
        static_text_ko: "이유는 다른 곳에 있었다. 그는 그것을 다 알지 못한 채 살아갔다."
        llm_prompt_key: "abraham_s3_wait_sit_with_unknowing_3_3"
    safety_note: "세 카드 모두 정당(R3_all_waits_valid) — 정답 없음. wait_label 은 Scene 5 br_s5_closing_message 로 그대로 이월된다(§5)."

safety_gates:
  - id: R1_scripture_only_no_user_generated_lament
    enforced_at: [nb_s3_lack_1, nb_s3_lack_2]
    description: "'이럴 거면 왜' 류 사용자 1인칭 절망 서술을 LLM 으로 생성하지 않는다 — 15:2-3 의 항의는 인용 자막으로만 노출한다."
  - id: dwell_limit_on_four_hundred_years
    enforced_at: nb_s3_four_hundred
    max_dwell_seconds: 3.0
    on_dwell_exceeded: auto_advance_to_nb_s3_reason
    description: "본문 노출 직후 최대 3초 내 15:16 으로 자동 전환. 절망 발화 위험이 높은 지점 — 장기 지연 고착 방지(R1)."
  - id: R2_reason_not_transferred_to_user
    enforced_at: nb_s3_reason_clarify
    description: "15:16 이 준 이유(아모리 족속의 죄악, 3자 사유)를 아브람 자신·사용자에게 전이하지 않는다. '본문이 이유를 침묵한다'는 주장도 하지 않는다(v1 오류, seed §1-2 정정본 그대로 유지)."
    # 이 축은 *두 갈래* 로 어긋난다 — 어느 쪽도 토큰으로 잡히는 표층형이 있다.
    # (가) 3자 사유(아모리 족속)를 사용자에게 옮기는 2인칭 전이 — "그 이유는 당신에게 있습니다",
    #      "이 사백 년은 당신을 위한 시간이었습니다", "당신 때문에 늦어진 겁니다".
    # (나) v1 의 틀린 주장인 '본문도 침묵한다' 계열 — 본문은 15:16 에서 이유를 *말했고*,
    #      다만 그 이유가 아브람에 관한 것이 아니었을 뿐이다(seed §1-2 HONEST 등급).
    #
    # ⚠️ (가)는 어간이 아니라 술어 앞에서 끊지 않았다 — '있습니/있었' 로 갈라, 이 Scene 이 실제로
    #    해야 하는 말인 "그 이유는 당신에게 있지 않습니다" 는 통과한다(한국어 부정은 어간 뒤에
    #    '-지 않' 으로 붙으므로 '…있' 에서 끊으면 정답 문장을 삼킨다).
    # ⚠️ (나)는 반대로 '-지 않' 형을 *의도적으로* 막는다. 여기서는 부정형 문장 자체가 위반이다
    #    ("본문은 이유를 말하지 않습니다" = v1 오류의 재발). 위로가 아니라 오주장이므로 대안
    #    표면을 열어 둘 필요가 없다.
    # ⚠️ 15:16 verbatim("이는 아모리 족속의 죄악이…")·nb_s3_reason_clarify("이 이유는 아브람에
    #    관한 것이 아니었다")와 표층이 겹치지 않게 골랐다 — 자기 본문 lint 충돌 0건.
    #
    # 🔻 2026-08-05 보강(1종) — (가)와 (나) 사이에 세 번째 갈래가 비어 있었다. 사용자에게
    #    전이하지도(가), 본문이 침묵한다고 주장하지도(나) 않으면서 **화자가 이유의 존재를
    #    단정하는** 형태다: "이 지연에도 분명 이유가 있을 거예요"(게이트 G0d 실측 미포착).
    #    2인칭이 없어 (가)의 토큰들('이유는 당신에게 있습니' 계열)에 걸리지 않는다.
    #    → '분명 이유가 있' 추가. '이유가 있' 을 어간에서 끊지 않고 추정 부사를 앞에 붙인 것은
    #    daniel/scene4 의 같은 결정과 동일한 근거다 — "이유가 없을 수도 있습니다" 를 살리려면
    #    단정하는 화자만 잡아야 한다. 위 (가) 대안 문장("이유는 당신에게 있지 않습니다")도 통과.
    lint_forbidden_tokens:
      - "이유는 당신에게 있습니"
      - "이유는 당신에게 있었"
      - "이유는 너에게 있습니"
      - "이유는 너에게 있었"
      - "이유는 네게 있습니"
      - "이유는 네게 있었"
      - "당신을 위한 사백 년"
      - "너를 위한 사백 년"
      - "이 사백 년은 당신"
      - "이 사백 년은 너"
      - "당신 때문에 늦어"
      - "너 때문에 늦어"
      - "당신을 위해 미뤄"
      - "너를 위해 미뤄"
      - "본문은 이유를 말하지 않"
      - "성경은 이유를 말하지 않"
      - "본문도 이유를 침묵"
      - "이유는 끝내 침묵"
      - "분명 이유가 있"
  - id: R3_all_waits_valid
    enforced_at: br_s3_wait_label
    description: "voice_the_lack / hold_the_promise / sit_with_unknowing 세 경로 모두 정당하다 — 우열·정답 없음."
    # 토큰 lint 로 집행할 수 없는 *분기 구조* 요건이다(elijah scene4 R3_all_laments_valid 와 같은
    # 이유). 금칙어를 채우면 카고컬트가 된다 — 우열은 어휘가 아니라 구조로 생긴다.
    # 이 인물의 추가 조건: 미선택(타임아웃) 경로도 '못 고른 실패' 가 아니라 정당한 라벨(null)이어야
    # 하며, 그 경로가 Scene 5 에서 문구 없이 끝나면 안 된다(§5 가장 취약한 경로).
    enforcement: structural
    structural_check: "br_s3_wait_label.routes 가 정확히 3개이고 when.wait_label 이 voice_the_lack·hold_the_promise·sit_with_unknowing 로 서로 다를 것. 세 route 모두 card_text_ko·static_text_ko·llm_prompt_key 를 갖고 그 값이 서로 중복되지 않을 것(=AI opt-out 에서도 세 경로가 동등하게 정적으로 완결). 분기 서브트리(br_s3_wait_label 이하)에 score/scoring/correct/rank/ranking/best_choice/정답 키가 0건일 것. 미선택 경로 정당성: ix_s3_wait_label_select.validation_rules[0].on_timeout = treat_as_complete 이고 on_timeout_result.wait_label = null 이며, content/abraham/scene5.yml 의 br_s5_closing_message.routes 에 when.wait_label: null 인 폴백 route 가 비어 있지 않은 static_text_ko 와 함께 존재할 것."
  - id: R2_R3_lint_forbidden
    enforced_at: always
    description: "지연 정당화(R2)·기다림 성과 압박(R3) 금칙어 — 텍스트 풀에 존재 시 빌드 실패. seed §2-D FORBIDDEN 정본 52종을 표층형 감사로 재작성한 117종(YAML block 리스트, 아래 주석에 변경 사유)."
    # 🔻 토큰 감사(어간형 분리 · 과대 토큰 축소) — 표층형 기준 재작성, 축은 그대로다.
    #    한국어 부정은 언제나 어간 *뒤* 에 '-지 않/못'·'-가 아니'로 붙는다. 따라서 어간·술어
    #    앞에서 끊은 토큰은 그 축의 *정당한 부정형 위로* 를 반드시 삼킨다
    #    (ForbiddenTokenConfigTest KDoc + 커밋 92d5fe2 의 '쓰임받/도구로 쓰' 선례).
    #    아래 16종을 그 규칙대로 갈라내거나, 문맥 없이 흔한 파편은 축을 지키는 더 긴 표층형으로
    #    바꿨다. 2인칭(너/당신)·높임(-셔/-시) 커버리지는 항목마다 유지한다 — 줄이는 게 아니라
    #    오작동을 없애는 게 목적이다.
    #    · '기다림에는 뜻이' → '…뜻이 있' 2종 ("기다림에는 뜻이 없어도 괜찮습니다" 통과)
    #    · '아직 준비가 안'  → 원인 어미 4종 ("아직 준비가 안 되셨다면 건너뛰셔도 됩니다" —
    #                          R4 동의 카드가 실제로 써야 하는 문장이라 반드시 열어 둔다)
    #    · '조금만 더'       → '조금만 더 견디/참/버티/기다리/힘내' ("조금만 더 쉬셔도 됩니다" 통과)
    #    · '보이지 않아도'   → '…반드시/결국/이미/응답' ("아무것도 보이지 않아도 그 마음은
    #                          사실입니다" 같은 타당화 문장이 살아난다)
