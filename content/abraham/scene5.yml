theology_footer_refs:
  - citation_id: A_gen21_1_7_candidate
    source: "창세기 21:1-7 이삭의 출생과 사라의 웃음 — 확정 서지 미확보(드릴다운 필요, seed §10 후보 참조)"
    note: "21:6 은 17:17·18:12 의 웃음이 되돌아오는 절이다 — 정정·성취의 트로피가 아니라 같은 웃음의 회귀로 읽는다."
    anchor_block: nb_s5_laughter_21_6
  - disputed_points:
      - id: DP6
        summary: "이 미션의 정점을 '오랜 기다림 끝의 응답'으로만 읽지 않는다 — 아브라함 서사에서 흔히 신학적 정점으로 다뤄지는 시험 사건(창세기 21장 직후에 이어지는 장)은 본 미션에서 전면 배제되어 있으므로, 이삭의 출생을 그 사건의 전조·복선으로 암시하는 연출·문구를 넣지 않는다."
      - id: DP2
        summary: "여종 서사(창 16, 창 21:8-21)는 이 인물의 서사에서 자주 함께 다뤄지지만 학대·유기 narrative라 본편에서 완전히 배제한다. 이 지점에만 기록한다."
    handling: "출생·웃음의 회귀만 다룬다. 이후 장으로 이어지는 복선·암시를 넣지 않는다."

