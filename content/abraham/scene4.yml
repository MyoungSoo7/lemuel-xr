    dust_road_haze_emphasis: true
  ambient_sound:
    - id: tent_entrance_shade_ambience
      gain_db: -22
      spatial: true
    - id: distant_flock_and_wind
      gain_db: -26
      spatial: true
  user_position: [0.0, 1.65, 0.0]
  user_facing: [0.0, 0.0, 1.0]
