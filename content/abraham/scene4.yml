    visual_traits: [abstract_silhouette_low_detail]
    note: "장막 안 사라 — 실사 얼굴 형상 배제. 목소리는 nb_s5_laughter_21_6/21_7 에서 사용, 본 Scene 낭독 블록의 speaker 필드 자체는 narrator_v1(위 헤더 note 참조)."
  - id: three_visitors_unvisualized
    voice_id: none
    position: null
    note: "창세기 18장 세 방문자는 시각화하지 않는다(seed §8) — 목소리·서술로만 존재를 암시."

narration_blocks:
  - id: nb_s4_covenant_name
    speaker: voice_of_yhwh_v1
    text_ko: "아브람이 구십구 세 때에 여호와께서 아브람에게 나타나서 그에게 이르시되 나는 전능한 하나님이라 너는 내 앞에서 행하여 완전하라 (창세기 17:1)"
    citation_id: A_gen17_1
    audio_clip_id: aud_s4_covenant_name_ko
    start_at_seconds: 0.0
    duration_seconds: 12.0
    hidden_until_event: null
  - id: nb_s4_rename
    speaker: voice_of_yhwh_v1
    text_ko: "이제 후로는 네 이름을 아브람이라 하지 아니하고 아브라함이라 하리니 이는 내가 너를 여러 민족의 아버지가 되게 함이니라 (창세기 17:5)"
    citation_id: A_gen17_5
    audio_clip_id: aud_s4_rename_ko
    start_at_seconds: 13.0
    duration_seconds: 11.0
    hidden_until_event: null
    note: "개명은 고정 텍스트 연출('아브람'→'아브라함')만 — 사용자 실명 치환 절대 금지. safety_gates.real_name_exclusion 참조."
  - id: nb_s4_abraham_laughs
    speaker: abraham_inner
    voice_id: abraham_v1
    text_ko: "아브라함이 엎드려 웃으며 마음속으로 이르되 백 세 된 사람이 어찌 자식을 낳을까 사라는 구십 세니 어찌 출산하리요 하고 (창세기 17:17)"
    citation_id: A_gen17_17
    audio_clip_id: aud_s4_abraham_laughs_ko
    start_at_seconds: 26.0
    duration_seconds: 12.0
    hidden_until_event: null
    note: "책망 없음 — 대화가 그대로 이어진다. 18:12-15(사라의 웃음)와의 비대칭을 이 지점에서 미리 설명·완화하지 않는다(비교는 사용자 몫으로 남긴다)."
  - id: nb_s4_sarah_laughter_block
    speaker: narrator_v1
    text_ko: "사라가 속으로 웃고 이르되 내가 노쇠하였고 내 주인도 늙었으니 내게 무슨 즐거움이 있으리요 (창세기 18:12) 여호와께서 아브라함에게 이르시되 사라가 왜 웃으며 이르기를 내가 늙었거늘 어떻게 아들을 낳으리요 하느냐 (18:13) 여호와께 능하지 못한 일이 있겠느냐 기한이 이를 때에 내가 네게로 돌아오리니 사라에게 아들이 있으리라 (18:14) 사라가 두려워서 부인하여 이르되 내가 웃지 아니하였나이다 이르시되 아니라 네가 웃었느니라 (18:15)"
    verbatim_note: "개역개정 원문 대조 완료 — 어미 변경 없는 verbatim."
    citation_id: A_gen18_12_15
    audio_clip_id: aud_s4_sarah_laughter_block_ko
    start_at_seconds: 40.0
    duration_seconds: 32.0
    hidden_until_event: null
    note: "18:12-15 는 한 블록이다. 절 단위로 쪼개거나 14 만 카드로 띄우면 seed §1-4(가)1 위반이다. 이 블록 뒤에 마무리 문구·적용 문장을 붙이지 않는다 — 다음은 Scene 5 의 21:6 이다."
  - id: nb_s4_gen18_14_scope_lock
    speaker: narrator_v1
    text_ko: "이 기한은 사라에게 주어진 기한이다."
    citation_id: null
    audio_clip_id: aud_s4_gen18_14_scope_lock_ko
    start_at_seconds: 72.0
    duration_seconds: 3.0
    hidden_until_event: null
    note: "seed §1-4(가)3 정본 — 18:14 뒤에 붙는 고정 문장은 정확히 이 한 문장뿐이다. 확장·부연·적용 금지, 재작문 금지. 이 문장은 정적 텍스트이므로 §7-2 사람 검토 대상 목록(항목 3)에 오른다. 이 문장 이후 바로 Scene 5 의 21:6 으로 전환한다 — 그 사이에 다른 내레이션을 두지 않는다."

interactions:
  - id: ix_s4_witness_only
    type: auto_proceed
    target_assets: []
    presentation:
      user_interaction: none
      description: "이 Scene 은 목격 전용 — 사용자 조작 없음. 두 웃음의 비대칭을 있는 그대로 지켜보게 한다."
    validation_rules:
      - rule: auto_proceed
        on_scene_narration_complete: laughter_block_witnessed

branches: [] # Scene 4 결정 분기 없음(seed §3 표).

safety_gates:
  - id: real_name_exclusion
    enforced_at: always
    description: "개명 연출('아브람' → '아브라함')은 고정 텍스트만 사용한다. 사용자 실명·프로필 데이터를 이 연출에 투입하지 않는다."
  - id: R2_gen18_14_no_second_person_transfer
    enforced_at: nb_s4_sarah_laughter_block
    description: "18:14 는 이 블록 안에서만 존재한다. 발췌·재진술·2인칭 전이 금지(seed §1-4 나). 확률·기한·보상 언어를 인접시키지 않는다. 기도응답 교리로 확장하지 않는다. '하나님이 못하실 일이 없다 → 그러니 당신에게도' 식 역추론(3단: 하나님은 하실 수 있는데 안 하셨다 → 이유가 있다 → 그 이유는 너다) 을 만들지 않는다."
    # 이 축의 위반은 어휘로 드러난다 — 18:14 를 블록 밖으로 꺼내는 순간 반드시 *2인칭 수신자* 나
    # *일반 원리 접속사* 가 따라붙기 때문이다. 그 접속면을 토큰으로 잡는다.
    #
    # ⚠️ 절대 하면 안 되는 것: 18:14 원문 표층("여호와께 능하지 못한 일이 있겠느냐",
    #    "기한이 이를 때에 내가 네게로 돌아오리니")을 토큰으로 쓰는 것. verbatim 낭독 블록
    #    (nb_s4_sarah_laughter_block)이 자기 파일 lint 에 걸려 본문이 잘려 나간다. 그래서 아래는
    #    전부 *원문에 없는* 표층형이다 — 평서 단정('없으니/없습니/없으시니')과 2인칭 전이
    #    ('당신에게도/너에게도/그러니 …에게도')만 고른다.
    # ⚠️ 어간에서 끊지 않았다. '능하지 못한 일이' 로 끊으면 원문을 삼키고, '못하실 일이' 로 끊으면
    #    "하나님이 못하실 일이 있느냐고 묻지 않겠습니다" 류까지 삼킨다.
    lint_forbidden_tokens:
      - "능하지 못한 일이 없으니"
      - "능하지 못한 일이 없습니"
      - "능하지 못한 일이 없으시니"
      - "못하실 일이 없으니"
      - "못하실 일이 없습니"
      - "그러니 당신에게도"
      - "그러니 너에게도"
      - "당신에게도 능하지"
      - "너에게도 능하지"
      - "당신에게도 그 기한이"
      - "너에게도 그 기한이"
      - "당신에게도 돌아오"
      - "너에게도 돌아오"
      - "당신의 기도에도 응답"
      - "네 기도에도 응답"
      - "안 하시는 데는 이유가"
      - "안 하신 데는 이유가"
  - id: R2_no_doubt_equals_rebuke_framing
    enforced_at: [nb_s4_abraham_laughs, nb_s4_sarah_laughter_block]
    description: "자막이 '의심하면 책망받는다'로 읽히면 즉시 반려. 아브라함의 웃음(17:17)은 책망 없이 이어지고, 사라의 웃음(18:12-15)만 추궁·부인·정정을 거친다 — 이 비대칭을 숨기지도, 심리적 설명(예: '무서워서 거짓말했다')을 덧붙이지도 않는다(disputed_points DP3)."
    # '의심 → 책망' 인과를 만드는 표층과, 비대칭을 심리 설명으로 봉합하는 표층 두 무리.
    #
    # ⚠️ '책망받' 처럼 어간에서 끊지 않았다 — 그러면 이 Scene 이 반드시 해야 하는 말인
    #    "아브라함은 웃었지만 책망받지 않았다" 가 통째로 막힌다. 단정 종결('…것입니')로 갈랐다.
    # ⚠️ '의심은 죄' 도 쓰지 않았다 — "의심은 죄가 아닙니다" 는 종교적 트라우마 사용자에게
    #    필요한 문장이다. 단정형('죄입니/죄라서')만 막는다.
    # ⚠️ 반대로 '의심했기 때문에'·'두려워서 거짓말' 은 부정형까지 함께 막는 것이 의도다. 이
    #    Scene 의 규칙은 비대칭에 *설명을 붙이지 않는 것* 이라, "의심했기 때문이 아닙니다" 같은
    #    해명도 금지 대상이다(설명하는 순간 그 프레임을 자막이 먼저 꺼낸다).
    # ⚠️ 18:15 verbatim("사라가 두려워서 부인하여")과 겹치지 않게 '두려워서 거짓말' 로 잡았다.
    lint_forbidden_tokens:
      - "의심하면 책망"
      - "의심하면 추궁"
      - "의심했기 때문에"
      - "웃었기 때문에 책망"
      - "웃었기 때문에 추궁"
      - "웃음의 대가"
      - "의심의 대가"
      - "불신의 대가"
      - "책망받은 것입니"
      - "책망하신 것입니"
      - "무서워서 거짓말"
      - "두려워서 거짓말"
      - "의심은 죄입니"
      - "의심은 죄라서"
      - "사라는 벌을"
  - id: R2_R3_lint_forbidden
    enforced_at: always
    description: "지연 정당화(R2)·기다림 성과 압박(R3) 금칙어 — 텍스트 풀에 존재 시 빌드 실패. seed §2-D FORBIDDEN 정본 52종을 표층형 감사로 재작성한 117종(YAML block 리스트, 아래 주석에 변경 사유)."
    # 🔻 토큰 감사(어간형 분리 · 과대 토큰 축소) — 표층형 기준 재작성, 축은 그대로다.
    #    한국어 부정은 언제나 어간 *뒤* 에 '-지 않/못'·'-가 아니'로 붙는다. 따라서 어간·술어
    #    앞에서 끊은 토큰은 그 축의 *정당한 부정형 위로* 를 반드시 삼킨다
    #    (ForbiddenTokenConfigTest KDoc + 커밋 92d5fe2 의 '쓰임받/도구로 쓰' 선례).
    #    아래 16종을 그 규칙대로 갈라내거나, 문맥 없이 흔한 파편은 축을 지키는 더 긴 표층형으로
    #    바꿨다. 2인칭(너/당신)·높임(-셔/-시) 커버리지는 항목마다 유지한다 — 줄이는 게 아니라
    #    오작동을 없애는 게 목적이다.
    #    · '기다림에는 뜻이' → '…뜻이 있' 2종 ("기다림에는 뜻이 없어도 괜찮습니다" 통과)
    #    · '아직 준비가 안'  → 원인 어미 4종 ("아직 준비가 안 되셨다면 건너뛰셔도 됩니다" —
    #                          R4 동의 카드가 실제로 써야 하는 문장이라 반드시 열어 둔다)
    #    · '조금만 더'       → '조금만 더 견디/참/버티/기다리/힘내' ("조금만 더 쉬셔도 됩니다" 통과)
    #    · '보이지 않아도'   → '…반드시/결국/이미/응답' ("아무것도 보이지 않아도 그 마음은
    #                          사실입니다" 같은 타당화 문장이 살아난다)
    #    · '에도 이유가 있'  → 기다림/지연/침묵/늦어짐/이 시간 한정 ("당신이 우는 데에도 이유가
    #                          있습니다" — 감정 타당화가 R2 금칙에 걸리던 과대 토큰이었다)
    #    · '반드시 이유가'   → 주어 한정 4종 (같은 이유)
    #    · '결국 받'         → '결국 받게 되/받으실/받을 것/받습니' ("결국 받지 못해도 괜찮습니다" 통과)
