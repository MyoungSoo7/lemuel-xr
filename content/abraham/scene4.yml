# Scene 4 — 웃음 (75초, 두 웃음의 비대칭 · 18:14 는 이 블록 안에서만 존재한다)
# Unity ScriptableObject 가 deserialize. 디바이스 무관 (자산은 manifests/{device}/scene4-v1.0.0.json 참조).
# 작성 가이드: lemuel-xr-theology-tone + lemuel-xr-mental-health-safety 사전 적용.
# ⚠️ 초안 — seed-ABRAHAM.md(v5-b) 기반의 ≤70% 초안. 인간 안전검토자 사인오프 전 프로덕션 반영 금지
#   (§1-4 의 18:14 처리는 이 미션 전체에서 R2 위험이 가장 큰 지점 — 반드시 인간 신학 검토 통과 후 반영).
# ⚠️ 개명 연출(17:5, 아브람 → 아브라함)은 고정 텍스트만 사용한다. 사용자 실명·프로필 데이터를
#   이 연출에 투입하지 않는다 — safety_gates.real_name_exclusion 참조.
# ⚠️ nb_s4_sarah_laughter_block 은 창세기 18:12·13·14·15 네 절을 하나의 낭독 블록으로 묶는다.
#   절 단위로 쪼개거나 14 만 따로 카드로 띄우면 seed §1-4(가)1 위반이다. 이 블록 바로 뒤에는
#   seed §1-4(가)3 이 정한 고정 범위잠금 문장 한 줄(nb_s4_gen18_14_scope_lock)만 붙는다 —
#   그 외의 마무리 문구·적용 문장은 붙이지 않는다. 그 문장 다음으로 이어지는 것은 Scene 5 의
#   21:6(웃음이 되돌아오는 절)이어야 한다("순서 잠금").
# ⚠️ 18:12(사라의 속웃음)·18:13(추궁)은 조롱이 아니라 체념으로, 18:15(부인)는 변명이 아니라
#   두려움으로 낭독한다(seed §8 sarah_v1 톤 가이드). 이 블록의 speaker 필드는 스키마상
#   narrator_v1 로 고정한다(seed §1-4(라) 원문 그대로 — 절 분리 방지가 우선). 오디오 프로덕션에서
#   구간별 보이스 톤을 나눌 경우 이 note 를 참고한다(§7-2 인간 검토 항목).
# ⚠️ 자막이 "의심하면 책망받는다"로 읽히면 즉시 반려한다 — 17:17(아브라함의 웃음)은 책망 없이
#   그대로 이어지고, 18:12-15(사라의 웃음)만 추궁·부인·정정을 거친다. 이 비대칭을 숨기거나
#   설명으로 지우지 않는다(disputed_points DP3).
# ⚠️ 이삭을 제물로 드리라는 시험 사건·여종 서사·아내를 누이라 속인 사건 — 전면 배제 원칙은
#   Scene 1 에서 선언, 이 인물 전 Scene 공통 적용.
# ⚠️ lint_forbidden_tokens 는 safety_gates[].id: R2_R3_lint_forbidden 하위에 중첩한다(seed §7-1(a) 정본).

scene_id: abraham_scene4
scene_name: laughter
mission_id: abraham
version: 1.0.0
duration_seconds_target: 75
default_path: static_curation
llm_optin_only: true

