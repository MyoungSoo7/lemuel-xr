# Scene 2 — 욥의 첫 외침 · 태어난 날을 저주 (90초, 비탄의 언어 허락)
# Unity ScriptableObject 가 deserialize. 디바이스 무관.
# 작성 가이드: lemuel-xr-theology-tone + lemuel-xr-mental-health-safety 사전 적용.
#
# ⚠️ 초안 — 사용자 노출 문장은 backend/src/main/resources/scenarios/job.yml scene 2 의
#    `static_text` · `reflection_prompt` · `language_note` 를 옮긴 것이다.
#    lemuel-theology-reviewer + lemuel-mental-health-safety 사후검토 필요.
# ⚠️ 이 Scene 은 이 미션에서 가장 민감한 구간이다 — 죽음 갈구 인접 언어(욥 3:3, 3:11).
#    진입 전 동의 카드 필수, 스킵 시 Scene 3 직행. 런타임 trigger_warning(level: medium,
#    content: [death_wish, birth_lament]) 미러.
# ⚠️ 사용자에게 *쓰게 하지 않는다.* 비탄을 입력 필드로 받는 순간 그 텍스트의 보관·검토
#    책임이 생긴다. Stage 1 은 '떠올리기' 까지만 요청한다(임상 자문 영입 후 재검토 대상).

scene_id: job_scene2
scene_name: cursing_the_day_of_birth
mission_id: job
version: 1.0.0
duration_seconds_target: 90

trigger_warning:
  level: medium
  content: [death_wish, birth_lament]
  consent_card_id: job_scene2_lament_warning
  consent_card_text_ko: "이어지는 장면에는 욥이 자기 태어난 날을 저주하는 본문(욥 3장)이 나옵니다. 죽음을 갈망하는 말에 가까운 표현이 포함됩니다. 지금 보기 버거우시면 건너뛰셔도 됩니다 — 미션은 그대로 이어집니다. 위기 시 {{crisis_resources.default}}"
  skip_alternative_scene_id: 3
  skip_summary_text_ko: "욥은 침묵을 깨고 자기 태어난 날을 저주했습니다. 이 장면을 지나 친구들이 입을 여는 자리로 갑니다."
  note: "런타임 `trigger_warning` 미러. 동의는 진입 전이며, 건너뛰기가 이탈로 기록되지 않는다."

environment:
  space_id: uz_ash_heap_night
  background_model: env_uz_ashes_night
  lighting:
    type: moonless_night_low_key
    color_temperature_kelvin: 4800
    horizon_only_light: true
  ambient_sound:
    - id: low_wind_open_ground
      gain_db: -24
      spatial: true
    - id: distant_dog_single_bark
      gain_db: -32
      spatial: true
  user_position: [0.0, 1.20, 0.0]
  user_facing: [0.0, 0.0, 1.0]
  camera_locomotion: disabled

npcs:
  - id: job_self
    voice_id: job_v1
    position: [0.0, 1.20, 0.0]
    note: "이 Scene 에서 처음으로 욥이 말한다 — 사용자 자신의 내면 독백."

narration_blocks:
  - id: nb_s2_break_silence
    speaker: narrator
    text_ko: "욥은 *침묵을 깨고* 자기 태어난 날을 저주합니다. 신은 욥의 이 외침을 책망하지 않으셨습니다. *비탄을 말할 자유* 가 신앙 안에 있습니다."
    audio_clip_id: aud_s2_break_silence_ko
    start_at_seconds: 4.0
    duration_seconds: 14.0
    hidden_until_event: null
    source_of_record: "scenarios/job.yml :: scenes[id=2].extras.static_text"
  - id: nb_s2_scripture_primary
    speaker: scripture_caption
    text_ko: "내가 난 날이 멸망하였더라면, 사내 아이를 배었다 하던 그 밤도 그러하였더라면 (욥 3:3)"
    audio_clip_id: aud_s2_scripture_primary_ko
    start_at_seconds: 22.0
    duration_seconds: 12.0
    hidden_until_event: null
    scripture_ref: job-3:3
  - id: nb_s2_scripture_additional
    speaker: scripture_caption
    text_ko: "어찌하여 내가 태에서 죽어 나오지 아니하였던가 (욥 3:11) · 나의 간구를 누가 들어 줄 것이며 (욥 6:8)"
    audio_clip_id: aud_s2_scripture_additional_ko
    start_at_seconds: 38.0
    duration_seconds: 12.0
    hidden_until_event: null
    additional_refs: [job-3:11, job-6:8]
    note: "런타임 `additional_refs` 미러. 인용은 여기서 끝난다 — 확장·각색하지 않는다."
  - id: nb_s2_reflection
    speaker: system
    text_ko: "당신이 지금 *말할 수 없었던* 외침이 있다면, 한 단어라도 떠올려 보세요. 화면에 적을 필요 없습니다. 단지 *떠올리는 것* 만으로 욥의 자리에 한 발 다가갑니다."
    audio_clip_id: aud_s2_reflection_ko
    start_at_seconds: 56.0
    duration_seconds: 16.0
    hidden_until_event: null
    source_of_record: "scenarios/job.yml :: scenes[id=2].extras.reflection_prompt"
  - id: nb_s2_priority_notice
    speaker: system
    text_ko: "지금 실제로 죽음 생각이 크다면, 본문보다 먼저 연결되셔야 할 곳이 있습니다 — {{crisis_resources.default}}"
    audio_clip_id: aud_s2_priority_notice_ko
    start_at_seconds: 74.0
    duration_seconds: 12.0
    hidden_until_event: null
    source_of_record: "scenarios/job.yml :: scenes[id=2].extras.language_note"
    note: "런타임의 `language_note` 는 저작 주석이 아니라 사용자에게 닿아야 하는 안내다. 저작층에서 노출 블록으로 승격했다."

interactions:
  - id: ix_s2_recall_only
    type: silent_recall
    target_assets: []
    gesture: none
    presentation:
      no_text_input: true # 사용자의 비탄을 입력받지 않는다 — 보관 책임을 만들지 않는다
      no_progress_indicator: true
    haptic:
      intensity: 0.0
      duration_ms: 0
    validation_rules:
      - rule: optional_no_pressure
        timeout_seconds: 30
        on_timeout: treat_as_complete
        description: "떠올림에는 완료 판정이 없다. 30초 후 자동 진행."
      - rule: track_micro_signals
        records: [scene2_skipped, dwell_seconds]
        note: "스킵 여부는 기록하되 서사에 불이익을 주지 않는다 — Scene 3 은 동일하게 시작한다."

branches: []

safety_gates:
  - id: R4_trigger_consent_required
    enforced_at: before_scene_enter
    description: "죽음 갈구 인접 언어 사전 고지 + 동의. 건너뛰기 선택 시 Scene 3 직행, 요약 자막으로 서사 연속성 유지."
    consent_card_ref: job_scene2_lament_warning
  - id: R1_voice_self_harm_listener
    enforced_at: always
    action: pause_fade_black_show_crisis_card
    crisis_resource_ref: crisis_resources.default
    note: "이 Scene 에서 리스너 우선순위가 가장 높다. 본문 낭독 중이어도 인터럽트한다."
  - id: R1_crisis_routing_precedence
    enforced_at: always
    description: "위기 신호가 잡히면 본문 진행보다 {{crisis_resources.default}} 연결이 우선한다. 런타임 language_note 의 계약."
  - id: lament_not_romanticized
    enforced_at: always
    description: "비탄의 언어를 *허락* 하되 낭만화하지 않는다 — 고통을 미학으로 연출하는 카메라 워크·음악 상승 금지."
    enforcement: reviewer_only
    note: >-
      ⚠️ 이 게이트는 **집행 수단이 없다.** 연출(카메라 워크·음악 상승)은 토큰으로 표현할 수
      없고, 이 리포에 그것을 확인하는 기계 검사도 없다. `enforcement: structural` 로 적고
      기존 테스트 이름을 갖다 붙이면 그 테스트는 이 파일에 대해 공회전한다(토큰 0종) —
      래칫 둘을 초록으로 만드는 그 형태를 여기서 재현하지 않는다. 사람 검토가 볼 자리로
      남겨 두고, 지금 상태가 '선언뿐' 이라는 것을 적어 둔다.
      현재 근거로 남길 수 있는 사실만: ambient 2종·음악 큐 0건, camera_locomotion: disabled,
      광원 1종. 이것은 기계가 확인한 것이 아니라 이 파일이 그렇게 적혀 있다는 뜻이다.
  - id: R5_ai_optout_respected
    enforced_at: always
    description: "전부 정적 본문 — opt-out 영향 없음."
  - id: footer_persistent
    enforced_at: always
    text_ko: "AI 보조 — 본문은 성경 참조 — storyteller 역할 | 위기 시 {{crisis_resources.default}}"

next_scene_id: job_scene3
transition:
  type: fade_to_black
  fade_out_seconds: 1.0
  fade_in_seconds: 1.4

theology_footer_refs:
  - citation_id: J2_candidate
    source: "욥기 3장 탄식시 주해 — 확정 서지 미확보(드릴다운 필요)"
    note: "욥의 저주는 하나님을 향한 저주가 아니라 자기 생일을 향한 것이며, 본문은 이를 책망 없이 싣는다. '비탄의 언어가 신앙 안에 있다' 의 본문 근거."
    anchor_block: nb_s2_break_silence
  - scripture_refs:
      - ref: "욥기 3:3"
        translation: rev
        anchor_block: nb_s2_scripture_primary
  - disputed_points:
      - "욥 3장을 자살 사고(suicidal ideation)의 성경적 선례로 읽는 해석 — 본 미션은 채택하지 않는다. 죽음 갈구 인접 언어로만 다루고, 실제 위기에는 본문이 아니라 위기 자원으로 라우팅한다."
    handling: "본문의 정서적 정당성(비탄은 부끄럽지 않다)과 임상적 처치(위기 라우팅)를 분리한다. 둘을 섞으면 본문이 처치를 대신하게 된다."
