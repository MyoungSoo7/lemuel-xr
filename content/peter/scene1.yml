# Scene 1 — 중보와 확언 (60초, 눅 22:31-34) · 실패 이전에 이미 예고된 회복
# ⚠️ R2 핵심: 눅 22:31-32(중보 예고)를 눅 22:33(확언)보다 먼저 배치 — "실패 이전에 이미 중보가 있었다".
#    Scene 1 을 "자만 → 벌"의 인과로 구성하면 즉시 반려(seed §4 R2).
# note: 사용자가 베드로 — 1인칭.
# 작성 가이드: lemuel-xr-theology-tone + lemuel-xr-mental-health-safety 사전 적용.
# ⚠️ 초안 — 인간 안전검토자 사인오프 전 프로덕션 반영 금지 (R1 직접 취급 + "실패·수치심 이후 정체성 재구성" 신규 카테고리 첫 도입).

