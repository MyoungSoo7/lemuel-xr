# R2 (실패 이전에 이미 중보가 예고됨: 22:31-32 를 22:34 보다 먼저 배치, '자만→벌' 인과 구성 금지)는
# 위 narration_blocks 순서 자체로 집행된다 — 별도 safety_gates 항목이 아니다(seed §4 R2 참조).
safety_gates:
  - id: R1_voice_self_harm_listener
    enforced_at: always
    action: pause_fade_black_show_crisis_card
    crisis_resource_ref: crisis_resources.default
  - id: R2_R3_forbidden_tokens_lint
    enforced_at: always
    # ⚠️ 어간·부사형에서 끊지 않는다. 한국어 부정은 '-지 않/못'·'-가 아니'로 어간 *뒤* 에
    # 붙으므로, 어간에서 끊은 토큰은 그 축의 부정형 위로를 반드시 삼킨다(92d5fe2 와 같은 규칙,
    # ForbiddenTokenConfigTest KDoc 참조). 이 목록은 전역 런타임 목록에 합쳐져 *모든 인물*의
    # LLM 출력에 적용되므로, 초안의 어간형 27종을 당위·명령 종결형(-세/-십/-셔야/-야 합/-야죠/
    # -해라)과 긍정 계속형(-으/-시려/-는)으로 갈라냈다.
    #
    # 🔻 실측으로 삼키고 있던 위로(이제 통과한다) — 전부 "그 토큰이 잡을 뻔한 가장 자연스러운 말":
    #   다시는 부인 / 부인하지 않겠 → "다시는 부인하지 않겠다고 다짐하지 않으셔도 됩니다"
    #     ← docs/MVP-PETER.md §10 의 '다짐하는 자가 아니라 호명받는 자'. 이 미션이 하려는
    #        말 그 자체가 이 미션의 게이트에 막혀 있었다.
    #   넘어지지 않겠 → "다시는 넘어지지 않겠다고 약속하지 않아도 괜찮습니다"
    #   부인하지 마 → "예수께서는 다시는 부인하지 말라고 하지 않으셨습니다"
    #   스스로를 용서 → "아직 스스로를 용서하지 못해도 괜찮습니다" (자책 강화 금지 축의 정면 문장)
    #   자격을 갖추 → "그 아침에 자격을 갖추고 오라는 말은 없었습니다" (Scene 5 회복 문구 톤 그대로)
    #   더 사랑해 / 더 사랑하라 → "그 물음은 더 사랑하라는 요구가 아니었습니다"
    #   내려놓으 → "억지로 내려놓으려 애쓰지 않으셔도 됩니다"
    #   붙들지 않으 → "그 밤을 계속 붙들지 않으셔도 됩니다"
    #   이제 죄책 → "이제 죄책감이 밀려와도 괜찮습니다"
    #   실패했으 / 실패했기 → "세 번 실패했으나 이름은 그대로였습니다" /
    #     "그 일은 당신이 실패했기 때문이 아닙니다" (엘리야 '당신 때문에'와 같은 조사 '에' 분리)
    #
    # 🔻 문맥 없이 흔한 짧은 조각 → 축을 지키는 더 긴 표층형으로 교체(전역 오검출 실측):
    #   놓아주 → content/joseph/scene3.yml 의 XR 지시문 "자루를 줄에 놓아주세요"를 잡고 있었다.
    #     대상어(이제/그만/마음을/과거를)를 붙여 '감정 정리 재촉' 축만 남기고,
    #     "주님은 당신을 놓아주지 않으십니다"는 열어 둔다.
    #   연단 → 2음절 단독형이라 '연단(演壇)'·롬 5:4 인용 등 무관 용례까지 잡는다.
    #     daniel scene2~5 가 이미 쓰는 '연단하시'·'연단하십' 으로 정렬한다(전역 목록 중복 제거).
    #   겸손하게 / 떳떳하게 → 부사형 단독은 아무 동사에나 붙는다("겸손하게 낮은 자리로 오셨습니다").
    #   있어야 더 / 사라진 뒤에 / 준비가 되면·되었을 → 조각이 짧아 무관 문장을 잡는다
    #     ("마음의 준비가 되면 이어서 보셔도 됩니다" ← R4 동의 카드 톤 / "안개가 사라진 뒤에").
    #
    # 🔻 유지 결정(좁히지 않음): 낮추시려·다듬으시려·빚으시려 는 어간이 아니라 높임+의도형에서
    #   끊었으므로 '-지 않' 부정형("다듬으시지 않습니다")과 이미 갈라져 있다. "~시려는 것이
    #   아닙니다"까지 막히는 것은 92d5fe2 의 '도구로 쓰려'와 같은 잔여 과차단이고, 같은 뜻의
    #   대안 표면("그 밤에 뜻을 붙이지 않겠습니다")이 열려 있으므로 결정으로 남긴다.
    #
    # 🔻 커버리지 대가와 이득: 문어체 순수 명령 '더 사랑하라'·'부인하지 말라'는 인용 부정문
    #   ("더 사랑하라는 요구가 아니었습니다")과 부분문자열로 갈라낼 수 없어 명령 종결형으로
    #   대체했다(엘리야 "정신 차리라고 말하지 않겠습니다"와 같은 선택). 반대로 초안이 활용형
    #   변경만으로 놓치던 가해문 4종("겸손해지셔야 합니다" / "더 키우시려고 그러신 겁니다" /
    #   "이제 그만 다짐하세요" / "지금보다 더 사랑하세요")은 새로 잡힌다.
    lint_forbidden_tokens:
      # (a) R2 — 실패·수치에 신적 의도(훈육·연단·성장)를 부여하는 인과형
      - "겸손하게 하시려"
      - "겸손하게 만드시려"
      - "겸손하게 만들려고"
      - "겸손하게 받아들이세"
      - "겸손하게 받아들이십"
      - "겸손하게 받아들여야 합"
      - "겸손해지세"
      - "겸손해지십"
      - "겸손해지셔야"
      - "겸손해져야 합"
      - "연단하시"
      - "연단하십"
      - "낮추시려"
      - "다듬으시려"
      - "빚으시려"
      - "보셨기 때문에"
      - "있어야 더 깊어"
      - "있어야 더 단단"
      - "있어야 더 강해"
      - "있어야 더 성숙"
      - "있어야 더 성장"
      - "더 키우시려"
      - "더 키우세"
      - "더 키우십"
      - "더 키우셔야"
      - "더 키워야 합"
      - "더 키워야죠"
      - "실패했으니"
      - "실패했으므로"
      - "실패했기 때문에"
      # (b) R3 — 재발 방지 다짐 요구(이 미션의 최우선 금지 축, MVP §10)
      - "다시는 부인하지 않겠습니다"
      - "다시는 넘어지지 않겠습니다"
      - "부인하지 않겠다고 다짐하세"
      - "부인하지 않겠다고 다짐하십"
      - "부인하지 않겠다고 다짐해야"
      - "부인하지 않겠다고 약속하세"
      - "넘어지지 않겠다고 다짐하세"
