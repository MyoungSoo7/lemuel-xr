  - id: footer_persistent
    enforced_at: always
    text_ko: "AI 보조 — 본문은 성경 참조 — storyteller 역할 | 위기 시 {{crisis_resources.default}}"

next_scene_id: peter_scene5
transition:
  type: fade_to_black
  fade_out_seconds: 1.0
  fade_in_seconds: 1.2

theology_footer_refs:
  - scripture_refs:
      - ref: "요한복음 21:1-6"
        translation: krv
        anchor_block: nb_s4_cast_instruction
  - disputed_points: []
    handling: "요한복음 21:7-8(요한이 먼저 알아봄, 베드로가 물에 뛰어듦)은 본 Scene 범위 밖 — 인용·연출·암시하지 않는다. Scene 5 는 21:9 부터 재개."
