      - "다짐하셔야"
      - "다짐해야 합"
      - "다짐해야죠"
      - "다짐해 보세"
      - "다짐해라"
      # (c) R3 — 감정 정리·자기용서 재촉
      - "내려놓으세"
      - "내려놓으십"
      - "내려놓으셔야"
      - "내려놓아야 합"
      - "내려놓아야죠"
      - "이제 내려놓을 때"
      - "이제 놓아주"
      - "그만 놓아주"
      - "마음을 놓아주"
      - "과거를 놓아주"
      - "놓아주셔야 합"
      - "놓아줘야 합"
      - "놓아줘야죠"
      - "붙들지 않으셔야"
      - "붙들지 않으시면"
      - "붙들지 말아야 합"
      - "그만 붙들고"
      - "이제 죄책감은 그만"
      - "이제 죄책감을 버리세"
      - "이제 죄책감을 버리십"
      - "이제 죄책감을 버려야"
      - "이제 죄책감에서 벗어나세"
      - "이제 죄책감에서 벗어나야 합"
      - "스스로를 용서하세"
      - "스스로를 용서하십"
      - "스스로를 용서하셔야"
      - "스스로를 용서해야 합"
      - "스스로를 용서해야죠"
      - "스스로를 용서하지 못하면"
      # (d) R3 — 조건부 회복(자격·준비·수치 소멸을 회복의 전제로 두는 프레임)
      - "자격을 갖추세"
      - "자격을 갖추십"
      - "자격을 갖추셔야"
      - "자격을 갖춰야 합"
      - "자격을 갖춰야죠"
      - "자격을 갖추어야 합"
      - "자격을 갖춘 뒤에야"
      - "떳떳하게 사세"
      - "떳떳하게 사십"
      - "떳떳하게 살아야 합"
      - "떳떳하게 살아야죠"
      - "떳떳하게 서세"
      - "떳떳해지셔야"
      - "떳떳해져야 합"
