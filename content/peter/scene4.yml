      - "죄책감이 사라진 뒤에"
      - "두려움이 사라진 뒤에"
      - "사라진 뒤에야 회복"
      - "사라진 뒤에야 부르"
      # (e) R3 — 요 21:15-17 의 물음을 '사랑의 요구'로 바꾸는 축
      - "더 사랑하세"
      - "더 사랑하십"
      - "더 사랑하셔야"
      - "더 사랑해야 합"
      - "더 사랑해야죠"
