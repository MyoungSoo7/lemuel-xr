      - "충분히 우셨"
      # (d) R3 — 조건부 회복(자격·준비·수치 소멸을 회복의 전제로 두는 프레임)
      - "자격을 갖추세"
      - "자격을 갖추십"
      - "자격을 갖추셔야"
      - "자격을 갖춰야 합"
      - "자격을 갖춰야죠"
      - "자격을 갖추어야 합"
      - "자격을 갖춘 뒤에야"
