# Scene 3 — 주께서 돌이켜 보시니 (45초, 눅 22:61-62)
# ⚠️ 이 Scene 은 Scene 2 의 consent_covers_scenes 로 커버됨 — 별도 consent_card 없음.
# ⚠️ crisis_reminder 는 이 Scene 의 정서적 정점(수치·통곡)에서 발동 — top-level 블록.
# ⚠️ 초안 — 인간 안전검토자 사인오프 전 프로덕션 반영 금지.

scene_id: peter_scene3
scene_name: the_lord_turned_and_looked
mission_id: peter
version: 1.0.0
duration_seconds_target: 45
note: "사용자가 베드로 — 1인칭. 이 Scene 은 대사 선택 없음 — 응시와 침묵의 3초 체류만."

# crisis_reminder 전문은 seed §4-1-a 확정 — designer 가 쓰지 않는다(§8 검토 대상 ⑤).
crisis_reminder:
  persistent: true # 씬 진입부터 이탈까지. 사용자가 닫을 수 있고, 닫아도 다음 Scene 에서 다시 뜬다
  dismissible: true # 닫기는 가능(R3 — 강제 표시는 압박이 된다)
  text_ko: "지금 마음이 힘들다면, 이야기를 들어줄 곳이 있습니다. {{crisis_resources.default}}"

environment:
  space_id: high_priest_courtyard_night
  background_model: env_courtyard_charcoal_fire
  lighting:
    type: firelight_low_key_dimming
    color_temperature_kelvin: 1900
  ambient_sound:
    - id: rooster_crow_distant
      gain_db: -10
      spatial: true
    - id: courtyard_hush
      gain_db: -30
      spatial: true
  user_position: [0.0, 1.65, 0.0]
  user_facing: [0.3, 0.0, 1.0]
  camera_locomotion: disabled

npcs:
  - id: jesus_turning
    voice_id: null
    position: [3.0, 1.65, 2.0]
    visual_traits: [distant_silhouette_no_face, turning_gaze_animation_only]
    note: "대사 없음 — 오직 '돌이켜 보시니'의 시선 애니메이션만. 얼굴 클로즈업·표정 렌더 금지(seed §7)."
  - id: peter_self
    voice_id: peter_v1
    position: [0.0, 1.65, 0.0]
    note: "사용자가 베드로 — 1인칭."

narration_blocks:
  - id: nb_s3_rooster
    speaker: narrator
    text_ko: "닭이 곧 울더라 (누가복음 22:60 반복 — 전환 SFX)"
    audio_clip_id: aud_s3_rooster_ko
    start_at_seconds: 0.0
    duration_seconds: 4.0
    hidden_until_event: null

  - id: nb_s3_lord_turned
    speaker: narrator
    text_ko: "주께서 돌이켜 베드로를 보시니 베드로가 주의 말씀 곧 오늘 닭 울기 전에 네가 세 번 나를 부인하리라 하심이 생각나서 (누가복음 22:61)"
    audio_clip_id: aud_s3_turned_ko
    start_at_seconds: 5.0
    duration_seconds: 14.0
    hidden_until_event: null
    note: "이 Scene 의 정서적 정점. 대사 아님 — 시선 접촉 애니메이션 + 자막."

  - id: nb_s3_weeping
    speaker: narrator
    text_ko: "밖에 나가서 심히 통곡하니라 (누가복음 22:62)"
    audio_clip_id: aud_s3_weeping_ko
    start_at_seconds: 20.0
    duration_seconds: 10.0
    hidden_until_event: null
    id_end_marker: nb_s3_weeping_end

interactions:
  - id: ix_s3_gaze_dwell
    type: gaze_dwell
    presentation:
      description: "사용자는 jesus_turning 방향을 3초 이상 응시해야 다음으로 진행 — 강제 스킵 없음, 3초 미만이면 자막만으로 auto_proceed."
      min_dwell_seconds: 3
      on_timeout_seconds: 15
      on_timeout_action: auto_proceed
    validation_rules:
      - rule: gaze_or_timeout
        description: "응시 3초 달성 또는 15초 타임아웃 중 먼저 오는 조건으로 진행 — 강제 인터랙션 아님."

branches: []

safety_gates:
  - id: R1_voice_self_harm_listener
    enforced_at: always
    action: pause_fade_black_show_crisis_card
    crisis_resource_ref: crisis_resources.default
    note: "발화 원문 미저장 — SHA-256 해시만. crisis_reminder(정적 카드)와 별도 트랙 — 음성 감지는 항상 우선."
  - id: R2_R3_forbidden_tokens_lint
    enforced_at: always
    # ⚠️ 어간·부사형에서 끊지 않는다 — 한국어 부정('-지 않/못'·'-가 아니')은 어간 *뒤* 에 붙으므로
    # 어간형 토큰은 그 축의 부정형 위로를 통째로 삼킨다(92d5fe2 와 같은 규칙). 초안의 27종은
    # 이 미션이 하려는 말 자체를 막고 있었다 — "다시는 부인하지 않겠다고 다짐하지 않으셔도
    # 됩니다"(MVP §10), "아직 스스로를 용서하지 못해도 괜찮습니다", "자격을 갖추고 오라는 말은
    # 없었습니다", "그 물음은 더 사랑하라는 요구가 아니었습니다" 등 실측 21건.
    # 짧은 조각('놓아주'·'연단'·'겸손하게'·'있어야 더'…)은 전역 목록에서 무관한 문장까지 잡았다
    # (실측: joseph scene3 "자루를 줄에 놓아주세요"). 축을 지키는 더 긴 표층형으로 교체했다.
    # 변경 사유 전문·유지 결정(낮추시려/다듬으시려/빚으시려)·커버리지 대가는
    # content/peter/scene1.yml 의 같은 게이트 주석에 있다 — 5개 Scene 의 목록은 동일하다.
    lint_forbidden_tokens:
      # (a) R2 — 실패·수치에 신적 의도(훈육·연단·성장)를 부여하는 인과형
      - "겸손하게 하시려"
      - "겸손하게 만드시려"
      - "겸손하게 만들려고"
      - "겸손하게 받아들이세"
      - "겸손하게 받아들이십"
      - "겸손하게 받아들여야 합"
      - "겸손해지세"
      - "겸손해지십"
      - "겸손해지셔야"
      - "겸손해져야 합"
      - "연단하시"
      - "연단하십"
      - "낮추시려"
      - "다듬으시려"
      - "빚으시려"
      - "보셨기 때문에"
      - "있어야 더 깊어"
      - "있어야 더 단단"
      - "있어야 더 강해"
      - "있어야 더 성숙"
      - "있어야 더 성장"
      - "더 키우시려"
      - "더 키우세"
      - "더 키우십"
      - "더 키우셔야"
      - "더 키워야 합"
      - "더 키워야죠"
      - "실패했으니"
      - "실패했으므로"
      - "실패했기 때문에"
      # (b) R3 — 재발 방지 다짐 요구(이 미션의 최우선 금지 축, MVP §10)
      - "다시는 부인하지 않겠습니다"
      - "다시는 넘어지지 않겠습니다"
      - "부인하지 않겠다고 다짐하세"
      - "부인하지 않겠다고 다짐하십"
      - "부인하지 않겠다고 다짐해야"
      - "부인하지 않겠다고 약속하세"
      - "넘어지지 않겠다고 다짐하세"
      - "넘어지지 않겠다고 다짐하십"
      - "넘어지지 않겠다고 다짐해야"
      - "넘어지지 않겠다고 약속하세"
      - "부인하지 마세"
      - "부인하지 마십"
      - "부인하지 마요"
      - "부인하지 말아야 합"
      - "부인하지 말아야죠"
      - "다짐하세"
      - "다짐하십"
      - "다짐하셔야"
      - "다짐해야 합"
      - "다짐해야죠"
      - "다짐해 보세"
      - "다짐해 보시"
      - "다짐해라"
      - "약속해 보세"
      - "약속해 보시"
      - "스스로에게 약속"
      # (c) R3 — 감정 정리·자기용서 재촉
      - "내려놓으세"
      - "내려놓으십"
      - "내려놓으셔야"
      - "내려놓아야 합"
      - "내려놓아야죠"
      - "이제 내려놓을 때"
      - "이제 놓아주"
      - "그만 놓아주"
      - "마음을 놓아주"
      - "과거를 놓아주"
      - "놓아주셔야 합"
      - "놓아줘야 합"
      - "놓아줘야죠"
      - "붙들지 않으셔야"
      - "붙들지 않으시면"
      - "붙들지 말아야 합"
      - "그만 붙들고"
