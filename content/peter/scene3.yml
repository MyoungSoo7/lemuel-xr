      - "이제 죄책감을 버려야"
      - "이제 죄책감에서 벗어나세"
      - "이제 죄책감에서 벗어나야 합"
      - "스스로를 용서하세"
      - "스스로를 용서하십"
      - "스스로를 용서하셔야"
