# Scene 5 — 숯불 앞의 회복 (90초, 요 21:9-17) · 미션 마지막 Scene · 이탈 지점
# ⚠️ 이 Scene 은 요한복음 21:17 에서 끝난다 — 그 다음에 오는 두 절(R1/R4 사유로 배제,
#    docs/MVP-PETER.md disputed_points 5번 참조)은 이 Scene 범위 밖이다.
#    배제는 seed §2 의 문자열 20종(EXCLUDED_TEXT 8 + EXCLUDED_REF 12)으로 집행되며,
#    이 파일에서 그 배제 사실을 문자열로 남기는 유일한 자리는 아래 `excluded_passages_note`
#    1행이다(마커 위치 3곳 중 하나 — seed §2-3). 그 외 어디에도 배제 문자열을 쓰지 않는다.
# ⚠️ br_s5_restore_label 카드 3장·br_s5_recovery_message 12개 문구는 seed §5-2/§5-3
#    확정 전문 그대로다 — designer 가 재작성하지 않는다(§8 검토 대상 ②⑦).
# ⚠️ triggered_by_event 는 baseline([scene_enter])과 다르게 [decision_recorded,
#    scene_exit_pending] 을 쓴다 — 라벨 카드가 Scene 4 가 아니라 Scene 5 내부(세 번째
#    문답 직전)에 있기 때문(seed §5-4 ⚠️, 임의 변경 금지).
# ⚠️ 초안 — 인간 안전검토자 사인오프 전 프로덕션 반영 금지.

scene_id: peter_scene5
scene_name: restoration_by_the_charcoal_fire
mission_id: peter
version: 1.0.0
duration_seconds_target: 90
note: "사용자가 베드로 — 1인칭. 요 18:18(부인의 불)과 요 21:9(회복의 불) 동일 에셋 재사용 — 같은 불 앞에 다시 서는 것 자체가 회복의 장치(seed §6)."

# crisis_reminder 전문은 seed §4-1-a 확정 — designer 가 쓰지 않는다(§8 검토 대상 ⑤).
# 이 Scene 은 이탈 지점(미션 종료)이므로 scene3 과 문구를 의도적으로 다르게 둔다.
crisis_reminder:
  persistent: true
  dismissible: true
  text_ko: "미션이 끝난 뒤에도 이야기를 들어줄 곳이 있습니다. {{crisis_resources.default}}"

excluded_passages_note: "본 Scene 은 요한복음 21:17에서 끝난다. 요 21:18-19(순교 예고)는 R1/R4 사유로 이 미션 범위에서 완전히 배제되었다 — docs/MVP-PETER.md disputed_points 5번 참조." # <!-- EXCLUSION-DECL -->

default_path: static_curation
llm_optin_only: true

environment:
  space_id: galilee_shore_dawn_fire
  background_model: env_shore_charcoal_fire_breakfast
  lighting:
    type: dawn_gradient_low_key
    color_temperature_kelvin: 3200
  ambient_sound:
    - id: charcoal_fire_crackle
      gain_db: -16
      spatial: true
      note: "Scene 2 의 charcoal_fire_crackle 과 동일 에셋 재사용(요 18:18 → 요 21:9 대칭, seed §3-1 말미)."
    - id: shore_wave_lap
      gain_db: -22
      spatial: true
  user_position: [0.0, 1.65, 0.0]
  user_facing: [0.0, 0.0, 1.0]
  camera_locomotion: disabled

npcs:
  - id: jesus_shore
    voice_id: jesus_v1
    position: [0.0, 1.65, 1.5]
    visual_traits:
      [backlit_silhouette_no_face, hand_closeup_only, bread_and_fish_closeup]
    note: "육체로 해변에 선 임재 — 역광 실루엣 + 손·숯불·떡 국소 클로즈업 + 음성. 얼굴 렌더 없음, 완전 추상 광휘도 금지(seed §7)."
  - id: peter_self
    voice_id: peter_v1
    position: [0.0, 1.65, 0.0]
    note: "사용자가 베드로 — 1인칭. 감정 연기 금지."

narration_blocks:
  - id: nb_s5_v9
    speaker: narrator
    text_ko: "육지에 올라보니 숯불이 있는데 그 위에 생선이 놓였고 떡도 있더라 (요 21:9)"
    audio_clip_id: aud_s5_09_ko
    start_at_seconds: 0.0
    duration_seconds: 8.0
    hidden_until_event: null

  - id: nb_s5_v10
    speaker: jesus_shore
    text_ko: "예수께서 이르시되 지금 잡은 생선을 좀 가져오라 하시니 (요 21:10)"
    audio_clip_id: aud_s5_10_ko
    start_at_seconds: 8.0
    duration_seconds: 6.0
    hidden_until_event: null

  - id: nb_s5_v11
    speaker: peter_self
    text_ko: "시몬 베드로가 올라가서 그물을 육지에 끌어 올리니 가득히 찬 큰 물고기가 백쉰세 마리라 이같이 많으나 그물이 찢어지지 아니하였더라 (요 21:11)"
    audio_clip_id: aud_s5_11_ko
    start_at_seconds: 14.0
    duration_seconds: 10.0
    hidden_until_event: null

  - id: nb_s5_v12
    speaker: jesus_shore
    text_ko: "예수께서 이르시되 와서 조반을 먹으라 하시니 제자들이 주님이신 줄 아는 고로 당신이 누구냐 감히 묻는 자가 없더라 (요 21:12)"
    audio_clip_id: aud_s5_12_ko
    start_at_seconds: 24.0
    duration_seconds: 10.0
    hidden_until_event: null

  - id: nb_s5_v13
    speaker: narrator
    text_ko: "예수께서 가셔서 떡을 가져다가 그들에게 주시고 생선도 그와 같이 하시니라 (요 21:13)"
    audio_clip_id: aud_s5_13_ko
    start_at_seconds: 34.0
    duration_seconds: 8.0
    hidden_until_event: null

  - id: nb_s5_v14
    speaker: narrator
    text_ko: "이것은 예수께서 죽은 자 가운데서 살아나신 후에 세 번째로 제자들에게 나타나신 것이라 (요 21:14)"
    audio_clip_id: aud_s5_14_ko
    start_at_seconds: 42.0
    duration_seconds: 8.0
    hidden_until_event: null

  - id: nb_s5_v15
    speaker: jesus_shore
    text_ko: "그들이 조반 먹은 후에 예수께서 시몬 베드로에게 이르시되 요한의 아들 시몬아 네가 이 사람들보다 나를 더 사랑하느냐 하시니 이르되 주님 그러하나이다 내가 주님을 사랑하는 줄 주님께서 아시나이다 이르시되 내 어린 양을 먹이라 하시고 (요 21:15)"
    audio_clip_id: aud_s5_15_ko
    start_at_seconds: 50.0
    duration_seconds: 16.0
    hidden_until_event: null
    note: "bskorea 원문의 각주 마커 '2)'는 화면에 노출하지 않는다 — '이 사람들보다'로만 렌더(seed §1 규칙). 이독('이것들보다')은 자막에 반영하지 않는다."

  - id: nb_s5_v16
    speaker: jesus_shore
    text_ko: "또 두 번째 이르시되 요한의 아들 시몬아 네가 나를 사랑하느냐 하시니 이르되 주님 그러하나이다 내가 주님을 사랑하는 줄 주님께서 아시나이다 이르시되 내 양을 치라 하시고 (요 21:16)"
    audio_clip_id: aud_s5_16_ko
    start_at_seconds: 66.0
    duration_seconds: 14.0
    hidden_until_event: null

  - id: nb_s5_v17
    speaker: jesus_shore
    text_ko: "세 번째 이르시되 요한의 아들 시몬아 네가 나를 사랑하느냐 하시니 주께서 세 번째 네가 나를 사랑하느냐 하시므로 베드로가 근심하여 이르되 주님 모든 것을 아시오매 내가 주님을 사랑하는 줄을 주님께서 아시나이다 예수께서 이르시되 내 양을 먹이라 (요 21:17)"
    audio_clip_id: aud_s5_17_ko
    start_at_seconds: 80.0
    duration_seconds: 10.0
    hidden_until_event: null
    note: "br_s5_restore_label 은 이 블록 직전(position: '세 번째 문답 직전')에 뜬다 — 요 21:16 종료와 이 블록 시작 사이."

interactions:
  - id: ix_s5_charcoal_fire_gaze
    type: gaze_dwell
    presentation:
      description: "요 21:9 의 숯불을 응시 — Scene 2 의 부인의 불과 동일 에셋. 같은 불 앞에 다시 서는 것이 회복의 장치(seed §6-1)."
      min_dwell_seconds: 6
      recommended_dwell_seconds: 8
      on_timeout_seconds: 8
      on_timeout_action: treat_as_complete
    validation_rules:
      - rule: gaze_or_timeout
        description: "6~8초 권장, on_timeout: treat_as_complete — 실패 상태가 존재하지 않는다(R3)."
  - id: ix_s5_restore_label_select
    type: select_one_of_n
    presentation:
      description: "세 번째 문답(요 21:17) 직전, restore_label 카드 3장 중 선택 — 셋 다 정당, 틀린 답 없음."
      n: 3
    validation_rules:
      - rule: optional_selection_or_timeout
        description: "무응답도 정상 경로(on_timeout: proceed_without_label) — R3, 선택은 강제되지 않는다."

# branches 배열 길이 2 — ①선택(카드 3장) + ②라우팅(9+3=12). seed §5-4/§3 표 확정 스키마.
branches:
  - id: br_s5_restore_label
    selectable: true
    position: "세 번째 문답 직전" # 요 21:17 자막 앞
    decision_key: restore_label
    default_path: static_curation
    llm_optin_only: true
    cards: # 셋 다 정당 — 틀린 답 없음
      - { value: unforgivable, static_text_ko: "돌이킬 수 없다" }
      - { value: unworthy, static_text_ko: "자격이 없다" }
      - { value: afraid_again, static_text_ko: "또 그럴까 두렵다" }
    on_timeout: proceed_without_label # R3 — 무응답이 실패가 아니다 → restore_label = null

  - id: br_s5_recovery_message
    triggered_by_event: [decision_recorded, scene_exit_pending]
    decision_key: restore_label
    backend_endpoint: "POST /api/game/peter/complete"
    default_path: static_curation
    llm_optin_only: true
    body_template:
      restore_label: "{{from_scene5_or_null}}"
      faith_tone: "{{users.faith_tone}}"
    routes: # 3 라벨 × 3 faith_tone = 9 + null × 3 = 12. §5-2/§5-3 확정 전문 그대로 — 재작성 금지.
      - when: { restore_label: unforgivable, faith_tone: strong }
        static_text_ko: "세 번 부인한 그 밤은 지워지지 않았습니다. 그런데 그 밤을 다 알고 계신 주님이, 아침 바닷가에 먼저 불을 피워 놓고 계셨습니다."
      - when: { restore_label: unforgivable, faith_tone: balanced }
        static_text_ko: "그 밤에 있었던 일은 없던 일이 되지 않았습니다. 그리고 그 일을 가장 정확히 아는 분이 아침 바닷가에 있었다는 것도, 같이 남아 있습니다."
      - when: { restore_label: unforgivable, faith_tone: soft }
        static_text_ko: "돌이킬 수 없는 밤이 있었습니다. 그 다음 날 아침에도 바닷가에는 불이 피워져 있었고, 이름을 부르는 목소리가 있었습니다."
      - when: { restore_label: unworthy, faith_tone: strong }
        static_text_ko: '세 번째 물음 앞에서 베드로는 근심했습니다. 주님은 그 근심을 걷어내지 않으신 채로, 그 물음 안에서 그를 "요한의 아들 시몬"이라고 부르셨습니다.'
      - when: { restore_label: unworthy, faith_tone: balanced }
        static_text_ko: '그 아침에 자격을 묻는 말은 없었습니다. 세 번째 물음까지도, 묻는 분이 그를 부르는 이름은 계속 "요한의 아들 시몬"이었습니다.'
      - when: { restore_label: unworthy, faith_tone: soft }
        static_text_ko: "자격을 확인하는 절차는 없었습니다. 세 번 다 같은 이름으로 불렸을 뿐입니다."
      - when: { restore_label: afraid_again, faith_tone: strong }
        static_text_ko: '또 그럴까 하는 두려움은 쉽게 사라지지 않습니다. 그 밤이 오기 전에 주님은 이미 "네 믿음이 떨어지지 않기를 기도하였노니"라고 말씀하셨습니다.'
      - when: { restore_label: afraid_again, faith_tone: balanced }
        static_text_ko: "또 그럴까 하는 두려움이 남아 있습니다. 그 두려움이 생기기 전에, 너를 위하여 기도했다고 말한 분이 먼저 있었습니다."
      - when: { restore_label: afraid_again, faith_tone: soft }
        static_text_ko: "또 그럴까 하는 두려움이 남아 있습니다. 그런데 그 밤보다 먼저 있었던 말이 하나 있었고, 그것은 무너지지 않기를 바라는 기도였습니다."
      - when: { restore_label: null, faith_tone: strong }
        static_text_ko: '무엇이라고 이름 붙이지 않아도 괜찮습니다. 그 아침 바닷가에서 주님이 부르신 것은 어떤 상태가 아니라 "요한의 아들 시몬"이라는 한 사람이었습니다.'
      - when: { restore_label: null, faith_tone: balanced }
        static_text_ko: "무엇이라고 이름 붙이지 않아도 괜찮습니다. 그 아침에 이름을 부른 분이 부른 것은 어떤 상태가 아니라 한 사람의 이름이었습니다."
      - when: { restore_label: null, faith_tone: soft }
        static_text_ko: "무엇이라고 이름 붙이지 않아도 괜찮습니다. 그 아침 바닷가에서 불린 것은 어떤 상태가 아니라 한 사람의 이름이었습니다."

safety_gates:
  - id: R1_voice_self_harm_listener
    enforced_at: always
    action: pause_fade_black_show_crisis_card
    crisis_resource_ref: crisis_resources.default
  - id: R2_R3_forbidden_tokens_lint
    enforced_at: always
    # ⚠️ 어간·부사형에서 끊지 않는다 — 한국어 부정('-지 않/못'·'-가 아니')은 어간 *뒤* 에 붙으므로
    # 어간형 토큰은 그 축의 부정형 위로를 통째로 삼킨다(92d5fe2 와 같은 규칙). 초안의 27종은
    # 이 미션이 하려는 말 자체를 막고 있었다 — "다시는 부인하지 않겠다고 다짐하지 않으셔도
    # 됩니다"(MVP §10), "아직 스스로를 용서하지 못해도 괜찮습니다", "자격을 갖추고 오라는 말은
    # 없었습니다", "그 물음은 더 사랑하라는 요구가 아니었습니다" 등 실측 21건.
    # 짧은 조각('놓아주'·'연단'·'겸손하게'·'있어야 더'…)은 전역 목록에서 무관한 문장까지 잡았다
    # (실측: joseph scene3 "자루를 줄에 놓아주세요"). 축을 지키는 더 긴 표층형으로 교체했다.
    # 변경 사유 전문·유지 결정(낮추시려/다듬으시려/빚으시려)·커버리지 대가는
    # content/peter/scene1.yml 의 같은 게이트 주석에 있다 — 5개 Scene 의 목록은 동일하다.
    lint_forbidden_tokens:
      # (a) R2 — 실패·수치에 신적 의도(훈육·연단·성장)를 부여하는 인과형
      - "겸손하게 하시려"
      - "겸손하게 만드시려"
      - "겸손하게 만들려고"
      - "겸손하게 받아들이세"
      - "겸손하게 받아들이십"
      - "겸손하게 받아들여야 합"
      - "겸손해지세"
      - "겸손해지십"
      - "겸손해지셔야"
      - "겸손해져야 합"
      - "연단하시"
      - "연단하십"
      - "낮추시려"
      - "다듬으시려"
      - "빚으시려"
      - "보셨기 때문에"
      - "있어야 더 깊어"
      - "있어야 더 단단"
      - "있어야 더 강해"
      - "있어야 더 성숙"
      - "있어야 더 성장"
      - "더 키우시려"
      - "더 키우세"
      - "더 키우십"
      - "더 키우셔야"
      - "더 키워야 합"
      - "더 키워야죠"
      - "실패했으니"
      - "실패했으므로"
      - "실패했기 때문에"
      # (b) R3 — 재발 방지 다짐 요구(이 미션의 최우선 금지 축, MVP §10)
      - "다시는 부인하지 않겠습니다"
      - "다시는 넘어지지 않겠습니다"
      - "부인하지 않겠다고 다짐하세"
      - "부인하지 않겠다고 다짐하십"
      - "부인하지 않겠다고 다짐해야"
      - "부인하지 않겠다고 약속하세"
      - "넘어지지 않겠다고 다짐하세"
      - "넘어지지 않겠다고 다짐하십"
      - "넘어지지 않겠다고 다짐해야"
      - "넘어지지 않겠다고 약속하세"
      - "부인하지 마세"
      - "부인하지 마십"
      - "부인하지 마요"
