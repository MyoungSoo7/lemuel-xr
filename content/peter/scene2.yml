duration_seconds_target: 90
note: "사용자가 베드로 — 1인칭. C1·C2 는 선택(카드를 눌러 진행), C3 는 선택지 없이 자동 재생 — 세 카드 모두 정당하며 틀린 답이 없다(R3_all_denials_are_the_text)."

