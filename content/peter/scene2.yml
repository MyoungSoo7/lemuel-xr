# Scene 2 — 세 번의 부인 (90초, 눅 22:54-60 / 요 18:18) · R1 고감도 Scene · R4 동의 트리거
# ⚠️ consent_card_id / consent_trigger_ko / consent_covers_scenes / skip_alternative_scene_id /
#    skip_summary_subtitle / consent_cards[] / skip_summary 는 seed §4 R4 확정 전문을
#    그대로 옮긴 것이다 — designer 가 재작성하지 않는다(§8 검토 대상 ⑥⑧, 인간 사인오프 전).
# ⚠️ denial_card_id(deny_knowing/deny_belonging/deny_understanding) 는 decisions 에
#    절대 기록하지 않고 restore_label 과 상관시키지 않는다(seed §5, §3-1).
# ⚠️ 카드 텍스트는 본문의 세 부인에 1:1 고정(선택형 발명 아님) — seed §3-1 확정 전문.
# ⚠️ 초안 — 인간 안전검토자 사인오프 전 프로덕션 반영 금지.

scene_id: peter_scene2
