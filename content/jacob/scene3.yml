# Scene 3 — 이십 년 (60초, 창 32:9-11 — 3지 분기: return_label)
# ⚠️ 초안 — seed-JACOB 기반 ≤70% draft. 인간 안전검토자 사인오프 필수.
# ⚠️ 라반 밑에서의 20년은 서술하지 않는다 — 압축 자막 한 줄로만 시간 경과를 알린다(seed §4-1). 인과응보 서사 금지.
# ⚠️ 동의: Scene 1 의 cc_jacob_family_deception 카드가 이 Scene 도 커버한다(별도 카드 없음).
# ⚠️ 3개 값(send_ahead / go_afraid / stay_and_pray) 모두 동등하게 정당하다(R3) — 이후 UI·문구에서 서열화 금지.

scene_id: jacob_scene3
scene_name: two_decades
mission_id: jacob
version: 1.0.0
duration_seconds_target: 60

environment:
  space_id: jabbok_riverside_night
  background_model: env_river_ford_night
  lighting:
    type: moonlit_low
    color_temperature_kelvin: 5600
  ambient_sound:
    - id: river_flow_low
      gain_db: -18
      spatial: true
    - id: night_insects_faint
      gain_db: -32
      spatial: true
  user_position: [0.0, 1.65, 0.0]
  user_facing: [0.0, 0.0, 1.0]
  camera_locomotion: disabled

npcs:
  - id: jacob_self
    voice_id: jacob_v1
    position: [0.0, 1.65, 0.0]
    note: "사용자가 야곱. 이 Scene 은 홀로 드리는 기도 — 다른 인물 없음(라반·처자·사환 서사 없음)."

narration_blocks:
  - id: nb_s3_time_compressed
    speaker: narrator
    text_ko: "이십 년이 지났다. 야곱은 이제 돌아가는 길 위에 있다."
    audio_clip_id: aud_s3_time_compressed_ko
    start_at_seconds: 0.0
    duration_seconds: 5.0
    hidden_until_event: null
    note: "seed §4-1 — 라반 20년 서사(재산·품삯 분쟁 등)를 서술하지 않는다. 인과관계·교훈화 언급 절대 금지."
  - id: nb_s3_prayer_open
    speaker: jacob_inner
    text_ko: "내 조부 아브라함의 하나님, 내 아버지 이삭의 하나님 여호와여 주께서 전에 내게 명하시기를 네 고향, 네 족속에게로 돌아가라 내가 네게 은혜를 베풀리라 하셨나이다 (창 32:9)"
    audio_clip_id: aud_s3_prayer_open_ko
    start_at_seconds: 6.0
    duration_seconds: 12.0
    hidden_until_event: null
  - id: nb_s3_unworthy
    speaker: jacob_inner
    text_ko: "나는 주께서 주의 종에게 베푸신 모든 은총과 모든 진실하심을 조금도 감당할 수 없사오나 내가 내 지팡이만 가지고 이 요단을 건넜더니 지금은 두 떼나 이루었나이다 (창 32:10)"
    audio_clip_id: aud_s3_unworthy_ko
    start_at_seconds: 19.0
    duration_seconds: 13.0
    hidden_until_event: null
  - id: nb_s3_deliver_fear
    speaker: jacob_inner
    text_ko: "내가 주께 간구하오니 내 형의 손에서, 에서의 손에서 나를 건져내시옵소서 내가 그를 두려워함은 그가 와서 나와 내 처자들을 칠까 겁이 나기 때문이니이다 (창 32:11)"
    audio_clip_id: aud_s3_deliver_fear_ko
    start_at_seconds: 33.0
    duration_seconds: 14.0
    hidden_until_event: null
    note: "두려움을 숨기지 않는 기도 — 이 감정을 '믿음 없음'으로 재단하는 연출·자막 금지."

interactions:
  - id: ix_s3_return_choice
    type: select_one_of_n
    prompt_verse: "32:9-11"
    prompt_ko: "돌아가는 길, 당신은 지금 무엇을 하겠습니까."
    options:
      - {
          id: send_ahead,
          label_ko: "먼저 무언가를 보낸다",
          verse_ref: "창세기 33:8",
        }
      - {
          id: go_afraid,
          label_ko: "두려운 채로 간다",
          verse_ref: "창세기 32:11",
        }
      - {
          id: stay_and_pray,
          label_ko: "가지 않고 머문다",
          verse_ref: "창세기 32:9-10",
        }
    timeout_seconds: 30
    on_timeout: proceed_without_label # return_label = null 로 진행 — 미선택도 유효한 결말(§5-1 null 라우트)
    parity_note: "세 옵션 모두 UI 상 동일 크기·동일 순서 가중치. 시각적 우열(색상·아이콘 크기) 부여 금지."

branches:
  - id: br_s3_return_label
    triggered_by_event: [return_card_selected, ix_s3_return_choice_timeout]
    decision_key: return_label
    backend_endpoint: "POST /api/game/jacob/scene/3/decide"
    default_path: static_curation # R5 — 정적 큐레이션이 기본 경로(routes 4개 card_text_ko 전부 사전 저작)
    llm_optin_only: true # R5 — LLM 은 명시적 opt-in 시에만. scene5.yml br_s5_closing_message 와 동일 선언
    body_template:
      return_label: "{{send_ahead|go_afraid|stay_and_pray|null}}"
    routes:
      - when: { return_label: send_ahead }
        card_text_ko: "먼저 무언가를 보낸다"
        carry_to_scene5: { return_label: send_ahead }
      - when: { return_label: go_afraid }
        card_text_ko: "두려운 채로 간다"
        carry_to_scene5: { return_label: go_afraid }
      - when: { return_label: stay_and_pray }
        card_text_ko: "가지 않고 머문다"
        carry_to_scene5: { return_label: stay_and_pray }
        note: "stay_and_pray 는 '유예'가 아니라 그 자체로 종결된 상태다(seed §5-2-a) — 회피·미성숙으로 읽히는 문구·톤 금지."
      - when: { return_label: null }
        card_text_ko: "(선택 없이 시간 경과)"
        carry_to_scene5: { return_label: null }
    safety_note: "세 값 모두 정당(R3). 서열화·정답화 금지 — lint_forbidden_tokens 축과 별개로 UI 레벨에서도 재확인."

safety_gates:
  - id: R3_no_ranking_of_return_choices
    enforced_at: ix_s3_return_choice
    description: "send_ahead / go_afraid / stay_and_pray 3개 값에 우열 표시(색상·순위·추천 배지 등) 금지."
    # 이 축은 *분기 구조* 요건이라 토큰으로 표현할 수 없다. '추천'·'정답' 같은 금칙어를 채워
    # 넣으면 집행되는 것은 등급 없음이 아니라 어휘 몇 개뿐인 카고컬트가 된다(엘리야 S4
    # R3_all_laments_valid 와 같은 판단). 아래 서술은 이 파일·scene5.yml 의 실제 구조를 직접
    # 대조해 적었다 — 서열은 UI 뿐 아니라 *결말 분량* 으로도 생기므로 Scene 5 절도 포함한다.
    enforcement: structural
    structural_check:
      "ix_s3_return_choice.options 가 정확히 3개(send_ahead·go_afraid·stay_and_pray)이고 각
      항목이 동일한 키 집합(id·label_ko·verse_ref)만 가질 것 — 한 옵션에만 붙는 badge·
      recommended·default·highlight 류 키가 0건이어야 서열이 생기지 않는다. on_timeout=
      proceed_without_label 로 미선택(return_label=null)도 유효 종결일 것. br_s3_return_label 의
      routes 가 4개(3값 + null)이고 넷 다 card_text_ko 와 carry_to_scene5.return_label 을 가져
      후속 경로 형태가 동일할 것(note 는 저작 메타라 제외). 인터랙션·분기 서브트리에
      score/scoring/correct/rank/ranking/best_choice/정답 류 키가 0건일 것. 마지막으로
      content/jacob/scene5.yml 의 br_s5_closing_message 에서 세 라벨이 각각 soft·balanced·strong
      3문씩(합 9문)을 가져 어느 선택도 결말 분량·해상도에서 우대되지 않을 것 — 현재 3/3/3 + null 1문."
  - id: R1_voice_self_harm_listener
    enforced_at: always
    action: pause_fade_black_show_crisis_card
    crisis_resource_ref: crisis_resources.default
    on_detect:
      scene_progress: halted
      audio: fade_out_all
      interactions: disabled
      card_text_ko: "지금 들린 말이 마음에 걸립니다. 여기서 잠시 멈추겠습니다. 혼자 감당하지 않아도 됩니다 — {{crisis_resources.default}}"
      resume: user_initiated_only
      exit_always_available: true
      storage: hash_only
      no_transcript_echo: true
      clinical_judgment: false
  - id: R4_not_my_seat_offramp_ref
    enforced_at: always
    description: "cc_jacob_not_my_seat 이탈로 — scene1.yml 전문 정의 참조."
    offramp_ref: cc_jacob_not_my_seat
  - id: R2_R3_lint_forbidden
    enforced_at: always
    description: "R2·R3 금지 토큰 29종 — Scene 1 과 동일 세트(seed §7 정본)."
    # 목록·감사 근거는 scene1.yml 의 같은 게이트 주석이 정본이다(5개 Scene 문자 그대로 동일).
    lint_forbidden_tokens:
      [
        "용서해야",
        "먼저 연락해",
        "먼저 손을 내미",
        "먼저 손을 내밀",
        "관계는 회복되어야 합",
        "관계는 회복되어야죠",
        "관계는 회복되어야 하지",
        "관계도 회복될",
        "너를 다듬으시",
        "너를 다듬으신",
        "너를 다듬으려",
        "너를 다듬는",
        "당신을 다듬으시",
        "당신을 다듬으신",
        "당신을 다듬으려",
        "당신을 다듬는",
        "속인 대가",
        "그래서 겸손해지셨",
        "그래서 겸손해지신",
        "그래서 겸손해진",
        "그래서 겸손해집",
        "흉터도 축복",
        "훈장",
        "언젠가는 가야 합",
        "언젠가는 가야죠",
        "언젠가는 가셔야",
        "언젠가는 가게 될",
        "아직은 때가 아닐",
        "지나고 보면",
      ]
  - id: footer_persistent
    enforced_at: always
    text_ko: "AI 보조 — 본문은 성경 참조 — storyteller 역할 | 위기 시 {{crisis_resources.default}}"

next_scene_id: jacob_scene4
transition:
  type: fade_to_black
  fade_out_seconds: 1.0
  fade_in_seconds: 1.5

theology_footer_refs:
  - citation_id: J1_candidate
    source: "docs/THEOLOGY-REFERENCES.md:34 [J2] 창세기 속임수 내러티브 어떻게 이해할 것인가 — 야곱 이야기 중심"
    note: "32:10 '조금도 감당할 수 없사오나'는 자기비하가 아니라 은혜 앞의 정직한 인정으로 처리한다."
    anchor_block: nb_s3_unworthy
  - disputed_points:
      - "stay_and_pray 를 '회피'로 읽을 위험 — 유보 아님, 확정 처리: 종결 상태(seed §5-2-a)."
    handling: "closing_key routing(Scene 5)에서 stay_and_pray 전용 3문(soft/balanced/strong) 모두 '머무름=미완'을 암시하는 표현을 배제한다."
