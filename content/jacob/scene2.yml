# Scene 2 — 부르짖음 (60초, 창 27:34 · 27:36 · 27:41 — 선택 없음)
# ⚠️ 초안 — seed-JACOB 기반 ≤70% draft. 인간 안전검토자 사인오프 필수.
# ⚠️ branches: [] — "남의 고통은 선택지가 아니다"(seed §4). 사용자는 여기서도 관찰자로 남는다.
# ⚠️ 동의: Scene 1 의 cc_jacob_family_deception 카드가 이 Scene 도 커버한다(별도 카드 없음).
# ⚠️ 27:41(살해 의도)은 인용 자막으로만 노출한다 — 위협 연출(추격·무기·긴박 음향) 절대 금지.

scene_id: jacob_scene2
scene_name: outcry
mission_id: jacob
version: 1.0.0
duration_seconds_target: 60

environment:
  space_id: isaac_tent_interior_dim
  background_model: env_tent_interior_aged
  lighting:
    type: dim_interior_failing_eyes
    color_temperature_kelvin: 2400
  ambient_sound:
    - id: tent_cloth_rustle
      gain_db: -24
      spatial: true
  user_position: [0.0, 1.65, 0.0]
  user_facing: [0.0, 0.0, 1.0]
  camera_locomotion: disabled
  entry_mode_variant: caption_only_no_audio # alt_routes[1_alt].carries_to_scene2 가 true 일 때만 적용 — 처벌적 의미 없음(§3-2 보상 비대칭 주의)

npcs:
  - id: esau_npc
    voice_id: esau_v1
    position: [0.5, 1.7, 1.0]
    initial_animation: distress_kneeling
    note: "절규 톤 — 악역 연기 금지. §8: 27:34 절규와 33:4 포옹이 같은 인물의 목소리임을 유지한다."
  - id: isaac_npc
    voice_id: isaac_v1
    position: [0.0, 1.45, 1.0]
    initial_animation: aged_seated_still
    note: "27:34~36 사이 대사 없음, 침묵으로만 존재."

narration_blocks:
  - id: nb_s2_esau_cry
    speaker: esau_npc
    text_ko: "내 아버지여 내게 축복하소서 내게도 그리하소서 (창세기 27:34)"
    audio_clip_id: aud_s2_esau_cry_ko
    audio_clip_id_caption_only_variant: null # entry_mode_variant=caption_only_no_audio 일 때 재생하지 않음
    start_at_seconds: 3.0
    duration_seconds: 10.0
    hidden_until_event: null
  - id: nb_s2_esau_second_theft
    speaker: esau_npc
    text_ko: "그의 이름을 야곱이라 함이 합당하지 아니하니이까 그가 나를 속임이 이것이 두 번째니이다 전에는 나의 장자의 명분을 빼앗고 이제는 내 복을 빼앗았나이다 (창세기 27:36)"
    audio_clip_id: aud_s2_esau_second_theft_ko
    start_at_seconds: 17.0
    duration_seconds: 14.0
    hidden_until_event: null
  - id: nb_s2_esau_hatred_intent
    speaker: scripture_caption # 위협 연출 배제 — 음성·연기 없이 자막 전용
    text_ko: "그의 아버지가 야곱에게 축복한 그 축복으로 말미암아 에서가 야곱을 미워하여 심중에 이르기를 아버지를 곡할 때가 가까웠은즉 내가 내 아우 야곱을 죽이리라 하였더니 (창세기 27:41)"
    audio_clip_id: null
    start_at_seconds: 38.0
    duration_seconds: 10.0
    hidden_until_event: null
    presentation: caption_only_static_text
    note: "이 블록은 위협 연출(음향 고조·VFX·추격 애니메이션) 없이 정적 자막으로만 노출된다."

interactions: []
# ⚠️ 의도적으로 비어 있음 — "남의 고통은 선택지가 아니다"(seed §4). 사용자는 관찰만 한다.

branches: []

safety_gates:
  - id: dwell_limit_on_esau_cry
    enforced_at: nb_s2_esau_cry
    description: "27:34 절규 노출 직후 최대 3초 정적 → nb_s2_esau_second_theft 로 자동 전환. 절규 상태에 고착시키지 않는다."
    max_dwell_seconds: 3
  - id: R1_no_threat_dramatization_2741
    enforced_at: nb_s2_esau_hatred_intent
    description: "27:41(살해 의도)은 인용 자막으로만 노출 — 위협 연출(추격·무기·긴박 음향 등) 완전 배제."
  - id: R1_crisis_reminder
    enforced_at: on_scene_enter
    crisis_reminder_text_ko: "지금 이 장면이 버겁다면 멈추어도 됩니다. 도움을 받을 수 있는 곳이 있습니다 — {{crisis_resources.default}}"
    crisis_resource_ref: crisis_resources.default
    note: "seed §4-3 리터럴 그대로. CRISIS_REMINDER_SCENES = (2, 5) 중 하나."
  - id: R1_voice_self_harm_listener
    enforced_at: always
    action: pause_fade_black_show_crisis_card
    crisis_resource_ref: crisis_resources.default
    on_detect:
      scene_progress: halted
      audio: fade_out_all
      interactions: disabled
      card_text_ko: "지금 들린 말이 마음에 걸립니다. 여기서 잠시 멈추겠습니다. 혼자 감당하지 않아도 됩니다 — {{crisis_resources.default}}"
      resume: user_initiated_only
      exit_always_available: true
      storage: hash_only
      no_transcript_echo: true
      clinical_judgment: false
  - id: R4_not_my_seat_offramp_ref
    enforced_at: always
    description: "cc_jacob_not_my_seat 이탈로는 scene1.yml 에 전문 정의 — Scene 2 에서도 상시 이용 가능(available_at 참조)."
    offramp_ref: cc_jacob_not_my_seat
  - id: R2_R3_lint_forbidden
    enforced_at: always
    description: "R2·R3 금지 토큰 25종 — Scene 1 과 동일 세트(seed §7 정본)."
    # 목록·감사 근거는 scene1.yml 의 같은 게이트 주석이 정본이다(5개 Scene 문자 그대로 동일).
    lint_forbidden_tokens:
      [
        "용서해야",
        "먼저 연락해",
        "관계는 회복되어야 합",
        "관계는 회복되어야죠",
        "관계는 회복되어야 하지",
        "관계도 회복될",
        "너를 다듬으시",
        "너를 다듬으신",
        "너를 다듬으려",
        "너를 다듬는",
        "당신을 다듬으시",
        "당신을 다듬으신",
        "당신을 다듬으려",
        "당신을 다듬는",
        "속인 대가",
        "그래서 겸손해지셨",
        "그래서 겸손해지신",
        "그래서 겸손해진",
        "그래서 겸손해집",
        "흉터도 축복",
        "언젠가는 가야 합",
        "언젠가는 가야죠",
        "언젠가는 가셔야",
        "언젠가는 가게 될",
        "아직은 때가 아닐",
      ]
  - id: footer_persistent
    enforced_at: always
    text_ko: "AI 보조 — 본문은 성경 참조 — storyteller 역할 | 위기 시 {{crisis_resources.default}}"

next_scene_id: jacob_scene3
transition:
  type: fade_to_black
  fade_out_seconds: 1.0
  fade_in_seconds: 1.5

theology_footer_refs:
  - citation_id: J1_candidate
    source: "docs/THEOLOGY-REFERENCES.md:34 [J2] 창세기 속임수 내러티브 어떻게 이해할 것인가 — 야곱 이야기 중심"
    note: "에서의 절규(27:34)와 살해 의도(27:41)는 야곱이 만든 상처의 실재 규모를 축소하지 않고 그대로 둔다 — 3인칭 관찰, 사용자 개입 없음."
    anchor_block: nb_s2_esau_cry
  - disputed_points:
      - "에서를 단순 '피해자 서사'로만 읽을 것인가 — 유보(seed §9 관련 쟁점, 향후 야곱 서사 후속 절과의 연속성 참고 필요)."
    handling: "이 Scene 은 에서의 고통을 축소·해명하지 않되, 야곱 미션의 축(가해자 회복)을 벗어나 에서의 서사를 임의로 확장하지도 않는다."
