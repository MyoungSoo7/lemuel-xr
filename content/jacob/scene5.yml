# Scene 5 — 받으니라 (90초, 창 33:1 · 33:3-4 · 33:8-11 — 핵심 인터랙션: 예물 내밀기)
# ⚠️ 초안 — seed-JACOB 기반 ≤70% draft. 인간 안전검토자 사인오프 필수.
# ⚠️ 이 Scene 은 두 진입 경로를 갖는다: entry_mode=full(Scene 4 완주) / entry_mode=closing_only(5_alt, cc_jacob_confrontation 스킵).
#    entry_mode 는 선택에 대한 보상/처벌이 아니다 — 어느 경로든 closing_route_ref: scene5_closing 로 동일하게 수렴한다(§3-2 보상 비대칭 금지).
# ⚠️ ix_jacob_gift 는 seed §6-1 리터럴 스펙을 그대로 옮긴 것이다 — routes/parity_assert 구조를 임의로 바꾸지 않는다.
# ⚠️ br_s5_closing_message 의 static_text_ko 10문(9 curation + 1 null fallback)은 seed §5-2 전문 그대로다 — 자구 변경 금지.
#    각 문장은 반드시 "이것은 야곱에게 있었던 일이며, 당신의 실제 관계에 적용하지 않아도 된다."로 끝난다(해제 문장, 10문 전부 동일 자구).

scene_id: jacob_scene5
scene_name: receiving
mission_id: jacob
version: 1.0.0
duration_seconds_target: 90

environment:
  space_id: jabbok_plain_dawn
  background_model: env_open_plain_dawn
  lighting:
    type: dawn_warm_rising
    color_temperature_kelvin: 4200
  ambient_sound:
    - id: plain_wind_low
      gain_db: -22
      spatial: true
    - id: distant_flock_herd
      gain_db: -26
      spatial: true
  user_position: [0.0, 1.65, 0.0]
  user_facing: [0.0, 0.0, 1.0]
  camera_locomotion: disabled
  entry_mode_note: "entry_mode=closing_only(5_alt) 인 경우 environment/npcs 는 렌더되지 않는다 — alt_routes[5_alt] 참조."

npcs:
  - id: jacob_self
    voice_id: jacob_v1
    position: [0.0, 1.65, 0.0]
    note: "사용자가 야곱. limp_persistent(Scene 4 carry_flag) 가 true 면 이동 애니메이션에 절뚝임 반영."
  - id: esau_npc
    voice_id: esau_v1
    position: [1.5, 1.7, 3.0]
    initial_animation: approach_open_arms
    note: "27:34 절규와 같은 목소리(§8) — 악역도 무조건적 화해자도 아닌, 본문 그대로의 반응."
  - id: esau_company_background
    count: 400
    presentation: silhouette_distant_ambiguous
    note: "disputed #8 — 400명을 무기·전열·위협 음향으로도, 환영 행렬로도 연출하지 않는다. 확정 연출 없음. 야곱의 두려움은 nb_s5_v33_1 1인칭 내면 음성으로만 표현한다."

narration_blocks:
  - id: nb_s5_v33_1
    speaker: jacob_inner
    text_ko: "야곱이 눈을 들어 보니 에서가 사백 명의 장정을 거느리고 오고 있는지라 그의 자식들을 나누어 레아와 라헬과 두 여종에게 맡기고 (창세기 33:1)"
    audio_clip_id: aud_s5_v33_1_ko
    start_at_seconds: 0.0
    duration_seconds: 12.0
    hidden_until_event: null
  - id: nb_s5_v33_3
    speaker: narrator
    text_ko: "자기는 그들 앞에서 나아가되 몸을 일곱 번 땅에 굽히며 그의 형 에서에게 가까이 가니 (창세기 33:3)"
    audio_clip_id: aud_s5_v33_3_ko
    start_at_seconds: 13.0
    duration_seconds: 10.0
    hidden_until_event: null
  - id: nb_s5_v33_4
    speaker: narrator
    text_ko: "에서가 달려와서 그를 맞이하여 안고 목을 어긋맞추어 그와 입맞추고 서로 우니라 (창세기 33:4)"
    audio_clip_id: aud_s5_v33_4_ko
    start_at_seconds: 24.0
    duration_seconds: 10.0
    hidden_until_event: null
    note: "재회 자체는 사용자 선택 이전에 이미 본문 그대로 일어난다 — 사용자가 재회 여부를 결정하지 않는다(재회 이후의 예물 응대만 결정)."
  - id: nb_s5_v33_8_q
    speaker: esau_npc
    text_ko: "내가 만난 바 이 모든 떼는 무슨 까닭이냐 (창세기 33:8)"
    audio_clip_id: aud_s5_v33_8_q_ko
    start_at_seconds: 35.0
    duration_seconds: 5.0
    hidden_until_event: null
  - id: nb_s5_v33_8_a
    speaker: jacob_inner
    text_ko: "내 주께 은혜를 입으려 함이니이다 (창세기 33:8)"
    audio_clip_id: aud_s5_v33_8_a_ko
    start_at_seconds: 41.0
    duration_seconds: 5.0
    hidden_until_event: null
  - id: nb_s5_v33_9
    speaker: esau_npc
    text_ko: "내 동생아 내게 있는 것이 족하니 네 소유는 네게 두라 (창세기 33:9)"
    audio_clip_id: aud_s5_v33_9_ko
    start_at_seconds: 47.0
    duration_seconds: 7.0
    hidden_until_event: null
    note: "ix_jacob_gift.decision_point_verse — 이 절 직후 사용자 결정 지점(내민다/거둔다)."
  - id: nb_s5_v33_10
    speaker: jacob_inner
    text_ko: "그렇지 아니하니이다 내가 형님의 눈앞에서 은혜를 입었사오면 청하건대 내 손에서 이 예물을 받으소서 내가 형님의 얼굴을 뵈온즉 하나님의 얼굴을 본 것 같사오며 형님도 나를 기뻐하심이니이다 (창세기 33:10)"
    audio_clip_id: aud_s5_v33_10_ko
    start_at_seconds: null # rt_offer_again 선택 시에만 재생 — ix_jacob_gift.routes[rt_offer_again].plays_verses 참조
    duration_seconds: 14.0
    hidden_until_event: rt_offer_again_selected
    note: "disputed #3 — '형님의 얼굴을 뵈온즉 하나님의 얼굴을 본 것 같사오며'는 신현(神現) 표현인지 관용적 존중 표현인지 신학검토자 승인 대기. 이 미션은 이 절을 보조 자막으로만 노출하고, br_s5_closing_message 의 마무리 10문에는 이 표현을 사용하지 않는다(확정된 해석처럼 쓰지 않는다)."
  - id: nb_s5_v33_11
    speaker: narrator
    text_ko: "하나님이 내게 은혜를 베푸셨고 내 소유도 족하오니 청하건대 내가 형님께 드리는 예물을 받으소서 하고 그에게 강권하매 받으니라 (창세기 33:11)"
    audio_clip_id: aud_s5_v33_11_ko
    start_at_seconds: null
    duration_seconds: 10.0
    hidden_until_event: rt_offer_again_selected

interactions:
  - id: ix_jacob_gift
    kind: reach_and_offer
    prologue_verses: ["33:1", "33:3", "33:4", "33:8", "33:9"]
    decision_point_verse: "33:10"
    records_decision: false
    decision_key: null
    routes:
      - id: rt_offer_again
        label_ko: "다시 내민다"
        plays_verses: ["33:10", "33:11"]
        entry_mode_after: full
        closing_route_ref: scene5_closing
      - id: rt_withdraw
        label_ko: "거두어들인다"
        plays_verses: ["33:9"]
        entry_mode_after: full
        closing_route_ref: scene5_closing
    parity_assert:
      entry_mode_after_all: full
      closing_route_ref_identical: true
      environment_disabled_on_any_route: false
      npc_disabled_on_any_route: false
    purpose_ko: "이 인터랙션이 재현하는 것은 창 33:9 → 33:10 → 33:11 의 본문 순서뿐이다."

branches:
  - id: br_s5_closing_message
    triggered_by_event: [scene_enter]
    decision_key: closing_key
    backend_endpoint: "POST /api/game/jacob/complete"
    default_path: static_curation
    llm_optin_only: true
    body_template:
      return_label: "{{from_scene3_or_null}}"
      faith_tone: "{{users.faith_tone}}"
      entry_mode: "{{full|closing_only}}"
    routes:
      - when: { return_label: send_ahead }
        static_text_ko:
          soft: "먼저 무언가를 보내는 것도 하나의 걸음이었다. 그것이 닿을지 아닐지는 보낸 사람도 알지 못했다. 야곱도 몰랐다. 이것은 야곱에게 있었던 일이며, 당신의 실제 관계에 적용하지 않아도 된다."
          balanced: '야곱은 떼를 먼저 보냈다. 그것으로 잃은 것을 되살 수는 없었지만, 그 손짓은 그가 할 수 있는 일이었다. "내 주께 은혜를 입으려 함이니이다" — 그가 한 말은 그것뿐이었다. (창 33:8) 이것은 야곱에게 있었던 일이며, 당신의 실제 관계에 적용하지 않아도 된다.'
          strong: '먼저 보낸 것이 무엇이든, 그것을 내밀던 손 위에 하나님의 은혜가 있었다. 야곱이 "하나님이 내게 은혜를 베푸셨고" 라고 말한 자리가 거기였다. (창 33:11) 이것은 야곱에게 있었던 일이며, 당신의 실제 관계에 적용하지 않아도 된다.'
      - when: { return_label: go_afraid }
        static_text_ko:
          soft: "두려운 채로 가는 것은 용기가 없는 것이 아니었다. 야곱은 겁이 난다고 말한 채로 갔다. 이것은 야곱에게 있었던 일이며, 당신의 실제 관계에 적용하지 않아도 된다."
          balanced: '"그가 와서 나와 내 처자들을 칠까 겁이 나기 때문이니이다"(창 32:11). 야곱은 두려움을 감추지 않고 그대로 아뢰었다. 두려움은 숨겨야 할 것이 아니었다. 이것은 야곱에게 있었던 일이며, 당신의 실제 관계에 적용하지 않아도 된다.'
          strong: "두려움을 말한 그 기도를 하나님은 물리치지 않으셨다. 겁이 난다고 말한 그 밤에도 하나님은 거기 계셨다. 이것은 야곱에게 있었던 일이며, 당신의 실제 관계에 적용하지 않아도 된다."
      - when: { return_label: stay_and_pray }
        static_text_ko:
          soft: "가지 않는 것도 하나의 자리다. 그 자리는 잠시 미뤄 둔 자리가 아니라, 끝까지 그대로 두어도 되는 자리다. 이것은 야곱에게 있었던 일이며, 당신의 실제 관계에 적용하지 않아도 된다."
          balanced: "야곱은 강을 건너기 전에 홀로 남아 밤을 지냈다(창 32:24). 야곱이 이튿날 건넌 것은 야곱에게 일어난 일이고, 건너지 않는 것 역시 그 자체로 온전한 이야기다. 머무름은 다음 장을 기다리는 여백이 아니다. 이것은 야곱에게 있었던 일이며, 당신의 실제 관계에 적용하지 않아도 된다."
          strong: '"나는 주께서 주의 종에게 베푸신 모든 은총과 모든 진실하심을 조금도 감당할 수 없사오나"(창 32:10) — 머문 자리에서 나온 그 말도 하나님 앞에 드려진 기도였다. 하나님 앞에 있기 위해 강을 건너야 하는 것은 아니었다. 이것은 야곱에게 있었던 일이며, 당신의 실제 관계에 적용하지 않아도 된다.'
      - when: { return_label: null }
        static_text_ko: "여기까지 온 것으로 이 시간은 완결이다. 야곱의 이야기는 형제가 마주 서는 것으로 이어지지만, 그 장면이 당신에게 요구되는 것은 아니다. 오늘 여기서 멈추어도 된다. 이것은 야곱에게 있었던 일이며, 당신의 실제 관계에 적용하지 않아도 된다."
        note: "Scene 3 스킵·라벨 미선택·R4 이탈 경로 폴백. faith_tone 무관 공통 1문."
    note: "faith_tone(strong/balanced/soft) × return_label(3) = 9 사전 큐레이션 + 폴백 1문 = 10문 전문(seed §5-2, 자구 변경 없이 그대로 이식). 해제 문장 '이것은 야곱에게 있었던 일이며, 당신의 실제 관계에 적용하지 않아도 된다' 10문 전부 자구 동일."

alt_routes:
  - id: 5_alt
    triggered_by: consent_card_skip # cc_jacob_confrontation 스킵 시
    entry_mode: closing_only
    presentation_mode: caption_only_no_enactment
    summary_text_ko: "하나님이 내게 은혜를 베푸셨고 내 소유도 족하오니 청하건대 내가 형님께 드리는 예물을 받으소서 하고 그에게 강권하매 받으니라 (창세기 33:11)"
    environment_disabled: true
    npc_disabled: true
    interactions_disabled: true
    closing_route_ref: scene5_closing
    note: "재회 연출 없이 33:11 인용 자막 + 정적 마무리(seed §3-1). br_s5_closing_message 는 entry_mode=closing_only 로도 동일하게 실행된다 — 보상/처벌 비대칭 없음."

safety_gates:
  - id: R4_pre_scene5_confrontation_consent
    enforced_at: before_scene_enter
    description: "재회 안전 고지 R4 동의 카드 — seed §4-2-a 리터럴, 변경 없이 그대로 반영. r3_reunion_safety_notice_ko 키는 고정."
    consent_card_id: cc_jacob_confrontation
    consent_card:
      id: cc_jacob_confrontation
      trigger_disclosure_ko: "다루는 소재 — 가해자로서의 대면 · 원치 않는 재회."
      r3_reunion_safety_notice_ko: "재회가 안전하지 않은 관계가 실재합니다. 학대나 폭력이 있었던 관계에서 다시 만나는 것은 회복이 아니라 위험일 수 있습니다. 이것은 야곱에게 있었던 일이며, 당신의 실제 관계에 적용하지 않아도 됩니다. 넘어가도 되고 여기서 마쳐도 됩니다."
      skip_alternative_scene_id: 5_alt
    crisis_resource_ref: crisis_resources.default
  # 🔻 2026-08-05 — `R1_crisis_reminder` → `crisis_reminder` **이름만** 바꿨다(사용자 지시).
  #    근거 전문은 scene2.yml 의 같은 항목 주석 참조. 문구는 그 파일과 문자 그대로
  #    동일하며(seed §4-3 리터럴), 이번 변경으로 바뀐 것은 키 이름 둘뿐이다.
  - id: crisis_reminder
    enforced_at: on_scene_enter
    text_ko: "지금 이 장면이 버겁다면 멈추어도 됩니다. 도움을 받을 수 있는 곳이 있습니다 — {{crisis_resources.default}}"
    crisis_resource_ref: crisis_resources.default
    note: "seed §4-3 리터럴 그대로. CRISIS_REMINDER_SCENES = (2, 5) 중 하나."
  - id: R3_no_reconciliation_pressure
    enforced_at: always
    description: "이 Scene 의 어떤 경로(rt_offer_again/rt_withdraw/5_alt)도 사용자의 실제 관계 화해를 전제·권유·요구하지 않는다. 화해 여부와 예물 인터랙션 선택은 완전히 분리되어 있으며 어느 쪽도 정답으로 표시되지 않는다."
    # 어휘 축(용서 강요·회복 당위·유예)은 같은 파일의 R2_R3_lint_forbidden 이 이미 토큰으로
    # 집행한다. 여기서 토큰을 복사해 붙이면 집행량은 0 인데 게이트만 두 개로 보이는 카고컬트가
    # 된다 — 이 게이트가 실제로 지키는 것은 *경로 대칭* 이다. 화해 압박은 문장보다 구조로 먼저
    # 생긴다: 한쪽 선택에만 서사를 더 주거나(보상), 스킵 경로의 결말을 깎으면(처벌) 사용자는
    # 어느 쪽이 정답인지 즉시 읽어 낸다. 아래 서술은 이 파일 구조를 직접 대조해 적었다.
    enforcement: structural
    structural_check:
      "ix_jacob_gift 가 records_decision=false · decision_key=null 로 예물 응대를 기록 대상에서
      제외하고(선택이 사용자 프로필에 남으면 그 자체가 평가가 된다), routes 2개(rt_offer_again·
      rt_withdraw)가 모두 entry_mode_after=full · closing_route_ref=scene5_closing 로 동일하게
      수렴할 것. alt_routes 의 5_alt(동의 카드 스킵 경로) 역시 closing_route_ref=scene5_closing 로
      같은 결말에 도달할 것 — 재회 연출을 건너뛴 사용자의 결말이 깎이면 그것이 곧 화해 압박이다.
      br_s5_closing_message 의 static_text_ko 10문(9 큐레이션 + null 폴백 1) 전부가 해제 문장
      '이것은 야곱에게 있었던 일이며, 당신의 실제 관계에 적용하지 않아도 된다.' 로 끝날 것(현재 10/10).
      R4_pre_scene5_confrontation_consent 가 skip_alternative_scene_id=5_alt 로 화면상 스킵 경로를
      보유하고 r3_reunion_safety_notice_ko(안전하지 않은 재회 고지)를 포함할 것. 인터랙션·분기
      서브트리에 score/scoring/correct/rank/ranking/best_choice/정답 류 키가 0건일 것."
  - id: R1_voice_self_harm_listener
    enforced_at: always
    action: pause_fade_black_show_crisis_card
    crisis_resource_ref: crisis_resources.default
    on_detect:
      scene_progress: halted
      audio: fade_out_all
