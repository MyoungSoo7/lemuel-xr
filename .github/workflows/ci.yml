name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # 문서·콘텐츠 판정기를 CI 에서 돌린다 (2026-08-11 신설).
  #
  # 이 잡이 여태 없었던 이유는 게을러서가 아니라 **초록인 게이트가 하나도 없어서**다.
  # 12개 인물 게이트 전부 rc=1 이다 — rc 규약상 BLOCKED 가 하나만 있어도 1 이기 때문
  # (`scripts/newchar_gates.py`). 그대로 붙이면 첫날부터 빨강이고 사흘 뒤엔 아무도 안 본다.
  # 그렇다고 `|| true` 로 덮으면 이 리포가 가장 싫어하는 것(아무것도 거절하지 않는 초록)이 된다.
  #
  # 그래서 `ci_gates.py` 는 **통과 여부가 아니라 기록된 기준선과의 일치**를 잰다.
  # 빨강이 빨강인 채로 유지 = 통과 / 빨강이 늘어남 = 실패 / 빨강이 줄어듦도 실패
  # (기준선 갱신을 강제해 "언제 무엇이 해소됐는지"를 기록으로 남기기 위해).
  #
  # 잡 이름을 `gates` 가 아니라 `gate-baseline` 으로 둔 것도 같은 이유다 —
  # 초록 체크마크가 "게이트 통과"로 읽히면 안 된다.
  gate-baseline:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # fetch-depth: 0 이 필수다. `ac_table_check.py` 의 `t-baseline` 축은 git log 를
      # 걸어가 직전 판(rev.N-1)을 선언한 커밋을 찾는다 — 얕은 클론이면 그 축이
      # 조용히 판정 불가가 되고, 판정 불가는 통과가 아니다.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # 스크립트 19개의 외부 의존은 PyYAML 하나뿐이다 (나머지는 표준 라이브러리).
      - run: pip install pyyaml
      - name: Gate baseline
        run: python3 scripts/ci_gates.py

      # 이 잡이 **덮지 않는 것** — 조용히 빠뜨린 게 아니라 재 보고 뺐다.
      #
      # `scripts/mutate_*.py` 4종(판정기를 결함으로 다시 재는 층)은 여기 없다.
      # `mutate_ac_table.py` 하나가 로컬에서 20분을 넘겨도 끝나지 않아 측정을 중단했다
      # (2026-08-11, M-series macOS). 중첩이 깊어서 그렇다 — 이 러너는 ac_table_check 를
      # 15회 이상 돌리고, 그 ac_table_check 는 자기 안에서 다시 mutate_review_log 를 돌린다.
      #
      # 그래서 지금 CI 는 **판정기의 결과만 지키고, 판정기가 여전히 무언가를 재고 있는지는
      # 지키지 못한다.** 아무것도 안 하는 스크립트도 기준선과는 일치한다 —
      # 이 잡의 초록으로 메울 수 없는 구멍이고, 남은 일이다(별도 스케줄 잡 또는 러너 최적화).

  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      tts: ${{ steps.filter.outputs.tts }}
      ai: ${{ steps.filter.outputs.ai }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              # 저작 콘텐츠도 backend 잡의 입력이다 — ContentSafetyGateEnforcementTest 가
              # content/{인물}/scene*.yml 의 안전 게이트를 검사한다. 이 줄이 없으면
              # 콘텐츠만 고친 PR 은 안전 게이트 검사를 한 번도 거치지 않고 머지된다.
              - 'content/**'
              # 골든셋도 backend 잡의 입력이다 — 픽스처는 jar 에 패키징되고,
              # 무결성 검사(GoldenSetIntegrityTest 등)가 이 파일들을 읽는다.
              # 이 줄이 없으면 픽스처만 고친 PR 은 검증도 재빌드도 없이 머지된다.
              - 'eval/grounding/**'
            tts:
              - 'tts/**'
            ai:
              - 'ai/**'
            frontend:
              - 'frontend/**'
              # 위기번호 게이트는 프론트 파일만 보는 게 아니다. 백엔드 대체값과
              # 대조하는 축이 있어서, application.yml 의 default-contact 만 바꾼 PR 도
              # 이 잡을 돌려야 드리프트가 잡힌다. 판정기 자신이 바뀔 때도 마찬가지다.
              - 'backend/src/main/resources/application.yml'
              - 'scripts/check_frontend_hotline.py'
              # R4 동의 게이트 배선 판정기도 같은 이유로 시나리오 yml 을 입력으로 갖는다.
              # 어떤 씬에 trigger_warning 을 새로 붙인 PR 이 프론트를 안 건드리면
              # 이 잡이 안 돌고, 화면 없는 경고(= 안 뜨는 동의 카드)가 그대로 머지된다.
              - 'backend/src/main/resources/scenarios/**'
              - 'scripts/check_frontend_trigger_warning.py'

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4

      # 테스트를 실제로 돌린다. 이전에는 `bootJar -x test` 라 스텝 이름과 달리
      # 한 건도 실행되지 않았고, 통과하는 스위트가 아무 것도 게이트하지 못했다.
      # Testcontainers 는 ubuntu-latest 에 사전 설치된 Docker 를 쓴다.
      # ScriptureGroundingValidationTest 는 GEMINI_API_KEY 게이트로 자동 skip.
      - name: Test
        working-directory: backend
        run: gradle --no-daemon test

      # 커버리지를 로그에 남기고 하한을 강제한다. 하한은 build.gradle.kts 의
      # coverageMinimum 래칫 — 실측값에서 여유를 뺀 값이라 떨어지면 깨진다.
      - name: Coverage gate
        working-directory: backend
        run: gradle --no-daemon printCoverage jacocoTestCoverageVerification

      - name: Upload coverage report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: backend/build/reports/jacoco/test/html/
          retention-days: 7

      - name: Build
        working-directory: backend
        run: gradle --no-daemon bootJar -x test

      - name: Set up Docker Buildx
        if: github.ref == 'refs/heads/main' || github.event_name == 'pull_request'
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build + push backend image
        if: github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          # 컨텍스트가 리포 루트인 이유: 골든셋 원본 eval/grounding/ 이 backend/ 밖에 있다.
          # backend 로 두면 Dockerfile 이 그걸 COPY 할 수 없고, Gradle 은 없는 디렉터리를
          # 조용히 건너뛰어 골든셋 없는 jar 를 만든다(2026-08-05 사고).
          context: .
          file: backend/Dockerfile
          push: true
          tags: |
            ghcr.io/myoungsoo7/lemuel-xr-backend:main-${{ github.sha }}
            ghcr.io/myoungsoo7/lemuel-xr-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  tts:
    needs: changes
    if: needs.changes.outputs.tts == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build + push tts image
        if: github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: tts
          push: true
          tags: |
            ghcr.io/myoungsoo7/lemuel-xr-tts:main-${{ github.sha }}
            ghcr.io/myoungsoo7/lemuel-xr-tts:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  ai:
    needs: changes
    if: needs.changes.outputs.ai == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # 안전 필터 테스트를 이미지 빌드 *앞* 에 둔다. 깨진 안전 코드를 담은 이미지가
      # ghcr 로 올라가지 않게 하려면 순서가 이래야 한다.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test (ai)
        working-directory: ai
        run: |
          pip install -r requirements-dev.txt
          pytest -q

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build + push ai image
        if: github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: ai
          push: true
          tags: |
            ghcr.io/myoungsoo7/lemuel-xr-ai:main-${{ github.sha }}
            ghcr.io/myoungsoo7/lemuel-xr-ai:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install deps
        working-directory: frontend
        run: npm ci

      # 린트 (2026-08-12 복구).
      #
      # Next 16 이 `next lint` 를 없앴는데 스크립트는 그대로여서, 이 리포는 그동안
      # **린트가 한 번도 돌지 않았다.** 그냥 안 돈 게 아니라 깨진 줄 모르고 안 돌았다 —
      # `next lint` 는 사라진 뒤 `lint` 를 프로젝트 디렉터리 인자로 읽어서
      # "no such directory: frontend/lint" 라는 엉뚱한 말을 하고 죽었다.
      # 규칙 세트를 끼워주던 것도 그 명령이었으므로 설정 파일조차 없었다.
      #
      # 이제 `eslint.config.mjs` 에 규칙을 명시하고 eslint 를 직접 부른다.
      # `--max-warnings=0` 이다 — 지금 에러 0·경고 0 이라 조일 수 있고, 조여 두지
      # 않으면 경고가 쌓이면서 린트가 다시 조용히 무의미해진다.
      #
      # 알려진 예외 1건: `useTtsNarration.ts` 의 `a.src = url` 에
      # react-hooks/immutability 를 인라인으로 껐다. 이유는 그 파일 주석에 적었다.
      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Type check
        working-directory: frontend
        run: npm run type-check

      # 프론트 유닛 테스트 + 커버리지 하한 (2026-08-14 신설).
      #
      # 이 리포는 백엔드만 재고 있었다 — jacoco 가 LINE 98% 를 지키는 동안
      # 프론트엔드는 유닛 테스트가 **한 줄도 없었고 러너조차 없었다.** 초록한 CI 가
      # 사실은 절반만 보고 있었던 셈이다. e2e(Playwright)가 있긴 하지만 그건
      # 백엔드가 붙어야 돌고 행복 경로 위주라, 분기·에러 경로는 아무도 안 봤다.
      #
      # 하한은 `vitest.config.mts` 의 thresholds 에 있다 (lines/statements 90,
      # functions/branches 80). 백엔드 `build.gradle.kts` 의 coverageMinimum 과
      # 같은 사고방식 — 실측에서 여유를 뺀 값이고 내려가면 깨진다.
      #
      # 함정 하나를 명시해 둔다: v8 커버리지는 기본적으로 **테스트가 import 한
      # 파일만** 집계한다. 손대지 않은 파일은 0% 로 잡히는 게 아니라 분모에서
      # 통째로 빠져서, 테스트 없는 코드가 늘수록 숫자가 올라간다. 그래서 설정에
      # `all: true` 를 켜 뒀다. 그거 끄면 이 게이트는 거짓 초록이 된다.
      - name: Unit tests + coverage
        working-directory: frontend
        run: npm run test:coverage

      # 위기 상담번호 하드코딩 게이트 (2026-08-11 신설).
      #
      # 백엔드는 2026-08-02 부터 번호를 yml 에 안 적고 토큰만 쓴다
      # (`ScenarioHotlineRatchetTest` 가 강제). 프론트는 그 규율 바깥이라
      # 9개 파일이 번호를 각자 문자열로 들고 있었다. 한 군데를 놓치면 위기 상태의
      # 사용자가 죽은 번호를 받는데, 그때 화면은 멀쩡해 보인다.
      #
      # 이 잡의 다른 스텝과 달리 `gate-baseline` 이 아니라 **진짜 합격·불합격**이다 —
      # 정리를 끝냈으므로 실제로 초록이고, 빨강이면 그건 새 하드코딩이다.
      # setup-python 을 따로 붙이지 않는다: ubuntu-latest 러너에 python3 가 이미
      # 있고 이 스크립트의 외부 의존은 0 이다(표준 라이브러리만 쓴다).
      - name: Crisis hotline hardcoding gate
        run: python3 scripts/check_frontend_hotline.py

      # R4 동의 게이트 배선 게이트 (2026-08-12 신설).
      #
      # 시나리오 yml 의 `trigger_warning` 은 저작자·안전 검토자가 쓰는 자리다.
      # 여기 적으면 화면이 경고 카드를 띄우고 건너뛸 길을 연다 — 는 것이 규약인데,
      # 전수 조사에서 그 규약이 세 갈래로 깨져 있었다: jesus 는 payload 를 안 읽고
      # 씬 타입으로 분기, david 는 레거시 boolean, **joseph 은 카드 자체가 없었다.**
      #
      # 이 실패는 빨갛지 않다. 화면은 돌고 백엔드 테스트도 초록이다 — 그 테스트는
      # skip 목적지가 실재하는지만 보지 화면이 그 길을 쓰는지는 안 본다. 그래서
      # 안전 검토자가 yml 을 고치면 *고쳐진 줄 알고* 넘어간다. 아무것도 안 바뀌는데.
      #
      # 재는 범위는 "화면이 payload 를 읽는가" 까지다. 카드가 실제로 렌더되는지는
      # 백엔드가 붙은 e2e 만 잡을 수 있고, 문구의 적절성은 사람이 판정한다.
      # 위와 같은 이유로 setup-python 을 붙이지 않는다 (표준 라이브러리만 쓴다).
      - name: R4 consent gate wiring
        run: python3 scripts/check_frontend_trigger_warning.py

      # 모바일 레이아웃 게이트 (2026-08-12 신설).
      #
      # 이걸 붙이는 이유. 이 프론트는 데스크탑 Chrome 하나로만 검증돼 왔고, 그래서
      # **모바일에서 위기 상담 푸터가 본문을 최대 157px 덮고 있었는데 아무도 몰랐다.**
      # 덮인 쪽이 화면 아래라 눈으로는 멀쩡해 보인다. 손으로 돌리는 검사는 안 돌린
      # 검사와 같으므로 여기에 넣는다.
      #
      # 세 스위트가 돈다. 전부 **백엔드 없이** 판정된다 — 그래서 서비스 컨테이너가 없다.
      #   · mobile-hybrid    — 푸터가 본문을 덮는가 / PWA manifest·아이콘이 실제로 200 인가
      #   · tap-targets      — 터치 타깃이 44px 이상인가 (WCAG 2.5.5 / Apple HIG)
      #   · tap-targets-data — 같은 검사를, **응답을 가로채 채워 넣은 상태**에서
      #
      # 세 번째가 왜 생겼는가. `tap-targets` 만 있을 때 이 잡은 **잴 것이 없어서** 초록이었다.
      # 이 앱의 누르는 것 상당수는 백엔드가 응답해야 그려진다(`/topics/journal` 의 감정 칩은
      # `catalog?.catalog ?? []`). 백엔드가 없으면 버튼이 0 개고, 0 개면 「44px 미만이 없다」가
      # 참이라 검사는 통과한다. 백엔드를 띄우고 같은 검사를 돌리자 그 자리에서 12 개가
      # 빨개졌다(2026-08-12). 초록이 초록의 이유를 보증하지 않는 경우다.
      # `tap-targets-data` 는 픽스처가 화면에 닿았는지 먼저 확인하고(안 닿으면 거기서 실패)
      # 분모까지 함께 본다. 스펙 파일을 이름으로 명시하는 이유는 `tap-targets` 라는 인자가
      # 부분일치라 의도치 않은 파일까지 끌어오기 때문이다.
      #
      # ⚠️ 이 초록이 **덮지 않는 것** (조용히 빠진 게 아니라 알고 뺀 것):
      #   · 엔진은 넷 다 Chromium 이다. Safari(WebKit) 는 한 번도 안 돌렸다 —
      #     이 리포의 Playwright 가 받는 WebKit 빌드가 `webkit-mac-15` 하나뿐이라
      #     개발 기기(macOS 26.6)에서 newPage() 가 멈춘다. `playwright.config.ts` 의
      #     `PW_WEBKIT=1` 로 여는 opt-in 프로젝트가 있고, ubuntu 러너에서는 돌 수도
      #     있으나 **확인하지 않았다.** iPhone 프로젝트가 재는 것은 뷰포트·DPR·터치·UA 지
      #     Safari 엔진이 아니다.
      #   · 실기기 안전영역(노치·홈 인디케이터) 은 미검증이다. Playwright 의 기기 에뮬레이션은
      #     env(safe-area-inset-*) 을 전부 0 으로 준다.
      #   · 성능(LCP·번들·프레임) 은 재지 않는다. 레이아웃만 잰다.
      #   · 미션 화면(요셉·다윗·엘리야·욥·예수·모세·솔로몬)의 씬 내부는 백엔드가 있어야
      #     열리므로 **여기서는 안 열린다.** 그 자리는 2026-08-13 부터 아래
      #     `mission-e2e` 잡이 맡는다 — 백엔드를 실제로 띄우고 같은 검사를 돌린다.
      #     이 잡이 초록이어도 미션 씬은 여기서 재지 않았다는 뜻이다.
      #   · `tap-targets-data` 의 픽스처는 실제 응답을 받아 적은 사본이라 서버 계약이
      #     바뀌면 같이 낡는다. 계약 검증이 아니라 「응답이 오면 무엇이 그려지는가」다.
      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      # 프로덕션 빌드에 대고 잰다. 개발 서버로 재면 안 된다 — `/david` 는 dev 에서
      # 초록인데 프로덕션 빌드에서만 드러나는 측정 결함이 있었다(2026-08-12).
      - name: Build
        working-directory: frontend
        run: npm run build

      # `npm run start` 를 띄우고 응답할 때까지 기다린다. 곧바로 테스트를 걸면
      # 첫 스펙이 커넥션 거부로 죽는다. 60초를 넘기면 로그를 남기고 실패시킨다 —
      # 조용히 넘어가면 그 다음 빨강의 원인을 엉뚱한 데서 찾게 된다.
      - name: Start production server
        working-directory: frontend
        run: |
          npm run start > /tmp/next-start.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf -o /dev/null http://localhost:3000/ && echo "up after ${i}x2s" && exit 0
            sleep 2
          done
          echo "서버가 60초 안에 안 떴다:"; cat /tmp/next-start.log; exit 1

      - name: Mobile layout + tap target e2e
        working-directory: frontend
        env:
          BASE_URL: http://localhost:3000
        run: |
          npx playwright test \
            tests/e2e/mobile-hybrid.spec.ts \
            tests/e2e/tap-targets.spec.ts \
            tests/e2e/tap-targets-data.spec.ts

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build + push frontend image
        if: github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: true
          tags: |
            ghcr.io/myoungsoo7/lemuel-xr-frontend:main-${{ github.sha }}
            ghcr.io/myoungsoo7/lemuel-xr-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # 미션 씬 게이트 — 백엔드를 실제로 띄우고 잰다 (2026-08-13 신설).
  #
  # 이 리포에서 유일하게 **백엔드가 붙은 채로 도는 잡**이다. 별도 잡인 이유는 명확하다:
  # `frontend` 잡은 백엔드 없이 도는 검사만 모아 둔 곳이고, 거기에 DB 서비스 컨테이너와
  # bootRun 을 얹으면 백엔드 없이도 잡히는 결함의 판정까지 백엔드 기동 실패에 묶인다.
  #
  # 여기서 도는 `mission-tap-targets.spec.ts` 는 7개 인물 미션 씬 안쪽의 44px 터치 타깃을
  # 잰다. 이 검사가 CI 밖에 있던 동안 무엇이 방치됐는지가 이 잡의 존재 이유다 —
  # 2026-08-12 에 손으로 백엔드를 띄우고 처음 재서 세 군데를 고쳤는데
  # (/elijah 위기 확인 씬 상담번호 링크 26×17 · /moses 변명 배정 68×30 · /solomon
  # 음성/자막 강도 36×26), **고친 뒤에도 그 세 군데를 지키는 것은 아무것도 없었다.**
  # 앱이 「이 사용자가 위험할 수 있다」고 판단한 화면에서 전화 거는 링크가 제일 작았던
  # 결함이라, 손으로만 재는 상태를 남겨 둘 수 없다.
  #
  # ⚠️ 이 잡을 넣기 전에 스펙 자체를 고쳐야 했다. 스펙의 방어는 분모(`measured > 0`)
  #    하나였는데, **백엔드를 내리고 돌려 보니 7개 인물이 전부 초록이었다**(2026-08-13 실측).
  #    백엔드가 없으면 `SceneBootState` 가 「세션을 시작하지 못했습니다」 화면과 `다시 시도`
  #    버튼(min-h-11 이라 44px 준수)을 그리고 위기 푸터·내비도 같이 그려져서, 분모가 0 이
  #    아니게 된다. 씬은 한 줄도 안 열렸는데 검사는 통과한다 — 이 잡이 서비스 컨테이너
  #    설정 하나 틀린 채로 영원히 초록일 수 있었다는 뜻이다. 지금 스펙은
  #    `/api/game/{인물}/start` 가 200 으로 왔는지를 네트워크에서 직접 본다.
  #
  # 이 초록이 **주장하지 않는 것**: 씬 분기 전부가 아니라 첫 버튼을 따라간 한 갈래다.
  # 엔진은 Chromium 이고 뷰포트는 둘(아래 주석 참조)이다. 문구·흐름의 적절성은 사람 몫이다.
  mission-e2e:
    needs: changes
    # 백엔드(시나리오 yml 포함)든 프론트든 바뀌면 돈다. 씬을 그리는 데 둘 다 필요해서,
    # 한쪽만 트리거로 두면 나머지 한쪽 변경이 이 게이트를 우회한다.
    if: needs.changes.outputs.frontend == 'true' || needs.changes.outputs.backend == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      # docker-compose.yml 과 같은 이미지·자격증명을 쓴다. 순정 postgres 는 안 된다 —
      # V6 마이그레이션이 `CREATE EXTENSION vector` 를 하고, 없으면 Flyway 가 거기서 죽는다.
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: lemuel_xr
          POSTGRES_USER: xr
          POSTGRES_PASSWORD: xr1234
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U xr -d lemuel_xr"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # 백엔드를 띄운다. `AI_GENERATION_ENABLED: false` 인 이유는 AI 사이드카를 여기
      # 띄우지 않기 때문이다 — 켜 두면 씬마다 30초 타임아웃을 기다린다. 이 잡이 재는 것은
      # 레이아웃이지 생성 품질이 아니므로 정해진 묵상문 폴백으로 충분하다.
      # 나머지 설정(JWT_SECRET·INTERNAL_TOKEN·SAFETY_CRISIS_DEFAULT_CONTACT)은
      # application.yml 의 dev 기본값을 그대로 쓴다.
      - name: Start backend
        working-directory: backend
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/lemuel_xr?charSet=UTF8&characterEncoding=UTF-8
          SPRING_DATASOURCE_USERNAME: xr
          SPRING_DATASOURCE_PASSWORD: xr1234
          AI_GENERATION_ENABLED: "false"
        run: |
          gradle --no-daemon bootRun > /tmp/backend.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf -o /dev/null http://localhost:8080/actuator/health && echo "backend up after ${i}x5s" && exit 0
            sleep 5
          done
          echo "백엔드가 300초 안에 안 떴다:"; tail -200 /tmp/backend.log; exit 1

      - name: Install deps
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      # `frontend` 잡과 같은 이유로 프로덕션 빌드에 대고 잰다 (dev 서버에서만 초록인
      # 측정 결함이 실제로 있었다 — /david, 2026-08-12).
      - name: Build
        working-directory: frontend
        run: npm run build

      # `BACKEND_INTERNAL_URL` 은 런타임 값이다 — `frontend/src/app/api/[...path]/route.ts`
      # 가 요청마다 읽는다. 빌드 때가 아니라 여기서 줘야 프록시가 위 백엔드를 가리킨다.
      # 기본값(`http://lemuel-xr-backend:8080`)은 K8s 서비스명이라 러너에서는 안 풀린다.
      - name: Start production server
        working-directory: frontend
        env:
          BACKEND_INTERNAL_URL: http://localhost:8080
        run: |
          npm run start > /tmp/next-start.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf -o /dev/null http://localhost:3000/ && echo "up after ${i}x2s" && exit 0
            sleep 2
          done
          echo "프론트가 60초 안에 안 떴다:"; cat /tmp/next-start.log; exit 1

      # 뷰포트 둘만 돈다. 넷 다 돌리면 인물 7 × 프로젝트 4 × 씬 12단계라 러너에서
      # 15분을 넘기는데, 남는 둘(iPhone 15 · Pixel 7)은 이 축에서 SE 와 같은 것을 잰다 —
      # 엔진이 같은 Chromium 이고 폭도 SE 보다 넓다. 320px(SE)이 이 리포의 최악 폭이고,
      # desktop chromium 은 레이아웃 분기가 달라 남겼다. 돌연변이(솔로몬 강도 버튼에서
      # 44px 클래스 제거) 로 재 보니 두 뷰포트가 같은 위반을 잡았다 — 높이(26px)로
      # 걸리는 결함은 폭과 무관하기 때문이다. 폭으로만 걸리는 결함은 SE 몫이다.
      - name: Mission scene tap target e2e
        working-directory: frontend
        env:
          BASE_URL: http://localhost:3000
        run: |
          npx playwright test tests/e2e/mission-tap-targets.spec.ts \
            --project=chromium --project=mobile-iphone-se

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-mission
          path: frontend/playwright-report/
          retention-days: 7

      # 빨강일 때 백엔드 로그를 남긴다. 이 잡의 실패는 「44px 위반」과 「백엔드가 씬을
      # 못 줬다」 두 갈래인데, 로그가 없으면 둘을 구별하는 데 재실행이 필요하다.
      - name: Backend log (on failure)
        if: failure()
        run: tail -300 /tmp/backend.log
