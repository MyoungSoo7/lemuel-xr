name: ci

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      tts: ${{ steps.filter.outputs.tts }}
      ai: ${{ steps.filter.outputs.ai }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
            tts:
              - 'tts/**'
            ai:
              - 'ai/**'
            frontend:
              - 'frontend/**'

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4

      - name: Build + test
        working-directory: backend
        run: gradle --no-daemon bootJar -x test

      - name: Set up Docker Buildx
        if: github.ref == 'refs/heads/main' || github.event_name == 'pull_request'
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build + push backend image
        if: github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: |
            ghcr.io/myoungsoo7/lemuel-xr-backend:main-${{ github.sha }}
            ghcr.io/myoungsoo7/lemuel-xr-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  tts:
    needs: changes
    if: needs.changes.outputs.tts == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build + push tts image
        if: github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: tts
          push: true
          tags: |
            ghcr.io/myoungsoo7/lemuel-xr-tts:main-${{ github.sha }}
            ghcr.io/myoungsoo7/lemuel-xr-tts:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  ai:
    needs: changes
    if: needs.changes.outputs.ai == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build + push ai image
        if: github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: ai
          push: true
          tags: |
            ghcr.io/myoungsoo7/lemuel-xr-ai:main-${{ github.sha }}
            ghcr.io/myoungsoo7/lemuel-xr-ai:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build + push frontend image
        if: github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: true
          tags: |
            ghcr.io/myoungsoo7/lemuel-xr-frontend:main-${{ github.sha }}
            ghcr.io/myoungsoo7/lemuel-xr-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
