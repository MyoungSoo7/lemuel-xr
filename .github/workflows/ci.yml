name: ci

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      tts: ${{ steps.filter.outputs.tts }}
      ai: ${{ steps.filter.outputs.ai }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
            tts:
              - 'tts/**'
            ai:
              - 'ai/**'
            frontend:
              - 'frontend/**'

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4

      # 테스트를 실제로 돌린다. 이전에는 `bootJar -x test` 라 스텝 이름과 달리
      # 한 건도 실행되지 않았고, 통과하는 스위트가 아무 것도 게이트하지 못했다.
      # Testcontainers 는 ubuntu-latest 에 사전 설치된 Docker 를 쓴다.
      # ScriptureGroundingValidationTest 는 GEMINI_API_KEY 게이트로 자동 skip.
      - name: Test
        working-directory: backend
        run: gradle --no-daemon test

      # 커버리지를 로그에 남기고 하한을 강제한다. 하한은 build.gradle.kts 의
      # coverageMinimum 래칫 — 실측값에서 여유를 뺀 값이라 떨어지면 깨진다.
      - name: Coverage gate
        working-directory: backend
        run: gradle --no-daemon printCoverage jacocoTestCoverageVerification

      - name: Upload coverage report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: backend/build/reports/jacoco/test/html/
          retention-days: 7

      - name: Build
        working-directory: backend
        run: gradle --no-daemon bootJar -x test

      - name: Set up Docker Buildx
        if: github.ref == 'refs/heads/main' || github.event_name == 'pull_request'
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build + push backend image
        if: github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: |
            ghcr.io/myoungsoo7/lemuel-xr-backend:main-${{ github.sha }}
            ghcr.io/myoungsoo7/lemuel-xr-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  tts:
    needs: changes
    if: needs.changes.outputs.tts == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build + push tts image
        if: github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: tts
          push: true
          tags: |
            ghcr.io/myoungsoo7/lemuel-xr-tts:main-${{ github.sha }}
            ghcr.io/myoungsoo7/lemuel-xr-tts:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  ai:
    needs: changes
    if: needs.changes.outputs.ai == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build + push ai image
        if: github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: ai
          push: true
          tags: |
            ghcr.io/myoungsoo7/lemuel-xr-ai:main-${{ github.sha }}
            ghcr.io/myoungsoo7/lemuel-xr-ai:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install deps
        working-directory: frontend
        run: npm ci

      # 타입 체크만 게이트한다. `npm run lint` 는 Next 16 에서 제거된
      # `next lint` 를 호출해 현재 깨져 있고, Playwright e2e 는 백엔드가 떠
      # 있어야 하므로(playwright.config.ts 주석 참조) 별도 작업으로 남긴다.
      - name: Type check
        working-directory: frontend
        run: npm run type-check

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build + push frontend image
        if: github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: true
          tags: |
            ghcr.io/myoungsoo7/lemuel-xr-frontend:main-${{ github.sha }}
            ghcr.io/myoungsoo7/lemuel-xr-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
