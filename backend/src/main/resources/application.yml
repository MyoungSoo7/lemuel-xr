      있는 데는 이유가,있어야 더 강해,있어야 더 깊어,있어야 더 단단,있어야 더 성숙,
      있어야 더 성장,자격을 갖추세,자격을 갖추셔야,자격을 갖추십,자격을 갖추어야 합,
      자격을 갖춘 뒤에야,자격을 갖춰야 합,자격을 갖춰야죠,자리에 뜻이,잘 버티셨,
      잘 참아 내셨,잘 해 내셨,정신 차려,정신 차리세,정신 차리셔야,
      정신 차리시고,정신 차리십,조금 더 견디,조금 더 버티,조금 더 참,
      조금도 상하지 않을,조금만 견디,조금만 더 견디,조금만 더 기다리,조금만 더 버티,
      조금만 더 참,조금만 더 힘내,죄책감이 사라진 뒤에,준비가 되면 다시 부르,준비가 되면 다시 쓰,
      준비가 되면 부르,준비가 되면 회복,준비가 되어야 부르,준비가 되어야 회복,준비가 되었을 때 부르,
      준비가 되었을 때 비로소,준비가 되었을 때 회복,준비되면 비로소,준비되면 이루어,준비되면 주실,
      준비되었을 때 비로소,준비되었을 때에야,지금은 참으,지나고 보면,지연도 은혜,
      지연에도 이유가 있,지켜 주십니다,직업을 버리고,착해서,참으니 복이,
      책망받은 것입니,책망하신 것입니,처럼 담대,충분히 슬퍼하셨,충분히 아파하셨,
      충분히 우셨,충성했으니,침묵도 은혜,침묵에도 이유가 있,침묵하면 안,
      타협 없이 지켜야 합,타협 없이 지켜야죠,타협 없이 지키세,타협 없이 지킨,타협하면 안,
      타협하지 마,타협하지 말,타협해서는,포기하지 않으,핍박받는 것은 복,
      핍박은 복,하나님께는 반드시 이유가,하나님의 시계,하시려고 그 일을 허락,허락하신 것,
      허무를 극복,허무하지 않으려면,헛되이 사라지지 않,회개했기 때문에,회복의 크기는,
      후회가 될,후회하게 되,후회하게 됩,훈장,흉터도 축복
    # 위 `list` 중 **신학 정통성(T1) 축**에 속하는 토큰. 여기 없는 토큰의 축은 R2_R3 다.
    #
    # 사용자에게는 아무 차이가 없다 — 어느 축이든 같은 `fallback-text` 를 받는다(seed AC2).
    # 차이는 **운영자 쪽**에만 있다. `content.gate.block{axis=T1}` 이 튀면 그건 LLM 이
    # 구원 서사로 인물의 과거를 지우려 한 것이고, `axis=R2_R3` 이 튀면 정신건강 축이다.
    # 대응 주체(신학 검토 vs 안전 문구 조정)가 다르므로 한 계열로 섞으면 둘 다 못 읽는다.
    #
    # 축의 1차 출처는 이 파일이 아니라 **저작 yml 의 게이트 id**(`T1_*`) 다. 여기 적힌 것은
    # 그 저작의 사본이고, 어긋나면 `SafetyMetricsGateBlockTest` 가 빨강을 낸다.
    theology-list: >-
      과거를 씻고,더 이상 기생이,믿었기 때문에,믿음 덕분에,새사람이 되어,
      직업을 버리고,회개했기 때문에
    # 두 번 연속 걸렸을 때 내보낼 사전 저작 응답. 사용자를 탓하지도, 재촉하지도 않는다.
    fallback-text: >-
      지금은 어떤 말도 보태지 않겠습니다. 여기 이대로 머물러도 괜찮습니다.

# === Telegram ChatOps 알람 ===
chatops:
  telegram:
    enabled: ${CHATOPS_TELEGRAM_ENABLED:false}
    bot-token: ${CHATOPS_TELEGRAM_BOT_TOKEN:}
    chat-id: ${CHATOPS_TELEGRAM_CHAT_ID:}
    base-url: https://api.telegram.org

# === 근거성 골든셋 정기 채점 (승격계약 §2 의 지속 측정) ===
# 기본 꺼짐. 켜면 매 주기 유료 임베딩 API 를 호출하므로 배포자가 명시적으로 켠다.
# 결과는 `grounding.goldenset.*` 게이지로 /actuator/prometheus 에 실려 기존 ServiceMonitor 가 수집.
grounding:
  eval:
    enabled: ${GROUNDING_EVAL_ENABLED:false}
    cron: ${GROUNDING_EVAL_CRON:0 30 3 * * *} # 매일 03:30 KST
    version: ${GROUNDING_EVAL_VERSION:v1}
    embedding-model: ${GROUNDING_EVAL_EMBEDDING_MODEL:gemini-embedding-001}
    # 1536 은 scripture_embeddings.embedding vector(1536) + pgvector HNSW 2000 차원 상한에 맞춘 값.
    # 바꾸려면 마이그레이션이 함께 가야 한다. (GeminiEmbeddingAdapter 주석 참고)
    embedding-dimensions: ${GROUNDING_EVAL_EMBEDDING_DIMENSIONS:1536}
    api-key: ${GEMINI_API_KEY:}

# === XR 자산 ===
asset:
  manifest:
    cdn-base-url: ${ASSET_CDN:https://r2.lemuel.co.kr/assets}

# === XR 몰입 모드 ===
lemuel:
  xr:
    # AR(패스스루) 을 노출할 미션. 여기 없는 미션에 mode=ar 로 오면 400.
    # 요셉만 AR 씬·에셋이 있어서 요셉만 열어둔다 — 늘리려면 그 미션의
    # manifests/{mission}/{device}/ar/ 시드를 먼저 채울 것.
    ar-enabled-missions: ${XR_AR_MISSIONS:joseph,moses,david}

# === Actuator (운영 모니터링) ===
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
    info:
      enabled: true
  prometheus:
    metrics:
      export:
        enabled: true
  tracing:
    # 운영 10% 샘플링. dev: TRACING_SAMPLING=1.0 으로 모두.
    sampling:
      probability: ${TRACING_SAMPLING:0.1}
    propagation:
      type: w3c
  otlp:
    tracing:
      endpoint: ${OTLP_ENDPOINT:http://tempo.monitoring.svc:4318/v1/traces}
      compression: gzip
      timeout: 10s
  metrics:
    distribution:
      # endpoint별 latency histogram (Grafana p50/p95/p99 차트용)
      percentiles-histogram:
        http.server.requests: true
        emotion.classify: true
        game.decide: true
      percentiles:
        http.server.requests: 0.5, 0.95, 0.99
    tags:
      application: lemuel-xr-backend

# === Server ===
server:
  port: ${SERVER_PORT:8080}
  servlet:
    encoding:
      charset: UTF-8
      force: true
  tomcat:
    uri-encoding: UTF-8

# === 로깅 ===
logging:
  charset:
    console: UTF-8
    file: UTF-8
  pattern:
    # %X{traceId}/%X{spanId} — Micrometer Tracing 이 MDC 에 박는 OTel trace context.
    # Grafana 에서 log → trace jump 가능 (Tempo derived field 매핑).
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] [%X{traceId:-}/%X{spanId:-}] %-5level %logger{36} - %msg%n"
