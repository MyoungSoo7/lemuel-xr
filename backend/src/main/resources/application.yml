spring:
  application:
    name: lemuel-xr-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/lemuel_xr}
    username: ${SPRING_DATASOURCE_USERNAME:xr}
    password: ${SPRING_DATASOURCE_PASSWORD:xr1234}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: public
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
ai:
  base-url: ${AI_BASE_URL:http://localhost:8000}

tts:
  base-url: ${TTS_BASE_URL:http://localhost:5002}
  cache-ttl-seconds: 86400

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

server:
  port: ${SERVER_PORT:8080}
