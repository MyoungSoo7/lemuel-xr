spring:
  application:
    name: lemuel-xr-backend

  # === UTF-8 일관성 강제 (Spring HTTP) ===
  http:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/lemuel_xr?charSet=UTF8&characterEncoding=UTF-8}
    username: ${SPRING_DATASOURCE_USERNAME:xr}
    password: ${SPRING_DATASOURCE_PASSWORD:xr1234}
    hikari:
      connection-init-sql: "SET client_encoding = 'UTF8'"

  jpa:
    hibernate:
      ddl-auto: validate # Flyway 가 진실. JPA 는 검증만.
    properties:
      hibernate:
        default_schema: public
        format_sql: false
        connection:
          characterEncoding: UTF-8
          useUnicode: true
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    encoding: UTF-8
    # 기존 DB에 schema history 가 없으면 baseline 으로 시작 (initial 마이그레이션 X 처리)
    baseline-on-migrate: true
    baseline-version: 0
    # 운영 환경에서 실수 방지 — out-of-order 차단
    out-of-order: false

  jackson:
    default-property-inclusion: non_null
    time-zone: UTC

# === AI 사이드카 (Python FastAPI + LangChain) ===
ai:
  base-url: ${AI_BASE_URL:http://localhost:8000}
  timeout-ms: 30000
  internal-token: ${AI_INTERNAL_TOKEN:dev-internal-token-rotate-in-prod}
  # 2026-05-22 정착: lemuel-xr 정체성 = *영적 비상 대비 훈련* (큐티+민방위).
  # 임상·치료 영역 X → AI 생성 활성화 default. Prompt guard 가 *큐티 톤* 강제.
  generation:
    enabled: ${AI_GENERATION_ENABLED:true}
    disabled-fallback-text: "지금은 정해진 묵상문만 안내드려요. 위기 시 109 (자살예방 상담전화)."
    # Prompt 톤 가이드 — Python AI 사이드카가 system prompt 에 prepend.
    tone-guidance: |
      당신은 *영적 비상 대비 훈련* 가이드입니다. 큐티(QT)와 같은 *일상 영적 양식* 톤으로 응답하세요.
      반드시 따를 것:
      - 4 인물 (요셉·모세·다윗·예수) 의 *절망 → 아름다운 회복* 이야기로 내면 단련에 도움 주기
      - 큐티 톤: 본문 인용 + 묵상 + 개인 적용. 짧고 진솔하게.
      - "내면을 단단히", "영적 양식", "예방 영성" 같은 *단련·예방* 어휘 사용
      절대 금지:
      - 의료 진단·치료 권고 (위기 키워드는 시스템이 자동 처리)
      - 거짓 위로 ("곧 나아질 거예요", "다 뜻이 있어요" 같은 가스라이팅)
      - 결과 보장 ("이 미션 끝나면 회복돼요")
  provider-priority:
    classify_emotion: [openai_gpt4o_mini, anthropic_claude3_haiku]
    polish_psalm: [anthropic_claude35_sonnet, openai_gpt4o]
    game_branch: [openai_gpt4o_mini, anthropic_claude3_haiku]
    weekly_report: [anthropic_claude35_sonnet, openai_gpt4o]
    diary_meditation: [anthropic_claude35_sonnet, openai_gpt4o]

# === TTS 사이드카 (Coqui XTTS-v2, self-hosted) ===
tts:
  base-url: ${TTS_BASE_URL:http://localhost:5002}
  cache-ttl-seconds: 86400
  storage:
    bucket: ${TTS_BUCKET:lemuel-xr-tts}
    public-base-url: ${TTS_PUBLIC_URL:https://r2.lemuel.co.kr/tts}

# === 인증 (게스트 JWT) ===
security:
  jwt:
    secret: ${JWT_SECRET:dev-secret-min-32-chars-rotate-in-prod-please-use-sops-encrypted-value}
    expiry-days: 30
    issuer: lemuel-xr
  internal:
    token: ${INTERNAL_TOKEN:dev-internal-svc-token-rotate-in-prod}
  rate-limit:
    enabled: true
    default-per-minute: 60
    classify-per-minute: 20
    llm-realtime-per-minute: 30
    tts-miss-per-minute: 10

# === 정신건강 안전선 (5개) ===
safety:
  # 명명 그룹(suicideIntent / selfHarm)이 곧 분류 키다 — CrisisKeywordScanner 가 이걸로
  # matchedPattern 을 정한다. 그룹 없이 쓰면 crisis_unclassified 로 떨어지되 차단은 유지된다
  # (분류를 몰라도 통과시키지 않는다). 환경변수로 override 할 때도 그룹명을 지키는 편이 좋다.
  crisis-keywords-regex: ${SAFETY_CRISIS_REGEX:(?<suicideIntent>자살|죽고\s?싶|죽어\s?버|뛰어내리)|(?<selfHarm>자해)}
  alert-severity-threshold: medium # 이 이상이면 사용자에게 위기 자원 표시
  show-disclaimer-on-first-entry: true

  crisis:
    # 시나리오 yml 의 `{{crisis_resources.default}}` 치환 실패 시 쓰는 *최후* 대체값.
    # 정본은 DB `crisis_resources` 의 region/locale 별 우선순위 1위 활성 전화 자원이다
    # (V20260802031449 — 2024-01-01 보건복지부 자살예방 상담 109 통합).
    # DB 가 죽어도 위기 카피에 원시 토큰이 노출되는 것만은 막는 안전망 — 비워 두지 말 것.
    default-contact: ${SAFETY_CRISIS_DEFAULT_CONTACT:109}

  # 가스라이팅 금지 토큰 — LLM *출력측* 게이트(enforce).
  #
  # 출처는 저작 YAML `content/{인물}/scene*.yml` 의 lint_forbidden_tokens 다.
  # content/ 는 백엔드 클래스패스가 아니므로 자동 동기화되지 않는다 — 저작 쪽에 토큰을
  # 추가하면 여기에도 반영해야 한다. 누락 감지는 ContentSafetyGateEnforcementTest 가
  # (저작 토큰 전수 ⊆ 이 목록) 맡고, 빈 주입 여부는 ForbiddenTokenConfigTest 가 맡는다.
  #
  # 금지 이유는 신학이 아니라 정신건강이다. 절망 상태의 사용자에게 책임을 전가하거나
  # (믿음이 부족/욕심이 많아서) 회복을 압박하는(빨리 회복/다시 일어나 싸워) 표현은
  # 예방 영적 교육이라는 이 앱의 정체성과 정면으로 충돌한다.
  #
  # 이 목록은 *전역* 이다 — 인물 구분 없이 모든 LLM 출력에 적용된다. 그래서 토큰은
  # 인과·명령 어미까지 포함해 좁게 잡는다. "믿음이 약해도 괜찮습니다" 같은 정당한 위로가
  # 걸리면 사용자는 fallback-text 만 받게 되므로, 넓은 토큰은 안전이 아니라 손실이다.
  #
  # 한글 형태론 주의(실측):
  #  - 존칭 선어말 '-시-'는 다음 음절에 합쳐진다 — "쓰시" ⊄ "쓰신다", "아니" ⊄ "아닙니다".
  #  - 어간이 교체된다 — 싸워→싸우, 차려→차리, 이겨→이기. 활용형만 바꿔도 토큰이 뚫린다.
  #  → 어간까지만 끊고, 명령형은 높임 어미(-세/-십/-셔야)를 별도 토큰으로 둔다.
  #  → 단, 어간형은 부정 위로까지 삼킨다("다시 싸우지 않아도 됩니다"). 명령형만 잡는 이유다.
  #
  # 이 게이트가 막는 것과 못 막는 것 — 과신 금지:
  #  [막음] 이미 알려진 유해 표층형의 *재발*, 그리고 그 활용·높임 변이형.
  #  [못 막음] 유의어 재작성. "감사가 부족하셔서"→"감사할 줄 모르셔서",
  #           "믿음이 부족"→"믿음이 여전히 모자라셨던", "허무를 극복"→"허무함을 이겨내셔야"
  #           는 전부 통과한다(실측 8/8 미포착). 부분문자열 lint 의 구조적 한계다.
  #  유의어 우회는 이 목록이 아니라 (a) LLM 시스템 프롬프트 제약, (b) 사람 안전 검토가 맡는다.
  #  토큰을 늘려 해결됐다고 적지 말 것.
  #
  # ⚠️ 저작 정본은 content/{인물}/scene*.yml 의 lint_forbidden_tokens 다. 이 목록은 그
  # 합집합의 런타임 사본이며, content/ 는 클래스패스가 아니라 자동 동기화되지 않는다.
  # 동기화는 ContentSafetyGateEnforcementTest 가 강제한다(저작 ⊆ 런타임).
  forbidden-tokens:
    list: >-
      감사가 부족,게을러서 그,교훈으로 삼는,교훈으로 삼아,교훈으로 삼으,
      교훈으로 삼을,그만 쉬고,기도가 부족해서,깨달았으,깨달으셨으,너 때문,
      누워만 있으면,다시 열심히,다시 이겨,다시 일어나 싸워,당신 때문에,
      도구로 다시,도구로 삼는,도구로 삼아,도구로 삼으,도구로 삼을,
      도구로 쓰는,도구로 쓰려,도구로 쓰시,도구로 쓰신,도구로 쓰실,
      만족을 모르,믿음이 부족,믿음이 약해서,바르게 사세,바르게 사십,
      바르게 살아라,바르게 살아야 하지,바르게 살아야 합,바르게 살아야죠,
      빨리 회복,사역으로 돌아가,쉴 때가 아,싸우세,싸우셔야,싸우십,쓰시려고,
      쓰임받는,쓰임받아,쓰임받으,쓰임받을,약해서 무너,언제까지 쉬,왜 도망,
      욕심이 많아서,욕심이 많으셔,욕심이 많으시,의지가 약해서,이기세,
      이기셔야,이기십,이제 다시 싸워,이제부터라도,일꾼으로 세우,정신 차려,
      정신 차리세,정신 차리셔야,정신 차리시고,정신 차리십,허무를 극복,
      허무하지 않으려면
    # 두 번 연속 걸렸을 때 내보낼 사전 저작 응답. 사용자를 탓하지도, 재촉하지도 않는다.
    fallback-text: >-
      지금은 어떤 말도 보태지 않겠습니다. 여기 이대로 머물러도 괜찮습니다.

# === Telegram ChatOps 알람 ===
chatops:
  telegram:
    enabled: ${CHATOPS_TELEGRAM_ENABLED:false}
    bot-token: ${CHATOPS_TELEGRAM_BOT_TOKEN:}
    chat-id: ${CHATOPS_TELEGRAM_CHAT_ID:}
    base-url: https://api.telegram.org

# === XR 자산 ===
asset:
  manifest:
    cdn-base-url: ${ASSET_CDN:https://r2.lemuel.co.kr/assets}

# === Actuator (운영 모니터링) ===
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
    info:
      enabled: true
  prometheus:
    metrics:
      export:
        enabled: true
  tracing:
    # 운영 10% 샘플링. dev: TRACING_SAMPLING=1.0 으로 모두.
    sampling:
      probability: ${TRACING_SAMPLING:0.1}
    propagation:
      type: w3c
  otlp:
    tracing:
      endpoint: ${OTLP_ENDPOINT:http://tempo.monitoring.svc:4318/v1/traces}
      compression: gzip
      timeout: 10s
  metrics:
    distribution:
      # endpoint별 latency histogram (Grafana p50/p95/p99 차트용)
      percentiles-histogram:
        http.server.requests: true
        emotion.classify: true
        game.decide: true
      percentiles:
        http.server.requests: 0.5, 0.95, 0.99
    tags:
      application: lemuel-xr-backend

# === Server ===
server:
  port: ${SERVER_PORT:8080}
  servlet:
    encoding:
      charset: UTF-8
      force: true
  tomcat:
    uri-encoding: UTF-8

# === 로깅 ===
logging:
  charset:
    console: UTF-8
    file: UTF-8
  pattern:
    # %X{traceId}/%X{spanId} — Micrometer Tracing 이 MDC 에 박는 OTel trace context.
    # Grafana 에서 log → trace jump 가능 (Tempo derived field 매핑).
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] [%X{traceId:-}/%X{spanId:-}] %-5level %logger{36} - %msg%n"
