      이제 죄책감을 버리세,이제 죄책감을 버리십,이제부터라도,일곱 아들보다 귀한,일꾼으로 세우,
      일어나셨듯 당신,일어나셨듯 여러분,일어날 차례,일하고 계세,일하고 계셔,
