spring:
  application:
    name: lemuel-xr-backend

  # === UTF-8 일관성 강제 (Spring HTTP) ===
  http:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/lemuel_xr?charSet=UTF8&characterEncoding=UTF-8}
    username: ${SPRING_DATASOURCE_USERNAME:xr}
    password: ${SPRING_DATASOURCE_PASSWORD:xr1234}
    hikari:
      connection-init-sql: "SET client_encoding = 'UTF8'"

  jpa:
    hibernate:
      ddl-auto: validate # Flyway 가 진실. JPA 는 검증만.
    properties:
      hibernate:
        default_schema: public
        format_sql: false
        connection:
          characterEncoding: UTF-8
          useUnicode: true
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    encoding: UTF-8
    # 기존 DB에 schema history 가 없으면 baseline 으로 시작 (initial 마이그레이션 X 처리)
    baseline-on-migrate: true
    baseline-version: 0
    # 운영 환경에서 실수 방지 — out-of-order 차단
    out-of-order: false

  jackson:
    default-property-inclusion: non_null
    time-zone: UTC

# === AI 사이드카 (Python FastAPI + LangChain) ===
ai:
  base-url: ${AI_BASE_URL:http://localhost:8000}
  timeout-ms: 30000
  internal-token: ${AI_INTERNAL_TOKEN:dev-internal-token-rotate-in-prod}
  # 긴 생성 응답이 WebClient 기본 한도(256KB)를 넘으면 사이드카는 200 인데 백엔드만 502 가 된다.
  max-response-bytes: ${AI_MAX_RESPONSE_BYTES:4194304}
  # 2026-05-22 정착: lemuel-xr 정체성 = *영적 비상 대비 훈련* (큐티+민방위).
  # 임상·치료 영역 X → AI 생성 활성화 default. Prompt guard 가 *큐티 톤* 강제.
  generation:
    enabled: ${AI_GENERATION_ENABLED:true}
    disabled-fallback-text: "지금은 정해진 묵상문만 안내드려요. 위기 시 109 (자살예방 상담전화)."
    # Prompt 톤 가이드 — Python AI 사이드카가 system prompt 에 prepend.
    tone-guidance: |
      당신은 *영적 비상 대비 훈련* 가이드입니다. 큐티(QT)와 같은 *일상 영적 양식* 톤으로 응답하세요.
      반드시 따를 것:
      - 4 인물 (요셉·모세·다윗·예수) 의 *절망 → 아름다운 회복* 이야기로 내면 단련에 도움 주기
      - 큐티 톤: 본문 인용 + 묵상 + 개인 적용. 짧고 진솔하게.
      - "내면을 단단히", "영적 양식", "예방 영성" 같은 *단련·예방* 어휘 사용
      절대 금지:
      - 의료 진단·치료 권고 (위기 키워드는 시스템이 자동 처리)
      - 거짓 위로 ("곧 나아질 거예요", "다 뜻이 있어요" 같은 가스라이팅)
      - 결과 보장 ("이 미션 끝나면 회복돼요")
  provider-priority:
    classify_emotion: [openai_gpt4o_mini, anthropic_claude3_haiku]
    polish_psalm: [anthropic_claude35_sonnet, openai_gpt4o]
    game_branch: [openai_gpt4o_mini, anthropic_claude3_haiku]
    weekly_report: [anthropic_claude35_sonnet, openai_gpt4o]
    diary_meditation: [anthropic_claude35_sonnet, openai_gpt4o]

# === TTS 사이드카 (Coqui XTTS-v2, self-hosted) ===
tts:
  base-url: ${TTS_BASE_URL:http://localhost:5002}
  # 사이드카가 WAV 를 base64 data URL 로 인라인해 돌려주므로 응답이 크다 (실측: 5.7초 문장 = 357KB).
  # WebClient 기본 한도 256KB 로는 *모든* 합성이 DataBufferLimitException → 502 가 된다.
  max-response-bytes: ${TTS_MAX_RESPONSE_BYTES:16777216}
  cache-ttl-seconds: 86400
  storage:
    bucket: ${TTS_BUCKET:lemuel-xr-tts}
    public-base-url: ${TTS_PUBLIC_URL:https://r2.lemuel.co.kr/tts}

# === 인증 (게스트 JWT) ===
security:
  jwt:
    secret: ${JWT_SECRET:dev-secret-min-32-chars-rotate-in-prod-please-use-sops-encrypted-value}
    expiry-days: 30
    issuer: lemuel-xr
  internal:
    token: ${INTERNAL_TOKEN:dev-internal-svc-token-rotate-in-prod}
  rate-limit:
    enabled: true
    default-per-minute: 60
    classify-per-minute: 20
    llm-realtime-per-minute: 30
    tts-miss-per-minute: 10

# === 정신건강 안전선 (5개) ===
safety:
  # 명명 그룹이 곧 분류 키다 — CrisisKeywordScanner 가 이걸로 matchedPattern 과 severity 를
  # 정한다. 그룹 없이 쓰면 crisis_unclassified 로 떨어지되 차단은 유지된다(분류를 몰라도
  # 통과시키지 않는다). 환경변수로 override 할 때도 그룹명을 지키는 편이 좋다.
  #
  # **정본은 docs/EMOTION-CLASSIFIER.md §3 이다** (2026-08-06 사용자 결정 "정본을 문서로").
  # 아래 표는 그 문서의 키워드 사전과 분기표를 런타임으로 옮긴 것이고, 양방향 일치는
  # CrisisKeywordDocContractTest 가 강제한다 — 문서에만 적고 여기 안 넣으면 검사가 빨개진다.
  #
  #   그룹                        분류 키                        등급      사용자에게 보이는 것
  #   suicideIntent               suicide_intent                critical  분류 skip · LLM 호출 X · 위기 화면 강제
  #   selfHarm                    self_harm                     critical  동일
  #   bereavementCompanionDeath   bereavement_companion_death   high      분류 계속 + 위기 자원 *상단 배너*
  #   despairIdeation             despair_ideation              high      동일
  #   bereavementLonging          bereavement_longing           medium    분류 계속 + *조용한* 하단 카드
  #   riskSignal                  risk_signal                   medium    동일
  #
  # 사별 4종의 등급은 2026-08-06 사용자 결정이다 — 나도 따라 죽고 싶(critical) /
  # 같이 묻히(high) / 곁으로 가고 싶·(고인)곁에 있고 싶(medium). 분류기는 *사용자가 쓴 글* 을
  # 보므로 성경 자구 규칙(출력측)이 이 판정을 대신하지 못한다. 출력측은 별개로 이미 막혀 있다 —
  # `같이 묻히` 는 아래 forbidden-tokens 에도 있어 앱이 먼저 그 말을 꺼내지 못한다.
  #
  # `곁에 있고 싶` 을 단독 토큰으로 두지 않은 이유: "가족 곁에 있고 싶어" 같은 일상어를 전부
  # 삼킨다. 사망 지시어(먼저 간·떠난·돌아가신·죽은·고인)가 12자 이내 앞에 있을 때만 잡는다.
  #
  # riskSignal 은 2026-08-06 에 좁혔다. 이전에는 `마지막`·`혼자 살아`·`아무도 모를` 이 단독
  # 토큰이라 "마지막 장면이 좋았어요"·"혼자 살아온 지 십 년" 을 전부 삼켰다. 뺀 것은 일상
  # 용법이고 위험 형태는 남긴다("혼자 살아요" X / "혼자 살아남았어요" O).
  # 안 넣기로 한 것: `마지막으로 정리` — 신변 정리는 실제 신호지만 "마지막으로 정리하겠습니다"
  # 가 너무 흔하다. 놓치는 걸 알고 놓는다(문서 §3 에 같은 문장으로 적혀 있다).
  #
  # 등급이 낮다고 기록을 건너뛰지는 않는다 — medium 도 safety_alerts 에 남는다. 다만
  # 운영자 Telegram 알람은 high 이상(RecordSafetyAlertUseCase.CHATOPS_SEVERITIES)이다.
  crisis-keywords-regex: ${SAFETY_CRISIS_REGEX:(?<suicideIntent>자살|죽고\s?싶|스스로 목숨|목숨을 끊|끝내고 싶|따라 죽|죽어\s?버|뛰어내리|목을 매달|목맴|수면제를 모으|약을 모으|약을 모아 두|약을 모아둔|suicide|kill myself|end my life|hang myself|hanging myself)|(?<selfHarm>자해|베이고 싶|긋고 싶|self harm|cutting myself)|(?<bereavementCompanionDeath>같이 묻히|함께 묻히)|(?<despairIdeation>사라지고 싶|없어지고 싶|그만 살고 싶|버티기 힘들|못 버티겠|더는 못 버티|더 이상 못 버티|버틸 수가 없|(?:스스로|혼자서?)[^\n]{0,4}목을\s?(?:매|맬|맸)|want to disappear|can't go on)|(?<bereavementLonging>곁으로 가고 싶|(?:먼저 간|떠난|돌아가신|죽은|고인)[^\n]{0,12}곁에 있고 싶)|(?<riskSignal>유서|마지막 인사|마지막으로 하고 싶은 말|마지막 편지|마지막으로 남기|혼자 살아남|혼자 살아 뭐|혼자 살아서 미안|(?:없어져도|사라져도|죽어도)[^\n]{0,8}아무도 모를|아무도 모르게 떠나)}
  # `alert-severity-threshold` 는 2026-08-06 에 제거했다. Kotlin 소비자가 0개였는데
  # "이 이상이면 위기 자원 표시" 라는 주석을 달고 있어 *살아 있는 임계값처럼 읽히는* 죽은 설정이었다.
  # 실제 분기는 위 표(= docs/EMOTION-CLASSIFIER.md §3)가 정본이다.
  show-disclaimer-on-first-entry: true

  crisis:
    # 시나리오 yml 의 `{{crisis_resources.default}}` 치환 실패 시 쓰는 *최후* 대체값.
    # 정본은 DB `crisis_resources` 의 region/locale 별 우선순위 1위 활성 전화 자원이다
    # (V20260802031449 — 2024-01-01 보건복지부 자살예방 상담 109 통합).
    # DB 가 죽어도 위기 카피에 원시 토큰이 노출되는 것만은 막는 안전망 — 비워 두지 말 것.
    default-contact: ${SAFETY_CRISIS_DEFAULT_CONTACT:109}

  # 가스라이팅 금지 토큰 — LLM *출력측* 게이트(enforce).
  #
  # 출처는 저작 YAML 의 lint_forbidden_tokens 다(정본 두 곳은 아래 ⚠️ 참고).
  # 저작 쪽에 토큰을 추가하면 여기에도 반영해야 한다. 누락 감지는
  # ContentSafetyGateEnforcementTest 가 (저작 토큰 전수 ⊆ 이 목록) 맡고,
  # 빈 주입 여부는 ForbiddenTokenConfigTest 가 맡는다.
  #
  # 금지 이유는 신학이 아니라 정신건강이다. 절망 상태의 사용자에게 책임을 전가하거나
  # (믿음이 부족/욕심이 많아서) 회복을 압박하는(빨리 회복/다시 일어나 싸워) 표현은
  # 예방 영적 교육이라는 이 앱의 정체성과 정면으로 충돌한다.
  #
  # 이 목록은 *전역* 이다 — 인물 구분 없이 모든 LLM 출력에 적용된다. 그래서 토큰은
  # 인과·명령 어미까지 포함해 좁게 잡는다. "믿음이 약해도 괜찮습니다" 같은 정당한 위로가
  # 걸리면 사용자는 fallback-text 만 받게 되므로, 넓은 토큰은 안전이 아니라 손실이다.
  #
  # 한글 형태론 주의(실측):
  #  - 존칭 선어말 '-시-'는 다음 음절에 합쳐진다 — "쓰시" ⊄ "쓰신다", "아니" ⊄ "아닙니다".
  #  - 어간이 교체된다 — 싸워→싸우, 차려→차리, 이겨→이기. 활용형만 바꿔도 토큰이 뚫린다.
  #  → 어간까지만 끊고, 명령형은 높임 어미(-세/-십/-셔야)를 별도 토큰으로 둔다.
  #  → 2026-08-05 보강: **권유·허용 어미도 별도 토큰이 필요하다.** 목록을 세어 보니
  #    명령형 높임(-세/-십/-셔야)은 촘촘한데 연결형 '-시면'(권유)과 허용형 '-셔도'는
  #    거의 비어 있었다. 실측 공백 — 다니엘은 담대해지세/십/셔야/면 넉 종을 두고도
  #    '담대해지시'가 없어 "담대해지시면"이 통과했고, 에스더도 용기를 내세/십/셔야를
  #    두고 '용기를 내시'가 없었다. 제품 카피의 기본 말투가 명령이 아니라 권유라
  #    이 축이 비면 목록의 크기와 무관하게 실사용 표면이 그대로 뚫린다.
  #  → 단, 어간형은 부정 위로까지 삼킨다("다시 싸우지 않아도 됩니다"). 명령형만 잡는 이유다.
  #
  # 이 게이트가 막는 것과 못 막는 것 — 과신 금지:
  #  [막음] 이미 알려진 유해 표층형의 *재발*, 그리고 그 활용·높임 변이형.
  #  [못 막음] 유의어 재작성. "감사가 부족하셔서"→"감사할 줄 모르셔서",
  #           "믿음이 부족"→"믿음이 여전히 모자라셨던", "허무를 극복"→"허무함을 이겨내셔야"
  #           는 전부 통과한다(실측 8/8 미포착). 부분문자열 lint 의 구조적 한계다.
  #  유의어 우회는 이 목록이 아니라 (a) LLM 시스템 프롬프트 제약, (b) 사람 안전 검토가 맡는다.
  #  토큰을 늘려 해결됐다고 적지 말 것.
  #
  # ⚠️ 저작 정본은 두 곳이다 — content/{인물}/scene*.yml 과
  # backend/src/main/resources/scenarios/{인물}.yml 의 `safety_gates[].lint_forbidden_tokens`.
  # 이 목록은 그 합집합의 런타임 사본이며, content/ 는 클래스패스가 아니라 자동 동기화되지 않는다.
  # 동기화는 ContentSafetyGateEnforcementTest 가 강제한다(저작 ⊆ 런타임).
  #
  # scenarios/ 트리가 2026-08-05 에 추가된 이유: 거기 안전선은 *헤더 주석* 으로만 있었다.
  # job.yml 은 "R3 — 갑절 회복을 결말로 쓰지 않는다" 를 두 군데(헤더·scene5 restoration_note)에
  # 적어 두고도 토큰이 0종이라, "결국 갑절로 회복됩니다" 가 모든 게이트를 통과했다(실측).
  # 산문으로 선언된 축은 게이트가 아니다 — 이 트리를 검사 대상에 넣은 것이 그 교정이다.
  #
  # 2026-08-07 라합(Theme 20) 9종 추가 — scripts/gates/rahab.yml 의 `forbidden` 31종 중
  # 룻과 겹치지 않는 9종이다. 축은 "구원 서사로 과거를 지우기"(과거를 씻고/새사람이 되어/
  # 더 이상 기생이/직업을 버리고)와 "은혜의 원인을 인간 공로로 돌리기"(회개했기 때문에/
  # 믿었기 때문에/믿음 덕분에/그래서 쓰임받았/쓰시려고 그 자리에) 둘이다.
  #  ⚠️ 이 중 둘은 *이미 막히고 있었다* — '믿음 덕분에' ⊃ 기존 '덕분에',
  #    '쓰시려고 그 자리에' ⊃ 기존 '쓰시려고'. 곧 실효 신규 차단은 9종이 아니라 7종이고,
  #    나머지 둘은 게이트 G5b(저작 ⊆ 런타임 *멤버십*)를 통과시키기 위한 선언이다.
  #    G5b 초록을 "9종만큼 더 막힌다"로 읽으면 안 된다 — 그 게이트는 표면 커버리지가
  #    아니라 목록 동기화를 잰다.
  forbidden-tokens:
    list: >-
      가장 좋은 것으로,가족까지 잃게 될,가족까지 잃게 됩,감당할 만하니,감당할 수 있는 사람에게만,
      감사가 부족,감사하면 회복,감추고 사시겠,감추고 사시면 안,감추고 사십시,
      감추고 살지 마,갑절로 갚,갑절로 돌려,갑절로 돌아오,갑절로 주십,
      갑절로 채워,갑절로 회복,같이 묻히,갚아 주실,거저 주어진 것이 아,
      거저 주어진 게 아,거저 주어진 자리가 아,건져 주십니다,게을러서 그,견뎌 내셨,
