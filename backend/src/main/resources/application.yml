# === Telegram ChatOps 알람 ===
chatops:
  telegram:
    enabled: ${CHATOPS_TELEGRAM_ENABLED:false}
    bot-token: ${CHATOPS_TELEGRAM_BOT_TOKEN:}
    chat-id: ${CHATOPS_TELEGRAM_CHAT_ID:}
    base-url: https://api.telegram.org

# === 근거성 골든셋 정기 채점 (승격계약 §2 의 지속 측정) ===
# 기본 꺼짐. 켜면 매 주기 유료 임베딩 API 를 호출하므로 배포자가 명시적으로 켠다.
# 결과는 `grounding.goldenset.*` 게이지로 /actuator/prometheus 에 실려 기존 ServiceMonitor 가 수집.
grounding:
  eval:
    enabled: ${GROUNDING_EVAL_ENABLED:false}
    cron: ${GROUNDING_EVAL_CRON:0 30 3 * * *} # 매일 03:30 KST
    version: ${GROUNDING_EVAL_VERSION:v1}
    embedding-model: ${GROUNDING_EVAL_EMBEDDING_MODEL:gemini-embedding-001}
    api-key: ${GEMINI_API_KEY:}

# === XR 자산 ===
asset:
  manifest:
    cdn-base-url: ${ASSET_CDN:https://r2.lemuel.co.kr/assets}

# === Actuator (운영 모니터링) ===
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
    info:
      enabled: true
  prometheus:
    metrics:
      export:
        enabled: true
  tracing:
    # 운영 10% 샘플링. dev: TRACING_SAMPLING=1.0 으로 모두.
    sampling:
      probability: ${TRACING_SAMPLING:0.1}
    propagation:
      type: w3c
  otlp:
    tracing:
      endpoint: ${OTLP_ENDPOINT:http://tempo.monitoring.svc:4318/v1/traces}
      compression: gzip
      timeout: 10s
  metrics:
    distribution:
      # endpoint별 latency histogram (Grafana p50/p95/p99 차트용)
      percentiles-histogram:
        http.server.requests: true
        emotion.classify: true
        game.decide: true
      percentiles:
        http.server.requests: 0.5, 0.95, 0.99
    tags:
      application: lemuel-xr-backend

# === Server ===
server:
  port: ${SERVER_PORT:8080}
  servlet:
    encoding:
      charset: UTF-8
      force: true
  tomcat:
    uri-encoding: UTF-8

# === 로깅 ===
logging:
  charset:
    console: UTF-8
    file: UTF-8
  pattern:
    # %X{traceId}/%X{spanId} — Micrometer Tracing 이 MDC 에 박는 OTel trace context.
    # Grafana 에서 log → trace jump 가능 (Tempo derived field 매핑).
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] [%X{traceId:-}/%X{spanId:-}] %-5level %logger{36} - %msg%n"
