          text_ko: "그 후에 예수께서 디베랴 호수에서 또 제자들에게 자기를 나타내셨으니 나타내신 일은 이러하니라 (요 21:1)"
        - speaker_ko: 해설
          text_ko: "시몬 베드로와 디두모라 하는 도마와 갈릴리 가나 사람 나다나엘과 세베대의 아들들과 또 다른 제자 둘이 함께 있더니 (요 21:2)"
        - speaker_ko: 베드로
          text_ko: "시몬 베드로가 나는 물고기 잡으러 가노라 하니 그들이 우리도 함께 가겠다 하고 나가서 배에 올랐으나 그 날 밤에 아무 것도 잡지 못하였더니 (요 21:3)"
        - speaker_ko: 해설
          text_ko: "날이 새어갈 때에 예수께서 바닷가에 서셨으나 제자들이 예수이신 줄 알지 못하는지라 (요 21:4)"
        - speaker_ko: 해설
          text_ko: "예수께서 이르시되 얘들아 너희에게 고기가 있느냐 대답하되 없나이다 (요 21:5)"
        - speaker_ko: 해설
          text_ko: "이르시되 그물을 배 오른편에 던지라 그리하면 잡으리라 하시니 이에 던졌더니 물고기가 많아 그물을 들 수 없더라 (요 21:6)"
