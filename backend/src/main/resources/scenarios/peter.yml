      caption_pacing:
        { auto_advance: false, advance: user, rewind_allowed: true }
      captions:
        - speaker_ko: 해설
          text_ko: "육지에 올라보니 숯불이 있는데 그 위에 생선이 놓였고 떡도 있더라 (요 21:9)"
        - speaker_ko: 예수
          text_ko: "예수께서 이르시되 지금 잡은 생선을 좀 가져오라 하시니 (요 21:10)"
        - speaker_ko: 해설
          text_ko: "시몬 베드로가 올라가서 그물을 육지에 끌어 올리니 가득히 찬 큰 물고기가 백쉰세 마리라 이같이 많으나 그물이 찢어지지 아니하였더라 (요 21:11)"
        - speaker_ko: 해설
          text_ko: "예수께서 이르시되 와서 조반을 먹으라 하시니 제자들이 주님이신 줄 아는 고로 당신이 누구냐 감히 묻는 자가 없더라 (요 21:12)"
        - speaker_ko: 해설
          text_ko: "예수께서 가셔서 떡을 가져다가 그들에게 주시고 생선도 그와 같이 하시니라 (요 21:13)"
        - speaker_ko: 해설
          text_ko: "이것은 예수께서 죽은 자 가운데서 살아나신 후에 세 번째로 제자들에게 나타나신 것이라 (요 21:14)"
        - speaker_ko: 예수
          text_ko: "그들이 조반 먹은 후에 예수께서 시몬 베드로에게 이르시되 요한의 아들 시몬아 네가 이 사람들보다 나를 더 사랑하느냐 하시니 이르되 주님 그러하나이다 내가 주님을 사랑하는 줄 주님께서 아시나이다 이르시되 내 어린 양을 먹이라 하시고 (요 21:15)"
        - speaker_ko: 예수
          text_ko: "또 두 번째 이르시되 요한의 아들 시몬아 네가 나를 사랑하느냐 하시니 이르되 주님 그러하나이다 내가 주님을 사랑하는 줄 주님께서 아시나이다 이르시되 내 양을 치라 하시고 (요 21:16)"
        - speaker_ko: 예수
          text_ko: "세 번째 이르시되 요한의 아들 시몬아 네가 나를 사랑하느냐 하시니 주께서 세 번째 네가 나를 사랑하느냐 하시므로 베드로가 근심하여 이르되 주님 모든 것을 아시오매 내가 주님을 사랑하는 줄을 주님께서 아시나이다 예수께서 이르시되 내 양을 먹이라 (요 21:17)"
      # 세 번째 문답(요 21:17) 직전에 뜬다. 셋 다 정당하고, 고르지 않는 것도 정당하다.
      # 무응답은 실패가 아니라 정상 경로다 — 그때 라벨은 없는 채로 마감 문구가 나간다.
      options:
        - { id: unforgivable, label_ko: 돌이킬 수 없다 }
        - { id: unworthy, label_ko: 자격이 없다 }
        - { id: afraid_again, label_ko: 또 그럴까 두렵다 }
      options_note: 무응답도 정상 경로다. 선택은 강제되지 않으며 고르지 않으면 default 를 쓴다.
      # 라벨 3 × 톤 3 + 라벨 없음 3. 자구는 저작 정본에서 그대로 옮긴 것이다.
      recovery_texts:
        unforgivable:
          strong: 세 번 부인한 그 밤은 지워지지 않았습니다. 그런데 그 밤을 다 알고 계신 주님이, 아침 바닷가에 먼저 불을 피워 놓고 계셨습니다.
          balanced: 그 밤에 있었던 일은 없던 일이 되지 않았습니다. 그리고 그 일을 가장 정확히 아는 분이 아침 바닷가에 있었다는 것도, 같이 남아 있습니다.
          soft: 돌이킬 수 없는 밤이 있었습니다. 그 다음 날 아침에도 바닷가에는 불이 피워져 있었고, 이름을 부르는 목소리가 있었습니다.
        unworthy:
          strong: 세 번째 물음 앞에서 베드로는 근심했습니다. 주님은 그 근심을 걷어내지 않으신 채로, 그 물음 안에서 그를 「요한의 아들 시몬」이라고 부르셨습니다.
          balanced: 그 아침에 자격을 묻는 말은 없었습니다. 세 번째 물음까지도, 묻는 분이 그를 부르는 이름은 계속 「요한의 아들 시몬」이었습니다.
          soft: 자격을 확인하는 절차는 없었습니다. 세 번 다 같은 이름으로 불렸을 뿐입니다.
        afraid_again:
          strong: 또 그럴까 하는 두려움은 쉽게 사라지지 않습니다. 그 밤이 오기 전에 주님은 이미 「네 믿음이 떨어지지 않기를 기도하였노니」라고 말씀하셨습니다.
          balanced: 또 그럴까 하는 두려움이 남아 있습니다. 그 두려움이 생기기 전에, 너를 위하여 기도했다고 말한 분이 먼저 있었습니다.
          soft: 또 그럴까 하는 두려움이 남아 있습니다. 그런데 그 밤보다 먼저 있었던 말이 하나 있었고, 그것은 무너지지 않기를 바라는 기도였습니다.
        default:
          strong: 무엇이라고 이름 붙이지 않아도 괜찮습니다. 그 아침 바닷가에서 주님이 부르신 것은 어떤 상태가 아니라 「요한의 아들 시몬」이라는 한 사람이었습니다.
          balanced: 무엇이라고 이름 붙이지 않아도 괜찮습니다. 그 아침에 이름을 부른 분이 부른 것은 어떤 상태가 아니라 한 사람의 이름이었습니다.
          soft: 무엇이라고 이름 붙이지 않아도 괜찮습니다. 그 아침 바닷가에서 불린 것은 어떤 상태가 아니라 한 사람의 이름이었습니다.
      crisis_reminder: 미션이 끝난 뒤에도 이야기를 들어줄 곳이 있습니다. {{crisis_resources.default}}
      # 배제 자구를 값으로 적지 않는다. extras 는 payload 로 통째 복사되므로, 잘라낸
      # 문자열을 여기 적으면 잘라낸 그 문장이 화면으로 나간다. 사유는 문서 경로로만 가리킨다.
      scope_note: 이 Scene 은 요한복음 21:17 에서 끝난다. 그 이후 절의 배제 사유는 docs/MVP-PETER.md 참조.
      timeline_note: >-
        회복에 시간표를 붙이지 않는다. 이 아침 뒤에도 베드로의 두려움이 사라졌다고
        본문은 말하지 않으며, 이 미션도 그렇게 말하지 않는다.
      next_scene_suggestion: 시편 51 — 자기를 아는 자리에서 드리는 기도
