# 솔로몬 미션 시나리오 — 해 아래, 빈 손. MVP-SOLOMON.md §1~2 + MVP-SOLOMON-CONTENT.md §1~6 설계 기반.
#
# 핵심 메시지: "공허는 네 잘못이 아니다. 채움이 아니라 방향을 묻는 신호다 — 하나님을 경외하라."
#   (MVP-SOLOMON.md §1 핵심 메시지)
#
# 구원 카테고리: 성공 속 허무(실존적 공허) 재정향 — 기존 5 유형에 없는 6번째 (MVP-SOLOMON.md 헤더).
# 감정 anchor 곡선: 부담 → 수용됨 → 분별 → 허무 → 재정향(안착).
#
# 신학 기준: 대한예수교장로회 합신 / 웨스트민스터 표준 / 개혁주의 (프로젝트 단일 기준, MVP-JESUS.md §4.3 준용).
#   지혜 = 구함의 대상, 하나님의 선물 — 인간 성취 아님 (왕상 3:9·3:28).
#   전도서의 결론은 허무의 *부정* 이 아니라 허무 *곁의 방향* — "경외"는 숙제가 아니라 안착 (전 12:13).
# 배제: 외경·영지주의·뉴에이지 혼합 · "성공=축복의 증거" 번영복음 · "성공=죄" 금욕주의 양쪽 모두.
# disputed_points (MVP-SOLOMON.md §12.6): 전도서 저작 / 말년 타락(왕상 11) 범위 제외 /
#   헤벨 번역 스펙트럼 / 산당 일천번제(왕상 3:3~4) / 칼 명령의 성격(집행 의도 vs 시험 장치).
#
# 안전선 (MVP-SOLOMON.md §12.4):
#   R1 — 솔로몬 본문에 자살사고 *부재*. 죽음선호 구절(전도서 4장 초반 류)은 인용·각색·암시 전면 금지.
#        이 파일은 그 구절의 기계 검증(참조 문자열 0건) 대상이다.
#   R2 — Scene 4 는 공감 먼저·교정 없음. "허무는 믿음/감사 부족" 류 표현 0건.
#   R3 — Scene 5 내려놓기 비강제. "이제 깨달았으니 열심히" 류 재정향 압박 0건. 20초 침묵 대기 후 완주 처리.
#   R4 — Scene 3 (영아 상실 언급·칼, mid) / Scene 4 (허무 정서, low~mid) 진입 전 동의 게이트 + skip 대체 경로.
#   R5 — ai_assist_footer 항상 노출. 기본 경로 LLM 0회 (전 분기 정적 큐레이션).
#
# 위기 자원: MVP-SOLOMON-CONTENT.md 는 위기 번호를 {{crisis_resources.default}} 토큰으로만 표기한다
#   (하드코딩 금지 — §0.1·§0.5). 현재 main 에는 시나리오 yml 토큰 리졸버가 없으므로
#   crisis_reminder 필드를 *의도적으로 비워 둔다*. PR #18(위기번호 토큰화) 머지 후 토큰으로 추가할 것.
#   잘못된 번호를 제품에 넣는 것보다 필드 부재가 낫다.

character: solomon
title: 해 아래, 빈 손
target_user: general
# MVP-SOLOMON-CONTENT.md §0.5 — 화면 좌하단 영구 노출. 위기 자원 토큰부는 리졸버 부재로 제외(위 주석).
ai_assist_footer: "AI 보조 — 본문은 성경 참조 — storyteller 역할"
scenes:
  - id: 1
    title: 기브온의 일천번제
    type: interaction
    interaction: grab_and_place
    duration_sec: 60
    scripture_ref: 1kgs-3:9
    extras:
      anchor: 부담·부족감
      static_text: "아버지의 자리는 크고, 나는 작다. 이 왕관은 왜 이렇게 무거운가."
      script:
        - at_sec: 0
          beat: narration
          text: "다윗의 아들, 젊은 왕이 기브온 산당에 올라 일천 번제를 드렸다."
          ref: 1kgs-3:4
        - at_sec: 12
          beat: inner_voice
          text: "아버지의 자리는 크고, 나는 작다. 이 왕관은 왜 이렇게 무거운가."
        - at_sec: 30
          beat: inner_voice
          text: "종은 작은 아이라 출입할 줄을 알지 못하나이다"
          ref: 1kgs-3:7
        - at_sec: 44
          beat: petition
          text: "듣는 마음을 종에게 주사 주의 백성을 재판하여 선악을 분별하게 하옵소서"
          ref: 1kgs-3:9
      # 제물 올리기 — 비핵심 도입 연출. 서사 상태 불변, 구현 optional(자동 연출 대체 허용).
      offering:
        object_id: offering_bundle
        core: false
        auto_proceed_after_sec: 25
        meta_key: offering_placed # interaction_meta 기록만 — 분기·평가에 사용하지 않음
      crown_object: crown # Scene 5 내려놓기 오브젝트 #1 (항상 등장)
      skippable_after_sec: 3 # safety — 조용한 도입이 지루한 사용자 보호 (users.skip_intro_silence)
    next: 2

  - id: 2
    title: 꿈에 응답하신 하나님
    type: cinematic
    duration_sec: 45
    scripture_ref: 1kgs-3:12
    extras:
      anchor: 수용됨
      static_text: "내가 또 네가 구하지 아니한 부귀와 영광도 네게 주노니"
      script:
        - at_sec: 0
          beat: narration
          text: "기브온에서 밤에 여호와께서 꿈에 솔로몬에게 나타나셨다."
          ref: 1kgs-3:5
        - at_sec: 10
          beat: dream_voice
          text: "네가 이것을 구하도다 자기를 위하여 장수하기를 구하지 아니하며 부도 구하지 아니하며 자기 원수의 생명을 멸하기도 구하지 아니하고 오직 송사를 듣고 분별하는 지혜를 구하였으니"
          ref: 1kgs-3:11
        - at_sec: 23
          beat: dream_voice
          text: "내가 네 말대로 하여 네게 지혜롭고 총명한 마음을 주노니"
          ref: 1kgs-3:12
        - at_sec: 33
          beat: dream_voice
          text: "내가 또 네가 구하지 아니한 부귀와 영광도 네게 주노니"
          ref: 1kgs-3:13
      no_form_representation: true # 하나님은 형상 없이 꿈 속 음성과 빛으로만 (실사·형상 배제)
    next: 3

  - id: 3
    title: 두 여인 재판
    type: interaction
    interaction: pick_one
    duration_sec: 120
    scripture_ref: 1kgs-3:28
    extras:
      anchor: 분별·긴장
      static_text: "증거는 없다. 두 주장만 남았다. 왕이여 — 어떻게 판결하시겠습니까."
      script:
        - at_sec: 0
          beat: narration
          text: "그 때에 두 여자가 왕에게 와서 그 앞에 섰더라"
          ref: 1kgs-3:16
          excerpt_note: "요약 — '창기' 생략은 여인 비낙인화 목적의 의도적 각색"
        - at_sec: 10
          beat: woman_a
          text: "이 여자가 밤에 아이를 잃고, 내가 잠든 사이에 내 아들을 데려다가 자기 품에 뉘었나이다. 산 아이가 내 아들이니이다."
          ref: 1kgs-3:19-21
        - at_sec: 26
          beat: woman_b
          text: "아니라 산 것은 내 아들이요 죽은 것은 네 아들이라"
          ref: 1kgs-3:22
        - at_sec: 38
          beat: judgment_prompt
          text: "증거는 없다. 두 주장만 남았다. 왕이여 — 어떻게 판결하시겠습니까."
        - at_sec: 70
          beat: sword_command
          text: "칼을 가져오라 … 산 아이를 둘로 나누어 반은 이 여자에게 주고 반은 저 여자에게 주라"
          ref: 1kgs-3:24-25
        - at_sec: 84
          beat: true_mother
          text: "청하건대 내 주여 산 아이를 그에게 주시고 아무쪼록 죽이지 마옵소서"
          ref: 1kgs-3:26
        - at_sec: 96
          beat: verdict
          text: "산 아이를 저 여자에게 주고 결코 죽이지 말라 저가 그의 어머니이니라"
          ref: 1kgs-3:27
        - at_sec: 108
          beat: awe
          text: "온 이스라엘이 … 왕을 두려워하였으니 이는 하나님의 지혜가 그의 속에 있어 판결함을 봄이더라"
          ref: 1kgs-3:28
      # 핵심 인터랙션 #1 — 판결 선택. 세 분기 모두 사전 작성 정적 텍스트, LLM 호출 0회.
      options:
        - { id: first_woman, label: "산 아이를 첫째 여인에게 주라", converges_to: sword_test }
        - { id: second_woman, label: "산 아이를 둘째 여인에게 주라", converges_to: sword_test }
        - { id: sword_test, label: "칼을 가져오라", scripture_path: true }
      # (a)/(b) 재고 텍스트 — 오답 처리 아님. 원문(MVP-SOLOMON-CONTENT.md §3.3)에는 (a) 예시 1종만 저작돼 있다.
      # (b) 전용 문구는 소스 문서에 없어 비워 둔다 — 창작 금지. 저작 후 second_woman 키로 추가할 것.
      reconsider_texts:
        first_woman: "왕이 첫째 여인에게 아이를 주려 하자, 둘째 여인이 부르짖었다 — '아니라, 산 것은 내 아들이라.' 증거는 없고 두 주장만 남았다. 왕은 판결을 멈추고, 두 여인의 마음을 드러낼 다른 길을 생각했다."
      default_choice: sword_test
      default_choice_after_sec: 40 # 미선택 40초 경과 시 (c) 자동 진행
      # R4 skip 대체 경로 — 비묘사 요약 자막 1장 후 Scene 4 진행 (서사 연속성 유지).
      skip_summary_caption:
        text: "왕은 칼을 가져오라 명하여 두 여인의 마음을 드러냈고, 산 아기는 참 어머니의 품으로 돌아갔다. 온 이스라엘이 왕 안에 있는 하나님의 지혜를 보고 두려워하였다."
        ref: 1kgs-3:27-28
      skip_replaces_scene5_object: { from: sword, to: verdict_scroll } # 칼 시각 트리거 회피 일관성
      dead_infant_visualized: false # 죽은 아기는 시각화·등장 없음 — 대사 언급만, 경위 묘사 배제
      sword_touches_child: false # 칼은 들어올려질 뿐 아기에게 닿지 않음 — 마음을 드러내는 시험의 말로만
      intensity_toggle: [captions_only, mild, default]
    trigger_warning:
      level: medium
      content: ["infant_loss", "bereavement", "child_endangerment"]
      consent_card_id: "solomon_scene3_infant_loss_warning"
      skip_alternative_scene_id: 4
    next: 4

  - id: 4
    title: '영광의 정점에서 "헛되다"'
    type: interaction
    interaction: pick_one
    duration_sec: 120
    scripture_ref: eccl-2:11
    extras:
      anchor: 허무·공허
      static_text: "이만큼 가진 사람도 이렇게 적었다. 공허는 배부른 투정이 아니다. 지금 그 마음 그대로, 이름을 붙여 보아도 좋다."
      script:
        - at_sec: 0
          beat: narration
          text: "솔로몬 왕의 재산과 지혜가 세상의 그 어느 왕보다 큰지라"
          ref: 1kgs-10:23
        - at_sec: 12
          beat: elder_recollection
          text: "나는 은을 돌 같이 흔하게 하였다. 집들을 짓고, 포도원을 일구고, 못을 팠다."
          ref: 1kgs-10:27
          excerpt_note: "왕상 10:27; 전 2:4~6, 요약"
        - at_sec: 27
          beat: elder_recollection
          text: "무엇이든지 내 눈이 원하는 것을 내가 금하지 아니하며 무엇이든지 내 마음이 즐거워하는 것을 내가 막지 아니하였으니"
          ref: eccl-2:10
        - at_sec: 42
          beat: elder_recollection
          text: "그 후에 내가 생각해 본즉 내 손으로 한 모든 일과 내가 수고한 모든 것이 다 헛되어 바람을 잡는 것이며 해 아래에서 무익한 것이로다"
          ref: eccl-2:11
        - at_sec: 55
          beat: caption
          text: "헛되고 헛되며 헛되고 헛되니 모든 것이 헛되도다"
          ref: eccl-1:2
        - at_sec: 66
          beat: empathy_block
          text: "이만큼 가진 사람도 이렇게 적었다. 공허는 배부른 투정이 아니다. 지금 그 마음 그대로, 이름을 붙여 보아도 좋다."
      # 허무 라벨링 (Affect Labeling) — 선택은 초대이지 과제가 아님. 미선택 30초 시 라벨 없이 진행.
      options:
        - { id: emptiness, label: "다 이루었는데, 비어 있습니다", gesture: "카드를 가슴으로 가져옴" }
        - { id: restlessness, label: "멈추면 무너질 것 같아, 계속 쌓기만 합니다", gesture: "카드를 내려놓음" }
        - { id: loss_of_meaning, label: "이 모든 것이 무슨 의미인지 모르겠습니다", gesture: "카드를 두 손으로 감쌈" }
      decision_key: hevel_label
      optional_selection: true
      no_selection_after_sec: 30
      dwell_limit_sec: 90 # 허무 체류 상한 — 우울 상태 심화 방지 (§12.4)
    trigger_warning:
      level: low_medium
      content: ["emptiness", "existential_despair"]
      consent_card_id: "solomon_scene4_hevel_warning"
      skip_alternative_scene_id: 5
    next: 5

  - id: 5
    title: 재정향 — 하나님을 경외하라
    type: outro
    duration_sec: 60
    scripture_ref: eccl-12:13
    # MVP-SOLOMON.md §11 — Track A Theme 3 (전도서와 인생 — 허무·공허) 의 서사게임 대응물.
    linked_values: [3]
    value_prompt: "이 시간을 기록하시겠어요?"
    extras:
      anchor: 단순함·안착
      static_text: "가장 많이 가진 왕이 마지막에 남긴 말은 하나뿐이었다 — 하나님을 경외하라."
      script:
        - at_sec: 0
          beat: narration
          text: "왕은 처음 구하던 자리로 돌아왔다. 제단의 불씨가 아직 남아 있었다."
        - at_sec: 10
          beat: conclusion
          text: "일의 결국을 다 들었으니 하나님을 경외하고 그의 명령들을 지킬지어다 이것이 모든 사람의 본분이니라"
          ref: eccl-12:13
        - at_sec: 24
          beat: laydown_invitation
          text: "손에 들려 있던 것들을 제단 앞에 내려놓아도 좋다. 내려놓지 않아도 괜찮다. 이 자리는 시험이 아니다."
      # 핵심 인터랙션 #2 — 내려놓기 (grab-and-place, 비강제). 경로 의존 오브젝트.
      laydown:
        objects:
          - { id: crown, label: 왕관, meaning: "Scene 1 의 부담", appears: always }
          - { id: sword, label: 칼, meaning: "Scene 3 판결의 무게", appears: scene3_completed }
          - { id: verdict_scroll, label: 판결 두루마리, meaning: "칼 시각 트리거 회피", appears: scene3_skipped }
          - { id: treasure, label: 보물, meaning: "Scene 4 의 허무", appears: scene4_visited }
        required: false # 하나만/셋 다/하나도 안 내려놓아도 모두 완주
        wait_sec: 20
        on_timeout: treat_as_complete
        nudge_prompts: false # 재촉 프롬프트 없음 — 침묵 대기만
      # 재정향 문구 — hevel_label × faith_tone 9 조합 정적 큐레이션 (MVP-SOLOMON-CONTENT.md §6).
      # 라벨 없음(Scene 4 skip/미선택) 경로는 default 1종. 기본 경로 LLM 호출 0회.
      reorientation_texts:
        emptiness:
          strong: "부귀와 영광은 하나님이 덤으로 주신 것이었다 (왕상 3:13). 채움이 끝난 자리에서 남는 것은 한 가지 — 하나님을 경외하라 (전 12:13). 그 빈 자리는 실패의 자리가 아니라 그분 앞에 서는 자리다."
          balanced: "다 가진 왕도 비어 있었다. 전도서는 그 공허를 꾸짖지 않고 먼저 끝까지 말하게 한다. 그리고 채움이 아니라 방향 하나를 남긴다 — 경외."
          soft: "3000년 전, 가장 많이 가진 사람도 '헛되다'고 적었다. 비어 있다고 느끼는 당신이 이상한 것이 아니다. 오늘은 그 느낌을 인정한 것으로 충분하다."
        restlessness:
          strong: "은을 돌같이 쌓은 왕이 생각해 본즉 바람을 잡는 것이었다 (전 2:11). 쌓는 손을 멈추는 것은 신앙의 후퇴가 아니다. 경외는 달리는 것이 아니라 그분 앞에 서는 것이다."
