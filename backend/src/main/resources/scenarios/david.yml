# 다윗 미션 시나리오 — 다섯 개의 돌. MVP-DAVID.md 설계 기반.
# 핵심 감정 anchor: 작음 · 모욕 · 정체성 · 떨림 · 해방.
# 6 Scene · 5~7분.
#
# 핵심 메시지: "여호와의 구원하심이 칼과 창에 있지 아니함이라" (삼상 17:47) —
#   전투의 승리가 아니라 *자기 갑옷을 벗는 정체성의 해방* 이 이 미션의 축이다.
#
# 신학 기준: 대한예수교장로회 합신 / 웨스트민스터 표준 / 개혁주의 (프로젝트 단일 기준, MVP-JESUS.md §4.3 준용).
# 배제: 외경·영지주의·뉴에이지 혼합·"믿음 크면 골리앗(문제)도 쓰러진다" 식 승리 보장 프레임.
#
# 안전선: 승리 압박 금지 — 골리앗 씬이 '네 문제도 이렇게 단번에 쓰러뜨려라' 는 성취 압박이 되지 않게 한다.
#         폭력 미화 금지 — 물맷돌 씬은 통쾌함이 아니라 '떨림 → 일어섬' 의 체험이다.
#         R4 — Scene 5 (골리앗) 폭력 묘사 → trigger_warning + 스킵 대체. Scene 2 가족 모욕 → skip 옵션.
#         R1 — outro 위기 라우팅. R5 — ai_assist_footer 항상 노출.

# 위기 연락처는 하드코딩하지 않는다 — `{{crisis_resources.default}}` 토큰만 쓴다.
# ScenePayloadAssembler → CrisisTokenResolver 가 crisis_resources 정본(우선순위 1위 활성 전화)으로
# 치환한다. 번호를 yml 에 직접 적으면 정책 개정(예: 2024-01-01 자살예방 상담 109 통합) 때
# 낡은 번호가 위기 카피에 그대로 남는다. ScenarioHotlineRatchetTest 가 이를 강제한다.

character: david
title: 다섯 개의 돌
target_user: general
# AI 보조 — 본문은 성경 참조. monologue 캐시 포함 모든 LLM 텍스트에 필수.
ai_assist_footer: "AI 보조 — 본문은 성경 참조"
scenes:
  - id: 1
    title: 양 떼와 시편
    type: interaction
    interaction: contemplative
    duration_sec: 60
    narration_id: david.scene1.narration
    scripture_ref: ps-23:1-6
    extras:
      anchor: 평온·자기 존재감
      activity: lyre_strings
      strings_count: 25
      skippable_after_sec: 3   # safety — 조용한 도입이 지루한 사용자 보호 (users.skip_intro_silence)
    next: 2

  - id: 2
    title: 형들의 비웃음
    type: interaction
    interaction: pick_one
    duration_sec: 60
    scripture_ref: 1sam-17:28
    extras:
      anchor: 모욕감·내적 분노
      options:
        - { id: rebut,  label: "반박한다",   reference: 1sam-17:29 }
        - { id: silence, label: "침묵한다" }
        - { id: walk_past, label: "전선 쪽으로 걸어간다" }
      monologue_cache_keys:
        rebut:     david.s2.reaction.rebut
        silence:   david.s2.reaction.silence
        walk_past: david.s2.reaction.walk_past
      safety_skip_after_sec: 3   # 가족 트라우마 자극 시 skip
      family_note: "R 가드 — 형 엘리압의 비난은 다윗의 잘못이 아니었다 (삼상 17:28-29). 가족의 말이 남긴 상처에 '네가 예민한 탓' 프레임을 싣지 않는다. 세 반응 중 정답은 없다."
    next: 3

  - id: 3
    title: 사울의 갑옷
    type: interaction
    interaction: gesture_sequence
    duration_sec: 120
    scripture_ref: 1sam-17:38-39
    extras:
      anchor: 자기 정체성·해방
      steps:
        - { id: wear,    label: "갑옷을 입어본다" }
        - { id: walk,    label: "걸어본다 (비틀거림)" }
        - { id: remove,  label: "벗는다" }
      hapticHint: { intensity: 0.8, pattern: RUMBLE, channel: BOTH, fallback: { audioCueId: armor-weight } }
      identity_note: "남의 갑옷(남의 기준·남의 성공 방식)을 벗는 것이 이 미션의 실제 클라이맥스다. 골리앗보다 먼저 갑옷이 있다."
    next: 4

  - id: 4
    title: 시냇가의 5돌
    type: interaction
    interaction: distribute
    duration_sec: 120
    scripture_ref: 1sam-17:40
    extras:
      anchor: 두려움+신뢰 통합
      stones:
        - { id: fear,         label: "공포",   weight: 0.20 }
        - { id: humiliation,  label: "모욕",   weight: 0.20 }
        - { id: loneliness,   label: "외로움", weight: 0.20 }
        - { id: trust,        label: "신뢰",   weight: 0.20 }
        - { id: prayer,       label: "기도",   weight: 0.20 }
      pool_total: 7   # 7개 중 5개 선택
      monologue_cache_keys:
        # 어느 돌을 *마지막*으로 가져가느냐로 캐시 분기 (5종)
        last_fear:        david.s4.last.fear
        last_humiliation: david.s4.last.humiliation
        last_loneliness:  david.s4.last.loneliness
        last_trust:       david.s4.last.trust
        last_prayer:      david.s4.last.prayer
      integration_note: "공포·모욕·외로움도 '가져가는 돌' 이다 — 부정 감정의 제거가 아니라 신뢰·기도와의 *동행* 이 이 씬의 설계 의도다."
    next: 5

  - id: 5
    title: 골리앗
    type: interaction
    interaction: two_handed_throw
    duration_sec: 60
    scripture_ref: 1sam-17:45
    extras:
      anchor: 떨림 → 일어섬
      sling_rotation_min_sec: 5
      hapticHint: { intensity: 1.0, pattern: PULSE_HARD, channel: BOTH, fallback: { audioCueId: heart-pound } }
      violence_warning: true   # legacy flag — 구조화된 trigger_warning 병행 (하위 호환)
      victory_note: "R 가드 — 이 씬은 '문제를 단번에 쓰러뜨리는 승리' 를 약속하지 않는다. \"여호와의 구원하심이 칼과 창에 있지 아니함이라\" (삼상 17:47) — 초점은 결과가 아니라 떨림 속에서 일어선 것 자체다."
    trigger_warning:
      level: medium
      content: ["violence"]
      consent_card_id: "david_scene5_goliath_warning"
      skip_alternative_scene_id: 6
    next: 6

  - id: 6
    title: 회복
    type: outro
    duration_sec: 30
    scripture_ref: 1sam-17:46-47
    # CROSS-MAPPING-VR-AR.md §3 — 다윗이 빛내는 AR 1~7 가치 (●●●)
    linked_values: [1, 4, 7]   # 일기(솔직함) · 시편(시편 저자) · 사람(사울 추격 두려움)
    value_prompt: "다윗의 시편은 그의 *일기장* 이었습니다. 좋은 일만 적는 일기가 건강한 일기가 아닙니다. 오늘 *솔직한 한 줄* 을 적어보세요."
    extras:
      anchor: 자기 작음의 평화
      stones_remaining: 4
      static_monologue: "돌은 다섯 개였고 쓰인 것은 하나였습니다. 남은 네 개는 실패의 대비가 아니라 *작음 그대로 준비된 자* 의 평화였습니다. 오늘 당신의 작음도 결격 사유가 아닙니다."
      recovery_keys:
        ANXIOUS:    david.recovery.fear_with_trust
        CONFUSED:   david.recovery.armor_off
        LONELY:     david.recovery.psalm_companion
        ANGRY:      david.recovery.eliav_silenced
        EXHAUSTED:  david.recovery.small_active
      crisis_reminder: "{{crisis_resources.default}}."   # R1 — 위기 감지 시 1번 정적 콘텐츠(일기+상담)로 라우팅
      next_scene_suggestion: "트랙 A — 1번 일기(솔직한 한 줄) 또는 시편 감정 카드"
    next: null
