# 예수 미션 시나리오 — 길이요 진리요 생명. MVP-JESUS.md 설계 기반.
# 핵심 메시지: "나는 길이요 진리요 생명이니 나로 말미암지 않고는 아버지께로 올 자가 없느니라" (요 14:6)
#   — 요셉(경제)·모세(정치)·다윗(외세) 구원을 *영적 구원* 이 감싸 안는 정점(capstone).
# 성령·생명의 강(요 7:38-39, 계 22:1) 모티프 — 성령을 구속사적으로만 다룸(은사지속·체험 프레임 X).
# 구원은 오직 그리스도 안에서 오직 믿음으로(sola fide) — 믿음은 칭의를 받는 유일한 도구, 행위는 열매.
# 7 Scene · 7~9분.
#
# 신학 기준: 대한예수교장로회 합신 / 웨스트민스터 표준 / 개혁주의 로 단일 확정 (MVP-JESUS.md §4.3).
#   속죄론=형벌 대속(penal substitution) 중심 · 신론=고전적 유신론(그리스도 인성이 고난받으심) ·
#   성령=은사중지론 계열(구속사적) · 구원론=특수구속·유일성(포용주의·다원주의·만인구원 배제) · 이신칭의=sola fide.
# 배제: 외경·영지주의·뉴에이지·타종교 혼합·아르미니우스주의·펜테코스탈 은사지속·개방신론·번영복음.
#
# 안전선: R3(부활 회복 압박) 금지 — 부활은 예수의 사역/약속으로 제시, 사용자에게 회복 강요 X.
#         R2(고난 가스라이팅) 금지 — 고난 미화·정당화 X. R1 위기 라우팅 훅 outro 에 배치.
#         R5 AI 보조 footer("AI 보조 — 본문은 성경 참조") 항상 노출.
# 개혁주의 정통성과 R1~R5 정신건강 안전선은 양립 — 형벌 대속 확정이 고난 미화/회복 강요 근거가 되어선 안 됨.

# 위기 연락처는 하드코딩하지 않는다 — `{{crisis_resources.default}}` 토큰만 쓴다.
# ScenePayloadAssembler → CrisisTokenResolver 가 crisis_resources 정본(우선순위 1위 활성 전화)으로
# 치환한다. 번호를 yml 에 직접 적으면 정책 개정(예: 2024-01-01 자살예방 상담 109 통합) 때
# 낡은 번호가 위기 카피에 그대로 남는다. ScenarioHotlineRatchetTest 가 이를 강제한다.

character: jesus
title: 길이요 진리요 생명
target_user: general
# AI 보조 — 본문은 성경 참조. Scene 4·7 응답은 LLM 생성(사전 캐시), 나머지는 정적 본문 낭독.
ai_assist_footer: "AI 보조 — 본문은 성경 참조"

# ─────────────────────────────────────────────────────────────────────────────
# 2026-08-11 신설. 그 전까지 이 파일의 R2·R3 는 *주석으로만* 선언돼 있었다.
# 위 "안전선:" 줄이 R3 를 금지한다고 적어 두었지만 집행 수단이 없었으므로 아무것도 막지
# 못했다 — 전역 금칙 토큰 625종 중 '부활' 을 포함한 것이 0종이었고, 이 파일이 자기 산문으로
# 금지한 문장("너도 부활하라/극복하라")을 그대로 통과시켰다. 실측으로 확인하고 닫는다.
# 같은 구멍이 2026-08-05 job.yml 에서 한 번 났었다(application.yml 사후 기록 참조).
#
# ⚠️ 이 토큰들은 **전역** 이다. `application.yml` 의 safety.forbidden-tokens.list 에 동기화되며
#    인물 구분 없이 모든 LLM 출력에 적용된다 — 즉 여기 넣는 순간 욥·엘리야·룻 미션의 출력도
#    함께 막는다. 그래서 예수 서사에만 있는 표층형이 아니라 *어느 인물에서든 위반인* 형태만 넣었다.
#
# 【무엇으로 갈랐나】 부활 어휘로는 정통과 압박을 가를 수 없다. 가르는 것은 **귀결절**이다.
#    허용: 주어가 그리스도·성령(3인칭 신적 주어) + 종말 시제 + 사역형("일어나게 하시다")
#    금지: 주어가 당신·스스로(2인칭·재귀) + 현재/즉시 + 명령·당위(-세요·-십시오·-셔야 합니다)
#    그래서 토큰을 어간("부활하셔야")이 아니라 **종결형**("당신도 부활하셔야 합")에서 끊었다.
#    어간에서 끊으면 웨스트민스터가 *가르치는* 문장을 막는다 — 실측으로 확인한 과차단 5종:
#      · "마지막 날에 당신도 다시 일어나게 하실 것입니다"        (WCF 32.2 몸의 부활)
#      · "그리스도께서 부활하셔야 우리 믿음이 헛되지 않습니다"    (고전 15:14,17)
#      · "성령께서 부활의 능력으로 일어나게 하실 날이 옵니다"     (롬 8:11 / WCF 13.1)
#      · "성화는 스스로 일어서셔야 이루어지는 일이 아닙니다"      (WCF 16.3)
#      · "당신이 스스로 부활해 내셔야 하는 과제가 아닙니다"       ← **이 미션 자신의 R3 정본**
#    마지막 항목이 핵심이다. scene6 의 현행 문장은 반말("부활해 내야")이라 한 음절 차이로 겨우
#    통과한다. 존댓말로 다듬는 순간 자기 안전선이 자기 대본을 막는다. 어간 등재는 그 함정이다.
#
# 【못 막는 것 — 이 게이트를 초록으로 읽지 마라】 부분문자열 스캐너의 한계다. 실측 미포착:
#      · "이제 당신의 차례입니다"          — 조사 '의' 하나로 빠진다
#      · "부활의 소망으로 이 우울을 이겨 내세요" — 어절이 끼면 인접성이 깨진다
#      · "금요일이 지나면 당신의 주일도 옵니다" — 부활 어휘가 아예 없는 은유
#    닫힌 것은 **명시된 표층형뿐**이다. R3 축 자체는 LLM 시스템 프롬프트와 인간 검토가 맡는다.
#    `부활하셨듯` 같은 전제절은 의도적으로 등재하지 않았다 — 판정자가 뒤 귀결절이라
#    부분문자열로는 정통과 압박을 가를 수 없다(application.yml 의 "[못 막음]" 항목과 같은 이유).
# ─────────────────────────────────────────────────────────────────────────────
safety_gates:
  - id: R3_no_resurrection_pressure
    description: 부활 회복 압박 금지 — 그리스도의 부활을 사용자가 지금 재현·모방해야 할 과제로 틀거나, 회복을 2인칭 당위로 요구하는 서사
    lint_forbidden_tokens:
      # (a) 2인칭 부활 명령·당위 — 종결형에서 끊는다
      - "부활하세요"
      - "부활하십시"
      - "부활하시면"
      - "부활하셔도"
      - "당신도 부활하셔야 합"
      - "당신도 부활하셔야죠"
      - "스스로 부활하세"
      - "부활해 내셔야 합"
      - "부활해 내셔야죠"
      # (b) 그리스도 부활 → 당신 부활 유비 (귀결절이 2인칭인 것만)
      - "부활하셨듯 당신"
      - "부활하셨듯 여러분"
      - "부활하셨듯 너"
      - "부활하셨던 것처럼 당신"
      - "부활하신 것처럼 당신"
      - "부활하신 것처럼 여러분"
      - "살아나셨듯 당신"
      - "살아나셨듯 여러분"
      - "일어나셨듯 당신"
      - "일어나셨듯 여러분"
      # (c) 2인칭 재기동 명령 — '다시 일어나/살아' 는 사역형(신적 주어)을 살려야 하므로 종결형만
      - "당신도 다시 일어서"
      - "당신도 다시 살아"
      - "당신도 다시 일어나세"
      - "당신도 다시 일어나십"
      - "스스로 일어서세"
      - "스스로 일어서십"
      - "스스로 일어서셔야 합"
      - "스스로 일어서셔야죠"
      - "스스로 일어서시면 됩"
      # (d) 부활의 능력·소망을 회복 도구로 귀속
      - "부활의 능력으로 회복"
      - "부활의 능력으로 일어서세"
      - "부활의 능력으로 일어나세"
      - "부활의 능력이 당신"
      - "부활의 능력이 여러분"
      - "부활의 소망으로 극복"
      - "부활의 소망으로 이겨"
      - "부활의 소망으로 이기"
      - "부활의 소망을 붙들면"
      - "부활 신앙이 있다면"
      # (e) 순서·차례 프레임 — "이제 네 차례다"
      - "당신의 부활절"
      - "부활할 차례"
      - "살아날 차례"
      - "일어날 차례"
      # (f) 빈 무덤 서사의 2인칭 전용 — 요 20 서사 진술("나오셔서"·"나오셔야 할")은 살린다
      - "무덤에서 걸어 나오세"
      - "무덤에서 걸어 나오십"
      - "무덤에서 걸어 나오시면"
      - "무덤에서 걸어 나오셔야 해"
      - "무덤에서 걸어 나오셔야 합"
      - "무덤에서 걸어 나오셔야죠"
      - "무덤에서 나오세"
      - "무덤에서 나오십"
      - "무덤에서 나오시면"
      - "무덤에서 나오셔도"
      - "무덤에서 나오셔야 해"
      - "무덤에서 나오셔야 합"
      - "무덤에서 나오셔야죠"

scenes:
  - id: 1
    title: 성육신 — 말씀이 육신이 되어
    type: cinematic
    duration_sec: 60
    narration_id: jesus.scene1.narration
    scripture_ref: jn-1:14
    extras:
      anchor: 낮아짐·임재·시작
      static_monologue: "말씀이 육신이 되어 우리 가운데 거하셨습니다. 요셉의 저장도, 모세의 인도도, 다윗의 돌도 — 이 아기 앞에서 한 이야기의 여러 장(章)이 됩니다. 하늘이 낮은 구유로 내려왔습니다."
      skippable_after_sec: 3 # safety — 조용한 도입이 지루한 사용자 보호 (users.skip_intro_silence)
    next: 2

  - id: 2
    title: 산 위의 가르침 — 팔복
    type: interaction
    interaction: scripture_reading
    duration_sec: 90
    scripture_ref: matt-5:3 # book_code 정본은 `matt` (V6__scripture_embeddings.sql:11)
    extras:
      anchor: 뒤집힌 복·마음의 가난
      lines:
        - {
            ref: mt-5:3,
            text: "심령이 가난한 자는 복이 있나니 천국이 그들의 것임이요",
          }
        - {
            ref: mt-5:4,
            text: "애통하는 자는 복이 있나니 그들이 위로를 받을 것임이요",
          }
        - {
            ref: mt-5:6,
            text: "의에 주리고 목마른 자는 복이 있나니 그들이 배부를 것임이요",
          }
      reflection_prompt: "여기서 '복'은 성취가 아니라 *비어 있음* 에서 시작됩니다. 오늘 당신의 비어 있는 자리 하나를 떠올려 보세요 — 채우라는 압박 없이, 그저 인정만."
    next: 3

  - id: 3
    title: 만짐 — 병자를 고치심
    type: interaction
    interaction: gesture_sequence
    duration_sec: 90
    scripture_ref: mk-1:41
    extras:
      anchor: 접촉·존엄 회복
      steps:
        - {
            id: approach,
            label: "다가간다",
            note: "군중이 피하던 나병 환자에게 예수는 오히려 다가가셨습니다.",
          }
        - {
            id: reach_out,
            label: "손을 내민다",
            note: "'내가 원하노니 깨끗함을 받으라' — 말보다 먼저 손이 닿았습니다.",
          }
      hapticHint:
        {
          intensity: 0.35,
          pattern: PULSE_SOFT,
          channel: BOTH,
          fallback: { audioCueId: touch-warm },
        }
      note: "이 씬은 *치유의 즉효* 를 약속하지 않습니다. 예수의 *접촉하시는 성품* 을 체험하는 자리입니다. (R3 회복 압박 회피)"
    next: 4

  - id: 4
    title: 길이요 진리요 생명 — 갈림길에서
    type: interaction
    interaction: pick_one
    duration_sec: 120
    scripture_ref: jn-14:6
    extras:
      anchor: 방향·신뢰·핵심 통찰
      context_line: "'주여 어디로 가시는지 우리가 알지 못하거늘 그 길을 어찌 알겠사옵나이까' 하는 도마에게 (요 14:5)"
      options:
        - {
            id: the_way,
            label: "길 — 어디로 가야 할지 모를 때",
            scripture: jn-14:6,
            reference: jn-14:4,
          }
        - {
            id: the_truth,
            label: "진리 — 무엇이 참인지 흔들릴 때",
            scripture: jn-14:6,
            reference: jn-8:32,
          }
        - {
            id: the_life,
            label: "생명 — 살아갈 힘이 없을 때",
            scripture: jn-14:6,
            reference: jn-10:10,
          }
      monologue_cache_keys:
        # 어느 결핍으로 예수께 다가가느냐로 캐시 3분기 (× faith_tone 3 = 9 패턴)
        the_way: jesus.s4.iam.way
        the_truth: jesus.s4.iam.truth
        the_life: jesus.s4.iam.life
      teaching_note: "세 단어는 서로 다른 세 길이 아니라 *한 분* 의 세 얼굴입니다. 어느 결핍으로 오든 같은 분께 도착합니다. — 요 14:6 의 의도."
    next: 5

  - id: 5
    title: 겟세마네와 십자가 — 뜻대로 마옵시고
    type: interaction
    interaction: contemplative
    duration_sec: 120
    scripture_ref: lk-22:42
    extras:
      anchor: 내려놓음·함께 고통하심
      static_monologue: "'아버지여 만일 아버지의 뜻이거든 이 잔을 내게서 옮기시옵소서 그러나 내 원대로 마시옵고 아버지의 원대로 되기를 원하나이다.' 사람이 되신 그리스도께서 그 잔이 옮겨지기를 구하셨습니다. 고통 앞에서 흔들리는 것은 믿음의 결함이 아닙니다."
      cross_line: "'다 이루었다' (요 19:30) — 그리스도께서 죄의 형벌을 대신 다 치르셨습니다. 이것은 당신이 이루어야 할 숙제가 아니라, 이미 이루어진 선물입니다."
      contemplation_sec: 15
      suffering_footer: "이 묵상은 자발적인 고난의 의미를 다룹니다. 가정폭력·종교적 학대·정신적 학대 같은 피해 상황을 견디라는 강요가 아닙니다. 안전하지 않은 상황에 있다면 가까운 상담 자원에 연결되세요." # R2 필수 footer (Theme 11 십자가)
    trigger_warning:
      level: medium
      content: ["suffering", "death"]
      consent_card_id: "jesus_scene5_passion_warning"
      skip_alternative_scene_id: 6
    next: 6

  - id: 6
    title: 부활 — 빈 무덤
    type: interaction
    interaction: scripture_reading
    duration_sec: 90
    scripture_ref: jn-20:15
    extras:
      anchor: 소망·부르심·이름
      lines:
        - {
            ref: jn-20:15,
            text: "예수께서 이르시되 여자여 어찌하여 울며 누구를 찾느냐",
          }
