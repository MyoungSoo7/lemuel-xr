# 야곱 — 「내가 준 상처 앞에 다시 서기」
#
# 핵심 메시지: **회복은 상처를 받은 쪽에서만 시작되는 일이 아니다.**
#   이 미션의 사용자는 야곱의 자리에 선다 — 상처를 받은 쪽이 아니라 **준 쪽**이다.
#   트랙 B 에서 이 자리를 다루는 인물은 야곱 하나이며, 축은 저작이 배타 할당했다:
#   베드로=자기정죄로부터의 회복 · 아브라함=지연된 약속 · 야곱=내가 준 상처 앞에 다시 서기
#   (content/jacob/README.md).
#
# ─────────────────────────────────────────────────────────────────────────────
# ⚠️ 이 파일은 **아직 로드되지 않는다.**
#   ScenarioYamlLoader.loadAll() 은 `Character.entries` 를 순회한다 — 디렉터리가 아니다.
#   그래서 `Character` enum 에 JACOB("jacob") 이 없는 한 이 파일은 읽히지 않고
#   `/jacob` 은 열리지 않는다. 그 한 줄이 곧 사용자 노출이다.
#   여는 조건·범위·남은 빚은 docs/JACOB-RUNTIME-SIGNOFF.md 에 있고, 그 대장의
#   «노출 결정» 줄은 **사람이 채운다.** RuntimeExposureSignoffTest 가 그것을 집행한다.
#   · 전문 신학 검토 없음 · 전문 정신건강 검토 없음.
#   · content/jacob/scene1~5.yml 머리의 초안 고지는 「인간 안전검토자 사인오프 필수」를
#     걸어 두었고 **그 사인오프는 없다.** 이 파일이 그 전제를 해제하지 않는다.
#   · AR 은 닫혀 있다(VR 전용). `scripts/gen_ar_manifests.py` 의 AR_MISSIONS 에
#     jacob 이 들어간 적이 없다.
# ─────────────────────────────────────────────────────────────────────────────
#
# 상류 문서 (이 파일은 이들의 하류다 — 자구를 여기서 발명하지 않는다)
#   설계        docs/MVP-JACOB.md
#   런타임대본  docs/MVP-JACOB-CONTENT.md
#   저작        content/jacob/scene1~5.yml · content/jacob/README.md
#   성구 시드   backend/src/main/resources/db/migration/V20260822120000__seed_newchar_passages_gae.sql
#
# 이 파일의 자막은 **저작 트리의 text_ko 를 옮긴 것**이고, 그 자구는 개역개정이다.
# 옮기는 것 외의 작문을 하지 않았다 — 새 문장을 쓰면 그것은 아무도 검토하지 않은 본문이 된다.
# 새로 쓴 산문은 **한 줄도 없다**: Scene 1 의 skip_bridge_narration_ko 조차 저작의
# alt_routes[1_alt].summary_text_ko 를 그대로 옮긴 것이다(에스더와 같고 다니엘과 다르다).
#
# 신학 기준: 대한예수교장로회 합신 / 웨스트민스터 표준 / 개혁주의 (프로젝트 단일 기준).
#
# 배제 (docs/MVP-JACOB.md §0.2 — 이 파일에서는 자막 0건으로 집행된다)
#   · 창 29:21-25 (라헬·레아 혼인 속임) — 전면 배제
#   · 창 34 전체 (디나) — 전면 배제
#   · 창 35:22 — 전면 배제
#   · 창 38 전체 (유다와 다말) — 전면 배제
#   §0.2 는 이 배제가 **34개 절에 대해 장 라벨 문자열로만 덮여 있다**는 한계를 스스로 적어
#   두었다. 즉 마지막 방어선은 사람 검토다. 없는 기계 검사를 있다고 적지 않는다.
#   · 라반 밑에서의 이십 년 — 서술하지 않는다. Scene 3 의 압축 자막 한 줄이 전부이며
#     인과응보 교훈화("속인 대가")는 금칙 토큰으로 차단된다.
#
# 안전선
#   R1 자해 발화 리스너 5/5 Scene 상시. Scene 2·5 에 위기 안내를 함께 노출한다.
#   R4 **동의 카드가 둘이고, 서로를 상속하지 않는다.**
#      · Scene 1 카드 — 미션 전체의 **역할 고지**다. 「당신은 상처를 준 쪽에 선다」를
#        진입 전에 말한다. 건너뛰기 목적지는 정수 2 이고, 건너뛴 사람은 저작이 써 둔
#        요약 한 줄을 받는다. **주의**: 이 건너뛰기가 덜어내는 것은 Scene 1 의 재연뿐이다
#        (covers_scenes: [1]). 저작의 고지 범위는 Scene 1~4 지만 건너뛰기 범위는 Scene 1
#        하나다 — 엔진의 covers_scenes 는 「고지한 범위」가 아니라 「건너뛴 범위」이고,
#        목적지가 그 안에 있으면 ScenarioYamlLoaderTest 가 빨개진다(건너뛴 사람이 건너뛴
#        내용으로 들어가는 것을 막는 검사다). 저작은 Scene 2 를 **없애지 않고 소리만
#        끄기로** 설계했다(alt_routes[1_alt].carries_to_scene2) — 그 결정을 여기서 뒤집지 않는다.
#      · Scene 5 카드 — 재회의 **대면**. 마지막 Scene 이라 다음 씬이 없으므로 목적지는
#        같은 Scene 안의 축약 블록(`jacob_scene5_alt_receiving_only`)이다.
#        엔진 계약: 정수면 Scene 점프, 문자열이면 같은 Scene 의 conditional_blocks id
#        (SceneSkipResolver · ScenarioYamlLoaderTest 의 R4 무결성 루프).
#      한쪽 동의가 다른 쪽을 대신하지 않는다 — content/jacob/README.md 의 명시 요구다.
#   R4 이탈로 — 「나는 이 자리에 서 있지 않다」. 위 두 카드와 **다른 문**이다.
#      건너뛰기는 "소재는 괜찮지만 연출이 부담"이고, 이탈로는 "이 자리 자체가 내 자리가
#      아니다"(가족 안에서 상처를 **받은** 쪽). 저작은 5개 Scene 전부에서 상시 제공을
#      요구했고(available_at), 그래서 이 파일은 5개 Scene 전부의 extras 에 같은 블록을 둔다.
#      기록 없음(records_decision: false) · 마무리 문구 없음 · 미완 표시 없음.
#   R5 기본 경로는 LLM 호출 0회로 완주된다. 묵상만 opt-in 이며 기본값은 off.
#
# ⚠️ 위기 연락처를 이 파일에 숫자로 적지 말 것.
#   `{{crisis_resources.default}}` 토큰만 쓴다 — ScenePayloadAssembler → CrisisTokenResolver
#   가 정본으로 치환하고 ScenarioHotlineRatchetTest 가 이를 강제한다.

character: jacob
title: 내가 준 상처 앞에 다시 서기

target_user: 자기가 상처를 준 관계 앞에서 무엇을 해야 할지 모른 채 서 있는 사람

ai_assist_footer: AI 보조 — 본문은 성경 참조 — storyteller 역할. 위기 시 {{crisis_resources.default}}.

# ── 금칙 토큰: 이 파일에 사본을 두지 않는다 ──────────────────────────────────
# 이 미션의 금칙 토큰 29종 정본은 content/jacob/scene1~5.yml 의 `R2_R3_lint_forbidden`
# 안이고, 5개 Scene 이 문자 그대로 같은 목록을 갖는다. 여기에 복제하지 않는 이유는
# 다니엘과 같다 — 사본은 개정될 때 따라오지 않고, 따라오지 않은 사본이 초록을 만든다.
#
# 런타임 차단은 application.yml 의 safety.forbidden-tokens.list 가 하고(세 출구 전부:
# responseText · scenePayload · valuePrompt), 저작 목록이 그 전역 목록의 부분집합인지는
# 아래 verified_by 가 매 빌드 확인한다.
safety_gates:
  - id: R2_R3_forbidden_tokens_lint
    scenes: [1, 2, 3, 4, 5]
    axis: 화해 강요 금지 · 회복 당위 금지 · 유예/소급 프레이밍 금지 · 연단 신학 오용 금지 · 상해의 명예 환산 금지
    enforcement: structural
    structural_check: >-
      금칙 토큰 29종을 이 파일에 복제하지 않고 저작 정본(content/jacob/scene1~5.yml)의
      R2_R3_lint_forbidden 안에 둔다. 런타임 집행은 application.yml 의 전역 목록이 하며,
      저작 목록이 그 전역 목록의 부분집합임을 아래 verified_by 가 매 빌드 확인한다.
    verified_by: 저작 게이트의 금칙 토큰이 런타임 목록에 전부 반영돼 있다

  - id: R3_release_sentence_on_every_closing
    scenes: [5]
    axis: 마무리 문구 전건이 해제 문장으로 끝난다 — 화해를 사용자의 실제 관계로 옮기지 않는다
    enforcement: structural
    structural_check: >-
      마감 문구 10문(3 라벨 × 3 톤 + 라벨 없음 1)이 모두 같은 해제 문장으로 끝나고,
      Scene 5 마감 라벨이 Scene 3 선택지 id 와 일치하며, 건너뛴 사람의 축약 블록이
      정본 경로와 같은 마감·위기 안내·묵상 질문에 도달하고, 어느 경로에도 점수·순위·배지
      키가 없다. 처음에는 `reviewer_only` 로 두었다가 — 그러면 10문 중 하나에서 마지막
      문장을 지워도 빨개지는 것이 없어서 — 실제 검사를 붙였다.
    verified_by: 야곱 마감 문구 전건이 같은 해제 문장으로 끝난다

  - id: R1_no_theophany_identification
    scenes: [4]
    axis: 씨름 상대의 정체를 확정 지칭하지 않는다 (disputed #1 — 유보)
    enforcement: reviewer_only
    reviewer_note: >-
      Scene 4 의 화자 이름은 창 32:24 의 「어떤 사람」이다. 하나님·천사·영 어느 명사도
      자막·화자·연출에 붙이지 않는다. 32:30 의 「하나님과 대면하여」는 본문 인용이므로
      그대로 두되, 그 인용을 넘어서는 해설을 덧붙이지 않는다.

scenes:
  # ── Scene 1 ────────────────────────────────────────────────────────────────
  # 이미 저지른 자리에서 시작한다. 사용자 조작 0 — 속임은 선택지가 아니다.
  - id: 1
    title: 속임
    type: cinematic
    duration_sec: 60
    scripture_ref: gen-27:19
    next: 2
    exposure_grade: A
    trigger_warning:
      level: mid
      content:
        - family_deception
        - betrayal
      consent_card_id: cc_jacob_family_deception
      # 건너뛴 범위는 Scene 1 하나다. 고지 범위(Scene 1~4)와 다르며, 그 이유는
      # 이 파일 머리의 R4 항목에 적었다. 목적지가 covers_scenes 안에 있으면
      # ScenarioYamlLoaderTest 가 빨개진다.
      covers_scenes: [1]
      skip_alternative_scene_id: 2
      consent_card_ko: |-
        이 미션에서 당신은 야곱의 자리에 섭니다. 야곱은 상처를 받은 쪽이 아니라 상처를 준 쪽입니다.
        다루는 소재 — 가족 안의 기만과 편애 · 속은 형제의 절규 · 형이 품은 살해 의도.
        · 재연 없이 요약으로 보셔도 이야기는 이어집니다.
        · 어느 지점에서든 멈추거나 나갈 수 있습니다.
        [들어간다]  [연출 없이 요약으로 본다]
        지금 힘드시면: {{crisis_resources.default}}
      # 새로 쓴 다리가 아니다 — 저작의 alt_routes[1_alt].summary_text_ko 를 그대로 옮겼다.
      skip_bridge_narration_ko: |-
        야곱은 축복을 속임으로 취했다. (창 27:19, 27:35 요약)
    extras:
      anchor: 이삭의 장막 안. 눈이 어두워진 노인이 앉아 있는 어스름.
      additional_refs: ["gen-27:35"]
      environment:
        camera_rig: fixed_standing_in_tent
        time_of_day: dim_interior_failing_eyes
        ambient: [장막 천이 스치는 소리, 멀리 가축 소리]
        ui_overlays: [ai_assist_footer, exit_button, not_my_seat_offramp]
      npcs:
        - { name_ko: 이삭, framing: abstract_silhouette_low_detail }
      npc_note: >-
        실사 인물 형상을 쓰지 않는다. 이삭은 노쇠·시력 상실 상태이며 27:35 대사만 담당한다.
      caption_pacing:
        { auto_advance: false, advance: user, rewind_allowed: true }
      captions:
        - speaker_ko: 야곱의 속말
          text_ko: "나는 아버지의 맏아들 에서로소이다 아버지께서 내게 명하신 대로 내가 하였사오니 원하건대 일어나 앉아서 내가 사냥한 고기를 잡수시고 아버지 마음껏 내게 축복하소서 (창 27:19)"
        - speaker_ko: 이삭
          text_ko: "네 아우가 와서 속여 네 복을 빼앗았도다 (창 27:35)"
      # 27:35 를 명시 인용하는 것이 이 Scene 의 신학적 확정 지점이다 — 성경은 야곱의
      # 속임을 승인하지 않는다(disputed #2, 이 미션에서 유일하게 확정하는 항목).
      # 「결과가 좋았으니 방법도 옳았다」 독법을 이 한 절로 끊는다.
      approval_note: >-
        이 자막을 지우면 이 미션은 속임을 승인하지 않는다는 유일한 명시 근거를 잃는다.
      interactions: []
      branches: []
      not_my_seat_offramp: &not_my_seat_offramp
        id: cc_jacob_not_my_seat
        label_ko: 나는 이 자리에 서 있지 않다
        notice_ko: "가족 안에서 상처를 받은 쪽에 서 있다면, 이 미션은 당신의 자리를 다루지 않습니다. 회복할 것이 없다는 뜻이 아니라, 이 미션이 다른 자리를 다룬다는 뜻입니다. 여기서 마치셔도 됩니다."
        crisis_resource_ref: crisis_resources.default
        records_decision: false
        closing_phrase: none
        mission_complete: true
        note_ko: 건너뛰기와 다른 문이다. 건너뛰기는 연출을 덜고, 이 문은 자리 자체를 놓는다.

  # ── Scene 2 ────────────────────────────────────────────────────────────────
  # 남의 고통은 선택지가 아니다. 사용자는 여기서도 관찰자로 남는다.
  - id: 2
    title: 부르짖음
    type: cinematic
    duration_sec: 60
    scripture_ref: gen-27:34
    next: 3
    exposure_grade: A
    extras:
      anchor: 같은 장막. 형이 돌아온 자리.
      additional_refs: ["gen-27:36", "gen-27:41"]
      environment:
        camera_rig: fixed_standing_in_tent
        time_of_day: dim_interior_failing_eyes
        ambient: [장막 천이 스치는 소리]
        ui_overlays:
          [ai_assist_footer, crisis_reminder, exit_button, not_my_seat_offramp]
      npcs:
        - { name_ko: 에서, framing: abstract_silhouette_low_detail }
        - { name_ko: 이삭, framing: abstract_silhouette_low_detail }
      npc_note: >-
        에서를 악역 톤으로 연기하지 않는다. 27:34 의 절규와 33:4 의 포옹이 같은 인물의
        목소리임을 유지한다(저작 §8 voice 로스터). 이삭은 27:34~36 사이 침묵으로만 존재한다.
      caption_pacing:
        { auto_advance: false, advance: user, rewind_allowed: true }
      captions:
        - speaker_ko: 에서
          text_ko: "내 아버지여 내게 축복하소서 내게도 그리하소서 (창 27:34)"
        - speaker_ko: 에서
          text_ko: "그의 이름을 야곱이라 함이 합당하지 아니하니이까 그가 나를 속임이 이것이 두 번째니이다 전에는 나의 장자의 명분을 빼앗고 이제는 내 복을 빼앗았나이다 (창 27:36)"
        - speaker_ko: 해설
          text_ko: "그의 아버지가 야곱에게 축복한 그 축복으로 말미암아 에서가 야곱을 미워하여 심중에 이르기를 아버지를 곡할 때가 가까웠은즉 내가 내 아우 야곱을 죽이리라 하였더니 (창 27:41)"
      crisis_reminder: 지금 이 장면이 버겁다면 멈추어도 됩니다. 도움을 받을 수 있는 곳이 있습니다 — {{crisis_resources.default}}
      dwell_limit_note: >-
        27:34 의 절규 자막에는 체류 상한 3초가 걸려 있다. 절규 상태에 고착시키지 않고
        곧바로 다음 자막으로 넘어간다(저작 dwell_limit_on_esau_cry).
      threat_dramatization_ban: >-
        27:41(살해 의도)은 **인용 자막으로만** 노출한다. 추격·무기·긴박 음향 등
        위협 연출을 붙이지 않는다. 화자를 에서로 두지 않고 해설로 둔 것도 같은 이유다 —
        연기하는 순간 그것은 인용이 아니라 위협 연출이 된다.
      entry_mode_variant_note: >-
        Scene 1 의 카드에서 요약을 고른 사람은 저작상 이 Scene 을 소리 없이 자막으로만
        만난다(alt_routes[1_alt].carries_to_scene2). 웹 화면에는 자동 재생 음성이 없고
        낭독이 opt-in 버튼이라 이 구분이 사실상 보이지 않는다 — VR 빌드에서만 실효가 있다.
        보이지 않는 차이를 「집행되고 있다」고 적지 않는다.
      observe_note: >-
        사용자 조작이 없다. 에서의 고통은 개입 대상이 아니라 관찰 대상이다 —
        고를 수 있는 것처럼 두면 「그때 달랬어야 했다」가 된다.
      interactions: []
      branches: []
      not_my_seat_offramp: *not_my_seat_offramp

  # ── Scene 3 ────────────────────────────────────────────────────────────────
  # 이 미션의 **유일한 사용자 선택**. 세 값 전부 정당하고 틀린 답이 없다.
  - id: 3
    title: 이십 년
    type: interaction
    interaction: pick_one
    duration_sec: 60
    scripture_ref: gen-32:9
    next: 4
    exposure_grade: B
    extras:
      anchor: 얍복 나루의 밤. 강물 소리가 낮게 깔린다.
      additional_refs: ["gen-32:10", "gen-32:11"]
      environment:
        camera_rig: fixed_standing_riverside
        time_of_day: moonlit_low
        ambient: [낮은 강물 소리, 희미한 밤벌레 소리]
        ui_overlays: [ai_assist_footer, exit_button, not_my_seat_offramp]
      caption_pacing:
        { auto_advance: false, advance: user, rewind_allowed: true }
      captions:
        - speaker_ko: 해설
          text_ko: "이십 년이 지났다. 야곱은 이제 돌아가는 길 위에 있다."
        - speaker_ko: 야곱의 속말
          text_ko: "내 조부 아브라함의 하나님, 내 아버지 이삭의 하나님 여호와여 주께서 전에 내게 명하시기를 네 고향, 네 족속에게로 돌아가라 내가 네게 은혜를 베풀리라 하셨나이다 (창 32:9)"
        - speaker_ko: 야곱의 속말
          text_ko: "나는 주께서 주의 종에게 베푸신 모든 은총과 모든 진실하심을 조금도 감당할 수 없사오나 내가 내 지팡이만 가지고 이 요단을 건넜더니 지금은 두 떼나 이루었나이다 (창 32:10)"
        - speaker_ko: 야곱의 속말
          text_ko: "내가 주께 간구하오니 내 형의 손에서, 에서의 손에서 나를 건져내시옵소서 내가 그를 두려워함은 그가 와서 나와 내 처자들을 칠까 겁이 나기 때문이니이다 (창 32:11)"
      # ⚠️ 이 note 의 자구를 고칠 때: 문자열 leaf 는 전부 ScenePayloadAssembler 의
      #    ForbiddenTokenSanitizer 를 통과한다. 전역 금칙 토큰을 예시로라도 적으면 이 문장
      #    자체가 대체 문구로 조용히 갈린다 — 그래서 여기서는 금칙어를 인용하지 않고 서술한다.
      time_compression_note: >-
        라반 밑에서의 이십 년을 서술하지 않는다 — 압축 자막 한 줄이 전부다.
        이십 년의 고생을 속임에 대한 응보로 읽는 인과응보 서사는 이 미션의 금칙 축이다.
      fear_note: >-
        32:11 의 두려움을 「믿음 없음」으로 재단하는 자막·연출을 붙이지 않는다.
        두려움을 숨기지 않은 기도가 본문이 기록한 그대로의 기도다.
      prompt_ko: 돌아가는 길, 당신은 지금 무엇을 하겠습니까.
      options:
        - id: send_ahead
          ref: 창 33:8
          label_ko: 먼저 무언가를 보낸다
        - id: go_afraid
          ref: 창 32:11
          label_ko: 두려운 채로 간다
        - id: stay_and_pray
          ref: 창 32:9-10
          label_ko: 가지 않고 머문다
      options_note: >-
        세 값 모두 동등하게 정당하다. 점수·순위·추천 배지를 붙이지 않으며, 고른 값이
        이야기의 진행을 바꾸지도 않는다 — 셋 다, 그리고 무응답까지 Scene 4 로 간다.
        이 값이 쓰이는 자리는 Scene 5 의 마감 문구 하나뿐이다. 특히 stay_and_pray 는
        「유예」가 아니라 그 자체로 종결된 상태다 — 회피·미성숙으로 읽히는 문구를 쓰지 않는다.
      decision_key: return_label
      timeout_note: >-
        30초 무응답은 return_label = null 로 진행한다. 고르지 않는 것은 실패가 아니라
        정상 경로이고, Scene 5 에 그 경우 전용 마감 문구가 따로 있다.
      branches: []
      not_my_seat_offramp: *not_my_seat_offramp

  # ── Scene 4 ────────────────────────────────────────────────────────────────
  # 붙잡고 놓지 않는 것 자체가 정점. 실패 판정이 없다.
  - id: 4
    title: 얍복
    type: interaction
    interaction: contemplative
    duration_sec: 90
    scripture_ref: gen-32:24
    next: 5
    exposure_grade: B
    extras:
      anchor: 같은 나루. 밤이 새도록.
      additional_refs:
        ["gen-32:25", "gen-32:26", "gen-32:27", "gen-32:28", "gen-32:30", "gen-32:31"]
      environment:
        camera_rig: fixed_standing_riverside
        time_of_day: moonlit_low_to_dawn_transition
        ambient: [낮은 강물 소리, 숨소리]
        ui_overlays: [ai_assist_footer, exit_button, not_my_seat_offramp]
      npcs:
        - {
            name_ko: 어떤 사람,
            framing: abstract_humanoid_silhouette_no_face_no_gender,
          }
      npc_note: >-
        형상·성별을 렌더하지 않는다. **정체를 지칭하는 명사를 자막·화자·연출 어디에도
        붙이지 않는다** — 화자 이름 「어떤 사람」은 창 32:24 의 본문 어휘 그대로다.
      caption_pacing:
        { auto_advance: false, advance: user, rewind_allowed: true }
      captions:
        - speaker_ko: 해설
          text_ko: "야곱은 홀로 남았더니 어떤 사람이 날이 새도록 야곱과 씨름하다가 (창 32:24)"
        - speaker_ko: 해설
          text_ko: "자기가 야곱을 이기지 못함을 보고 그가 야곱의 허벅지 관절을 치매 야곱의 허벅지 관절이 그 사람과 씨름할 때에 어긋났더라 (창 32:25)"
        - speaker_ko: 어떤 사람
          text_ko: "그가 이르되 날이 새려하니 나로 가게 하라 (창 32:26)"
        - speaker_ko: 야곱
          text_ko: "야곱이 이르되 당신이 내게 축복하지 아니하면 가게 하지 아니하겠나이다 (창 32:26)"
        - speaker_ko: 어떤 사람
          text_ko: "그 사람이 그에게 이르되 네 이름이 무엇이냐 (창 32:27)"
        - speaker_ko: 야곱
          text_ko: "그가 이르되 야곱이니이다 (창 32:27)"
        - speaker_ko: 어떤 사람
          text_ko: "그가 이르되 네 이름을 다시는 야곱이라 부를 것이 아니요 이스라엘이라 부를 것이니 이는 네가 하나님과 및 사람들과 겨루어 이겼음이니라 (창 32:28)"
        - speaker_ko: 해설
          text_ko: "그러므로 야곱이 그 곳 이름을 브니엘이라 하였으니 그가 이르기를 내가 하나님과 대면하여 보았으나 내 생명이 보전되었다 함이더라 (창 32:30)"
        - speaker_ko: 해설
          text_ko: "그가 브니엘을 지날 때에 해가 돋았고 그의 허벅다리로 말미암아 절었더라 (창 32:31)"
      dwell:
        min_seconds: 3
        on_timeout: auto_proceed_after_seconds_15
        note_ko: 머무는 시간에 정답이 없습니다. 먼저 나가셔도 됩니다.
      # ⚠️ 저작의 정점은 VR 제스처다: `ix_s4_hold_and_wrestle` — 두 손으로 붙잡고 15초
      #   버티면 hold_completed 가 발생하고, 손을 놓아도 **실패가 아니라** Scene 이 처음부터
      #   다시 시작된다(재시도 횟수 기록 없음). 웹에는 그 제스처가 없다. 그래서 이 Scene 은
      #   웹에서 체류(dwell)로 내려앉는다 — 없는 것을 있다고 적지 않기 위해 여기 적는다.
      #   실패 판정이 없다는 성질만은 양쪽에서 같다(웹에도 재시도 카운트가 없다).
      web_interaction_downgrade_note: >-
        저작의 지속 그립(ix_s4_hold_and_wrestle)은 VR 전용이고 웹 화면에는 대응물이 없다.
        웹은 이 Scene 을 체류로 렌더한다. 이 차이는 docs/JACOB-RUNTIME-SIGNOFF.md 에 등재돼 있다.
      name_prompt_ban: >-
        사용자의 실제 이름을 묻지 않는다. 32:27 의 응답은 「야곱이니이다」 고정 자막이다.
        32:28 의 개명도 이야기 속 야곱의 것이고, 사용자 실명 개명 연출에 쓰지 않는다.
      victory_labeling_ban: >-
        32:28 의 「겨루어 이겼음이니라」를 사용자 개인의 신앙 성취·승리 서사로 일반화하지
        않는다(disputed #4, 유보). 「기도로 하나님을 이긴다」류 적용을 붙이지 않는다.
      hangul_lexicon_note: >-
        개역개정 표현인 「허벅지 관절」(32:25) · 「허벅다리」(32:31)만 쓴다.
        옛 번역의 해부 용어를 되살리지 않는다 — 개역한글의 그 표기는 이 파일 어디에도 없다.
      limp_persists_to_scene5: true
      interactions: []
      branches: []
      not_my_seat_offramp: *not_my_seat_offramp

  # ── Scene 5 ────────────────────────────────────────────────────────────────
  # R4 트리거 ②. 마지막 Scene 이라 건너뛰기 목적지가 같은 Scene 의 축약 블록이다.
  - id: 5
    title: 받으니라
    type: outro
    duration_sec: 90
    scripture_ref: gen-33:1
    next: null
    exposure_grade: A
    value_prompt: 오늘 한 가지만 — 내가 준 상처 앞에서 지금 할 수 있는 일이 무엇인지, 한 줄로 적어 보는 것.
    trigger_warning:
      level: mid
      content:
        - confrontation
        - unwanted_reunion
      consent_card_id: cc_jacob_confrontation
      covers_scenes: [5]
      # 문자열 목적지 — 다음 씬이 없는 마지막 Scene 의 축약 경로다. 같은 Scene 에 머물며
      # 아래 conditional_blocks 의 같은 id 를 쓴다(SceneSkipResolver 의 계약).
      skip_alternative_scene_id: jacob_scene5_alt_receiving_only
      consent_card_ko: |-
        다루는 소재 — 가해자로서의 대면 · 원치 않는 재회.
        재회가 안전하지 않은 관계가 실재합니다. 학대나 폭력이 있었던 관계에서 다시 만나는 것은 회복이 아니라 위험일 수 있습니다.
        이것은 야곱에게 있었던 일이며, 당신의 실제 관계에 적용하지 않아도 됩니다. 넘어가도 되고 여기서 마쳐도 됩니다.
        [그대로 본다]  [재회 연출 없이 넘어간다]
        지금 힘드시면: {{crisis_resources.default}}
      card_note: >-
        Scene 1 에서 동의했더라도 여기서 다시 묻는다. 역할 고지에 동의한 것이 대면에
        동의한 것은 아니다 — 한 Scene 의 동의가 다른 Scene 의 동의를 대신하지 않는다.
    extras:
      anchor: 새벽의 들판. 형이 사백 명을 거느리고 오는 자리.
      additional_refs:
        ["gen-33:3", "gen-33:4", "gen-33:8", "gen-33:9", "gen-33:10", "gen-33:11"]
      environment:
        camera_rig: fixed_standing_open_plain
        time_of_day: dawn_warm_rising
        ambient: [낮은 들바람, 멀리 가축 떼]
        ui_overlays:
          [ai_assist_footer, crisis_reminder, exit_button, not_my_seat_offramp]
      npcs:
        - { name_ko: 에서, framing: abstract_silhouette_low_detail }
        - { name_ko: 사백 명의 장정, framing: silhouette_distant_ambiguous }
      npc_note: >-
        사백 명을 무기·전열·위협 음향으로도, 환영 행렬로도 연출하지 않는다(disputed #8, 유보).
        야곱의 두려움은 33:1 자막의 1인칭 속말로만 표현한다.
        에서는 27:34 의 절규와 같은 목소리다 — 악역도, 무조건적 화해자도 아니다.
      caption_pacing:
        { auto_advance: false, advance: user, rewind_allowed: true }
      captions:
        - speaker_ko: 야곱의 속말
          text_ko: "야곱이 눈을 들어 보니 에서가 사백 명의 장정을 거느리고 오고 있는지라 그의 자식들을 나누어 레아와 라헬과 두 여종에게 맡기고 (창 33:1)"
        - speaker_ko: 해설
          text_ko: "자기는 그들 앞에서 나아가되 몸을 일곱 번 땅에 굽히며 그의 형 에서에게 가까이 가니 (창 33:3)"
        - speaker_ko: 해설
          text_ko: "에서가 달려와서 그를 맞이하여 안고 목을 어긋맞추어 그와 입맞추고 서로 우니라 (창 33:4)"
        - speaker_ko: 에서
          text_ko: "내가 만난 바 이 모든 떼는 무슨 까닭이냐 (창 33:8)"
        - speaker_ko: 야곱의 속말
          text_ko: "내 주께 은혜를 입으려 함이니이다 (창 33:8)"
        - speaker_ko: 에서
          text_ko: "내 동생아 내게 있는 것이 족하니 네 소유는 네게 두라 (창 33:9)"
        - speaker_ko: 야곱의 속말
          text_ko: "그렇지 아니하니이다 내가 형님의 눈앞에서 은혜를 입었사오면 청하건대 내 손에서 이 예물을 받으소서 내가 형님의 얼굴을 뵈온즉 하나님의 얼굴을 본 것 같사오며 형님도 나를 기뻐하심이니이다 (창 33:10)"
        - speaker_ko: 해설
          text_ko: "하나님이 내게 은혜를 베푸셨고 내 소유도 족하오니 청하건대 내가 형님께 드리는 예물을 받으소서 하고 그에게 강권하매 받으니라 (창 33:11)"
      reunion_precedes_choice_note: >-
        재회 자체는 사용자 선택 이전에 본문 그대로 일어난다(33:4). 사용자가 재회 여부를
        결정하지 않는다 — 결정한 것처럼 두면 재회하지 못한 사람의 책임이 된다.
      theophany_reservation_note: >-
        33:10 의 「형님의 얼굴을 뵈온즉 하나님의 얼굴을 본 것 같사오며」가 신현 표현인지
        관용적 존중 표현인지 확정하지 않는다(disputed #3, 유보). 아래 마감 문구 10문
        어디에도 이 절의 해석을 확정한 표현을 쓰지 않았다.
      # 예물 응대(다시 내민다 / 거두어들인다)는 **기록하지 않는다.** 저작이
      # records_decision: false · decision_key: null 로 못 박았다 — 선택이 사용자
      # 프로필에 남으면 그 자체가 평가가 된다. 두 경로는 같은 마감으로 수렴한다.
      gift_response_note: >-
        저작의 ix_jacob_gift 는 두 라우트(다시 내민다 / 거두어들인다)가 모두
        entry_mode_after=full · closing_route_ref=scene5_closing 로 동일하게 수렴하고
        어느 쪽도 기록되지 않는다. 이 런타임은 그 대칭을 「선택 자체를 두지 않는 것」으로
        구현한다 — 두 라우트가 결말·기록·연출에서 완전히 같으므로 화면에 나뉘는 문을
        두면 차이가 없는 선택으로 사용자를 시험하는 것이 된다. VR 빌드에서는 저작대로
        예물을 내미는 제스처가 남는다.
      # 건너뛴 사람이 도착하는 자리. 자막 여덟 장 중 33:11 한 장만 남는다 —
      # 저작의 alt_routes[5_alt].summary_text_ko 가 정확히 그 절이다.
      conditional_blocks:
        - id: jacob_scene5_alt_receiving_only
          reached_by: skip_from_scene5
          renders: [closing_texts, crisis_reminder, value_prompt]
          omits_assets:
            [
              env_open_plain_dawn,
              npc_esau,
              npc_company_400,
              anim_embrace,
              sfx_herd_approach,
            ]
          captions:
            - speaker_ko: 해설
              text_ko: "하나님이 내게 은혜를 베푸셨고 내 소유도 족하오니 청하건대 내가 형님께 드리는 예물을 받으소서 하고 그에게 강권하매 받으니라 (창 33:11)"
          note: >-
            축약 경로도 마무리 문구와 위기 안내에 그대로 도달한다. 재회 연출을 건너뛴
            사람의 결말이 깎이면 그것이 곧 화해 압박이다 — 저작의 R3_no_reconciliation_pressure
            가 지키는 것이 바로 이 대칭이다.
      dwell:
        min_seconds: 3
        on_timeout: auto_proceed_after_seconds_15
        note_ko: 머무는 시간에 정답이 없습니다. 먼저 나가셔도 됩니다.
      # 마감 문구 10종 — Scene 3 의 라벨 3 × 톤 3 + 라벨 없음 1.
      # 자구는 저작 정본(content/jacob/scene5.yml br_s5_closing_message)에서 그대로 옮겼다.
      # **10문 전부가 같은 해제 문장으로 끝난다** — 「이것은 야곱에게 있었던 일이며,
      # 당신의 실제 관계에 적용하지 않아도 된다.」 이 문장이 이 미션의 마지막 안전선이다.
      # 라벨을 고르지 않은 사람은 default 로 온다 — 무응답은 실패가 아니라 정상 경로다.
      # 라벨 없음은 저작에 톤 분기가 없다(공통 1문). 없는 세 문을 지어내지 않는다.
      closing_texts:
        send_ahead:
          soft: 먼저 무언가를 보내는 것도 하나의 걸음이었다. 그것이 닿을지 아닐지는 보낸 사람도 알지 못했다. 야곱도 몰랐다. 이것은 야곱에게 있었던 일이며, 당신의 실제 관계에 적용하지 않아도 된다.
          balanced: '야곱은 떼를 먼저 보냈다. 그것으로 잃은 것을 되살 수는 없었지만, 그 손짓은 그가 할 수 있는 일이었다. "내 주께 은혜를 입으려 함이니이다" — 그가 한 말은 그것뿐이었다. (창 33:8) 이것은 야곱에게 있었던 일이며, 당신의 실제 관계에 적용하지 않아도 된다.'
          strong: '먼저 보낸 것이 무엇이든, 그것을 내밀던 손 위에 하나님의 은혜가 있었다. 야곱이 "하나님이 내게 은혜를 베푸셨고" 라고 말한 자리가 거기였다. (창 33:11) 이것은 야곱에게 있었던 일이며, 당신의 실제 관계에 적용하지 않아도 된다.'
        go_afraid:
          soft: 두려운 채로 가는 것은 용기가 없는 것이 아니었다. 야곱은 겁이 난다고 말한 채로 갔다. 이것은 야곱에게 있었던 일이며, 당신의 실제 관계에 적용하지 않아도 된다.
          balanced: '"그가 와서 나와 내 처자들을 칠까 겁이 나기 때문이니이다"(창 32:11). 야곱은 두려움을 감추지 않고 그대로 아뢰었다. 두려움은 숨겨야 할 것이 아니었다. 이것은 야곱에게 있었던 일이며, 당신의 실제 관계에 적용하지 않아도 된다.'
          strong: 두려움을 말한 그 기도를 하나님은 물리치지 않으셨다. 겁이 난다고 말한 그 밤에도 하나님은 거기 계셨다. 이것은 야곱에게 있었던 일이며, 당신의 실제 관계에 적용하지 않아도 된다.
        stay_and_pray:
          soft: 가지 않는 것도 하나의 자리다. 그 자리는 잠시 미뤄 둔 자리가 아니라, 끝까지 그대로 두어도 되는 자리다. 이것은 야곱에게 있었던 일이며, 당신의 실제 관계에 적용하지 않아도 된다.
          balanced: 야곱은 강을 건너기 전에 홀로 남아 밤을 지냈다(창 32:24). 야곱이 이튿날 건넌 것은 야곱에게 일어난 일이고, 건너지 않는 것 역시 그 자체로 온전한 이야기다. 머무름은 다음 장을 기다리는 여백이 아니다. 이것은 야곱에게 있었던 일이며, 당신의 실제 관계에 적용하지 않아도 된다.
          strong: '"나는 주께서 주의 종에게 베푸신 모든 은총과 모든 진실하심을 조금도 감당할 수 없사오나"(창 32:10) — 머문 자리에서 나온 그 말도 하나님 앞에 드려진 기도였다. 하나님 앞에 있기 위해 강을 건너야 하는 것은 아니었다. 이것은 야곱에게 있었던 일이며, 당신의 실제 관계에 적용하지 않아도 된다.'
        default: 여기까지 온 것으로 이 시간은 완결이다. 야곱의 이야기는 형제가 마주 서는 것으로 이어지지만, 그 장면이 당신에게 요구되는 것은 아니다. 오늘 여기서 멈추어도 된다. 이것은 야곱에게 있었던 일이며, 당신의 실제 관계에 적용하지 않아도 된다.
      closing_texts_note: >-
        10문 전부가 해제 문장으로 끝난다. 그 문장이 하는 일은 하나다 — 이 이야기를
        사용자의 실제 관계에 대한 지시로 읽지 않게 하는 것. 재회가 안전하지 않은 관계가
        실재하기 때문이다. 어느 문구에도 화해를 전제·권유·요구하는 서술을 두지 않는다.
      crisis_reminder: 여기까지 오시느라 애쓰셨습니다. 오늘 마음이 무겁게 남으셨다면 {{crisis_resources.default}}
      llm_optin_note: >-
        기본 경로는 위 10문의 정적 큐레이션이다. LLM 실시간 생성은 사용자가 명시적으로
        opt-in 했을 때만 호출되며 기본값은 off 다(R5).
