# 야곱 — 「내가 상처를 준 쪽일 때」
#
# 핵심 메시지: **화해는 요구되지 않는다.**
#   이 미션은 사용자를 피해자가 아니라 **가해자 자리** 에 앉힌다(저작 §0). 그리고 그 자리에서
#   화해를 숙제로 주지 않는다 — 돌아가는 것도, 두려운 채로 가는 것도, 가지 않고 머무는 것도
#   전부 끝난 이야기다. 에스더의 「개시의 자기 결정권」과도, 다니엘의 「경계 설정」과도,
#   베드로의 「행동 이후의 자기 정죄」와도 겹치지 않게 저작이 일부러 갈라 둔 축이다.
#
# ─────────────────────────────────────────────────────────────────────────────
# ⚠️ 이 파일은 2026-08-22 부터 **실제로 로드된다.**
#   ScenarioYamlLoader.loadAll() 은 `Character.entries` 를 순회한다 — 디렉터리가 아니다.
#   그래서 `Character` enum 의 JACOB("jacob") 한 줄이 곧 사용자 노출이다.
#   근거·범위·남은 빚은 docs/JACOB-RUNTIME-SIGNOFF.md 에 있고
#   RuntimeExposureSignoffTest 의 «룻 이후 열리는 인물은 노출 대장 없이 열리지 않는다» 가 집행한다.
#   · 전문 신학 검토 없음 · 전문 정신건강 검토 없음. 그 사실은 대장에 남아 있다.
#   · content/jacob/scene1~5.yml 머리의 초안 고지는 「lemuel-theology-reviewer +
#     lemuel-mental-health-safety 사후 검토 + **인간 안전검토자 사인오프 필수**」를 걸어
#     두었고, **그 사인오프는 없다.** 베드로 §8 · 다니엘 · 에스더와 같은 종류의 미해소
#     부채다 — 지우지 않고 대장에 적었다. 초록이 아니라 등재다.
#   · 이 인물에는 그 고지가 한 겹 더 세다. 저작이 「신규 구원 카테고리: 내가 가해자인
#     관계의 회복 + R1 인접 가족 학대·살해 위협」이라고 스스로 표시해 두었다.
#   · AR 은 닫혀 있다(VR 전용). `scripts/gen_ar_manifests.py` 의 AR_MISSIONS 에
#     jacob 이 들어간 적이 없다.
# ─────────────────────────────────────────────────────────────────────────────
#
# 상류 문서 (이 파일은 이들의 하류다 — 자구를 여기서 발명하지 않는다)
#   설계        docs/MVP-JACOB.md
#   런타임대본  docs/MVP-JACOB-CONTENT.md
#   저작        content/jacob/scene1~5.yml
#   저작 게이트 scripts/gates/jacob.yml
#   성구 시드   backend/src/main/resources/db/migration/V20260822120000__seed_newchar_passages_gae.sql
#
# 이 파일의 자막은 **저작 트리의 text_ko 를 옮긴 것**이고, 그 자구는 개역개정이다.
# 마감 문구 10문도 저작 정본(content/jacob/scene5.yml br_s5_closing_message)의 자구
# 그대로다 — 저작이 「자구 변경 금지」라고 못 박아 둔 자리다.
# **새로 쓴 문장은 두 곳뿐이고 둘 다 성경 자막이 아니다**: Scene 5 의 `value_prompt`
# 한 줄과, Scene 3 의 `pre_branch_notice_ko`. 둘 다 저작의 R3 선언을 화면 문장으로
# 옮긴 것이며, 새로 쓴 것이라는 사실을 대장에 적었다.
#
# 신학 기준: 대한예수교장로회 합신 / 웨스트민스터 표준 / 개혁주의 (프로젝트 단일 기준).
#
# 배제 (이 파일에서 직접 집행되는 것)
#   · 라반 밑에서의 이십 년 — 서술하지 않는다. 압축 자막 한 줄로만 시간 경과를 알린다.
#     인과응보 서사(「속인 대가로 속았다」)를 만들지 않는 것이 저작 결정이다.
#   · 씨름 상대의 정체 — 어느 경로에서도 확정 지칭(하나님/천사)하지 않는다.
#     창 32:24 의 「어떤 사람」을 그대로 쓴다(저작 disputed #1, 신학검토자 승인 대기).
#   · 창 32:28 「이겼음이니라」를 사용자 성공 라벨로 재사용하지 않는다.
#     「기도로 하나님을 이긴다」류 적용 금지(저작 disputed #4).
#   · 창 33:10 「하나님의 얼굴을 본 것 같사오며」를 신현(神現)으로 확정하지 않는다
#     (저작 disputed #3). 보조 자막으로만 노출하고 마감 10문에는 쓰지 않는다.
#   · 「환도뼈」 — 개역한글 표기다. 개역개정의 「허벅지 관절」(32:25) ·
#     「허벅다리」(32:31) 만 쓴다.
#   · 창 33:1 의 사백 명 — 위협 대오로도 환영 행렬로도 연출하지 않는다
#     (저작 disputed #8, 확정 연출 없음).
#
# 안전선
#   R1 자해 발화 리스너 5/5 Scene 상시. 창 27:41(살해 의도)은 **인용 자막으로만** 노출하고
#      위협 연출(추격·무기·긴박 음향)을 붙이지 않는다.
#   R2 목적론적 의미부여 금지 — 「너를 다듬으시려고」·「그래서 겸손해지셨군요」·「훈장」류.
#   R3 **이 인물의 최우선 축.** 돌아가는 길 세 갈래에 등급이 없고, 예물을 다시 내미는
#      것과 거두는 것 사이에도 등급이 없다. 마감 10문은 전부 같은 해제 문장으로 끝난다.
#   R4 동의 카드가 **둘** 이다(다니엘과 같은 모양). Scene 1 의 가족 기만 카드와
#      Scene 5 의 재회 대면 카드.
#   R5 기본 경로는 LLM 호출 0회로 완주된다. 마감 문구의 기본값은 사전 큐레이션이다.
#
# ── 엔진과 저작이 갈라지는 자리 (숨기지 않는다) ──────────────────────────────
#   (1) **Scene 1 카드의 커버 범위.** 저작은 이 카드가 Scene 1~4 를 함께 덮는다고 적었다.
#       그런데 엔진은 skip 목적지가 `covers_scenes` 안에 있으면 반려한다
#       (SceneSkipResolver · ScenarioYamlLoaderTest 의 R4 무결성 루프). [1,2,3,4] 로
#       적으면 목적지가 5 밖에 없고, 그러면 **카드가 없애 주겠다고 한 적 없는 얍복의
#       기도와 씨름까지 통째로 사라진다.** 그래서 `covers_scenes: [1]` · 목적지 2 로 뒀다.
#       저작의 라우팅과도 이쪽이 맞다 — 저작의 1_alt 는 스스로
#       `carries_to_scene2: caption_only_no_audio` 로 Scene 2 로 이어지게 돼 있고,
#       음성이 없는 웹 자막 런타임에서 그 「음성 없이 자막만」은 자동으로 성립한다.
#   (2) **카드의 셋째 문.** 저작 카드는 문이 셋이다(들어간다 / 요약으로 본다 /
#       나는 이 자리에 서 있지 않다). 프론트의 `cardDoors()` 는 문을 **정확히 둘** 만
#       만든다. 셋째 문을 카드에 욱여넣으면 「요약으로 본다」가 사라진다.
#       그래서 셋째 문은 카드가 아니라 **모든 Scene 에 상시 떠 있는 이탈 버튼** 으로
#       옮겼다(`offramp`). 저작이 그 문에 건 조건 — `records_decision: false` ·
#       `closing_phrase: none` · `mission_complete: true` ·
#       `available_at: [scene1..scene5]` — 이 모양이 오히려 정확히 만족된다.
#       Scene 1 에만 있는 카드 옵션으로 뒀다면 「상시」가 거짓말이 됐다.
#   (3) **씨름의 15초 지속 그립이 런타임에 없다.** 저작의 정점은 붙잡고 놓지 않는
#       동작 그 자체인데, 자막 런타임에는 그 동작이 없다. 대신 저작이 그 동작에 건
#       규칙(놓아도 실패가 아니다 · 재시도 횟수를 세지 않는다 · 기록하지 않는다)은
#       그대로 지킨다 — Scene 4 에 판정도 기록도 없다. **연출이 빠진 것이지
#       규칙이 완화된 것이 아니다.** 빠졌다는 사실은 대장에 적었다.
#   (4) **예물 두 갈래의 분량이 다르다.** 다시 내밀면 33:10·33:11 이 더 나오고
#       거두면 33:9 에서 멈춘다. 저작이 그렇게 썼고, 저작 자신의 R3 구조 검사도
#       그것을 「보상」으로 보지 않는다 — 재는 것은 두 경로가 **같은 마감** 으로
#       수렴하느냐이기 때문이다. 이 파일도 같다.
#
# ⚠️ 위기 연락처를 이 파일에 숫자로 적지 말 것.
#   `{{crisis_resources.default}}` 토큰만 쓴다 — ScenePayloadAssembler → CrisisTokenResolver
#   가 정본으로 치환하고 ScenarioHotlineRatchetTest 가 이를 강제한다.

character: jacob
title: 내가 상처를 준 쪽일 때

target_user: 자기가 잘못한 관계를 안고 사는 사람. 돌아갈지 말지를 몇 해째 저울질하고 있는 사람

ai_assist_footer: AI 보조 — 본문은 성경 참조 — storyteller 역할. 위기 시 {{crisis_resources.default}}.

# ── 금칙 토큰: 이 파일에 사본을 두지 않는다 ──────────────────────────────────
# 이 미션의 금칙 토큰 정본은 content/jacob/scene1~5.yml 의 R2_R3_lint_forbidden 안이다
# (29종 × 5벌, 다섯 파일이 문자 그대로 동일). 여기에 여섯 번째 사본을 만들지 않는다 —
# 갈라질 것이 확실하다. 런타임 차단은 application.yml 의 safety.forbidden-tokens.list 가
# 하고(세 출구 전부: responseText · scenePayload · valuePrompt), 저작 목록이 그 전역
# 목록의 부분집합인지는 아래 verified_by 가 매 빌드 확인한다.
safety_gates:
  - id: R2_R3_forbidden_tokens_lint
    scenes: [1, 2, 3, 4, 5]
    axis: 용서 강요 금지 · 회복 당위 금지 · 목적론적 의미부여 금지 · 유예 프레이밍 금지
    enforcement: structural
    structural_check: >-
      금칙 토큰 29종을 이 파일에 복제하지 않고 저작 정본(content/jacob/scene1~5.yml 의
      R2_R3_lint_forbidden)에 둔다. 런타임 집행은 application.yml 의 전역 목록이 하며,
      저작 목록이 그 전역 목록의 부분집합임을 아래 verified_by 가 매 빌드 확인한다.
    verified_by: 저작 게이트의 금칙 토큰이 런타임 목록에 전부 반영돼 있다

  - id: R3_no_reconciliation_pressure
    scenes: [3, 5]
    axis: 화해는 요구되지 않는다 — 세 갈래에 등급이 없고 마감 10문이 같은 해제 문장으로 끝난다
    enforcement: structural
    structural_check: >-
      Scene 3 의 세 값(send_ahead · go_afraid · stay_and_pray)에 점수·순위·정답 류 키가
      0건이고 셋 모두 같은 Scene 4 로 수렴한다. 고르지 않은 사람(default)도 마감을 받는다.
      Scene 5 의 예물 두 갈래는 결정으로 기록되지 않으며(records_decision 없음),
      동의 카드를 건너뛴 사람도 같은 마감(closing_texts)에 도달한다 — 건너뛴 사용자의
      결말이 깎이면 그것이 곧 화해 압박이다. 마감 10문(라벨 3 × 톤 3 + 라벨 없음 1)이
      전부 저작이 정한 해제 문장으로 끝난다.
    # 지목 대상은 **실재하는 테스트 함수명** 이어야 한다(ContentSafetyGateEnforcementTest 의
    # 매달린 참조 차단). 산문을 적으면 그 자리는 두 번째 structural_check 일 뿐이다.
    verified_by: "돌아가는 세 갈래에 등급이 없고 마감 열 문장이 같은 해제 문장으로 끝난다"

  - id: content_exclusion_jacob
    scenes: [1, 2, 3, 4, 5]
    axis: 씨름 상대를 지칭하지 않고 개역한글 표기를 쓰지 않는다 — 배제 구간이 새지 않는다
    enforcement: structural
    structural_check: >-
      노출 텍스트에 나타나는 창세기 참조가 성구 시드에 등재된 스물두 개 안에만 있다.
      배제된 자구를 여기에 옮겨 적지 않는다 — 배제 목록을 기대값으로 적으면 그 문장이
      리포로 돌아오고, extras 는 payload 로 통째 복사되므로 화면으로 나갈 길이 생긴다.
      그래서 자구가 아니라 **허용된 참조의 집합** 으로 판정한다. 여기에 더해 화면에
      나가는 문자열에 개역한글 표기 한 낱말과 씨름 상대를 지칭하는 명사가 없는지 본다 —
      이 둘은 목록이 짧고 오염이 한 낱말로 일어나므로 자구로 잰다.
    verified_by: "씨름 상대를 지칭하지 않고 개역한글 표기를 쓰지 않는다"

scenes:
  # ── Scene 1 ────────────────────────────────────────────────────────────────
  # 사용자는 **이미 저지른 자리** 에서 시작한다. 선택지가 없다.
  - id: 1
    title: 속임
    type: cinematic
    duration_sec: 60
    scripture_ref: gen-27:19
    next: 2
    exposure_grade: A
    trigger_warning:
      level: high
      content:
        - family_deception
        - parental_favoritism
        - sibling_death_threat
      consent_card_id: cc_jacob_family_deception
      # 저작은 이 카드가 Scene 1~4 를 함께 덮는다고 적었지만, [1,2,3,4] 로 적으면
      # 엔진 규칙상 목적지가 5 밖에 없어 얍복(3·4)까지 사라진다. 머리 주석 (1) 참조.
      covers_scenes: [1]
      skip_alternative_scene_id: 2
      consent_card_ko: |-
        이 미션에서 당신은 야곱의 자리에 섭니다. 야곱은 상처를 받은 쪽이 아니라 상처를 준 쪽입니다.
        · 다루는 소재 — 가족 안의 기만과 편애 · 속은 형제의 절규 · 형이 품은 살해 의도.
        · 약 1분. 곧이어 속은 형제의 부르짖음으로 이어집니다.
        · 화해를 요구하는 묵상이 아닙니다. 돌아가지 않기로 하는 것도 이 묵상 안에서 온전한 끝입니다.
        계속하시겠어요?
        [들어간다]  [연출 없이 요약으로 본다]
        지금 힘드시면: {{crisis_resources.default}}
      # 저작 alt_routes[1_alt].summary_text_ko 를 그대로 옮겼다. 저작이 그 요약에
      # 「(창 27:19, 27:35 요약)」이라고 인용 아님을 화면에 표시해 두었고 그대로 둔다.
      skip_bridge_narration_ko: |-
        야곱은 축복을 속임으로 취했다. (창 27:19, 27:35 요약)
    extras:
      anchor: 이삭의 장막 안. 눈먼 아버지 앞. 낮은 등불.
      additional_refs: ["gen-27:35"]
      environment:
        camera_rig: fixed_kneeling_at_bedside
        time_of_day: dim_tent_lamplight
        ambient: [장막 천이 스치는 소리, 바깥의 낮은 바람]
        ui_overlays: [ai_assist_footer, exit_button, offramp_button]
      npcs:
        - { name_ko: 이삭, framing: aged_face_unrendered_low_detail }
      npc_note: >-
        이삭의 얼굴을 렌더하지 않는다. 속는 사람의 표정을 전시하지 않는다 —
        이 장면의 무게는 속은 얼굴이 아니라 속인 자기 목소리에 있다.
      caption_pacing:
        { auto_advance: false, advance: user, rewind_allowed: true }
      captions:
        - speaker_ko: 야곱의 속말
          text_ko: "나는 아버지의 맏아들 에서로소이다 아버지께서 내게 명하신 대로 내가 하였사오니 원하건대 일어나 앉아서 내가 사냥한 고기를 잡수시고 아버지 마음껏 내게 축복하소서 (창 27:19)"
        - speaker_ko: 이삭
          text_ko: "네 아우가 와서 속여 네 복을 빼앗았도다 (창 27:35)"
      approval_note: >-
        27:35 를 반드시 남긴다. 성경이 야곱의 속임을 승인하지 않는다는 것이 본문 안에서
        확정되는 자리다(저작 disputed #2 는 이 항목을 확정으로 분류했다). 이 절이 빠지면
        속임은 「지혜로운 기지」로 읽힐 여지가 생긴다.
      observe_note: >-
        사용자 조작이 없다. 이미 저지른 자리에서 시작하는 것이 이 미션의 전제이고,
        여기에 선택지를 두면 「그때 다르게 할 수 있었다」가 된다.
      offramp: &offramp
        label_ko: 나는 이 자리에 서 있지 않다 — 여기서 마치기
        notice_ko: >-
          가족 안에서 상처를 받은 쪽에 서 있다면, 이 미션은 당신의 자리를 다루지 않습니다.
          회복할 것이 없다는 뜻이 아니라, 이 미션이 다른 자리를 다룬다는 뜻입니다.
          여기서 마치셔도 됩니다.
        records_decision: false
        closing_phrase: none
        mission_complete: true
      offramp_note: >-
        저작 카드의 셋째 문이다. 프론트의 문 파싱이 정확히 둘만 만들기 때문에 카드가
        아니라 상시 버튼으로 옮겼고, 그래서 저작이 요구한 「Scene 1~5 어디서나」가
        실제로 성립한다. 고른 사람의 결정은 기록되지 않고 마감 문구도 나오지 않는다 —
        마치는 것이지 끝을 받는 것이 아니다.
      interactions: []
      branches: []

  # ── Scene 2 ────────────────────────────────────────────────────────────────
  # 남의 고통은 선택지가 아니다. 사용자는 여기서도 관찰자로 남는다.
  - id: 2
    title: 부르짖음
    type: cinematic
    duration_sec: 60
    scripture_ref: gen-27:34
    next: 3
    exposure_grade: A
    extras:
      anchor: 같은 장막의 문간. 조금 물러선 자리.
      additional_refs: ["gen-27:36", "gen-27:41"]
      consent_coverage:
        consent_card_id: cc_jacob_family_deception
        covered_by_scene: 1
        note: >-
          이 Scene 은 자기 카드를 띄우지 않는다. Scene 1 의 카드가 고지한 「속은 형제의
          절규 · 형이 품은 살해 의도」가 정확히 여기 있다. 덮인 표시를 남기는 것은
          엔진이 Scene 1 의 결정을 여기까지 들고 오기 위해서가 아니라(그 결정은 정수
          목적지라 이미 이 Scene 을 지나쳤다) **어느 카드가 이 Scene 을 고지했는지가
          파일에 남아야 하기 때문** 이다.
      environment:
        camera_rig: fixed_at_tent_threshold
        time_of_day: dim_tent_lamplight
        ambient: [장막 밖의 바람]
        ui_overlays:
          [ai_assist_footer, crisis_reminder, exit_button, offramp_button]
      npcs:
        - { name_ko: 에서, framing: back_turned_no_face_render }
      npc_note: >-
        에서의 얼굴을 렌더하지 않는다. 절규를 클로즈업으로 전시하지 않으며, 에서를
        악역으로도 무조건적 용서자로도 그리지 않는다 — 본문 그대로의 반응이다.
      caption_pacing:
        { auto_advance: false, advance: user, rewind_allowed: true }
      captions:
        - speaker_ko: 에서
          text_ko: "내 아버지여 내게 축복하소서 내게도 그리하소서 (창 27:34)"
        - speaker_ko: 에서
          text_ko: "그의 이름을 야곱이라 함이 합당하지 아니하니이까 그가 나를 속임이 이것이 두 번째니이다 전에는 나의 장자의 명분을 빼앗고 이제는 내 복을 빼앗았나이다 (창 27:36)"
        - speaker_ko: 성경 자막
          text_ko: "그의 아버지가 야곱에게 축복한 그 축복으로 말미암아 에서가 야곱을 미워하여 심중에 이르기를 아버지를 곡할 때가 가까웠은즉 내가 내 아우 야곱을 죽이리라 하였더니 (창 27:41)"
      threat_note: >-
        27:41 은 정적 자막 전용이다. 음성·연기·음향 고조·추격 연출을 붙이지 않는다.
        저작이 화자를 사람이 아니라 「성경 자막」으로 지정해 둔 이유가 이것이다 —
        살해 의도를 인물의 연기로 재생하면 그 순간 위협 연출이 된다.
      close_note: >-
        이 Scene 은 목격으로 끝난다. 사과·변명·결심 발화를 여기에 두지 않는다.
        목격이 곧바로 결정으로 넘어가면 남의 고통이 선택지가 된다.
      crisis_reminder: 지금 이 장면이 버겁다면 멈추어도 됩니다. 도움을 받을 수 있는 곳이 있습니다 — {{crisis_resources.default}}
      offramp: *offramp
      interactions: []
      branches: []

  # ── Scene 3 ────────────────────────────────────────────────────────────────
  # 이 미션의 **유일한 사용자 선택.** 세 갈래에 등급이 없다.
  - id: 3
    title: 이십 년
    type: interaction
    interaction: pick_one
    duration_sec: 60
    scripture_ref: gen-32:9
    next: 4
    exposure_grade: B
    extras:
      anchor: 얍복 나루가 내려다보이는 언덕. 해가 지고 있다.
      additional_refs: ["gen-32:10", "gen-32:11"]
      consent_coverage:
        consent_card_id: cc_jacob_family_deception
        covered_by_scene: 1
      environment:
        camera_rig: fixed_standing_above_the_ford
        time_of_day: low_sun_before_dusk
        ambient: [멀리 흐르는 물소리, 가축 떼의 낮은 소리]
        ui_overlays: [ai_assist_footer, exit_button, offramp_button]
      caption_pacing:
        { auto_advance: false, advance: user, rewind_allowed: true }
      captions:
        - speaker_ko: 해설
          text_ko: "이십 년이 지났다. 야곱은 이제 돌아가는 길 위에 있다."
        - speaker_ko: 야곱의 속말
          text_ko: "내 조부 아브라함의 하나님, 내 아버지 이삭의 하나님 여호와여 주께서 전에 내게 명하시기를 네 고향, 네 족속에게로 돌아가라 내가 네게 은혜를 베풀리라 하셨나이다 (창 32:9)"
        - speaker_ko: 야곱의 속말
          text_ko: "나는 주께서 주의 종에게 베푸신 모든 은총과 모든 진실하심을 조금도 감당할 수 없사오나 내가 내 지팡이만 가지고 이 요단을 건넜더니 지금은 두 떼나 이루었나이다 (창 32:10)"
        - speaker_ko: 야곱의 속말
          text_ko: "내가 주께 간구하오니 내 형의 손에서, 에서의 손에서 나를 건져내시옵소서 내가 그를 두려워함은 그가 와서 나와 내 처자들을 칠까 겁이 나기 때문이니이다 (창 32:11)"
      compression_note: >-
        이십 년은 한 줄로만 지나간다. 라반 밑에서의 일을 서술하지 않는다 —
        서술하는 순간 「속인 사람이 속았다」는 인과응보 서사가 만들어지고,
        그건 이 미션이 세우지 않기로 한 구조다.
      fear_note: >-
        두려움을 숨기지 않는 기도다. 이 감정을 「믿음 없음」으로 재단하는 자막·연출을
        붙이지 않는다. 겁이 난다고 말한 것이 기도에서 잘려 나가면, 겁이 난 사람은
        기도할 자격이 없는 사람이 된다.
      # 새로 쓴 문장이다(성경 자막 아님). 저작의 R3 선언 — 「세 값 모두 정당」·
      # 「stay_and_pray 는 유예가 아니라 그 자체로 종결된 상태」 — 를 화면 문장으로 옮겼다.
      pre_branch_notice_ko: |-
        이 다음은 세 장의 카드입니다.
        세 장은 나란히 있습니다. 순서도 단계도 아니고, 더 나아간 카드가 없습니다.
        · 가지 않고 머무는 것은 미뤄 둔 상태가 아니라 그 자체로 끝난 자리입니다.
        · 여기서 고른 것을 실제 관계에 적용하지 않아도 됩니다.
        · 돌아가는 것이 안전하지 않은 관계가 실제로 있습니다. 그런 자리에 계시다면
          가지 않는 쪽이 당신을 지킵니다.
        고르지 않고 지나가셔도 됩니다.
      # 라벨 셋과 그 순서는 저작 정본(content/jacob/scene3.yml ix_s3_return_choice)에서
      # 그대로 왔다. 옆에 붙은 참조도 저작이 각 옵션에 달아 둔 것이다.
      options:
        - id: send_ahead
          label_ko: 먼저 무언가를 보낸다
        - id: go_afraid
          label_ko: 두려운 채로 간다
        - id: stay_and_pray
          label_ko: 가지 않고 머문다
      options_note: >-
        셋 다 정당하고 결말 품질에 차등이 없다. 점수·순위·정답·진행 막대를 두지 않으며,
        고른 값이 이야기의 진행을 바꾸지도 않는다 — 세 라벨과 무응답 전부 Scene 4 로 간다.
        이 값이 쓰이는 자리는 Scene 5 의 마감 문구 하나뿐이고, 고르지 않는 것도 정상 경로다.
        저작은 30초 무응답을 「proceed_without_label」로 정의했다 — 무응답은 유효한 결말이다.
      card_order_policy: shuffle_per_session
      card_render_style: flat_siblings
      card_ui_note: >-
        세 카드는 같은 크기·같은 서체다. 색상·아이콘·번호로 우열을 만들지 않는다.
        고정 순서로 나란히 세우면 세 장은 「돌아감을 향한 진행 막대」로 읽히고,
        그 순간 머무는 카드는 「아직 거기」가 된다.
      decision_key: return_label
      crisis_reminder: 돌아갈지 말지를 고르는 자리입니다. 지금 힘드시면 {{crisis_resources.default}}
      ack_note: >-
        고른 직후의 응답 한 줄을 두지 않는다. 저작의 card_text_ko 넷은 라벨 자체를
        되풀이하는 문자열이라(「먼저 무언가를 보낸다」…) 화면에 다시 띄울 내용이 없다.
        여기서 새 문장을 지어 넣으면 그건 아무도 검토하지 않은 세 줄이 되고,
        세 줄의 길이·온도 차이가 곧 등급이 된다.
      offramp: *offramp
      branches: []

  # ── Scene 4 ────────────────────────────────────────────────────────────────
  # 얍복. 판정도 기록도 없다. 「이겼음이니라」를 성공 라벨로 재사용하지 않는다.
  - id: 4
    title: 얍복
    type: interaction
    interaction: contemplative
    duration_sec: 90
    scripture_ref: gen-32:24
    next: 5
    exposure_grade: A
    extras:
      anchor: 밤의 나루터. 홀로 남았다.
      additional_refs:
        [
          "gen-32:25",
          "gen-32:26",
          "gen-32:27",
          "gen-32:28",
          "gen-32:30",
          "gen-32:31",
        ]
      consent_coverage:
        consent_card_id: cc_jacob_family_deception
        covered_by_scene: 1
      environment:
        camera_rig: fixed_alone_at_the_ford
        time_of_day: moonlit_low_to_dawn
        ambient: [강물 소리, 낮은 숨소리]
        ui_overlays:
          [ai_assist_footer, crisis_reminder, exit_button, offramp_button]
      npcs:
        - { name_ko: 어떤 사람, framing: abstract_humanoid_no_face_no_gender }
      npc_note: >-
        본문이 「어떤 사람」이라고만 한 자리다. 정체를 지칭하는 명사를 자막·연출·주석
        어디에도 붙이지 않는다(저작 disputed #1, 신학검토자 승인 대기). 형상·성별을
        렌더하지 않으며, 본문이 이름을 대지 않은 자리를 해설이 채우지 않는다.
      caption_pacing:
        { auto_advance: false, advance: user, rewind_allowed: true }
      captions:
        - speaker_ko: 해설
          text_ko: "야곱은 홀로 남았더니 어떤 사람이 날이 새도록 야곱과 씨름하다가 (창 32:24)"
        - speaker_ko: 해설
          text_ko: "자기가 야곱을 이기지 못함을 보고 그가 야곱의 허벅지 관절을 치매 야곱의 허벅지 관절이 그 사람과 씨름할 때에 어긋났더라 (창 32:25)"
        - speaker_ko: 어떤 사람
          text_ko: "그가 이르되 날이 새려하니 나로 가게 하라 (창 32:26)"
        - speaker_ko: 야곱의 속말
          text_ko: "야곱이 이르되 당신이 내게 축복하지 아니하면 가게 하지 아니하겠나이다 (창 32:26)"
        - speaker_ko: 어떤 사람
          text_ko: "그 사람이 그에게 이르되 네 이름이 무엇이냐 (창 32:27)"
        - speaker_ko: 야곱의 속말
          text_ko: "그가 이르되 야곱이니이다 (창 32:27)"
        - speaker_ko: 어떤 사람
          text_ko: "그가 이르되 네 이름을 다시는 야곱이라 부를 것이 아니요 이스라엘이라 부를 것이니 이는 네가 하나님과 및 사람들과 겨루어 이겼음이니라 (창 32:28)"
        - speaker_ko: 해설
          text_ko: "그러므로 야곱이 그 곳 이름을 브니엘이라 하였으니 그가 이르기를 내가 하나님과 대면하여 보았으나 내 생명이 보전되었다 함이더라 (창 32:30)"
        - speaker_ko: 해설
          text_ko: "그가 브니엘을 지날 때에 해가 돋았고 그의 허벅다리로 말미암아 절었더라 (창 32:31)"
      name_note: >-
        32:27 의 이름 질문에 사용자의 실제 이름을 묻지 않는다. 응답은 「야곱이니이다」로
        고정이며, 개명도 이야기 속 야곱의 것이다 — 사용자 실명 개명 연출에 쓰지 않는다.
      victory_note: >-
        32:28 의 「이겼음이니라」를 사용자 성공 라벨로 재사용하지 않는다. 성취 UI(타이머·
        진행 바·완료 뱃지)를 두지 않고, 「기도로 하나님을 이긴다」류 적용을 붙이지 않는다
        (저작 disputed #4). 이긴 것은 본문 안의 야곱이지 오늘 여기 앉은 사람이 아니다.
      wording_note: >-
        개역한글 표기를 쓰지 않는다. 32:25 는 「허벅지 관절」, 32:31 은 「허벅다리」다.
      grip_debt_note: >-
        저작의 정점은 붙잡고 놓지 않는 15초 지속 그립이다. 자막 런타임에는 그 동작이
        없다. 다만 저작이 그 동작에 건 규칙은 그대로다 — 실패 판정이 없고, 재시도
        횟수를 세지 않으며, 아무것도 기록하지 않는다. 이 Scene 에는 판정도 기록도 없다.
        연출이 빠진 것이지 규칙이 완화된 것이 아니다.
      dwell:
        min_seconds: 3
        on_timeout: auto_proceed_after_seconds_15
        note_ko: 머무는 시간에 정답이 없습니다. 먼저 나가셔도 됩니다.
      limp_note: >-
        절뚝임은 지워지지 않는다. 32:31 을 마지막 자막으로 두고 「그래도 나았다」류
        회복 서사를 붙이지 않는다. 남은 것이 남은 채로 해가 돋는 것이 본문이다.
      crisis_reminder: 지금 이 장면이 버겁다면 멈추어도 됩니다. 도움을 받을 수 있는 곳이 있습니다 — {{crisis_resources.default}}
      offramp: *offramp
      interactions: []
      branches: []

  # ── Scene 5 ────────────────────────────────────────────────────────────────
  # 재회는 사용자가 결정하지 않는다 — 본문 그대로 이미 일어난다. 결정하는 것은 예물뿐이고,
  # 그 결정은 기록되지 않는다. 두 번째 동의 카드가 여기 있다.
  - id: 5
    title: 받으니라
    type: outro
    duration_sec: 90
    scripture_ref: gen-33:1
    next: null
    exposure_grade: A
    linked_values: [6, 4, 1] # 마음(두려움) · 시편(탄원) · 일기(오늘 고른 자리)
    value_prompt: 오늘 한 가지만 — 지금 두려운 것을 감추지 않고 한 줄로 적어 보는 것. 그 줄이 누구에게도 가지 않아도 됩니다.
    trigger_warning:
      level: high
      content:
        - confrontation_as_offender
        - unwanted_reunion
      consent_card_id: cc_jacob_confrontation
      covers_scenes: [5]
      # 마지막 Scene(next: null)이라 문자열 목적지가 성립한다. 같은 Scene 에 머물되
      # 아래 conditional_blocks 의 5_alt 가 payload 를 덮는다 — 저작의 5_alt
      # (caption_only_no_enactment)와 같은 모양이다.
      skip_alternative_scene_id: "5_alt"
      consent_card_ko: |-
        다음 장면은 가해자로서의 대면을 다룹니다.
        · 다루는 소재 — 가해자로서의 대면 · 원치 않는 재회.
        · 재회가 안전하지 않은 관계가 실재합니다. 학대나 폭력이 있었던 관계에서 다시
          만나는 것은 회복이 아니라 위험일 수 있습니다. 이것은 야곱에게 있었던 일이며,
          당신의 실제 관계에 적용하지 않아도 됩니다.
        · 넘어가도 되고 여기서 마쳐도 됩니다.
        계속하시겠어요?
        [들어간다]  [연출 없이 한 절로 마무리한다]
        지금 힘드시면: {{crisis_resources.default}}
      skip_bridge_narration_ko: |-
        하나님이 내게 은혜를 베푸셨고 내 소유도 족하오니 청하건대 내가 형님께 드리는 예물을 받으소서 하고 그에게 강권하매 받으니라 (창 33:11)
    extras:
      anchor: 새벽의 벌판. 해가 올라오고 있다.
      additional_refs:
        [
          "gen-33:3",
          "gen-33:4",
          "gen-33:8",
          "gen-33:9",
          "gen-33:10",
          "gen-33:11",
        ]
      environment:
        camera_rig: forward_step_reversible_across_open_plain
        time_of_day: dawn_warm_rising
        ambient: [벌판의 낮은 바람, 멀리 있는 가축 떼]
        ui_overlays:
          [ai_assist_footer, crisis_reminder, exit_button, offramp_button]
      npcs:
        - { name_ko: 에서, framing: approaching_no_face_render }
        - { name_ko: 사백 명, framing: silhouette_distant_ambiguous }
      npc_note: >-
        사백 명을 무기·전열·긴박 음향으로도, 환영 행렬로도 연출하지 않는다. 확정 연출이
        없다는 것이 저작의 결정이다(disputed #8). 야곱의 두려움은 33:1 자막 하나로만
        표현되고, 그 두려움이 옳았는지 틀렸는지를 화면이 판정하지 않는다.
      caption_pacing:
        { auto_advance: false, advance: user, rewind_allowed: true }
      captions:
        - speaker_ko: 야곱의 속말
          text_ko: "야곱이 눈을 들어 보니 에서가 사백 명의 장정을 거느리고 오고 있는지라 그의 자식들을 나누어 레아와 라헬과 두 여종에게 맡기고 (창 33:1)"
        - speaker_ko: 해설
          text_ko: "자기는 그들 앞에서 나아가되 몸을 일곱 번 땅에 굽히며 그의 형 에서에게 가까이 가니 (창 33:3)"
        - speaker_ko: 해설
          text_ko: "에서가 달려와서 그를 맞이하여 안고 목을 어긋맞추어 그와 입맞추고 서로 우니라 (창 33:4)"
        - speaker_ko: 에서
          text_ko: "내가 만난 바 이 모든 떼는 무슨 까닭이냐 (창 33:8)"
        - speaker_ko: 야곱의 속말
          text_ko: "내 주께 은혜를 입으려 함이니이다 (창 33:8)"
        - speaker_ko: 에서
          text_ko: "내 동생아 내게 있는 것이 족하니 네 소유는 네게 두라 (창 33:9)"
        - speaker_ko: 야곱의 속말
          text_ko: "그렇지 아니하니이다 내가 형님의 눈앞에서 은혜를 입었사오면 청하건대 내 손에서 이 예물을 받으소서 내가 형님의 얼굴을 뵈온즉 하나님의 얼굴을 본 것 같사오며 형님도 나를 기뻐하심이니이다 (창 33:10)"
        - speaker_ko: 해설
          text_ko: "하나님이 내게 은혜를 베푸셨고 내 소유도 족하오니 청하건대 내가 형님께 드리는 예물을 받으소서 하고 그에게 강권하매 받으니라 (창 33:11)"
      reunion_note: >-
        재회 자체는 사용자 선택 이전에 본문 그대로 일어난다. 사용자가 재회 여부를
        결정하지 않는다 — 결정을 두면 「만나기로 했다」가 이 미션의 성취가 되고,
        만나지 않기로 한 사람은 미완의 사람이 된다.
      theophany_note: >-
        33:10 의 「하나님의 얼굴을 본 것 같사오며」를 신현으로 확정하지 않는다
        (저작 disputed #3, 신학검토자 승인 대기). 인용 자막으로만 두고, 아래 마감
        10문 어디에도 이 표현을 쓰지 않았다. 「사람이 곧 하나님」류 번역은 절대 금지다.
      gift_note: >-
        저작은 33:9 다음에 예물을 다시 내밀지 거둘지를 사용자에게 묻는다. 그 선택은
        기록되지 않으며(records_decision: false · decision_key: null) 두 경로가 같은
        마감으로 수렴한다. 이 파일은 그 선택을 결정 지점으로 만들지 않고 두 절을 그대로
        이어 보여 준다 — 기록되지 않는 선택을 화면에만 두면 고른 사람은 무언가가
        달라졌다고 믿게 되고, 달라지지 않는다는 것이 저작의 요점이었다.
      dwell:
        min_seconds: 3
        on_timeout: auto_proceed_after_seconds_15
        note_ko: 머무는 시간에 정답이 없습니다. 먼저 나가셔도 됩니다.
      # 동의 카드를 건너뛴 사람의 축약 경로. 저작 alt_routes[5_alt] 와 같은 모양 —
      # 재회 연출 없이 33:11 한 절과 정적 마무리다. `renders` 가 약속한 대로
      # 마감 문구와 위기 안내와 기록 프롬프트는 **그대로 남는다.** 건너뛴 사용자의
      # 결말이 깎이면 그것이 곧 화해 압박이라는 것이 저작의 R3 구조 검사다.
      conditional_blocks:
        - id: "5_alt"
          reached_by: consent_skip
          renders: [closing_texts, crisis_reminder, value_prompt]
          captions:
            - speaker_ko: 해설
              text_ko: "하나님이 내게 은혜를 베푸셨고 내 소유도 족하오니 청하건대 내가 형님께 드리는 예물을 받으소서 하고 그에게 강권하매 받으니라 (창 33:11)"
          npcs: []
          note: >-
            연출 없이 한 절로 마무리한다. 마감은 본 경로와 동일하다.
      # 마감 문구 10종 — Scene 3 의 라벨 3 × 톤 3 + 라벨 없음 1.
      # 자구는 저작 정본(content/jacob/scene5.yml br_s5_closing_message)에서 그대로
      # 옮겼다. 저작이 「자구 변경 금지」로 못 박은 자리이고, 열 문장 전부가 같은
      # 해제 문장으로 끝난다 — 그 문장이 이 미션의 R3 축 자체다.
      # 라벨을 고르지 않은 사람은 default 로 온다. 저작은 여기를 톤과 무관한 한 문안으로
      # 두기로 했다(`all`). 셋으로 늘리는 「개선」을 하지 말 것.
      closing_texts:
        send_ahead:
          strong: '먼저 보낸 것이 무엇이든, 그것을 내밀던 손 위에 하나님의 은혜가 있었다. 야곱이 "하나님이 내게 은혜를 베푸셨고" 라고 말한 자리가 거기였다. (창 33:11) 이것은 야곱에게 있었던 일이며, 당신의 실제 관계에 적용하지 않아도 된다.'
          balanced: '야곱은 떼를 먼저 보냈다. 그것으로 잃은 것을 되살 수는 없었지만, 그 손짓은 그가 할 수 있는 일이었다. "내 주께 은혜를 입으려 함이니이다" — 그가 한 말은 그것뿐이었다. (창 33:8) 이것은 야곱에게 있었던 일이며, 당신의 실제 관계에 적용하지 않아도 된다.'
          soft: "먼저 무언가를 보내는 것도 하나의 걸음이었다. 그것이 닿을지 아닐지는 보낸 사람도 알지 못했다. 야곱도 몰랐다. 이것은 야곱에게 있었던 일이며, 당신의 실제 관계에 적용하지 않아도 된다."
        go_afraid:
          strong: "두려움을 말한 그 기도를 하나님은 물리치지 않으셨다. 겁이 난다고 말한 그 밤에도 하나님은 거기 계셨다. 이것은 야곱에게 있었던 일이며, 당신의 실제 관계에 적용하지 않아도 된다."
          balanced: '"그가 와서 나와 내 처자들을 칠까 겁이 나기 때문이니이다"(창 32:11). 야곱은 두려움을 감추지 않고 그대로 아뢰었다. 두려움은 숨겨야 할 것이 아니었다. 이것은 야곱에게 있었던 일이며, 당신의 실제 관계에 적용하지 않아도 된다.'
          soft: "두려운 채로 가는 것은 용기가 없는 것이 아니었다. 야곱은 겁이 난다고 말한 채로 갔다. 이것은 야곱에게 있었던 일이며, 당신의 실제 관계에 적용하지 않아도 된다."
        stay_and_pray:
          strong: '"나는 주께서 주의 종에게 베푸신 모든 은총과 모든 진실하심을 조금도 감당할 수 없사오나"(창 32:10) — 머문 자리에서 나온 그 말도 하나님 앞에 드려진 기도였다. 하나님 앞에 있기 위해 강을 건너야 하는 것은 아니었다. 이것은 야곱에게 있었던 일이며, 당신의 실제 관계에 적용하지 않아도 된다.'
          balanced: "야곱은 강을 건너기 전에 홀로 남아 밤을 지냈다(창 32:24). 야곱이 이튿날 건넌 것은 야곱에게 일어난 일이고, 건너지 않는 것 역시 그 자체로 온전한 이야기다. 머무름은 다음 장을 기다리는 여백이 아니다. 이것은 야곱에게 있었던 일이며, 당신의 실제 관계에 적용하지 않아도 된다."
          soft: "가지 않는 것도 하나의 자리다. 그 자리는 잠시 미뤄 둔 자리가 아니라, 끝까지 그대로 두어도 되는 자리다. 이것은 야곱에게 있었던 일이며, 당신의 실제 관계에 적용하지 않아도 된다."
        default:
          all: "여기까지 온 것으로 이 시간은 완결이다. 야곱의 이야기는 형제가 마주 서는 것으로 이어지지만, 그 장면이 당신에게 요구되는 것은 아니다. 오늘 여기서 멈추어도 된다. 이것은 야곱에게 있었던 일이며, 당신의 실제 관계에 적용하지 않아도 된다."
      closing_texts_note: >-
        열 문장 전부가 「이것은 야곱에게 있었던 일이며, 당신의 실제 관계에 적용하지
        않아도 된다.」로 끝난다. 자구를 바꾸지 않는다 — 이 문장이 빠지는 순간 마감은
        오늘 여기 앉은 사람에게 내려지는 지시가 된다. 사용자의 상태를 단정하지도 않는다.
      crisis_reminder: 여기까지 오시느라 애쓰셨습니다. 오늘 마음이 무겁게 남으셨다면 {{crisis_resources.default}}
      offramp: *offramp
      scope_note: 이 Scene 은 창세기 33:11 에서 끝난다. 그 이후의 배제 사유는 docs/MVP-JACOB.md 참조.
      next_scene_suggestion: 시편 32 — 숨기지 않고 아뢰는 기도
