# 욥 미션 시나리오 — *절망의 언어 허락*.
#
# 핵심 메시지: "너의 비탄은 부끄러운 것이 아니다. 욥의 친구들이 틀렸다."
# 신·임상 양쪽 검토 전이라 LLM 분기 X. 모든 응답은 정적 (큐레이션).
#
# Stage 1 MVP. Recovery 사용자 — 우울증 안정기 + 비탄의 언어 자체가 위로.
# Active crisis 사용자는 EmotionController 의 CrisisLockout 이 진입 차단.
#
# 임상 자문 영입 후 추가 양식 (사용자의 비탄 작성, AI 친구의 응답) 검토 예정.
#
# 신학 기준: 대한예수교장로회 합신 / 웨스트민스터 표준 / 개혁주의 (프로젝트 단일 기준, MVP-JESUS.md §4.3 준용).
#   욥기 — 인과응보 신학(친구들의 "네 죄 때문이다")을 하나님이 직접 책망하심 (욥 42:7).
#   고난의 원인을 특정인의 죄로 단정하는 서술 금지. 하나님의 응답은 설명이 아니라 임재(욥 38~42).
# 배제: 외경·영지주의·뉴에이지 혼합·"고난 = 축복의 전조" 번영 프레임.
#
# 안전선: R2 — Theme 5 (고통과 진리) 는 고난 의미화 필수 footer 대상. outro 에 suffering_footer 명시.
#         R3 — "결국 갑절로 회복됐다"(욥 42:10) 를 회복 보장 서사로 쓰지 않는다. 이 시나리오는 의도적으로
#              갑절 회복이 아니라 *만남* 에서 멈춘다.
#         R4 — Scene 2 (태어난 날 저주) 는 죽음 갈구 인접 언어 → trigger_warning + 스킵 대체.
#         R1 — outro 위기 라우팅. R5 — ai_assist_footer 항상 노출.

# 위기 연락처는 하드코딩하지 않는다 — `{{crisis_resources.default}}` 토큰만 쓴다.
# ScenePayloadAssembler → CrisisTokenResolver 가 crisis_resources 정본(우선순위 1위 활성 전화)으로
# 치환한다. 번호를 yml 에 직접 적으면 정책 개정(예: 2024-01-01 자살예방 상담 109 통합) 때
# 낡은 번호가 위기 카피에 그대로 남는다. ScenarioHotlineRatchetTest 가 이를 강제한다.

character: job
title: 너의 비탄은 부끄러운 것이 아니다
target_user: recovery

# R3 축의 *집행 수단*. 위 안전선 주석과 scene5 의 restoration_note 는 오랫동안 산문뿐이었고,
# 어떤 코드도 읽지 않았다 — 즉 "결국 갑절로 회복됩니다" 는 모든 게이트를 통과했다(2026-08-05 실측).
# 여기 토큰이 ForbiddenTokenScanner 로 승격돼 LLM *출력측* 을 막는다. 동기화는
# ContentSafetyGateEnforcementTest(저작 ⊆ 런타임)가 강제한다.
#
# 이 축이 다른 인물과 다른 점: 욥 42:10 은 *실제 성경 본문* 이다. 그래서 막는 것은 사실 진술이
# 아니라 **약속으로의 일반화** 다 — "욥이 갑절을 받았다"(통과) vs "너도 갑절로 받는다"(차단).
# 그래서 토큰은 명사(`갑절`)가 아니라 동사구(`갑절로 갚`, `갑절로 돌려`)에서 끊는다. 어간에서
# 끊어야 CONCESSIVE_NEGATION 이 "갑절로 돌려받지 못해도 괜찮습니다" 를 면제할 수 있다.
#
# 못 막는 것: 유의어 재작성("잃은 것 위에 더 좋은 것으로 채우십니다"). 부분문자열 lint 의
# 구조적 한계이며, 토큰을 늘려 해결됐다고 적지 말 것 — ForbiddenTokenConfigTest 의
# `알려진 한계` 가 이를 코드로 반증한다.
safety_gates:
  - id: R3_no_restoration_guarantee
    description: 회복 보장 서사 금지 — 잃은 것이 배수로 돌아온다는 약속, 회복 크기를 사용자 믿음에 귀속하는 비례 프레임
    lint_forbidden_tokens:
      # (a) 보상 보증 — 잃은 것이 배수로 돌아온다
      - "갑절로 갚"
      - "갑절로 돌려"
      - "갑절로 채워"
      - "갑절로 회복"
      - "갑절로 주십"
      - "배로 갚"
      - "배로 돌려"
      - "배로 돌아오"
      - "갑절로 돌아오"
      - "곱절로 돌아오"
      - "배로 채워"
      - "배로 회복"
      - "곱절로 갚"
      - "곱절로 돌려"
      - "곱절로 채워"
      - "잃은 것보다 더 크게"
      - "잃은 것보다 더 많이"
      - "잃은 것의 갑절"
      - "잃은 것을 다 돌려"
      - "빼앗긴 것을 다 돌려"
      # (b) 믿음 비례 — 회복의 크기를 사용자의 믿음 탓/덕으로 돌린다.
      #     번영신학의 역방향이라 더 위험하다. 회복이 안 오면 사용자 책임이 된다.
      - "믿음의 크기만큼"
      - "믿음의 크기가 곧"
      - "믿음의 크기대로"
      - "회복의 크기는"
      - "믿는 만큼 받"
      - "믿는 만큼 회복"
      - "믿는 만큼 채워"
      - "믿음만큼 회복"
      - "믿음만큼 받"
      - "믿음이 크면 클수록"
      - "믿음이 클수록"
      # (c) 회복 보증 — 시점만 유예할 뿐 결과를 확약한다
      - "반드시 회복시켜"
      - "반드시 회복됩"
      - "반드시 회복하게"
      - "언젠가 다 돌려"
# AI 보조 — 본문은 성경 참조. Stage 1 은 정적 콘텐츠뿐이나 footer 는 UI 일관성 위해 유지.
ai_assist_footer: "AI 보조 — 본문은 성경 참조"
scenes:
  - id: 1
    title: 침묵의 7일
    type: cinematic
    duration_sec: 60
    narration_id: job.scene1.narration
    scripture_ref: job-2:13
    extras:
      anchor: 함께 있음의 동행
      static_text: "친구 세 명이 욥의 슬픔이 너무 큰 것을 보고 *말없이* 7일 밤낮 함께 앉았습니다. 말이 필요 없는 자리가 있습니다."
      skippable_after_sec: 5
    next: 2

  - id: 2
    title: 욥의 첫 외침 — 태어난 날을 저주
    type: interaction
    interaction: scripture_reading
    duration_sec: 90
    scripture_ref: job-3:3
    extras:
      anchor: 비탄의 언어 정당화
      static_text: "욥은 *침묵을 깨고* 자기 태어난 날을 저주합니다. 신은 욥의 이 외침을 책망하지 않으셨습니다. *비탄을 말할 자유* 가 신앙 안에 있습니다."
      additional_refs: ["job-3:11", "job-6:8"]
      reflection_prompt: "당신이 지금 *말할 수 없었던* 외침이 있다면, 한 단어라도 떠올려 보세요. 화면에 적을 필요 없습니다. 단지 *떠올리는 것* 만으로 욥의 자리에 한 발 다가갑니다."
      language_note: "R 가드 — 비탄의 언어를 *허락* 하되 낭만화하지 않는다. 지금 실제로 죽음 생각이 크다면 본문보다 {{crisis_resources.default}} 연결이 우선이다."
    trigger_warning:
      level: medium
      content: ["death_wish", "birth_lament"]
      consent_card_id: "job_scene2_lament_warning"
      skip_alternative_scene_id: 3
    next: 3

  - id: 3
    title: 친구들의 위로 — 정답이 아닌 것
    type: interaction
    interaction: pick_one
    duration_sec: 90
    scripture_ref: job-4:7
    extras:
      anchor: 거짓 위로 인식
      static_text: "친구들은 *답을 가지고* 왔습니다. ''네가 죄가 있어서다'', ''곧 회복될 거다''. 신은 마지막에 친구들을 책망하셨습니다 (욥 42:7). *거짓 위로* 가 *침묵* 보다 해롭다는 것."
      options:
        - {
            id: heard_it_before,
            label: "나도 이런 말 들어본 적 있다",
            response: "당신만이 아닙니다. 그 말을 들으셨을 때 느꼈던 외로움은 정당한 감정입니다.",
          }
        - {
            id: said_it_before,
            label: "내가 다른 사람에게 이런 말 했을지도 모른다",
            response: "그 자각이 욥의 친구들이 끝까지 못 한 것입니다. 다음에 누군가 곁에 있을 때, *침묵* 의 선택지가 있다는 것을 기억해주세요.",
          }
        - {
            id: not_sure,
            label: "잘 모르겠다",
            response: "괜찮습니다. 욥기는 답이 아닌 *질문* 의 책입니다.",
          }
      theology_note: "신학 가드 — 고난의 원인을 당사자의 죄로 단정하는 인과응보 서술은 하나님이 직접 책망하신 것 (욥 42:7). 어떤 분기에서도 '네 탓' 프레임 금지."
    next: 4

  - id: 4
    title: 폭풍 가운데서 하나님의 응답
    type: interaction
    interaction: scripture_reading
    duration_sec: 90
    scripture_ref: job-38:1
    extras:
      anchor: 응답의 형태
      static_text: "신은 욥의 *질문에 답하지 않으셨습니다*. 대신 *우주의 광활함* 을 보여주셨습니다. 답이 *설명* 이 아니라 *함께 있음* 이라는 것."
      reflection_prompt: "당신의 *지금* 의 무게를 설명할 수 있는 사람은 없을지도 모릅니다. 하지만 *함께 있을* 수 있는 사람이 한 명 있다면 — 그 자리를 부탁해 보는 것도 회복의 한 걸음입니다."
    next: 5

  - id: 5
    title: 회복 — 그러나 답 없이
    type: outro
    duration_sec: 60
    scripture_ref: job-42:5
    linked_values: [5, 4, 1] # 욥(고통과 진리) · 시편(비탄) · 일기(솔직함)
    value_prompt: "욥처럼 *답이 아닌 자리* 도 있습니다. 오늘 *솔직한 한 줄* 을 일기에 적어보세요. 부끄러운 것이 아닙니다."
    extras:
      anchor: 만남으로서의 회복
      static_text: "욥은 결국 *설명* 을 듣지 못했습니다. 그러나 *만남* 을 얻었습니다."
      restoration_note: "R3 가드 — 욥 42:10 의 '갑절 회복' 을 이 시나리오의 결말로 쓰지 않는다 (회복 보장 서사 금지). 결말은 의도적으로 *답 없는 만남* 에서 멈춘다."
      suffering_footer: "이 묵상은 자발적인 고난의 의미를 다룹니다. 가정폭력·종교적 학대·정신적 학대 같은 피해 상황을 견디라는 강요가 아닙니다. 안전하지 않은 상황에 있다면 가까운 상담 자원에 연결되세요." # R2 필수 footer (Theme 5)
      recovery_keys:
        SAD: job.recovery.lament_permitted
        CONFUSED: job.recovery.question_book
        LONELY: job.recovery.silent_presence
        ANGRY: job.recovery.honest_cry
        EXHAUSTED: job.recovery.seven_days_silence
      crisis_reminder: "지금 이 순간이 무겁다면, {{crisis_resources.default}}."
      next_scene_suggestion: "엘리야 — 죽기를 갈망한 후 천사가 음식과 잠을 주신 이야기"
    next: null
