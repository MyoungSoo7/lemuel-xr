# 다니엘 — 「어디까지 맞추고, 어디서 멈추는가」
#
# 핵심 메시지: **정체성을 지키는 일은 세상에서 물러나는 일이 아니다.**
#   이름도 언어도 자리도 바뀐 자리에서 다니엘은 계속 유능하게 일했고, 멈춘 곳은
#   딱 한 군데였다. 이 미션의 축은 경계 설정이다 — 무엇이 바뀌어도 되고,
#   무엇은 바뀌면 안 되는가.
#
# ─────────────────────────────────────────────────────────────────────────────
# ⚠️ 이 파일은 2026-08-22 부터 **실제로 로드된다.**
#   ScenarioYamlLoader.loadAll() 은 `Character.entries` 를 순회한다 — 디렉터리가 아니다.
#   그래서 `Character` enum 의 DANIEL("daniel") 한 줄이 곧 사용자 노출이다.
#   근거·범위·남은 빚은 docs/DANIEL-RUNTIME-SIGNOFF.md 에 있고
#   RuntimeExposureSignoffTest 의 «룻 이후 열리는 인물은 노출 대장 없이 열리지 않는다» 가 집행한다.
#   · 전문 신학 검토 없음 · 전문 정신건강 검토 없음. 그 사실은 대장에 남아 있다.
#   · content/daniel/README.md 머리의 초안 고지는 「인간 안전검토자 사인오프 전
#     프로덕션 반영 금지」를 걸어 두었고, **그 사인오프는 없다.** 베드로의 §8 전건과
#     같은 종류의 미해소 부채다 — 지우지 않고 대장에 적었다. 초록이 아니라 등재다.
#   · AR 은 닫혀 있다(VR 전용). 이미 열려 있는 인물들과 같은 조건이며,
#     `scripts/gen_ar_manifests.py` 의 AR_MISSIONS 에 daniel 이 들어간 적이 없다.
# ─────────────────────────────────────────────────────────────────────────────
#
# 상류 문서 (이 파일은 이들의 하류다 — 자구를 여기서 발명하지 않는다)
#   설계        docs/MVP-DANIEL.md
#   런타임대본  docs/MVP-DANIEL-CONTENT.md
#   저작        content/daniel/scene1~5.yml · content/daniel/README.md
#   성구 시드   backend/src/main/resources/db/migration/V20260822120000__seed_newchar_passages_gae.sql
#
# 이 파일의 자막은 **저작 트리의 text_ko 를 옮긴 것**이고, 그 자구는 개역개정이다.
# 옮기는 것 외의 작문을 하지 않았다 — 새 문장을 쓰면 그것은 아무도 검토하지 않은 본문이 된다.
# 예외는 Scene 4 의 `skip_bridge_narration_ko` 한 덩어리뿐이고, 그것이 왜 새로 쓰였는지는
# docs/MVP-DANIEL-CONTENT.md 에 따로 적었다.
#
# 신학 기준: 대한예수교장로회 합신 / 웨스트민스터 표준 / 개혁주의 (프로젝트 단일 기준).
#
# 배제 (이 파일에서 직접 집행되는 것)
#   · 단 6:24 이하 — 참소자와 그 가족의 집단 처형, 그리고 다리오의 조서. 인물 전 Scene
#     공통 원칙으로 **완전 배제**한다. 이 미션은 6:23 에서 끝난다.
#     사유 전문은 content/daniel/README.md 「폭력 배제」와 docs/MVP-DANIEL.md 참조.
#   · 단 6:11-15(고발 경위) — Scene 5 범위 밖. 자막화하지 않는다.
#     저작이 놓아 둔 비성경 브리지 한 줄이 그 자리를 대신한다.
#   · 「믿었으므로 지켜졌다 → 지켜지지 않았으면 믿음이 부족했다」 인과 구성 —
#     마감 문구 12종 어디에도 결과 보장 서술을 두지 않는다. 저작의 R3 게이트가 같은 것을
#     금칙 토큰으로 잰다.
#
# 안전선
#   R1 자해 발화 리스너 5/5 Scene 상시. 정서 부담이 큰 Scene 4·5 에 위기 자원을 함께 노출한다.
#   R4 **동의 카드가 둘이고, 서로를 상속하지 않는다.** 이 인물의 구조적 차이점이다.
#      · Scene 4 카드 — 신앙을 이유로 한 처벌을 정한 금령의 **고지**. 덮는 범위는 Scene 4
#        하나이고 건너뛰기 목적지는 Scene 5 다. 건너뛴 사람은 Scene 5 에서 **다시 묻는다.**
#      · Scene 5 카드 — 위협의 **실행**. 마지막 Scene 이라 다음 씬이 없으므로 목적지는
#        같은 Scene 안의 축약 블록(`daniel_scene5_alt_quiet_window`)이다.
#        엔진 계약: 정수면 Scene 점프, 문자열이면 같은 Scene 의 conditional_blocks id
#        (SceneSkipResolver · ScenarioYamlLoaderTest 의 R4 무결성 루프).
#      한쪽 동의가 다른 쪽을 대신하지 않는다 — content/daniel/README.md 의 명시 요구다.
#   R5 기본 경로는 LLM 호출 0회로 완주된다. 묵상만 opt-in 이며 기본값은 off.
#
# ⚠️ 위기 연락처를 이 파일에 숫자로 적지 말 것.
#   `{{crisis_resources.default}}` 토큰만 쓴다 — ScenePayloadAssembler → CrisisTokenResolver
#   가 정본으로 치환하고 ScenarioHotlineRatchetTest 가 이를 강제한다.

character: daniel
title: 어디까지 맞추고 어디서 멈추는가

target_user: 신앙 정체성을 숨겨야 하는 자리에서 어디까지 맞출지 매일 고르고 있는 사람

ai_assist_footer: AI 보조 — 본문은 성경 참조 — storyteller 역할. 위기 시 {{crisis_resources.default}}.

# ── 금칙 토큰: 이 파일에 사본을 두지 않는다 ──────────────────────────────────
# 이 미션의 금칙 토큰 정본은 content/daniel/scene1~5.yml 의 축 게이트 안이다.
# 다니엘 저작은 그 목록을 **최상위에 두지 않았다** — 최상위에 두면 재귀 수집 게이트만
# 통과하고 축 게이트는 토큰 0종으로 남아 「선언만 있고 0건을 막는」 빈 초록이 되기 때문이다
# (content/daniel/scene1.yml 머리 주석). 그 결정을 여기서 되돌리지 않는다.
#
# 런타임 차단은 application.yml 의 safety.forbidden-tokens.list 가 하고(세 출구 전부:
# responseText · scenePayload · valuePrompt), 저작 목록이 그 전역 목록의 부분집합인지는
# 아래 verified_by 가 매 빌드 확인한다. 부분집합이 깨지면 그 테스트가 빨개진다.
safety_gates:
  - id: R2_R3_forbidden_tokens_lint
    scenes: [1, 2, 3, 4, 5]
    axis: 고난에 신적 의도 부여 금지 · 결과 보장 금지 · 성취 프레이밍 금지 · 배타적 우월 어휘 금지
    enforcement: structural
    structural_check: >-
      금칙 토큰 목록을 이 파일에 복제하지 않고 저작 정본(content/daniel/scene1~5.yml)의
      축 게이트 안에 둔다. 런타임 집행은 application.yml 의 전역 목록이 하며, 저작 목록이
      그 전역 목록의 부분집합임을 아래 verified_by 가 매 빌드 확인한다.
    verified_by: 저작 게이트의 금칙 토큰이 런타임 목록에 전부 반영돼 있다

  - id: violence_exclusion_dan_6_24
    scenes: [1, 2, 3, 4, 5]
    axis: 단 6:24 이하 완전 배제 — 이 미션은 6:23 에서 끝난다
    enforcement: structural
    structural_check: >-
      Scene 5 의 마지막 자막이 6:23 이고, 그 이후 절은 자막·연출·안내 어디에도 없다.
      배제된 자구를 여기에 옮겨 적지 않는다 — extras 는 payload 로 통째 복사되므로
      잘라낸 문장을 적으면 잘라낸 그 문장이 화면으로 나간다.
    # 지목 대상은 **실재하는 테스트 함수명** 이어야 한다(ContentSafetyGateEnforcementTest 의
    # 매달린 참조 차단). 산문을 적으면 그 자리는 두 번째 structural_check 일 뿐이다.
    # 검사는 backend/.../game/application/DanielViolenceExclusionTest.kt 가 한다 — 배제된
    # 자구를 옮기지 않고 절 번호의 상한(6:23)으로 판정한다.
    verified_by: "다니엘 미션은 단 6-23 에서 끝난다 — 그 이후 절은 자막·참조 어디에도 없다"

scenes:
  # ── Scene 1 ────────────────────────────────────────────────────────────────
  # 개명은 겪는 것이지 고르는 것이 아니다. 사용자 조작 0.
  - id: 1
    title: 이름이 바뀌던 자리
    type: cinematic
    duration_sec: 60
    scripture_ref: dan-1:7
    next: 2
    exposure_grade: B
    extras:
      anchor: 바벨론 왕궁의 안뜰. 횃불이 낮게 타는 저녁.
      environment:
        camera_rig: fixed_standing_in_courtyard
        time_of_day: torch_lit_interior
        ambient: [멀리서 들리는 낯선 말소리, 횃불 타는 소리]
        ui_overlays: [ai_assist_footer, exit_button]
      npcs:
        - { name_ko: 환관장, framing: abstract_silhouette_low_detail }
      npc_note: >-
        실사 인물 형상을 쓰지 않는다. 환관장·감독관·다리오 왕 전원 저디테일 실루엣이며,
        관료적 조심스러움으로 연기한다 — 악역 톤을 쓰지 않는다.
      caption_pacing:
        { auto_advance: false, advance: user, rewind_allowed: true }
      captions:
        - speaker_ko: 해설
          text_ko: "환관장이 그들의 이름을 고쳐 다니엘은 벨드사살이라 하고 하나냐는 사드락이라 하고 미사엘은 메삭이라 하고 아사랴는 아벳느고라 하였더라 (단 1:7)"
        - speaker_ko: 다니엘의 속말
          text_ko: "이름이 바뀌었다. 말투도, 음식도, 자리도 바뀔 것이다. 무엇이 바뀌어도 되고, 무엇은 바뀌면 안 되는가."
      # 개명 연출은 고정 텍스트 전환뿐이다. 사용자 실명·프로필을 여기에 넣지 않는다 —
      # 개인정보 취급이 늘어나고, 이름을 빼앗기는 연출이 사용자 본인에게 직접 가해진다.
      name_change:
        fixed_text_from: 다니엘
        fixed_text_to: 벨드사살
        user_identity_data_used: false
      name_change_note: >-
        사용자 조작이 없다. 개명은 이 이야기에서 선택지가 아니라 겪는 일이고,
        고를 수 있는 것처럼 두면 「그때 거절했어야 했다」가 된다.
      interactions: []
      branches: []

  # ── Scene 2 ────────────────────────────────────────────────────────────────
  # 이 미션의 **유일한 사용자 선택**. 세 카드 전부 본문이고 틀린 답이 없다.
  - id: 2
    title: 뜻을 정하다
    type: interaction
    interaction: pick_one
    duration_sec: 90
    scripture_ref: dan-1:8
    next: 3
    exposure_grade: B
    extras:
      anchor: 왕의 음식이 차려진 방. 창으로 빛이 길게 들어온다.
      additional_refs:
        ["dan-1:9", "dan-1:10", "dan-1:11", "dan-1:12", "dan-1:13", "dan-1:14"]
      environment:
        camera_rig: fixed_seated_at_table
        time_of_day: interior_daylight_shafts
        ambient: [그릇 놓이는 소리, 낮은 발소리]
        ui_overlays: [ai_assist_footer, exit_button]
      npcs:
        - { name_ko: 환관장, framing: abstract_silhouette_low_detail }
        - { name_ko: 감독하게 한 자, framing: abstract_silhouette_low_detail }
      caption_pacing:
        { auto_advance: false, advance: user, rewind_allowed: true }
      captions:
        - speaker_ko: 해설
          text_ko: "다니엘은 뜻을 정하여 왕의 음식과 그가 마시는 포도주로 자기를 더럽히지 아니하리라 하고 자기를 더럽히지 아니하도록 환관장에게 구하니 (단 1:8)"
        - speaker_ko: 해설
          text_ko: "하나님이 다니엘로 하여금 환관장에게 은혜와 긍휼을 얻게 하신지라 (단 1:9)"
        - speaker_ko: 환관장
          text_ko: "환관장이 다니엘에게 이르되 내가 내 주 왕을 두려워하노라 그가 너희 먹을 것과 너희 마실 것을 지정하셨거늘 너희의 얼굴이 초췌하여 같은 또래의 소년들만 못한 것을 그가 보게 할 것이 무엇이냐 그렇게 되면 너희 때문에 내 머리가 왕 앞에서 위태롭게 되리라 하니라 (단 1:10)"
        - speaker_ko: 해설
          text_ko: "환관장이 다니엘과 하나냐와 미사엘과 아사랴를 감독하게 한 자에게 다니엘이 말하되 (단 1:11)"
        - speaker_ko: 다니엘
          text_ko: "청하오니 당신의 종들을 열흘 동안 시험하여 채식을 주어 먹게 하고 물을 주어 마시게 한 후에 당신 앞에서 우리의 얼굴과 왕의 음식을 먹는 소년들의 얼굴을 비교하여 보아서 당신이 보는 대로 종들에게 행하소서 하매 (단 1:12-13)"
        - speaker_ko: 해설
          text_ko: "그가 그들의 말을 따라 열흘 동안 시험하더니 (단 1:14)"
      # 카드는 「무엇을 먹을까」가 아니라 「어떻게 요청할까」를 고른다. 음식 선택은
      # 분기가 아니다 — 이 미션의 결정 변수는 요청의 방식이다.
      options:
        - id: direct_refusal
          ref: 단 1:8
          label_ko: 여기까지라고 말한다
        - id: verifiable_proposal
          ref: 단 1:12-13
          label_ko: 확인해 볼 수 있는 방법을 낸다
        - id: seek_ally
          ref: 단 1:11
          label_ko: 결정할 수 있는 사람을 찾는다
      options_note: >-
        셋 다 본문에 있는 반응이고 틀린 카드가 없다. 점수·순위·정답을 매기지 않으며,
        고른 값이 이야기의 진행을 바꾸지도 않는다 — 세 라벨과 무응답 전부 Scene 3 으로 간다.
        이 값이 쓰이는 자리는 Scene 5 의 마감 문구 하나뿐이고, 고르지 않는 것도 정상 경로다.
      decision_key: request_style
      branches: []

  # ── Scene 3 ────────────────────────────────────────────────────────────────
  # 「버텨냈다」로 읽히지 않게 한다. 1:17 의 주어는 하나님이다.
  - id: 3
    title: 열흘
    type: interaction
    interaction: contemplative
    duration_sec: 45
    scripture_ref: dan-1:15
    next: 4
    exposure_grade: B
    extras:
      anchor: 같은 방. 열흘이 하루처럼 지나간다.
      additional_refs: ["dan-1:16", "dan-1:17"]
      environment:
        camera_rig: fixed_seated_at_table
        time_of_day: day_cycle_timelapse
        ambient: [낮과 밤이 오가는 낮은 저음]
        ui_overlays: [ai_assist_footer, exit_button]
      caption_pacing:
        { auto_advance: false, advance: user, rewind_allowed: true }
      captions:
        - speaker_ko: 해설
          text_ko: "열흘이 지났다."
        - speaker_ko: 해설
          text_ko: "열흘 후에 그들의 얼굴이 더욱 아름답고 살이 더욱 윤택하여 왕의 음식을 먹는 다른 소년들보다 더 좋아 보인지라 (단 1:15)"
        - speaker_ko: 해설
          text_ko: "그리하여 감독하는 자가 그들에게 지정된 음식과 마실 포도주를 제하고 채식을 주니라 (단 1:16)"
        - speaker_ko: 해설
          text_ko: "하나님이 이 네 소년에게 학문을 주시고 모든 서적을 깨닫게 하시고 지혜를 주셨으니 다니엘은 또 모든 환상과 꿈을 깨달아 알더라 (단 1:17)"
      dwell:
        min_seconds: 3
        on_timeout: auto_proceed_after_seconds_15
        note_ko: 머무는 시간에 정답이 없습니다. 먼저 나가셔도 됩니다.
      framing_note: >-
        열흘을 「버텨냈다」로 연출하지 않는다. 본문은 결과를 인간의 의지로 적지 않으며,
        마지막 절의 주어는 하나님이다. 성취로 읽히는 순간 이 Scene 은 버티지 못한
        사람에게 「네가 덜 버텼다」가 된다.
      interactions: []
      branches: []

  # ── Scene 4 ────────────────────────────────────────────────────────────────
  # R4 트리거 ①. 덮는 범위는 이 Scene 하나다 — Scene 5 는 상속하지 않고 다시 묻는다.
  - id: 4
    title: 금령
    type: cinematic
    duration_sec: 60
    scripture_ref: dan-6:4
    next: 5
    exposure_grade: A
    trigger_warning:
      level: mid
      content:
        - religious_persecution
        - death_threat
