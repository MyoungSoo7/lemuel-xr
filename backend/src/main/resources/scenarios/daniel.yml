  # ── Scene 5 ────────────────────────────────────────────────────────────────
  # R4 트리거 ②. 마지막 Scene 이라 건너뛰기 목적지가 같은 Scene 의 축약 블록이다.
  - id: 5
    title: 창문, 그리고 아침
    type: outro
    duration_sec: 105
    scripture_ref: dan-6:10
    next: null
    exposure_grade: A
    linked_values: [6, 4, 1] # 마음(두려움) · 시편(탄원) · 일기(오늘 그은 선)
    value_prompt: 오늘 한 가지만 — 어디까지는 맞출 수 있고 어디서부터는 아닌지, 한 줄로 적어 보는 것.
    trigger_warning:
      level: mid
      content:
        - confinement
        - death_threat
      consent_card_id: daniel_s5_consent
      covers_scenes: [5]
      # 문자열 목적지 — 다음 씬이 없는 마지막 Scene 의 축약 경로다. 같은 Scene 에 머물며
      # 아래 conditional_blocks 의 같은 id 를 쓴다(SceneSkipResolver 의 계약).
      skip_alternative_scene_id: daniel_scene5_alt_quiet_window
      consent_card_ko: |-
        다음 장면에는 좁고 어두운 공간과 맹수 소리가 나옵니다.
        · 폐쇄된 공간이 부담되시면 건너뛰셔도 괜찮습니다.
        · 건너뛰셔도 마무리는 그대로 받으십니다.
        [그대로 보기]  [조용한 장면으로 넘어가기]
        지금 힘드시면: {{crisis_resources.default}}
      card_note: >-
        Scene 4 에서 동의했더라도 여기서 다시 묻는다. 고지에 동의한 것이 실행에 동의한
        것은 아니다 — 한 Scene 의 동의가 다른 Scene 의 동의를 대신하지 않는다.
    extras:
      anchor: 예루살렘으로 향한 창문이 있는 윗방. 그리고 새벽.
      additional_refs:
        [
          "dan-6:16",
          "dan-6:17",
          "dan-6:19",
          "dan-6:20",
          "dan-6:21",
          "dan-6:22",
          "dan-6:23",
        ]
      environment:
        camera_rig: fixed_in_upper_room
        time_of_day: window_dawn_transition
        ambient: [조용한 저녁의 방, 멀리 도시의 낮은 소리]
        ui_overlays: [ai_assist_footer, crisis_reminder, exit_button]
      npcs:
        - { name_ko: 다리오 왕, framing: abstract_silhouette_low_detail }
      caption_pacing:
        { auto_advance: false, advance: user, rewind_allowed: true }
      captions:
        - speaker_ko: 해설
          text_ko: "다니엘이 이 조서에 왕의 도장이 찍힌 것을 알고도 자기 집에 돌아가서는 윗방에 올라가 예루살렘으로 향한 창문을 열고 전에 하던 대로 하루 세 번씩 무릎을 꿇고 기도하며 그의 하나님께 감사하였더라 (단 6:10)"
        - speaker_ko: 해설
          text_ko: "그 모습이 그대로 보고되었다."
        - speaker_ko: 해설
          text_ko: "이에 왕이 명령하매 다니엘을 끌어다가 사자 굴에 던져 넣는지라 왕이 다니엘에게 이르되 네가 항상 섬기는 너의 하나님이 너를 구원하시리라 하니라 (단 6:16)"
        - speaker_ko: 해설
          text_ko: "이에 돌을 굴려다가 굴 어귀를 막으매 왕이 그의 도장과 귀족들의 도장으로 봉하였으니 이는 다니엘에 대한 조치를 고치지 못하게 하려 함이었더라 (단 6:17)"
        - speaker_ko: 해설
          text_ko: "이튿날에 왕이 새벽에 일어나 급히 사자 굴로 가서 (단 6:19)"
        - speaker_ko: 다리오 왕
          text_ko: "다니엘이 든 굴에 가까이 이르러서 슬피 소리 질러 다니엘에게 묻되 살아 계시는 하나님의 종 다니엘아 네가 항상 섬기는 네 하나님이 사자들에게서 능히 너를 구원하셨느냐 하니라 (단 6:20)"
        - speaker_ko: 다니엘
          text_ko: "다니엘이 왕에게 아뢰되 왕이여 원하건대 왕은 만수무강 하옵소서 (단 6:21)"
        - speaker_ko: 다니엘
          text_ko: "나의 하나님이 이미 그의 천사를 보내어 사자들의 입을 봉하셨으므로 사자들이 나를 상해하지 못하였사오니 이는 나의 무죄함이 그 앞에 명백함이오며 또 왕이여 나는 왕에게도 해를 끼치지 아니하였나이다 하니라 (단 6:22)"
        - speaker_ko: 해설
          text_ko: "왕이 심히 기뻐서 명하여 다니엘을 굴에서 올리라 하매 그들이 다니엘을 굴에서 올린즉 그의 몸이 조금도 상하지 아니하였으니 이는 그가 자기의 하나님을 믿음이었더라 (단 6:23)"
      # 건너뛴 사람이 도착하는 자리. 자막 아홉 장 중 넷만 남는다 — 창문(6:10) ·
      # 저작이 놓아 둔 브리지 한 줄 · 보전(6:22) · 미션 종료점(6:23).
      # 투척·봉인·새벽·왕의 부름 넷이 빠지고, 그 넷이 곧 굴 안의 장면이다.
      conditional_blocks:
        - id: daniel_scene5_alt_quiet_window
          reached_by: skip_from_scene5
          renders: [closing_texts, crisis_reminder, value_prompt]
          omits_assets:
            [
              model_lion,
              sfx_lion_growl,
              env_den_interior,
              vfx_stone_seal,
              haptic_impact,
            ]
          captions:
            - speaker_ko: 해설
              text_ko: "다니엘이 이 조서에 왕의 도장이 찍힌 것을 알고도 자기 집에 돌아가서는 윗방에 올라가 예루살렘으로 향한 창문을 열고 전에 하던 대로 하루 세 번씩 무릎을 꿇고 기도하며 그의 하나님께 감사하였더라 (단 6:10)"
            - speaker_ko: 해설
              text_ko: "그 모습이 그대로 보고되었다."
            - speaker_ko: 다니엘
              text_ko: "나의 하나님이 이미 그의 천사를 보내어 사자들의 입을 봉하셨으므로 사자들이 나를 상해하지 못하였사오니 이는 나의 무죄함이 그 앞에 명백함이오며 또 왕이여 나는 왕에게도 해를 끼치지 아니하였나이다 하니라 (단 6:22)"
            - speaker_ko: 해설
              text_ko: "왕이 심히 기뻐서 명하여 다니엘을 굴에서 올리라 하매 그들이 다니엘을 굴에서 올린즉 그의 몸이 조금도 상하지 아니하였으니 이는 그가 자기의 하나님을 믿음이었더라 (단 6:23)"
          note: >-
            축약 경로도 마무리 문구와 위기 안내에는 도달한다. 창문 앞의 자리는 건너뛰기
            경로에서도 남는다 — 부담의 근원은 굴이지 창문이 아니다.
      dwell:
        min_seconds: 3
        on_timeout: auto_proceed_after_seconds_15
        note_ko: 머무는 시간에 정답이 없습니다. 먼저 나가셔도 됩니다.
      dwell_limit_note: >-
        투척과 봉인 두 자막에는 체류 상한 3초가 걸려 있다. 굴 안의 폐쇄 상태에
        머무르게 하지 않고 곧바로 보전 자막으로 넘어간다.
      # 마감 문구 12종 — Scene 2 의 라벨 3 × 톤 3 + 라벨 없음 3.
      # 자구는 저작 정본(content/daniel/scene5.yml br_s5_closing_message)에서 그대로 옮겼다.
      # 라벨을 고르지 않은 사람은 D 표로 온다 — 무응답은 실패가 아니라 정상 경로다.
      closing_texts:
        direct_refusal:
          strong: 다니엘은 뜻을 정했고, 그 결정이 그 혼자 감당할 일로 남지 않았습니다. 본문은 곧바로 이렇게 적습니다 — "하나님이 다니엘로 하여금 환관장에게 은혜와 긍휼을 얻게 하신지라"(단 1:9). 오늘 당신이 그은 선도, 당신 혼자 그은 것이 아닙니다.
          balanced: 다니엘은 왕의 음식 앞에서 물러서지 않았습니다. 그리고 그 거절이 관계를 끝내지도 않았습니다. 선을 긋는 일과 사람을 잃는 일이 언제나 같은 일은 아닙니다.
          soft: '"여기까지"라고 말해 본 사람은 그 말이 얼마나 무거운지 압니다. 오늘 그 무게를 한 번 들어 보았다는 것, 그것만 여기 남겨 둡니다.'
        verifiable_proposal:
          strong: 다니엘은 거절당한 자리에서 멈추지 않고, 열흘이라는 확인 가능한 제안을 내놓았습니다(단 1:12-13). 본문은 그 결과를 사람의 전략으로만 적지 않습니다 — "하나님이 이 네 소년에게 학문을 주시고 모든 서적을 깨닫게 하시고 지혜를 주셨으니"(단 1:17). 당신이 준비하고 있는 말도 혼자 놓여 있지 않습니다.
          balanced: 다니엘은 "안 됩니다"라는 답을 들은 뒤에, 확인해 볼 수 있는 열흘을 제안했습니다. 거절이 대화의 끝은 아니었습니다. 당신이 찾는 방법도 아직 다 나오지 않았을 뿐입니다.
          soft: 열흘이면 알 수 있다 — 다니엘의 제안은 그만큼 작았습니다. 크게 바꾸지 않아도 되는 방법이 남아 있을 때가 있습니다.
        seek_ally:
          strong: 환관장은 왕을 두려워해 거절했지만, 본문은 다니엘이 만난 또 한 사람을 기록합니다 — "감독하게 한 자"(단 1:11). 그 만남 바로 앞에 이 문장이 놓여 있습니다 — "하나님이 다니엘로 하여금 환관장에게 은혜와 긍휼을 얻게 하신지라"(단 1:9). 당신 곁에도 아직 만나지 않은 사람이 있습니다.
          balanced: 다니엘이 처음 말을 건넨 사람에게는 결정권이 없었습니다. 그래서 그는 다른 자리로 갔습니다. 같은 말을 다른 사람에게 하는 것은 물러서는 일이 아닙니다.
          soft: 혼자 밀어붙이지 않고 사람을 찾는 것도 하나의 길입니다. 오늘 그 길을 골랐다는 것만 기록해 둡니다.
        default:
          strong: 다니엘의 이야기는 그가 무엇을 골랐는지가 아니라 그가 지켜졌다는 사실로 끝납니다 — "사자들이 나를 상해하지 못하였사오니"(단 6:22). 오늘 아무것도 고르지 않았어도, 그 문장은 그대로 남아 있습니다.
          balanced: 오늘은 아무것도 고르지 않아도 되는 날이었습니다. 선택하지 않는 것도 하나의 자리입니다. 여기까지 온 것으로 이 시간은 끝납니다.
          soft: 고르지 않고 지나온 시간도 시간입니다. 오늘은 여기까지입니다.
      closing_texts_note: >-
        어디에도 결과 보장 서술을 두지 않는다. 이 미션은 다니엘의 선택 구조를 겪게 하지
        결과를 약속하지 않는다 — 지켜지지 않은 사람에게 약속은 곧 「네 믿음이 그만큼이
        아니었다」가 되기 때문이다. 임재·동행을 말하는 표면은 열어 둔다. 임재는 결과가 아니다.
      crisis_reminder: 여기까지 오시느라 애쓰셨습니다. 오늘 마음이 무겁게 남으셨다면 {{crisis_resources.default}}
      angel_note: >-
        본문이 말한 어휘를 그대로 둔다. 그 존재의 신원을 확정 서술하지 않는다 —
        해설이 그것을 채우는 순간 사용자는 본문이 하지 않은 말을 읽게 된다.
      scope_note: 이 Scene 은 다니엘 6:23 에서 끝난다. 그 이후 절의 배제 사유는 docs/MVP-DANIEL.md 참조.
      next_scene_suggestion: 시편 121 — 지키시는 이를 부르는 기도
