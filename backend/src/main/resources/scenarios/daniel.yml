        · 어느 지점에서든 멈추거나 나갈 수 있습니다.
        [본문 그대로 보기]  [요약만 듣고 넘어가기]
        지금 힘드시면: {{crisis_resources.default}}
      # 저작의 축약 경로(daniel_scene4_alt_decree_brief)를 런타임에서 옮긴 자리다.
