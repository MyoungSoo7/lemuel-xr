        - { name_ko: 다리오 왕, framing: abstract_silhouette_low_detail }
      caption_pacing:
        { auto_advance: false, advance: user, rewind_allowed: true }
      captions:
        - speaker_ko: 해설
          text_ko: "다니엘은 총리 셋 중 하나로 나라를 다스렸다. 그 자리를 넘겨다보는 사람들이 있었다."
        - speaker_ko: 해설
          text_ko: "이에 총리들과 고관들이 국사에 대하여 다니엘을 고발할 근거를 찾고자 하였으나 아무 근거, 아무 허물도 찾지 못하였으니 이는 그가 충성되어 아무 그릇됨도 없고 아무 허물도 없음이었더라 (단 6:4)"
        - speaker_ko: 해설
          text_ko: "나라의 모든 총리와 지사와 총독과 법관과 관원이 의논하고 왕에게 한 법률을 세우며 한 금령을 정하실 것을 구하나이다 왕이여 그것은 곧 이제부터 삼십일 동안에 누구든지 왕 외의 어떤 신에게나 사람에게 무엇을 구하면 사자 굴에 던져 넣기로 한 것이니이다 (단 6:7)"
      crisis_reminder: 신앙 때문에 위협을 받는 이야기가 이어집니다. 지금 힘드시면 {{crisis_resources.default}}
