# 에스더 — 「드러낼 것인가, 언제 어떻게 드러낼 것인가」
#
# 핵심 메시지: **드러내는 것이 정답인 묵상이 아니다.**
#   말하지 않기로 하는 것도, 먼저 곁을 만드는 것도, 지금 말하는 것도 전부 정당하다.
#   이 미션의 축은 개시(disclosure)의 자기 결정권이다 — 다니엘의 「경계 설정」과도,
#   베드로의 「행동 이후의 자기 정죄」와도 겹치지 않게 저작이 일부러 갈라 둔 축이다.
#
# ─────────────────────────────────────────────────────────────────────────────
# ⚠️ 이 파일은 2026-08-22 부터 **실제로 로드된다.**
#   ScenarioYamlLoader.loadAll() 은 `Character.entries` 를 순회한다 — 디렉터리가 아니다.
#   그래서 `Character` enum 의 ESTHER("esther") 한 줄이 곧 사용자 노출이다.
#   근거·범위·남은 빚은 docs/ESTHER-RUNTIME-SIGNOFF.md 에 있고
#   RuntimeExposureSignoffTest 의 «룻 이후 열리는 인물은 노출 대장 없이 열리지 않는다» 가 집행한다.
#   · 전문 신학 검토 없음 · 전문 정신건강 검토 없음. 그 사실은 대장에 남아 있다.
#   · content/esther/scene1~5.yml 머리의 초안 고지는 「lemuel-theology-reviewer +
#     lemuel-mental-health-safety 사후 검토 전 프로덕션 반영 금지」를 걸어 두었고,
#     **그 검토는 없다.** 베드로 §8 · 다니엘과 같은 종류의 미해소 부채다 —
#     지우지 않고 대장에 적었다. 초록이 아니라 등재다.
#   · scene3/scene5 의 R2/R3 게이트 **이름 자체가 인간 사인오프 전**이라고 저작이 적어
#     두었다(seed §7-3 8항). 그 사인오프도 없다.
#   · AR 은 닫혀 있다(VR 전용). 이미 열려 있는 인물들과 같은 조건이며,
#     `scripts/gen_ar_manifests.py` 의 AR_MISSIONS 에 esther 가 들어간 적이 없다.
# ─────────────────────────────────────────────────────────────────────────────
#
# 상류 문서 (이 파일은 이들의 하류다 — 자구를 여기서 발명하지 않는다)
#   설계        docs/MVP-ESTHER.md
#   런타임대본  docs/MVP-ESTHER-CONTENT.md
#   저작        content/esther/scene1~5.yml · content/esther/README.md
#   저작 게이트 scripts/gates/esther.yml
#   성구 시드   backend/src/main/resources/db/migration/V20260822120000__seed_newchar_passages_gae.sql
#
# 이 파일의 자막은 **저작 트리의 text_ko 를 옮긴 것**이고, 그 자구는 개역개정이다.
# 옮기는 것 외의 작문을 하지 않았다 — 새 문장을 쓰면 그것은 아무도 검토하지 않은 본문이 된다.
# 다니엘과 달리 이 인물에는 **새로 쓴 산문이 한 줄도 없다.** Scene 1 의
# `skip_bridge_narration_ko` 석 줄도 전부 저작에 있던 문장이다(2:10 · 3:8 축자 +
# 저작의 nb_s1_alt_summary 한 줄). 카드 라벨 셋은 docs/MVP-ESTHER.md §Scene 3 표에서 왔다.
#
# 신학 기준: 대한예수교장로회 합신 / 웨스트민스터 표준 / 개혁주의 (프로젝트 단일 기준).
#
# 배제 (이 파일에서 직접 집행되는 것)
#   · 에스더 1장(와스디 폐위) · 2장 후궁 징집 서사 — 전면 배제. 2:10 만 쓴다.
#   · 에 5:9-14 · 에 6장 전체 · 에 7:7-10(하만 처형) · 에 8:7-17(반격 조서) ·
#     에 9장(부림절 보복 살육) — 전면 배제. 이 미션은 8:6 인용에서 끝난다.
#   · 「말했으므로 구원받았다 → 말하지 않으면 아무도 못 산다」 인과 구성 —
#     4:14 의 「다른 데로 말미암아 놓임과 구원을 얻으려니와」 절반이 본문 스스로
#     그 구성을 막는 자리다. 그 절반을 생략하지 않는다.
#   배제된 자구를 이 파일의 *값* 에 옮겨 적지 않는다. extras 는 payload 로 통째 복사되므로
#   잘라낸 문장을 적으면 잘라낸 그 문장이 화면으로 나간다. 사유 전문은 문서에 있다.
#
# 안전선
#   R1 자해 발화 리스너 5/5 Scene 상시. 정서 부담이 큰 Scene 1·4·5 에 위기 자원을 함께 노출한다.
#      이 미션에서 자해 위험에 가장 가까운 문장은 Scene 4 의 4:16 「죽으면 죽으리이다」다.
#      인용 자막으로만 노출하고 사용자 대사로 재생성하지 않는다.
#   R3 **이 인물의 최우선 축.** 세 카드는 결말 품질에 차등이 없다. 점수·순위·정답·진행 막대가
#      분기 어디에도 없고, 라우트 순서는 침묵(nondisclosure)이 맨 앞이다.
#   R4 동의 카드는 **하나뿐이고 Scene 1 에 있다.** 다니엘(둘)과도 룻(다중 커버)과도 다르다.
#      덮는 범위는 Scene 1 하나이고 건너뛰기 목적지는 Scene 2 다.
#      ⚠️ 저작은 건너뛰기를 「같은 파일 안의 대체 라우트 s1_alt_summary(40초)」로 설계했는데,
#         엔진은 문자열 목적지를 **마지막 Scene 에서만** 허용한다(SceneSkipResolver ·
#         ScenarioYamlLoaderTest 의 R4 무결성 루프). Scene 1 은 마지막이 아니므로 그대로 옮길 수
#         없다. 그래서 목적지는 정수 2로 두고, 저작이 그 대체 라우트에 담아 둔 세 자막을
#         `skip_bridge_narration_ko` 로 옮겼다. **덜어낸 것은 3:9 와 3:13 두 자막뿐이고,
#         그 둘이 정확히 동의 카드가 고지한 내용이다.** 남긴 것·옮긴 근거는 대본 문서에 적었다.
#   R5 기본 경로는 LLM 호출 0회로 완주된다. 묵상만 opt-in 이며 기본값은 off.
#
# ⚠️ 위기 연락처를 이 파일에 숫자로 적지 말 것.
#   `{{crisis_resources.default}}` 토큰만 쓴다 — ScenePayloadAssembler → CrisisTokenResolver
#   가 정본으로 치환하고 ScenarioHotlineRatchetTest 가 이를 강제한다.

character: esther
title: 드러낼 것인가, 언제 어떻게 드러낼 것인가

target_user: 말하면 잃을 것 같아 말하지 못한 채로, 말해야 하는지 매일 저울질하고 있는 사람

ai_assist_footer: AI 보조 — 본문은 성경 참조 — storyteller 역할. 위기 시 {{crisis_resources.default}}.

# ── 금칙 토큰: 이 파일에 사본을 두지 않는다 ──────────────────────────────────
# 이 미션의 금칙 토큰 정본은 content/esther/scene3.yml · scene5.yml 의 축 게이트 안이다
# (71종 × 3벌). 저작은 그 목록을 R2_*/R3_* 게이트 **아래에만** 두기로 결정했고
# (content/esther/scene1.yml:159-165 의 판단 근거), Scene 1·2·4 에는 그 축이 없어 토큰 블록도
# 없다. 그 결정을 여기서 되돌리지 않는다 — 세 번째 사본을 만들면 갈라진다.
#
# 런타임 차단은 application.yml 의 safety.forbidden-tokens.list 가 하고(세 출구 전부:
# responseText · scenePayload · valuePrompt), 저작 목록이 그 전역 목록의 부분집합인지는
# 아래 verified_by 가 매 빌드 확인한다. 부분집합이 깨지면 그 테스트가 빨개진다.
safety_gates:
  - id: R2_R3_forbidden_tokens_lint
    scenes: [1, 2, 3, 4, 5]
    axis: 개시 정답화 금지 · 목적론적 의미부여 금지 · 유예된 개시 압박 금지 · 사후 후회 위협 금지
    enforcement: structural
    structural_check: >-
      금칙 토큰 목록을 이 파일에 복제하지 않고 저작 정본(content/esther/scene3.yml ·
      scene5.yml)의 축 게이트 안에 둔다. 런타임 집행은 application.yml 의 전역 목록이 하며,
      저작 목록이 그 전역 목록의 부분집합임을 아래 verified_by 가 매 빌드 확인한다.
    verified_by: 저작 게이트의 금칙 토큰이 런타임 목록에 전부 반영돼 있다

  - id: R3_silence_is_also_deliverance
    scenes: [3, 5]
    axis: 침묵도 정당한 끝이다 — 세 카드에 등급이 없고, 4:14 의 방어 절반절이 본문에 남는다
    enforcement: structural
    structural_check: >-
      Scene 3 의 4:14 자막이 「다른 데로 말미암아 놓임과 구원을 얻으려니와」를 실제로 포함하고,
      같은 Scene 이 그 문자열을 mandatory_clause 로 선언한다(선언·본문 두 곳 동시 확인이 이
      게이트의 핵심이다 — 선언만 있고 본문에서 빠지면 반려). 세 카드의 라벨 순서는
      nondisclosure 가 맨 앞이며, 분기 서브트리에 score/rank/correct/정답 류 키가 0건이다.
    # 지목 대상은 **실재하는 테스트 함수명** 이어야 한다(ContentSafetyGateEnforcementTest 의
    # 매달린 참조 차단). 산문을 적으면 그 자리는 두 번째 structural_check 일 뿐이다.
    verified_by: "침묵이 맨 앞이고 세 카드에 등급이 없다 — 4-14 의 방어 절반절도 그대로 남아 있다"

  - id: content_exclusion_esther
    scenes: [1, 2, 3, 4, 5]
    axis: 배제된 장·절이 자막·참조 어디에도 없다 — 이 미션은 8:6 에서 끝난다
    enforcement: structural
    structural_check: >-
      노출 텍스트에 나타나는 에스더서 참조가 성구 시드에 등재된 스물두 개 안에만 있다.
      배제된 자구를 여기에 옮겨 적지 않는다 — 배제 목록을 기대값으로 적으면 그 문장이
      리포로 돌아오고, extras 는 payload 로 통째 복사되므로 화면으로 나갈 길이 생긴다.
      그래서 자구가 아니라 **허용된 참조의 집합** 으로 판정한다.
    verified_by: "에스더 미션은 시드에 등재된 스물두 참조 밖으로 나가지 않는다"

scenes:
  # ── Scene 1 ────────────────────────────────────────────────────────────────
  # R4 동의 카드가 있는 유일한 Scene. 은폐(2:10) 위에 조서(3:13)가 내려앉는다.
  - id: 1
    title: 이름 없는 민족
    type: cinematic
    duration_sec: 60
    scripture_ref: est-2:10
    next: 2
    exposure_grade: A
    trigger_warning:
      level: high
      content:
        - genocide_threat
        - ethnic_persecution
        - child_endangerment
      consent_card_id: esther_scene1_edict_warning
      covers_scenes: [1]
      skip_alternative_scene_id: 2
      # 저작의 카드에서 한 줄을 뺐다 — 「음성/자막 강도: [자막만] [약] [기본]」.
      # 그 토글은 런타임에 없다. 없는 조작을 카드에 적으면 그건 고지가 아니라 거짓말이고,
      # 게다가 그 줄의 대괄호가 cardDoors 의 문 이름 파싱과 충돌한다. 남은 빚으로 대장에 적었다.
      consent_card_ko: |-
        다음 장면은 한 민족 전체를 없애라는 국가 조서를 다룹니다.
        · 조서 본문(에 3:13)에는 어린이와 여인을 포함해 죽이라는 표현이 인용 자막으로 잠시 나옵니다.
        · 약 1분. 곧이어 그 소식을 들은 사람들의 장면으로 이어집니다.
        · 이 묵상은 정체를 드러낼 것인가를 다룹니다. 드러내는 것이 정답인 묵상이 아닙니다.
          드러내지 않기로 하는 것도 이 묵상 안에서 온전한 선택입니다.
        계속하시겠어요?
        [계속한다]  [건너뛰기 — 조서 낭독 없이 요약으로]
        지금 힘드시면: {{crisis_resources.default}}
      # 저작의 대체 라우트(s1_alt_summary)를 런타임에서 옮긴 자리다. 저작이 그 40초에
      # 남겨 둔 것이 2:10 · 3:8 · 요약 한 줄이었고, 덜어낸 것이 3:9 와 3:13 이었다.
      # 그대로 옮겼다 — 새로 쓴 문장이 없다.
      skip_bridge_narration_ko: |-
        에스더가 자기의 민족과 종족을 말하지 아니하니 이는 모르드개가 명령하여 말하지 말라 하였음이라 (에 2:10)
        하만이 아하수에로 왕에게 아뢰되 한 민족이 왕의 나라 각 지방 백성 중에 흩어져 거하는데 그 법률이 만민의 것과 달라서 왕의 법률을 지키지 아니하오니 용납하는 것이 왕에게 무익하니이다 (에 3:8)
        한 민족 전체를 없애라는 조서가 온 지방에 내려졌다.
    extras:
      anchor: 수산 궁 알현실. 차고 격식 있는 낮빛.
      additional_refs: ["est-3:8", "est-3:9", "est-3:13"]
      environment:
        camera_rig: fixed_standing_in_audience_hall
        time_of_day: cold_formal_daylight
        ambient: [멀리서 들리는 서기관들의 말소리, 두루마리 스치는 소리]
        ui_overlays: [ai_assist_footer, crisis_reminder, exit_button]
      npcs:
        - { name_ko: 하만, framing: abstract_silhouette_low_detail }
      npc_note: >-
        하만을 만화적 악당으로 그리지 않는다. 조소·광기 연기 금지 — 서류를 읽는 관료 톤이다.
        소수자 배제가 행정 합리성의 언어로 발화되는 것이 이 장면의 날카로움이고,
        악당 연기를 얹는 순간 그 날카로움이 사라진다.
      caption_pacing:
        { auto_advance: false, advance: user, rewind_allowed: true }
      captions:
        - speaker_ko: 해설
          text_ko: "에스더가 자기의 민족과 종족을 말하지 아니하니 이는 모르드개가 명령하여 말하지 말라 하였음이라 (에 2:10)"
        - speaker_ko: 하만
          text_ko: "하만이 아하수에로 왕에게 아뢰되 한 민족이 왕의 나라 각 지방 백성 중에 흩어져 거하는데 그 법률이 만민의 것과 달라서 왕의 법률을 지키지 아니하오니 용납하는 것이 왕에게 무익하니이다 (에 3:8)"
        - speaker_ko: 하만
          text_ko: "왕이 옳게 여기시거든 조서를 내려 그들을 진멸하소서 내가 은 일만 달란트를 왕의 일을 맡은 자의 손에 맡겨 왕의 금고에 드리리이다 하니 (에 3:9)"
        - speaker_ko: 해설
          text_ko: "이에 그 조서를 역졸에게 맡겨 왕의 각 지방에 보내니 열두째 달 곧 아달월 십삼일 하루 동안에 모든 유다인을 젊은이 늙은이 어린이 여인들을 막론하고 죽이고 도륙하고 진멸하고 또 그 재산을 탈취하라 하였고 (에 3:13)"
      crisis_reminder: 한 민족을 없애라는 조서가 나오는 장면입니다. 지금 힘드시면 {{crisis_resources.default}}
      dwell_limit_note: >-
        조서 자막에는 체류 상한 3초가 걸려 있다. 그 화면에 머무르게 하지 않고 곧바로
        다음 자리로 넘어간다.
      order_note: >-
        2:10 을 먼저 두고 3:8 을 뒤에 둔다. 「내가 숨긴 그것이 지금 고발당하고 있다」가
        이 순서에서만 성립한다. 순서를 바꾸면 은폐는 배경 설명이 되고 축이 무너진다.
      observe_note: >-
        사용자 조작이 없다. 조서 선포는 관찰 대상이지 개입 대상이 아니다 —
        막을 수 있었던 것처럼 두면 막지 못한 사람의 책임이 된다.
      scope_note: 에스더 1장과 2장 서사의 배제 사유는 docs/MVP-ESTHER.md 참조.
      interactions: []
      branches: []

  # ── Scene 2 ────────────────────────────────────────────────────────────────
  # 남의 고통은 선택지가 아니다. 이 Scene 은 목격으로 끝나고 결정으로 넘어가지 않는다.
  - id: 2
    title: 성문 밖의 통곡
    type: cinematic
    duration_sec: 75
    scripture_ref: est-4:1
    next: 3
    exposure_grade: B
    extras:
      anchor: 수산 성문 밖이 내려다보이는 궁 안 난간. 흐린 한낮.
      additional_refs: ["est-4:3", "est-4:8"]
      environment:
        camera_rig: fixed_at_palace_railing
        time_of_day: overcast_midday_muted
        ambient: [원경의 통곡, 굵은 베옷과 재를 스치는 바람]
        ui_overlays: [ai_assist_footer, exit_button]
      npcs:
        - { name_ko: 모르드개, framing: distant_silhouette_sackcloth }
        - { name_ko: 하닥, framing: abstract_silhouette_low_detail }
      npc_note: >-
        모르드개도 재에 누운 군중도 원경 실루엣만이다. 얼굴 클로즈업으로 고통을 전시하지
        않는다. 하닥은 대사가 없다 — 물건을 건네는 동작뿐이다.
      distance_note: >-
        사용자는 궁 안에 있고 통곡은 성문 밖에 있다. 그 사이의 공간적 단절이 이 Scene 의
        구조다 — 닿지 않는 거리에서 듣는 것이 이 자리의 전부다.
      caption_pacing:
        { auto_advance: false, advance: user, rewind_allowed: true }
      captions:
        - speaker_ko: 해설
          text_ko: "모르드개가 이 모든 일을 알고 자기의 옷을 찢고 굵은 베 옷을 입고 재를 뒤집어쓰고 성중에 나가서 대성 통곡하며 (에 4:1)"
        - speaker_ko: 해설
          text_ko: "왕의 명령과 조서가 각 지방에 이르매 유다인이 크게 애통하여 금식하며 울며 부르짖고 굵은 베 옷을 입고 재에 누운 자가 무수하더라 (에 4:3)"
        - speaker_ko: 해설
          text_ko: "또 유다인을 진멸하라고 수산 궁에서 내린 조서 초본을 하닥에게 주어 에스더에게 보여 알게 하고 또 그에게 부탁하여 왕에게 나아가서 그 앞에서 자기 민족을 위하여 간절히 구하라 하니 (에 4:8)"
        - speaker_ko: 에스더의 속말
          text_ko: "성문 밖의 통곡이 여기까지 들려온다. 나는 그 소리를 듣는다."
      close_note: >-
        마지막 자막은 「듣는다」로 그친다. 결단·선언형 발화를 여기에 두지 않는다 —
        그건 Scene 3 과 4 의 몫이고, 목격이 곧바로 결정으로 넘어가면 남의 고통이
        선택지가 된다.
      leak_note: >-
        조서 초본의 문서 면은 읽히지 않는 문자 텍스처다. 조서 전문은 Scene 1 전용이며
        여기서 다시 렌더하지 않는다 — 동의 카드가 고지한 범위를 Scene 2 가 몰래 넘어서면
        사전 동의의 사정거리 위반이다.
      interactions: []
      branches: []

  # ── Scene 3 ────────────────────────────────────────────────────────────────
  # 이 미션의 핵심 Scene. **유일한 사용자 선택** 이고, 세 카드에 등급이 없다.
  - id: 3
    title: 법과 삼십 일
    type: interaction
    interaction: pick_one
    duration_sec: 90
    scripture_ref: est-4:11
    next: 4
    exposure_grade: B
    extras:
      anchor: 수산 궁 안쪽 방. 창으로 드는 빛이 낮다.
      additional_refs: ["est-4:13", "est-4:14"]
      environment:
        camera_rig: fixed_seated_in_inner_chamber
        time_of_day: dim_contemplative_window_light
        ambient: [방의 정적]
        ui_overlays: [ai_assist_footer, crisis_reminder, exit_button]
      npcs:
        - { name_ko: 하닥, framing: abstract_silhouette_low_detail }
        - { name_ko: 모르드개, framing: distant_silhouette }
      npc_note: >-
        4:13-14 는 하닥을 통한 전언이다. 모르드개를 사용자 정면에 세우지 않는다 —
        그는 화자이지 이 미션의 도덕적 권위가 아니다. 「너와 네 아버지 집은 멸망하리라」는
        모르드개의 대사이며, 내레이션이 그 위협에 동의하는 것으로 처리하지 않는다.
      caption_pacing:
        { auto_advance: false, advance: user, rewind_allowed: true }
      captions:
        - speaker_ko: 해설
          text_ko: "왕의 신하들과 왕의 각 지방 백성이 다 알거니와 남녀를 막론하고 부름을 받지 아니하고 안뜰에 들어가서 왕에게 나가면 오직 죽이는 법이요 왕이 그 자에게 금 규를 내밀어야 살 것이라 이제 내가 부름을 입어 왕에게 나가지 못한 지가 이미 삼십 일이라 하라 하니라 (에 4:11)"
        - speaker_ko: 해설
          text_ko: "모르드개가 그를 시켜 에스더에게 회답하되 너는 왕궁에 있으니 모든 유다인 중에 홀로 목숨을 건지리라 생각하지 말라 (에 4:13)"
        - speaker_ko: 해설
          text_ko: "이 때에 네가 만일 잠잠하여 말이 없으면 유다인은 다른 데로 말미암아 놓임과 구원을 얻으려니와 너와 네 아버지 집은 멸망하리라 네가 왕후의 자리를 얻은 것이 이 때를 위함이 아닌지 누가 알겠느냐 하니 (에 4:14)"
      # 이 절반절이 빠지면 본문은 「말하지 않으면 아무도 못 산다」가 된다. 본문이 스스로를
      # 방어하는 자리이고, 이 미션의 R3 축이 여기 뿌리를 둔다. 위 자막에서 생략 금지.
      mandatory_clause: "다른 데로 말미암아 놓임과 구원을 얻으려니와"
      open_question_note: >-
        「누가 알겠느냐」는 의문형 그대로 둔다. 「예비된 자리」류 확언으로 번역하지 않는다 —
        확언이 되는 순간 이 자리에 오지 못한 사람에게는 자기 탓의 근거가 된다.
      pre_branch_notice_ko: |-
        이 다음은 세 장의 카드입니다.
        세 장은 나란히 있습니다. 순서도 단계도 아니고, 더 나아간 카드가 없습니다.
        · 드러내는 것이 정답인 묵상이 아닙니다. 말하지 않기로 하는 것도 끝까지 온전한 선택입니다.
        · 여기서 고른 것을 실제 관계에 적용하지 않아도 됩니다.
        · 말하는 것이 안전하지 않은 자리가 실제로 있습니다 — 가정에서, 직장에서,
          체류 자격이 걸린 상황에서. 그런 자리에 계시다면 말하지 않는 쪽이 당신을 지킵니다.
        지금 힘드시면: {{crisis_resources.default}}
      # 라벨 셋은 docs/MVP-ESTHER.md §Scene 3 표에서 그대로 왔다. 침묵이 맨 앞이다 —
      # 순서 자체가 저작 결정이며, 섞어 보이는 것(shuffle)과는 별개로 정본의 첫 자리다.
      options:
        - id: nondisclosure
          label_ko: 말하지 않기로 한다
        - id: gather_first
          label_ko: 먼저 곁을 만든다
        - id: speak_now
          label_ko: 지금 말하기로 한다
      options_note: >-
        셋 다 정당하고 결말 품질에 차등이 없다. 점수·순위·정답·진행 막대를 두지 않으며,
        고른 값이 이야기의 진행을 바꾸지도 않는다 — 세 라벨과 무응답 전부 Scene 4 로 간다.
        이 값이 쓰이는 자리는 Scene 5 의 마감 문구 하나뿐이고, 고르지 않는 것도 정상 경로다.
      card_order_policy: shuffle_per_session
      card_render_style: flat_siblings
      card_ui_note: >-
        번호 매김·stepper·진행 막대를 쓰지 않는다. 고정 순서로 나란히 세우면 세 카드가
        「개시를 향한 진행 막대」로 읽히고, 그 순간 맨 앞 카드는 「아직 거기」가 된다.
      decision_key: disclose_label
      # 고른 직후의 응답 한 줄. 저작 정본(content/esther/scene3.yml br_s3_disclose_choice)에서
      # 그대로 옮겼고, 세 줄 사이에 길이·온도 차이를 두지 않았다.
      acknowledgements:
        nondisclosure: 말하지 않기로 하셨군요. 그 선택은 그대로 괜찮습니다.
        gather_first: 먼저 곁에 있을 사람을 떠올리셨군요.
        speak_now: 말하기로 하셨군요. 속도는 당신이 정합니다.
      crisis_reminder: 말할지 말지를 고르는 자리입니다. 지금 힘드시면 {{crisis_resources.default}}
      branches: []

  # ── Scene 4 ────────────────────────────────────────────────────────────────
  # 금식은 성취가 아니다. 이 미션에서 자해 위험에 가장 가까운 문장이 여기 있다.
  - id: 4
    title: 사흘
    type: interaction
    interaction: contemplative
    duration_sec: 45
    scripture_ref: est-4:16
    next: 5
    exposure_grade: A
    extras:
      anchor: 등불 하나만 남은 방. 사흘이 지나간다.
      environment:
        camera_rig: fixed_in_private_chamber
        time_of_day: single_low_lamp_dim
        ambient: [깊은 정적]
        ui_overlays: [ai_assist_footer, crisis_reminder, exit_button]
      caption_pacing:
        { auto_advance: false, advance: user, rewind_allowed: true }
      captions:
        - speaker_ko: 해설
          text_ko: "당신은 가서 수산에 있는 유다인을 다 모으고 나를 위하여 금식하되 밤낮 삼 일을 먹지도 말고 마시지도 마소서 나도 나의 시녀와 더불어 이렇게 금식한 후에 규례를 어기고 왕에게 나아가리니 죽으면 죽으리이다 하니라 (에 4:16)"
        - speaker_ko: 해설
          text_ko: "사흘이 지나갔다."
      dwell:
        min_seconds: 3
        on_timeout: auto_proceed_after_seconds_15
        note_ko: 머무는 시간에 정답이 없습니다. 먼저 나가셔도 됩니다.
      dwell_limit_note: >-
        4:16 자막에는 체류 상한 3초가 걸려 있고, 전환은 밝아지는 쪽이다. 암전으로 끝내지
        않는다 — 「죽으면 죽으리이다」에서 화면이 검게 닫히면 그 문장 위에 사용자를 두고
        나가는 셈이 된다.
      quotation_only_note: >-
        4:16 은 인용 자막으로만 노출한다. 사용자 1인칭 대사로 재생성하지 않는다 —
        자기 죽음을 각오한 발화이고, 사용자가 지금 그 자리에 서 있다. 극적 강조·
        클라이맥스 연출을 얹지 않는다.
      achievement_note: >-
        금식의 사흘은 성취가 아니다. 타이머·진행 바·완료 뱃지 같은 성취 UI 를 두지 않는다 —
        성취가 되는 순간 이 Scene 은 견디지 못한 사람에게 「네가 덜 견뎠다」가 된다.
      crisis_reminder: 힘든 문장이 지나갔습니다. 지금 마음이 무겁다면 {{crisis_resources.default}}
      interactions: []
      branches: []

  # ── Scene 5 ────────────────────────────────────────────────────────────────
  # 단계적 개시가 본문의 구조다. 왕이 세 번 묻고, 에스더는 두 번 미룬다 — 실패가 아니다.
  - id: 5
    title: 안 뜰, 금 규, 그리고 세 번의 물음
    type: outro
    duration_sec: 90
    scripture_ref: est-5:1
    next: null
    exposure_grade: A
    linked_values: [6, 4, 1] # 마음(두려움) · 시편(탄원) · 일기(오늘 고른 자리)
    value_prompt: 오늘 한 가지만 — 지금 말하지 않기로 한 것이 무엇이고 그게 왜 당신을 지키는지, 한 줄로 적어 보는 것.
    extras:
      anchor: 왕궁 안 뜰과 어전. 그리고 잔치의 자리.
      additional_refs:
        [
          "est-5:2",
          "est-5:3",
          "est-5:4",
          "est-5:6",
          "est-5:8",
          "est-7:2",
          "est-7:3",
          "est-7:4",
          "est-7:6",
          "est-8:6",
        ]
      environment:
        camera_rig: forward_step_reversible_into_inner_court
        time_of_day: royal_daylight_shift_to_banquet_warm
        ambient: [어전의 정적, 원경의 잔치 소리]
        ui_overlays: [ai_assist_footer, crisis_reminder, exit_button]
      npcs:
        - { name_ko: 아하수에로 왕, framing: abstract_silhouette_low_detail }
      npc_note: >-
        로맨스 연출을 쓰지 않는다. 왕은 변덕과 무관심의 톤이고, 세 번 모두 같은 관용구를
        기계적으로 반복한다는 점이 연출의 알맹이다. 하만은 7:6 시점에 등장하지 않는다 —
        자막만이다.
      caption_pacing:
        { auto_advance: false, advance: user, rewind_allowed: true }
      captions:
        - speaker_ko: 해설
          text_ko: "제삼일에 에스더가 왕후의 예복을 입고 왕궁 안 뜰 곧 어전 맞은편에 서니 왕이 어전에서 전 문을 대하여 왕좌에 앉았다가 (에 5:1)"
        - speaker_ko: 해설
          text_ko: "왕후 에스더가 뜰에 선 것을 본즉 매우 사랑스러우므로 손에 잡았던 금 규를 그에게 내미니 에스더가 가까이 가서 금 규 끝을 만진지라 (에 5:2)"
        - speaker_ko: 아하수에로 왕
          text_ko: "왕이 이르되 왕후 에스더여 그대의 소원이 무엇이며 요구가 무엇이냐 나라의 절반이라도 그대에게 주겠노라 하니 (에 5:3)"
        - speaker_ko: 해설
          text_ko: "에스더가 이르되 오늘 내가 왕을 위하여 잔치를 베풀었사오니 왕이 좋게 여기시거든 하만과 함께 오소서 하니 (에 5:4)"
        - speaker_ko: 아하수에로 왕
          text_ko: "잔치의 술을 마실 때에 왕이 에스더에게 이르되 그대의 소청이 무엇이뇨 곧 허락하겠노라 그대의 요구가 무엇이뇨 나라의 절반이라 할지라도 시행하겠노라 하니 (에 5:6)"
        - speaker_ko: 해설
          text_ko: "내가 만일 왕의 목전에서 은혜를 입었고 왕이 내 소청을 허락하시며 내 요구를 시행하시기를 좋게 여기시면 내가 왕과 하만을 위하여 베푸는 잔치에 또 오소서 내일은 왕의 말씀대로 하리이다 하니라 (에 5:8)"
        - speaker_ko: 아하수에로 왕
          text_ko: "왕이 이 둘째 날 잔치에 술을 마실 때에 다시 에스더에게 물어 이르되 왕후 에스더여 그대의 소청이 무엇이냐 곧 허락하겠노라 그대의 요구가 무엇이냐 곧 나라의 절반이라 할지라도 시행하겠노라 (에 7:2)"
        - speaker_ko: 해설
          text_ko: "왕후 에스더가 대답하여 이르되 왕이여 내가 만일 왕의 목전에서 은혜를 입었으며 왕이 좋게 여기시면 내 소청대로 내 생명을 내게 주시고 내 요구대로 내 민족을 내게 주소서 나와 내 민족이 팔려서 죽임과 도륙함과 진멸함을 당하게 되었나이다 만일 우리가 노비로 팔렸더라면 내가 잠잠하였으리이다 그래도 대적이 왕의 손해를 보충하지 못하였으리이다 하니 (에 7:3-4)"
        - speaker_ko: 해설
          text_ko: "에스더가 이르되 대적과 원수는 이 악한 하만이니이다 하니 하만이 왕과 왕후 앞에서 두려워하거늘 (에 7:6)"
        - speaker_ko: 해설
          text_ko: "내가 어찌 내 민족이 화 당함을 차마 보며 내 친척의 멸망함을 차마 보리이까 하니 (에 8:6)"
      delay_note: >-
        두 번의 미룸은 실패가 아니다. 「드디어」·「마침내」·「용기를 내어」류를 어디에도
        쓰지 않고, 미룸 자막에 부정적인 음향·조명 변화를 붙이지 않는다. 왕이 세 번 물은
        뒤에야 말했다는 것이 이 본문이 가진 단계적 개시의 증거다.
      repetition_note: >-
        5:3 과 5:6 과 7:2 는 같은 자리에 같은 서체로 반복 렌더한다. 「같은 질문이 또 왔다」가
        보여야 미룸이 실패로 읽히지 않는다.
      dwell:
        min_seconds: 3
        on_timeout: auto_proceed_after_seconds_15
        note_ko: 머무는 시간에 정답이 없습니다. 먼저 나가셔도 됩니다.
      scepter_pause_note: >-
        금 규가 내밀어지기까지의 정적에는 체류 상한을 걸지 않는다. 그 시간은 사용자가
        통제하는 시간이고, 이 Scene 의 인터랙션은 사실 그 정적이다. 안 뜰로 들어서는
        걸음도 되돌릴 수 있다 — 몇 번 물러나도 실패로 기록하지 않는다.
      # 마감 문구 10종 — Scene 3 의 라벨 3 × 톤 3 + 라벨 없음 1.
      # 자구는 저작 정본(content/esther/scene5.yml br_s5_closing_message)에서 그대로 옮겼다.
      # 라벨을 고르지 않은 사람은 default 로 온다 — 무응답은 실패가 아니라 정상 경로다.
      # default 는 톤으로 쪼개지 않고 한 문안이다(`all`). 라벨 없는 사람에게 임재 강도를
      # 조절할 근거가 없다는 저작 결정이며, 셋으로 늘리는 「개선」을 하지 말 것.
      closing_texts:
        nondisclosure:
          strong: 에스더는 삼십 일을 부름 없이 지냈습니다. 그 삼십 일에도 하나님은 그 궁 안에 계셨습니다. 말하지 않기로 한 당신 곁에도 계십니다. 곁에 계시는 일에는 기한이 없습니다.
          balanced: 에스더는 삼십 일 동안 부름을 받지 못했습니다. 말하지 않는 시간은 실패의 다른 이름이 아닙니다. 말하지 않기로 한 것은 당신이 당신을 지킨 방식이고, 그 방식에 유효기간을 두지 않아도 됩니다.
          soft: 말하지 않기로 하셨군요. 그 선택은 그대로 괜찮습니다. 오늘 이후로도 말하지 않기로 하신다면, 그것도 그대로 괜찮습니다.
        gather_first:
          strong: 에스더는 혼자 나아가지 않았습니다. 수산의 사람들이 함께 사흘을 지켰습니다. 하나님은 한 사람에게만 계시지 않고 그 사흘을 함께 지킨 모두에게 계셨습니다.
          balanced: 에스더가 가장 먼저 한 일은 말하는 것이 아니라 사람을 모으는 것이었습니다. 혼자 감당하지 않기로 한 것도 본문이 하는 일입니다.
          soft: 먼저 곁에 있을 사람을 떠올리셨군요. 혼자 하지 않기로 하는 것도 하나의 온전한 방식입니다.
        speak_now:
          strong: 에스더가 안 뜰에 섰을 때, 금 규가 내밀어질지는 아무도 알지 못했습니다. 그 알 수 없음 한가운데에 하나님이 계셨습니다. 오늘 말하기로 한 당신의 자리에도 계십니다.
          balanced: 에스더는 왕이 세 번 물은 뒤에야 말했습니다. 말하기로 한 오늘의 당신도, 속도를 스스로 정할 수 있습니다.
          soft: 오늘 말하기로 하셨군요. 그 말이 어디까지 닿을지는 지금 알 수 없습니다. 그래도 당신이 정한 일입니다.
        default:
          all: 에스더서는 '누가 알겠느냐'는 물음으로 남습니다. 답을 고르지 않고 여기까지 온 것도 이 묵상의 온전한 끝입니다. 오늘 여기까지 오신 것으로 충분합니다.
      closing_texts_note: >-
        사용자의 상태를 단정하지 않는다. 「당신은 지금 안전한 자리에 있고」류를 두지 않으며,
        괜찮다고 말하는 대상은 자리가 아니라 선택이다. 카드를 고르는 사람은 실제로
        안전하지 않은 상황에 있을 수 있고, 상태 단정은 위로가 아니라 오독의 통보가 된다.
      crisis_reminder: 여기까지 오시느라 애쓰셨습니다. 오늘 마음이 무겁게 남으셨다면 {{crisis_resources.default}}
      hidden_god_note: >-
        이 책에는 하나님이 이름으로 등장하지 않는다. 내레이션이 하나님을 화자로 세우지 않고,
        「다른 데로 말미암아」의 주체도 확정하지 않는다. 본문이 이름을 대지 않은 자리를
        해설이 채우는 순간 사용자는 본문이 하지 않은 말을 읽게 된다.
      scope_note: 이 Scene 은 에스더 8:6 인용에서 끝난다. 그 이후의 배제 사유는 docs/MVP-ESTHER.md 참조.
      next_scene_suggestion: 시편 27 — 숨겨 주시는 이를 부르는 기도
