          additional_refs: ["jos-2:9"]
          captions:
            - speaker_ko: 라합
              verse_ref: 수 2:9
              text_ko: "여호와께서 이 땅을 너희에게 주신 줄을 내가 아노라 우리가 너희를 심히 두려워하고 이 땅 주민들이 다 너희 앞에서 간담이 녹나니"
            - speaker_ko: 라합
