        - speaker_ko: 라합
          verse_ref: 수 2:12
          text_ko: "그러므로 이제 청하노니 내가 너희를 선대하였은즉 너희도 내 아버지의 집을 선대하도록 여호와로 내게 맹세하고 내게 증표를 내라"
        - speaker_ko: 라합
          verse_ref: 수 2:13
          text_ko: "그리고 나의 부모와 나의 남녀 형제와 그들에게 속한 모든 사람을 살려 주어 우리 목숨을 죽음에서 건져내라"
        - speaker_ko: 정탐꾼
          verse_ref: 수 2:14
          text_ko: "네가 우리의 이 일을 누설하지 아니하면 우리의 목숨으로 너희를 대신할 것이요 여호와께서 우리에게 이 땅을 주실 때에는 인자하고 진실하게 너를 대우하리라"
      conditional_blocks:
        - id: "s3_omit_2_13_2_14"
          reached_by: consent_skip
          renders: [captions]
          # 자막에서 뺀 2:13·2:14 가 성구 블록으로 되돌아오지 않게 함께 좁힌다(S1 주석).
          additional_refs: ["jos-2:12"]
          captions:
            - verse_ref: 수 2:8
              text_ko: "또 그들이 눕기 전에 라합이 지붕에 올라가서"
            - speaker_ko: 라합
              verse_ref: 수 2:12
              text_ko: "그러므로 이제 청하노니 내가 너희를 선대하였은즉 너희도 내 아버지의 집을 선대하도록 여호와로 내게 맹세하고 내게 증표를 내라"
          note: >-
            청하는 줄(2:13)과 답하는 줄(2:14)만 빠진다. 카드가 「장면은 이어집니다」라고
            했으므로 씬을 옮기지 않고 자막만 뺀다 — 그리고 실제로 다음 Scene 으로 이어진다.
      interactions: []
      interaction_note: >-
        인터랙션 0종. 저작 rev.2 가 수 2:13 위에 1종을 얹으려다 철회한 자리다 —
        동기가 설계가 아니라 판정 대상 만들기였다(저작 §3-1).
      branches: []

  # ── Scene 4 ────────────────────────────────────────────────────────────────
  # 카드 두 장이 한 Scene 을 덮는 첫 자리다. 엔진의 거절 조건은 Scene 범위 이진이라
  # 어느 한 장만 거절해도 두 장의 델타가 함께 적용된다 — 과차단이지만 정직한 대가이고,
  # 저작이 카드 문안 둘 다에 합집합을 적어 그 사실을 미리 말해 두었다.
  - id: 4
    title: 창문과 붉은 줄
    type: cinematic
    duration_sec: 80
    scripture_ref: jos-2:15
    next: 5
    exposure_grade: C
    trigger_warning:
      level: mid
      content:
        - blood_guilt_attribution
        - height_suspension
        - family_annihilation_risk
      consent_card_id: rahab_blood_guilt
      covers_scenes: [4]
      skip_alternative_scene_id: "s4_declined"
      # docs/RAHAB-LOCKED-STRINGS.md §2-4 + §2-5 를 자구 그대로 이어 붙였다 — 새 문장 0건.
      # 엔진의 카드 슬롯이 하나라 둘을 다 보여 주려면 이 방법뿐이고, 저작이 두 문안에
      # 각각 합집합 델타를 적어 두었으므로 어느 쪽을 읽어도 실제 동작과 어긋나지 않는다.
      # 프론트의 문 파싱은 첫 괄호 줄(§2-4)에서 문 둘을 만들고, §2-5 의 괄호 줄은
      # 산문에서 걷힌다. 머리 주석 (2) 참조.
      consent_card_ko: |-
        다음 장면에는 고대의 계약 문구가 나옵니다. 집 밖으로 나가면 그 피가 그의 머리로
        돌아간다는 말입니다.
        · 누구에게 책임이 있는지를 정하던 옛 표현이며, 이 미션은 그 말을 오늘의 당신에게
          적용하지 않습니다.
        · 건너뛰시면 그 두 줄이 나오지 않습니다. 같은 장면의 창문과 줄도 화면에 띄우지
          않습니다.
        · 어느 지점에서든 멈추거나 나갈 수 있습니다.
        계속하시겠어요?
        [계속한다]  [계약 문구 두 줄은 건너뛴다]
        음성/자막 강도: [ 자막만 ] [ 약 ] [ 기본 ]
        이 장면의 자막은 고대의 계약 문구입니다. 누가 다치든 그것이 당신 책임이라는 뜻이
        아닙니다. 지금 안전하지 않은 곳에 있다면 {{crisis_resources.default}}

        다음 장면에는 사람이 창문에서 줄에 매달려 성벽 아래로 내려가는 대목이 나옵니다.
        · 내려가는 동작은 어느 쪽을 고르셔도 화면에 나오지 않습니다.
        · 건너뛰시면 창문과 줄이 화면에 나오지 않습니다. 같은 장면의 계약 문구 두 줄도
          함께 빠집니다.
        · 어느 지점에서든 멈추거나 나갈 수 있습니다.
        계속하시겠어요?
        [계속한다]  [창문과 줄은 화면에 띄우지 않는다]
        음성/자막 강도: [ 자막만 ] [ 약 ] [ 기본 ]
        이 장면에는 줄을 타고 성벽을 내려가는 대목이 나옵니다. 자막은 성경 본문 그대로지만,
        창문과 줄은 화면에 띄우지 않도록 고르실 수 있습니다. 지금 힘들다면
        {{crisis_resources.default}}
    extras:
      anchor: 창문 안쪽. 성벽 위의 집. 밤.
      additional_refs: ["jos-2:18", "jos-2:19", "jos-2:21"]
      user_presence: 창문 안쪽, 줄에 손이 닿지 않는 곳
      staging_invariants:
        - 불변식 1 — 사용자를 라합의 몸 안에 두지 않는다. 시점을 라합의 신체 위치에 놓지 않는다.
        - 불변식 2 — 사용자를 정탐꾼의 자리에 두지 않는다.
        - 불변식 3 — 사용자를 「기생의 집」의 손님 자리에 두지 않는다(수 2:1 의 유숙).
      crisis_latch:
        post_crisis_render_policy: suppress_all_captions_except_crisis_card
        post_crisis_latch_scope: mission
        crisis_card_position: terminal_screen
      crisis_reminder: "지금 힘드시면: {{crisis_resources.default}}"
      # 축약 경로에서 덮인다. 화면이 이 값으로 배경을 고른다 — 자막 런타임에 에셋
      # 토글이 없어서 저작의 「창문과 줄을 화면에 띄우지 않는다」를 payload 키로 옮겼다.
      background_variant: window_and_cord
      environment:
        camera_rig: inside_window_out_of_reach
        time_of_day: night_interior_lamplight
        ambient: [밤바람]
        ui_overlays:
          [ai_assist_footer, crisis_reminder, exit_button, suffering_disclaimer]
      npcs:
        - { name_ko: 라합, framing: full_body_far }
        - { name_ko: 두 사람, framing: full_body_far }
      npc_note: >-
        줄을 매는 손은 라합의 손이다 — 수 2:21 이 라합에게 돌린 행위이고, 사용자에게
        넘기면 그 행위를 가로챈다. 성벽 바깥 조망을 금하고(높이를 시각적 위협으로 쓰지
        않는다) 하강 동작은 **어느 경로에서도** 화면에 나오지 않는다. 클로즈업 없음.
      caption_pacing:
        { auto_advance: false, advance: user, rewind_allowed: false }
      captions: &s4_captions
        - verse_ref: 수 2:15
          text_ko: "라합이 그들을 창문에서 줄로 달아 내리니 그의 집이 성벽 위에 있으므로 그가 성벽 위에 거주하였음이라"
        - speaker_ko: 정탐꾼
          verse_ref: 수 2:18
          text_ko: "우리가 이 땅에 들어올 때에 우리를 달아 내린 창문에 이 붉은 줄을 매고 네 부모와 형제와 네 아버지의 가족을 다 네 집에 모으라"
        - speaker_ko: 정탐꾼
          verse_ref: 수 2:19
          text_ko: "누구든지 네 집 문을 나가서 거리로 가면 그의 피가 그의 머리로 돌아갈 것이요 우리는 허물이 없으리라 그러나 누구든지 너와 함께 집에 있는 자에게 손을 대면 그의 피는 우리의 머리로 돌아오려니와"
        - speaker_ko: 라합
          verse_ref: 수 2:21
          text_ko: "너희의 말대로 할 것이라 하고 그들을 보내어 가게 하고 붉은 줄을 창문에 매니라"
      attribution_note: >-
        2:18·2:19 의 화자 표기가 배제된 앞 절에 기대고 있다. 배제 절의 **내용을 되살리지
        않고** 표기 필드로만 푼다. 절 번호도 적지 않는다 — 배제 절의 참조 문자열이 렌더
        leaf 에 나오는 것 자체가 저작 게이트 G9 의 대상이다.
      conditional_blocks:
        - id: "s4_declined"
          reached_by: consent_skip
          renders: [captions, background_variant]
          background_variant: no_window_no_cord
          # 자막에서 뺀 계약 문구 두 줄(2:18·2:19)이 성구 블록으로 되돌아오지 않게
          # 함께 좁힌다(S1 주석). 2:19 는 「피가 그의 머리로 돌아갈 것이요」를 담은 절이다.
          additional_refs: ["jos-2:21"]
          captions:
            - verse_ref: 수 2:15
              text_ko: "라합이 그들을 창문에서 줄로 달아 내리니 그의 집이 성벽 위에 있으므로 그가 성벽 위에 거주하였음이라"
            - speaker_ko: 라합
              verse_ref: 수 2:21
              text_ko: "너희의 말대로 할 것이라 하고 그들을 보내어 가게 하고 붉은 줄을 창문에 매니라"
          note: >-
            계약 문구 두 줄(2:18·2:19)이 빠지고 배경에서 창문·줄이 내려간다. 두 카드의
            합집합이며, 두 카드 문안이 이미 이 합집합을 적어 두었다. 남는 두 자막은
            본문에서 창문과 줄을 **말한다** — 카드가 약속한 것은 화면에 띄우지 않는
            것이지 본문을 지우는 것이 아니다.
      interactions: []
      interaction_note: >-
        인터랙션 0종. 창문에 줄을 매는 것은 수 2:21 이 라합에게 돌린 행위다.
      branches: []

  # ── Scene 5 ────────────────────────────────────────────────────────────────
  # 마지막은 여호와가 주어인 절로 닫는다(저작 헌장 §3-c). 세 경로의 마감 줄이 같은 것은
  # 실수가 아니라 요구다. 이 Scene 도 카드 둘이 덮는다 — 자기 카드(lineage_birth)와
  # Scene 1 의 stigma 카드. 후자는 `covered_by_scene: 1` 로 들고 온다(머리 주석 4).
  - id: 5
    title: 진영 밖에서 이스라엘 중으로
    type: outro
    duration_sec: 95
    scripture_ref: jos-6:23
    next: null
    exposure_grade: C
    linked_values: [6, 1] # 마음(두려움) · 일기(오늘 들은 것)
    value_prompt: 오늘 한 가지만 — 남들이 나를 부르는 이름 말고, 내가 오늘 들은 것을 한 줄로 적어 보는 것. 그 줄이 누구에게도 가지 않아도 됩니다.
    trigger_warning:
      level: low_mid
      content:
        - sex_work_stigma
        - ethnic_labeling
        - pregnancy_childbirth
      consent_card_id: rahab_lineage_birth
      covers_scenes: [5]
      # Scene 1 의 stigma 카드가 이 Scene 도 덮는다(저작 covers_scenes: [1, 5]).
      # 이 한 줄이 없으면 Scene 1 에서 호칭을 거절한 사용자가 여기서 카드를 다시 받고,
      # 수락하는 순간 거절했던 호칭 자막을 그대로 만난다. 머리 주석 (4) 참조.
      covered_by_scene: 1
      skip_alternative_scene_id: "s5_close_on_6_23_6_27"
      # docs/RAHAB-LOCKED-STRINGS.md §2-6 — LOCKED. 재작성 금지.
      # stigma 카드(§2-1)의 문안은 Scene 1 에 있고 여기에 두 번 적지 않는다 —
      # 자구 정본을 두 곳에 두면 한쪽만 고쳐질 자리를 만든다(저작 scene5.yml note).
      consent_card_ko: |-
        마지막 장면에는 한 사람이 아이를 낳았다는 계보 문장이 한 줄 나옵니다.
        · 출산 장면은 나오지 않습니다. 이름을 잇는 한 줄입니다.
        · 이 미션은 아이가 태어난 것을 보상이나 회복의 증거로 말하지 않습니다.
        · 건너뛰시면 그 한 줄이 나오지 않습니다. 이 장면에서 호칭이 든 줄들도 함께
          빠집니다. 이야기는 그대로 끝맺어집니다.
        · 그 자리에는 성경 본문이 아닌 안내 문장이 대신 뜹니다. 「본문이 아닙니다」
          표지가 함께 붙습니다.
        · 어느 지점에서든 멈추거나 나갈 수 있습니다.
        계속하시겠어요?
        [계속한다]  [계보 문장은 건너뛴다]
        음성/자막 강도: [ 자막만 ] [ 약 ] [ 기본 ]
        이 장면은 출산을 언급합니다. 이 미션은 출산을 보상이나 회복의 증거로 말하지
        않습니다. 지금 힘들다면 {{crisis_resources.default}}
    extras:
      anchor: 이스라엘의 진영 밖. 정지 시점. 낮.
      # ⚠️ 수 6:17 은 여기에 **없다.** 자막은 후반절(6:17b)만 인용하는데, 참조 키는
      # 절 단위라 `jos-6:17` 로 열면 화면에 전절이 뜬다 — 그 앞머리가
      # 「이 성과 그 가운데에 있는 모든 것은 여호와께 온전히 바치되」, 곧
      # `docs/SERIES-GRACE.md` §4 가 미션 밖으로 배제한 헤렘 명령이다
      # (`docs/VERSES-RAHAB-GAE.md` 수 6 판정표: 전반절 배제 · 후반절 채택).
      # 반절 키(`jos-6:17b`)는 `docs/SCRIPTURE-REF-CONVENTION.md` 가 형식불가로 막으므로
      # **참조로는 열지 않고 자막 한 줄로만 남긴다.** 그래서 시드에도 이 절은 없다.
      additional_refs:
        ["jos-6:22", "jos-6:25", "jas-2:25", "matt-1:5", "jos-6:27"]
      user_presence: 진영 밖 → 안, 걷지 않고 정지 시점
      staging_invariants:
        - 불변식 1 — 사용자를 라합의 몸 안에 두지 않는다. 시점을 라합의 신체 위치에 놓지 않는다.
        - 불변식 2 — 사용자를 정탐꾼의 자리에 두지 않는다.
        - 불변식 3 — 사용자를 「기생의 집」의 손님 자리에 두지 않는다(수 2:1 의 유숙).
      crisis_latch:
        post_crisis_render_policy: suppress_all_captions_except_crisis_card
        post_crisis_latch_scope: mission
        crisis_card_position: terminal_screen
      crisis_reminder: "지금 힘드시면: {{crisis_resources.default}}"
      environment:
        camera_rig: static_outside_camp
        time_of_day: daylight_flat
        ambient: [멀리서 오는 바람]
        forbidden_audio: [공성음, 함락음, 비명]
        ui_overlays:
          [ai_assist_footer, crisis_reminder, exit_button, suffering_disclaimer]
      npcs:
        - { name_ko: 라합, framing: full_body_far }
        - { name_ko: 그의 가족, framing: full_body_far }
      npc_note: >-
        군중으로 그리지 않는다. 불타는 성을 그리지 않는다. 종결 자막은 정지 화면에 둔다 —
        여리고 함락은 이 미션의 범위 밖이고(저작 §4), 배경으로도 들이지 않는다.
      caption_pacing:
        { auto_advance: false, advance: user, rewind_allowed: false }
      captions: &s5_captions
        - speaker_ko: 여호수아
          verse_ref: 수 6:17b
          text_ko: "기생 라합과 그 집에 동거하는 자는 모두 살려 주라 이는 우리가 보낸 사자들을 그가 숨겨 주었음이니라"
        - speaker_ko: 여호수아
          verse_ref: 수 6:22
          text_ko: "그 기생의 집에 들어가서 너희가 그 여인에게 맹세한 대로 그와 그에게 속한 모든 것을 이끌어 내라"
        - verse_ref: 수 6:23
          text_ko: "정탐한 젊은이들이 들어가서 라합과 그의 부모와 그의 형제와 그에게 속한 모든 것을 이끌어 내고 또 그의 친족도 다 이끌어 내어 그들을 이스라엘의 진영 밖에 두고"
        - verse_ref: 약 2:25
          text_ko: "또 이와 같이 기생 라합이 사자들을 접대하여 다른 길로 나가게 할 때에 행함으로 의롭다 하심을 받은 것이 아니냐"
        - verse_ref: 수 6:25
          text_ko: "여호수아가 기생 라합과 그의 아버지의 가족과 그에게 속한 모든 것을 살렸으므로 그가 오늘까지 이스라엘 중에 거주하였으니 이는 여호수아가 여리고를 정탐하려고 보낸 사자들을 숨겼음이었더라"
        - verse_ref: 마 1:5
          text_ko: "살몬은 라합에게서 보아스를 낳고"
        - verse_ref: 수 6:27
          text_ko: "여호와께서 여호수아와 함께 하시니 여호수아의 소문이 그 온 땅에 퍼지니라"
      closing_note: >-
        약 2:25 는 「행함으로 의롭다 하심」을 말하지 낙인이 씻겼다고 말하지 않는다.
        마 1:5 는 이름을 잇는 한 줄이고 보상의 증거가 아니다. 수 6:27 로 닫는 근거는
        낱말 반복이 아니라 헌장 §3-c 다 — 마지막 Scene 을 신의 행위로 닫는다.
      # 「계보 문장은 건너뛴다」 또는 Scene 1 의 「호칭이 든 자막은 건너뛴다」에서 온다.
      # 두 카드가 같은 경로를 쓰는 것은 저작의 결정이다(scene5.yml 머리 주석).
      conditional_blocks:
        - id: "s5_close_on_6_23_6_27"
          reached_by: consent_skip
          renders: [captions, closing_screen]
          # 이 Scene 에서 이 줄이 가장 중요하다. 좁히지 않으면 호칭을 거절한 사용자가
          # **자막에서 지운 네 절(6:22 · 6:25 · 약 2:25)과 계보 한 줄(마 1:5)을**
          # 바로 아래 성구 블록에서 전절로 다시 만난다 — 머리 주석 (4) 가 막았다고
          # 적은 그 누출이 자막이 아니라 성구 블록으로 되돌아오는 형태다(S1 주석).
          additional_refs: ["jos-6:27"]
          captions:
            - verse_ref: 수 6:23
              text_ko: "정탐한 젊은이들이 들어가서 라합과 그의 부모와 그의 형제와 그에게 속한 모든 것을 이끌어 내고 또 그의 친족도 다 이끌어 내어 그들을 이스라엘의 진영 밖에 두고"
            # 저작 `rahab_nar_s5_close`(LOCKED §3). 좌표도 저작 그대로 —
            # 「수 6:23 자막 직후 · 수 6:27 앞」. 표지를 화자 칸으로 옮겼다(머리 주석 5).
            - speaker_ko: 본문이 아닙니다
              text_ko: "지금 보신 자막에는 라합이 그 뒤에 어디에서 누구와 함께 살게 되었는지를 말하는 줄들이 없습니다. 그 줄들이 빠진 것은 이 미션이 보여 드리는 범위 때문이지, 이야기가 거기서 끝나서가 아닙니다. 이 미션은 방금 보신 줄을 라합의 마지막 자리로 말하지 않습니다."
            - verse_ref: 수 6:27
              text_ko: "여호와께서 여호수아와 함께 하시니 여호수아의 소문이 그 온 땅에 퍼지니라"
          note: >-
            호칭이 든 네 줄(6:17b · 6:22 · 6:25 · 약 2:25)과 계보 한 줄(마 1:5)이 빠진다.
            거절 경로에서 축이 뒤집히는 것 — 「진영 밖에서 이스라엘 중으로」의 뒷마디가
            통째로 빠져 진영 밖이 마지막 자리처럼 읽히는 것 — 을 막으려고 저작이 그
            자리에 내레이션 한 줄을 잠갔다. 막았다는 것을 재는 수단은 없다.
            마감 줄과 종결 화면은 `renders` 가 약속한 대로 그대로 남는다 —
            건너뛴 사용자의 결말이 깎이면 그것 자체가 압박이다.
      # 동의 상태를 읽지 못한 경우 **거절 경로와 같은 것**을 보여 준다. 모르는 상태에서
      # 더 보여 주는 쪽으로 기울면 묻지 않고 노출한 것이 된다(저작 fallback_note).
      # 엔진에서 이것은 자동으로 성립한다 — 결정이 기록되지 않으면 카드가 다시 뜨고,
      # 카드 없이 지나갈 길이 없다.
      unknown_consent_note: >-
        저작은 `consent_state: null` 경로를 따로 두어 거절 경로와 같은 자막 집합을
        지정했다. 엔진에는 그 세 번째 경로가 없다 — 동의를 읽지 못하면 카드가 다시
        뜨기 때문이다. 결과는 같다: 묻지 않고 노출되는 길이 없다.
      closing_screen:
        presentation_mode: still_frame
        environment_disabled: true
        npc_disabled: true
        mission_title_ko: 먼저 있었던 일
        closing_line_ko: 여호와께서 여호수아와 함께 하시니
        # docs/RAHAB-LOCKED-STRINGS.md §1 (F-6.5) — LOCKED. 세 경로 공통.
        closing_footer_ko: 이 미션은 라합이 겪은 일이 어떤 목적을 위해 주어졌다고 말하지 않습니다. 지금 힘들다면 {{crisis_resources.default}}
      closing_symmetry_note: >-
        마감 줄이 세 경로에서 같다. 저작 §3-c 의 요구이고, 건너뛴 사람의 결말을 깎지
        않는다는 뜻이기도 하다. 여기에 경로별 등급·점수·배지를 붙이지 말 것 —
        붙는 순간 「끝까지 본 사람이 더 받는다」가 되고, 그것이 이 미션이 금하는 압박이다.
      dwell:
        min_seconds: 3
        on_timeout: auto_proceed_after_seconds_15
        note_ko: 머무는 시간에 정답이 없습니다. 먼저 나가셔도 됩니다.
      interactions: []
      branches: []
