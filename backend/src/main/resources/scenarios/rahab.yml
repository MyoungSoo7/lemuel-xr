# 라합 — 「먼저 있었던 일」
#
# 핵심 메시지: **본문이 말한 것까지만 말한다.**
#   여호수아는 라합의 회개를 말하지 않는다. 회개·정화 서사는 4세기의 구성물이고
#   (docs/THEOLOGY-REFERENCES.md §라합), 약 2:25 도 낙인이 씻겼다고 말하지 않는다.
#   이 미션은 그 자리를 비워 둔 채로 끝난다 — 비워 둔 것이 결함이 아니라 축이다.
#   에스더의 「개시의 자기 결정권」과도, 룻의 「낯선 자리에서의 소속」과도 갈라 둔 축이다.
#
# ─────────────────────────────────────────────────────────────────────────────
# ⚠️ 이 파일은 `Character` enum 에 RAHAB("rahab") 이 들어가는 순간 **실제로 로드된다.**
#   ScenarioYamlLoader.loadAll() 은 `Character.entries` 를 순회한다 — 디렉터리가 아니다.
#   그래서 enum 한 줄이 곧 사용자 노출이다. 이 파일이 리포에 있다는 것만으로는
#   아무도 이것을 보지 않는다.
#   근거·범위·남은 빚은 docs/RAHAB-RUNTIME-SIGNOFF.md 에 있고
#   RuntimeExposureSignoffTest 의 «룻 이후 열리는 인물은 노출 대장 없이 열리지 않는다» 가 집행한다.
#   · 전문 신학 검토 없음 · 전문 정신건강 검토 없음. 그 사실은 대장에 남아 있다.
#   · AR 은 닫혀 있다(VR 전용). `scripts/gen_ar_manifests.py` 의 AR_MISSIONS 에
#     rahab 이 들어간 적이 없다.
# ─────────────────────────────────────────────────────────────────────────────
#
# 상류 문서 (이 파일은 이들의 하류다 — 자구를 여기서 발명하지 않는다)
#   설계        docs/MVP-RAHAB.md
#   자구 정본   docs/VERSES-RAHAB-GAE.md
#   잠금 문안   docs/RAHAB-LOCKED-STRINGS.md   (동의 카드 6장 · 비성경 내레이션 3줄 · F-6.5)
#   저작        content/rahab/scene1~5.yml
#   저작 게이트 scripts/gates/rahab.yml
#   성구 시드   backend/src/main/resources/db/migration/V20260822200000__seed_rahab_passages_gae.sql
#
# 이 파일의 자막 24행은 **저작 트리의 text_ko 를 한 글자도 바꾸지 않고 옮긴 것**이다.
# 그 사실은 산문 주장이 아니라 기계 검사다 — RahabWithheldNarrativeTest 가 매 빌드
# content/rahab/scene*.yml 과 축자 대조한다. 동의 카드 6장의 문안도 LOCKED 정본
# 그대로다. **새로 쓴 문장은 0건이다.**
#
# 신학 기준: 대한예수교장로회 합신 / 웨스트민스터 표준 / 개혁주의 (프로젝트 단일 기준).
#
# 배제 (이 파일에서 직접 집행되는 것)
#   · 여리고 함락(헤렘) 전 구간 — 수 6:1-21 · 6:24 · 6:26. 자구를 여기 옮겨 적지 않는다.
#     배제 자구는 docs/verses-rahab.txt 의 `## EXCLUDED` 칸에만 있다.
#   · 히 11:31 — 후반절이 §4 가 배제한 전멸이고 앞부분만 끊으면 주절 없는 종속절이 된다.
#     전문도 절단도 불가하므로 자막으로 쓰지 않는다(VERSES-RAHAB-GAE.md).
#   · 마 1:5 의 보아스-룻-오벳-이새 — 그 계보는 Theme 19(룻)의 자리다.
#   · 라합이 한 말의 진실성 평가(수 2:4-5) — 신약 세 곳 어디도 그것을 평가하지 않는다.
#     이 파일도 평가하지 않는다.
#
# 안전선
#   R1 자해 발화 리스너 5/5 Scene 상시. 위기 카드는 종결 화면에 두고, 한 번 걸리면
#      미션 범위로 래치된다(post_crisis_latch_scope: mission). 값 3키가 다섯 Scene 동일하다.
#   R2 고난 귀속 금지 — 「그래서 쓰임받았」·「다 뜻이 있어」류.
#   R3 회복 압박 금지 — 「이제 그만 일어나」·「결국 보상받았」류.
#   T1 **이 인물의 최우선 축.** 본문에 없는 회개·정화 서사 삽입 금지.
#      2026-08-18 에 저작의 수 6:27 자막이 「라합은 과거를 씻고」로 시작하고 있었다.
#      전문 인용이라고 적힌 카드에 본문에 없는 절이 붙어 있었고, 잡은 것은 산문 검토가
#      아니라 금칙 토큰이었다.
#   R4 동의 카드가 **여섯** 이다 — 코퍼스 최다. 한 Scene 을 두 장이 덮는 자리가 둘(4·5),
#      한 장이 두 Scene 을 덮는 자리가 하나(1→5).
#   R5 기본 경로는 LLM 호출 0회로 완주된다(static_curation).
#
# ── 엔진과 저작이 갈라지는 자리 (숨기지 않는다) ──────────────────────────────
#   (1) **Scene 2 의 목적지 타입.** 저작은 이 자리에 경로 id 문자열 `"s2_skip"` 을 적고,
#       정수를 쓰지 말라고 못 박았다(content/rahab/scene2.yml 주석 — 정수는 「대신 무엇이
#       재생되는가」를 지목하지 못한다). 그런데 그 경로가 하는 일은 **Scene 2 를 통째로
#       건너뛰고 Scene 3 으로 가는 것**이고, 저작 자신이 정의 블록을 scene3.yml 에 두었다.
#       엔진의 문자열 목적지는 「같은 씬에 머물며 payload 를 덮는다」이므로 이 뜻을 낼 수
#       없다. 그래서 여기서는 **정수 3** 을 쓴다. 목적지·재생 결과 둘 다 저작과 같고
#       (Scene 2 미재생 → Scene 3), 저작이 정수를 금한 이유였던 「대신 무엇이 재생되는가」는
#       브리지 내레이션이 지목한다. 저작 문안이 요구한 좌표 — 「Scene 3 첫 자막 앞」 —
#       도 그대로 성립한다: 엔진의 `skip_bridge_narration_ko` 는 **목적지 씬 상단**에 뜬다.
#   (2) **Scene 4 를 덮는 카드가 둘인데 엔진의 카드 슬롯은 하나다.** 저작은 이미 이 한계를
#       알고 두 카드 문안 **각각에 합집합 델타를 적어 두었다**(consent_overblock_note).
#       그래서 여기서는 두 LOCKED 문안을 **자구 그대로 이어 붙인다** — 새 문장을 쓰지 않고,
#       어느 쪽을 읽어도 실제로 일어나는 일이 카드에 적혀 있다. 프론트의 `cardDoors()` 는
#       첫 괄호 줄에서 문 둘을 만들므로 §2-4 의 문이 쓰이고, §2-5 의 괄호 줄은 산문에서
#       걷힌다. Scene 5 도 카드 둘(1의 stigma + 자기 lineage_birth)이지만 저작이 문안
#       중복을 금했으므로(scene5.yml note) 이어 붙이지 않는다 — 대신 (4) 를 쓴다.
#   (3) **Scene 4 의 에셋 비표시가 payload 키로 나간다.** 저작의 약속은 「창문과 줄을 화면에
#       띄우지 않는다」인데 자막 런타임에는 에셋 토글이 없다. 축약 블록이
#       `background_variant: no_window_no_cord` 를 덮고 화면이 그 값으로 다른 배경을 고른다.
#       `renders` 에 그 키를 약속해 두었으므로, 키가 사라지면 DecideSceneUseCase 가
#       런타임에 던진다 — 약속만 남고 집행이 사라지는 형태를 막는다.
#   (4) **Scene 5 의 `covered_by_scene: 1`.** 저작은 Scene 1 의 stigma 카드가 Scene 5 도
#       덮는다고 적었다(covers_scenes: [1, 5]). 이것을 적지 않으면 Scene 1 에서 호칭을
#       거절한 사용자가 Scene 5 에서 **자기 카드를 다시 받고**, 그것을 수락하는 순간
#       거절했던 호칭 자막(6:17b · 6:22 · 6:25 · 약 2:25)을 그대로 만난다. 실제 누출이다.
#       `covered_by_scene` 이 있으면 SceneSkipResolver.carriedSkip 이 세션에 남은 Scene 1
#       결정을 읽어 도착 시점에 축약 경로를 적용한다.
#   (5) **「본문이 아닙니다」 표지가 문자열 안에 있다.** 저작은 이 표지를 별도 필드
#       (`marker_ko`)로 두었는데 엔진의 브리지·자막에는 표지 필드가 없다. 지어내지 않고
#       **표지를 문자열의 첫 줄로 옮겼다** — 화면에 반드시 함께 뜬다는 저작의 요구가
#       필드 유무와 무관하게 성립한다. 정본/비정본의 **타이포그래피** 구분은 여전히
#       재는 수단이 없다(저작 DP-R17).
#   (6) **절 참조를 자막 문자열에 붙이지 않는다.** 야곱은 「(창 27:19)」를 text_ko 안에
#       넣었다. 라합은 넣지 않고 `verse_ref` 를 별도 키로 둔다. 두 가지 이유다 —
#       ① 자구 대조가 축자여야 하고(RahabWithheldNarrativeTest), ② 저작의 「중」 표기가
#       **근거 없는 미해소 항목**이라(24행 중 11행) 그것을 화면 문자열에 굳혀 넣으면
#       사용자에게 「뺀 것이 있다」고 잘못 알린다. 그 빚은 대장에 등재돼 있다.
#
# ⚠️ 위기 연락처를 이 파일에 숫자로 적지 말 것.
#   `{{crisis_resources.default}}` 토큰만 쓴다 — ScenePayloadAssembler → CrisisTokenResolver
#   가 정본으로 치환하고 ScenarioHotlineRatchetTest 가 이를 강제한다.

character: rahab
title: 먼저 있었던 일

target_user: 남들이 붙인 호칭으로 자기를 부르게 된 사람. 침묵을 조건으로 안전을 얻어 본 적이 있는 사람

ai_assist_footer: AI 보조 — 본문은 성경 참조 — storyteller 역할. 위기 시 {{crisis_resources.default}}.

# ── 금칙 토큰: 이 파일에 사본을 두지 않는다 ──────────────────────────────────
# 이 미션의 금칙 토큰 정본은 content/rahab/scene1~5.yml 의 lint_forbidden_tokens 안이다
# (R2_R3 축과 T1 축 두 갈래, 합 25종). 여기에 여섯 번째 사본을 만들지 않는다 —
# 갈라질 것이 확실하다. 런타임 차단은 application.yml 의 safety.forbidden-tokens.list 가
# 하고(세 출구 전부: responseText · scenePayload · valuePrompt), 저작 목록이 그 전역
# 목록의 부분집합인지는 아래 verified_by 가 매 빌드 확인한다.
safety_gates:
  - id: R2_R3_forbidden_tokens_lint
    scenes: [1, 2, 3, 4, 5]
    axis: 고난 귀속 금지 · 회복 압박 금지 · 목적론적 의미부여 금지
    enforcement: structural
    structural_check: >-
      금칙 토큰을 이 파일에 복제하지 않고 저작 정본(content/rahab/scene1~5.yml 의
      lint_forbidden_tokens)에 둔다. 런타임 집행은 application.yml 의 전역 목록이 하며,
      저작 목록이 그 전역 목록의 부분집합임을 아래 verified_by 가 매 빌드 확인한다.
    verified_by: 저작 게이트의 금칙 토큰이 런타임 목록에 전부 반영돼 있다

  - id: T1_no_repentance_narrative_lint
    scenes: [1, 2, 5]
    axis: T1 본문에 없는 회개·정화 서사 삽입 금지 — 여호수아는 라합의 회개를 말하지 않는다
    enforcement: structural
    structural_check: >-
      계열 7·8·9(낙인 소거 · 본문 밖 서사 · 공로화 인과)의 표층형을 저작 정본에 두고
      런타임 전역 목록이 집행한다. 이 축의 초록은 「선언된 표층형이 없다」까지이고
      「본문 밖 서사가 없다」가 아니다 — 문장 단위 신학 검토가 1차, 토큰이 2차다.
      그 1차(전문 신학 검토)는 **없다**. 대장에 등재돼 있다.
    verified_by: 저작 게이트의 금칙 토큰이 런타임 목록에 전부 반영돼 있다

  - id: R4_consent_delta_is_real
    scenes: [1, 3, 4, 5]
    axis: 카드가 없애 주겠다고 한 자막이 실제로 빠진다 — 빈 안전 통제 금지
    enforcement: structural
    structural_check: >-
      네 축약 블록(s1_no_epithet · s3_omit_2_13_2_14 · s4_declined ·
      s5_close_on_6_23_6_27)이 각각 저작의 `omitted_on_route` 가 지정한 자막을 정확히
      빼고 나머지를 그대로 남긴다. 거절 델타가 공집합인 카드는 보호를 얻었다는 착각만
      준다 — 그래서 「블록이 있다」가 아니라 「무엇이 빠졌는가」를 잰다.
    verified_by: 건너뛴 사람에게서 빠지는 자막이 저작이 지정한 그 줄들이다

  - id: content_fidelity_rahab
    scenes: [1, 2, 3, 4, 5]
    axis: 자막 24행이 저작 정본의 투영이다 — 런타임에서 자구를 발명하지 않는다
    enforcement: structural
    structural_check: >-
      다섯 Scene 의 자막을 content/rahab/scene*.yml 의 `captions[].text_ko` 와 순서까지
      포함해 축자 대조한다. 배제된 자구를 기대값으로 적지 않는다 — 배제 목록을 기대값에
      적으면 그 문장이 리포로 돌아오고, extras 는 payload 로 통째 복사되므로 화면으로
      나갈 길이 생긴다. 그래서 「없어야 할 것」이 아니라 「저작과 같은가」로 판정한다.
    verified_by: 라합 런타임 자막이 저작 정본의 자구와 한 글자도 다르지 않다

  - id: staging_invariants_rahab
    scenes: [1, 2, 3, 4, 5]
    axis: 사용자를 라합의 몸·정탐꾼의 자리·「기생의 집」의 손님 자리에 두지 않는다
    enforcement: structural
    structural_check: >-
      불변식 3종과 R1 래치 3키(post_crisis_render_policy · post_crisis_latch_scope ·
      crisis_card_position)가 다섯 Scene 에 **값까지 같게** 있는지 본다. 한 Scene 만
      풀리면 그 Scene 에서 통제가 사라지고, 나머지 넷이 초록이라 조용하다.
    verified_by: 다섯 Scene 의 위기 래칭과 연출 불변식이 값까지 같다

scenes:
  # ── Scene 1 ────────────────────────────────────────────────────────────────
  # 미션은 라합이 이미 말하고 있는 자리에서 시작한다. 사용자에게 선택지가 없다 —
  # 본문에서 손이 하는 일은 전부 라합의 행위이고, 사용자에게 넘기면 가로챈다(저작 §3-1).
  - id: 1
    title: 우리가 듣자 곧
    type: cinematic
    duration_sec: 70
    scripture_ref: jos-2:11
    next: 2
    exposure_grade: C
    trigger_warning:
      level: mid
      content:
        - sex_work_stigma
        - collective_terror_response
      consent_card_id: rahab_stigma
      # 저작 그대로 [1, 5] 다. 문자열 목적지라 「목적지가 covers 안에 있으면 안 된다」
      # 규칙(정수 전용)에 걸리지 않는다 — 이 경로는 씬을 옮기지 않고 자막만 뺀다.
      covers_scenes: [1, 5]
      skip_alternative_scene_id: "s1_no_epithet"
      # docs/RAHAB-LOCKED-STRINGS.md §2-1 — LOCKED. 재작성 금지.
      consent_card_ko: |-
        이 이야기에는 한 여인이 나옵니다. 성경 본문은 그를 '기생'이라고 부릅니다.
        그 호칭은 인용되는 자막에 다섯 번 나옵니다.
        · 이 미션은 그 호칭을 평가하지 않습니다. 좋다고도 나쁘다고도 말하지 않습니다.
        · 그 여인이 겪은 일을 재연하는 장면은 없습니다.
        · 건너뛰시면 호칭이 든 자막이 나오지 않습니다. 마지막 장면에서 그가 어떤
          사람들 가운데 살게 되었는지를 말하는 줄도 함께 빠집니다.
        · 그 두 자리에는 성경 본문이 아닌 안내 문장이 대신 뜹니다. 「본문이 아닙니다」
          표지가 함께 붙습니다.
        · 전체 7분입니다. 어느 지점에서든 멈추거나 나갈 수 있습니다.
        · 지금 보지 않으셔도 이야기는 온전히 끝맺어집니다.
