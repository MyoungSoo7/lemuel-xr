# 요셉 미션 시나리오 — 곡식 7년. MVP-JOSEPH.md 설계 기반.
# Scene 별 페이로드 + 분기 매핑. LLM 으로 생성되는 부분은 별도 캐시.
#
# 핵심 메시지: 배신·억울함·13년의 지연 속에서도 *신중함과 꾸준함* 은 헛되지 않다.
#   "하나님이 생명을 구원하시려고 나를 당신들보다 먼저 보내셨나이다" (창 45:5)
#
# 신학 기준: 대한예수교장로회 합신 / 웨스트민스터 표준 / 개혁주의 (프로젝트 단일 기준, MVP-JESUS.md §4.3 준용).
#   섭리 교리 — 하나님의 주권적 선으로 바꾸심(창 50:20). 단, 인간 악행의 책임은 소멸되지 않음(웨스트민스터 신앙고백 5장).
# 배제: 외경·영지주의·뉴에이지 혼합·번영복음("신중하면 총리 된다" 식 성공 보장 금지).
# disputed_points: 창 45:5·50:20 섭리 해석은 결정론 vs 자유의지 논쟁 지점 —
#   "하나님이 선으로 바꾸셨다" 를 *형제 악행의 정당화* 로 서술하지 않는다 (양립 교리, 단정 금지).
#
# 안전선: R2(고난 가스라이팅) 금지 — 13년 옥살이를 "성공을 위한 필수 코스" 로 미화하지 않는다.
#         용서 강요 금지 — Scene 4 의 침묵/시험 선택지는 즉시 용서 못 함의 정당성을 보존한다.
#         R4 — Scene 4 (형제 재회) 는 가족 배신 트라우마 자극 가능 → trigger_warning + 스킵 대체.
#         R1 — outro 에 위기 라우팅. R5 — ai_assist_footer 항상 노출.

# 위기 연락처는 하드코딩하지 않는다 — `{{crisis_resources.default}}` 토큰만 쓴다.
# ScenePayloadAssembler → CrisisTokenResolver 가 crisis_resources 정본(우선순위 1위 활성 전화)으로
# 치환한다. 번호를 yml 에 직접 적으면 정책 개정(예: 2024-01-01 자살예방 상담 109 통합) 때
# 낡은 번호가 위기 카피에 그대로 남는다. ScenarioHotlineRatchetTest 가 이를 강제한다.

character: joseph
title: 곡식 7년
target_user: general
# AI 보조 — 본문은 성경 참조. Scene 4 realtime_llm 응답 포함 모든 LLM 텍스트에 필수.
ai_assist_footer: "AI 보조 — 본문은 성경 참조"
scenes:
  - id: 1
    title: 파라오의 꿈
    type: cinematic
    duration_sec: 60
    narration_id: joseph.scene1.narration
    scripture_ref: gen-41:25
    extras:
      anchor: 낯선 자리·해석의 은혜
      skippable_after_sec: 3   # safety — 조용한 도입이 지루한 사용자 보호 (users.skip_intro_silence)
    next: 2

  - id: 2
    title: 풍년 — 저장 결정
    type: interaction
    interaction: pick_one
    duration_sec: 120
    scripture_ref: gen-41:34
    options:
      - { id: save_20, label: "1/5 저장", weight: 20 }
      - { id: save_33, label: "1/3 저장", weight: 33 }  # 요셉이 실제로 선택한 수준 (창 41:34)
      - { id: save_50, label: "1/2 저장", weight: 50 }
    # Phase 2-A: backend 가 사용자 결정 매칭하여 responseText 채움.
    # Phase 2-B 에서 LLM (Python AI 사이드카) 캐시 / 실시간 호출로 교체 가능.
    # 자문 통과 후 본문 갱신 — docs/governance/REVIEW-REQUEST-PACKAGE.md §1.1.
    monologues:
      save_20: "백성 중 일부만 살리는 분량. 부족이 닥치면 누군가는 굶을 것이다. 지금의 풍요를 더 많이 누리는 대신 미래의 위기를 적게 본 너의 선택이다."
      save_33: "요셉이 실제로 따른 비율(창 41:34). 풍요와 미래의 책임을 나눠 든다. 지금 손에 쥔 자루의 무게는 7년 뒤 누군가의 양식이 되어 돌아온다."
      save_50: "과한 저장. 지금 풍년의 기쁨은 줄어든다. 그러나 너의 신중함으로 굶주리는 자가 더 적을 것이다."
    extras:
      anchor: 신중함·미래 책임
      teaching_note: "어느 비율에도 '정답 보상' 은 없다 — 신중함은 결과 보장이 아니라 방향이다 (번영복음 프레임 금지)."
    next: 3

  - id: 3
    title: 흉년 — 분배 결정
    type: interaction
    interaction: distribute
    duration_sec: 120
    scripture_ref: gen-41:56
    queues:
      - { id: farmer,    label: 이집트 농민 }
      - { id: immigrant, label: 이주민 가족 }
      - { id: merchant,  label: 무역 상인 }
    rule: distribute_all_sacks
    # 사용자 결정의 priority 필드 (farmer / immigrant / merchant) 기반 매칭.
    # backend 의 responseText 매칭 — DecideSceneUseCase 가 decision.priority 로 lookup.
    outcomes:
      farmer: "이집트가 살았다. 백성이 너를 기억할 것이다. 다만 국경 너머에서 굶주린 이주민들의 손길은 너의 창고에 닿지 못했다."
      immigrant: "야곱의 가문이 너를 통해 살았다. 13년 전 너를 구덩이에 던진 형제가, 너의 양식을 받으러 올 것이다. 원망과 용서의 거리를 너는 직접 걷게 된다."
      merchant: "재정은 견고해졌으나 굶는 자들의 원망이 쌓였다. 통치는 강해지지만 다음 흉년의 분배는 더 어려워질 것이다."
    extras:
      anchor: 책임의 무게·모두를 살릴 수 없음
      teaching_note: "세 선택 모두 잃는 것이 있다 — 유한한 자원 앞의 결정은 완벽할 수 없다는 것 자체가 이 씬의 배움이다."
    next: 4

  - id: 4
    title: 형제와 재회
    type: interaction
    interaction: pick_one
    duration_sec: 120
    scripture_ref: gen-45:4
    options:
      - { id: reveal,  label: 정체를 즉시 밝힌다 }
      - { id: test,    label: 잠시 시험한다 (베냐민 데려오라) }
      - { id: silent,  label: 침묵한다 }
    realtime_llm: true   # Phase 2-B — 사용자 선택 + Scene 3 분배 결과 조합 → LLM 실시간
    # Phase 2-A 임시 — realtime_llm 활성화 전까지 정적 reactions 사용
    reactions:
      reveal: "정체를 즉시 밝힌다 — \"나는 요셉이다. 너희가 애굽에 판 그 동생이다\". 13년의 원망을 한 문장에 풀어놓는다. 형제들의 얼굴이 흙빛이 된다."
      test: "잠시 시험한다 — 베냐민을 데려오라 명한다. 형제들의 변화가 진실한지, 그들의 마음이 13년 전과 같은지 확인한다."
      silent: "침묵한다 — 다만 곡식을 내어준다. 재회의 기쁨도 분노도 아직 너의 몫이 아니다. 시간이 더 필요하다."
    extras:
      anchor: 배신의 기억·용서의 자유
      forgiveness_note: "R 가드 — 세 선택지 중 '정답' 은 없다. 즉시 용서하지 못하는 마음(test/silent)은 믿음의 결함이 아니다. 용서는 강요될 수 없는 *자유* 다. 현실의 학대·배신 피해 상황에서는 화해 시도보다 안전이 우선이다."
    trigger_warning:
      level: medium
      content: ["betrayal", "family_trauma"]
      consent_card_id: "joseph_scene4_reunion_warning"
      skip_alternative_scene_id: 5
    next: 5

  - id: 5
    title: 결말
    type: outro
    duration_sec: 60
    scripture_ref: gen-45:5
    # CROSS-MAPPING-VR-AR.md §3 — 요셉이 빛내는 AR 1~7 가치 (●●●)
    linked_values: [1, 2, 7]   # 일기·묵상(꾸준함) · 잠언(신중함) · 사람(용서)
    value_prompt: "요셉의 13년 옥살이는 *꾸준함* 의 자리였습니다. 오늘 *3줄 일기* 한 번이 일주일 후 30분 묵상을 만듭니다. 잠시 일기장을 펴 보세요."
    extras:
      anchor: 섭리의 회고·원망의 내려놓음
      static_monologue: "\"당신들이 나를 이 곳에 팔았다고 해서 근심하지 마소서\" (창 45:5). 요셉은 13년이 지난 *후에야* 이 문장을 말할 수 있었습니다. 지금 원망 중이라면 — 그 시간도 요셉의 시간입니다."
      suffering_note: "R2 가드 — 13년 옥살이를 '성공을 위한 필수 코스' 로 미화하지 않는다. 고난의 의미화는 회고적 은혜이지, 현재 고난을 견디라는 강요가 아니다. 학대·피해 상황이라면 견딤이 아니라 안전과 상담 자원 연결이 우선이다."
      recovery_keys:
        ANGRY:      joseph.recovery.betrayal_named
        SAD:        joseph.recovery.thirteen_years
        LONELY:     joseph.recovery.prison_faithfulness
        EXHAUSTED:  joseph.recovery.small_daily
        CONFUSED:   joseph.recovery.providence_later
      crisis_reminder: "{{crisis_resources.default}}."   # R1 — 위기 감지 시 1번 정적 콘텐츠(일기+상담)로 라우팅
      next_scene_suggestion: "트랙 A — 1번 일기·묵상 (3줄 일기) 또는 잠언 신중함 카드"
    next: null
