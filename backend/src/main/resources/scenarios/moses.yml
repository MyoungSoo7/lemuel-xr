# 모세 미션 시나리오 — 떨기나무 앞에서. MVP-MOSES.md 설계 기반.
# 핵심 감정 anchor: 두려움 · 부름 · 떨림 · 책임 · 신뢰.
# 6 Scene · 6~8분.
#
# 핵심 메시지: 무자격감·변명·떨림은 부름을 취소시키지 않는다 — "내가 반드시 너와 함께 있으리라" (출 3:12).
#
# 신학 기준: 대한예수교장로회 합신 / 웨스트민스터 표준 / 개혁주의 (프로젝트 단일 기준, MVP-JESUS.md §4.3 준용).
#   소명 교리 — 부르심의 근거는 사람의 자격이 아니라 하나님의 동행 약속(출 3:12).
# 배제: 외경·영지주의·뉴에이지 혼합·"큰 믿음 = 큰 성취" 프레임.
#
# 안전선: 소명 압박 금지 — "부름" 을 '지금 당장 큰 일을 해내라' 는 성취 압박으로 서술하지 않는다.
#         변명 카드(Scene 3)는 죄책 목록이 아니라 *정직한 고백* 의 자리다.
#         R2 — 광야 40년을 '성공 전 필수 훈련 코스' 로 미화하지 않는다.
#         R1 — outro 위기 라우팅. R5 — ai_assist_footer 항상 노출.

character: moses
title: 떨기나무 앞에서
target_user: general
# AI 보조 — 본문은 성경 참조. Scene 4 realtime_llm 응답 포함 모든 LLM 텍스트에 필수.
ai_assist_footer: "AI 보조 — 본문은 성경 참조"
scenes:
  - id: 1
    title: 광야의 침묵
    type: cinematic
    duration_sec: 40
    narration_id: moses.scene1.narration
    extras:
      anchor: 자기부정·체념
      skippable_after_sec: 3   # safety — skip 옵션 (users.skip_intro_silence)
    next: 2

  - id: 2
    title: 떨기나무 앞에서
    type: interaction
    interaction: gesture_sequence
    duration_sec: 120
    narration_id: moses.scene2.narration
    scripture_ref: ex-3:5
    extras:
      anchor: 경외·두려움·거부
      steps:
        - { id: approach,     label: "다가가기"   }
        - { id: remove_shoes, label: "신을 벗기"  }
        - { id: look_up,      label: "고개 들기"  }
      hapticHint: { intensity: 0.4, pattern: PULSE_SOFT, fallback: { audioCueId: bush-soft } }
    next: 3

  - id: 3
    title: 다섯 변명의 카드
    type: interaction
    interaction: distribute
    duration_sec: 120
    narration_id: moses.scene3.narration
    extras:
      anchor: 자기방어·고백
      cards:
        - { id: who_am_i,     label: "제가 누구이기에",      scripture: ex-3:11 }
        - { id: who_sent_me,  label: "이름이 무엇이냐 물으면", scripture: ex-3:13 }
        - { id: trust_me,     label: "믿지 않으면",          scripture: ex-4:1 }
        - { id: cant_speak,   label: "말이 둔하니",          scripture: ex-4:10 }
        - { id: send_other,   label: "보낼 만한 자를 보내소서", scripture: ex-4:13 }
      slots: ["throw", "heart"]   # 던지기 vs 가슴에 가져가기
      monologue_cache_keys:
        all_throw:  moses.s3.outcome.all_throw
        all_heart:  moses.s3.outcome.all_heart
        mixed:      moses.s3.outcome.mixed
      excuse_note: "R 가드 — 변명을 '던지지 못함'(가슴에 가져감)은 실패가 아니다. 모세의 다섯 변명은 책망이 아니라 대화로 응답받았다. 무자격감을 *말해도 되는* 자리가 이 씬의 목적이다."
    next: 4

  - id: 4
    title: 파라오 앞에서
    type: interaction
    interaction: pick_one
    duration_sec: 90
    scripture_ref: ex-7:10
    extras:
      anchor: 공포·동행 인식
      options:
        - { id: cast_now,       label: "지팡이를 던진다 (즉시)" }
        - { id: hesitate,       label: "망설인다 (5초)" }
        - { id: with_aaron,     label: "아론을 본다 (동행)" }
      realtime_llm: true
      hapticHint: { intensity: 0.7, pattern: PULSE_HARD, channel: BOTH, fallback: { audioCueId: tremor-deep } }
      hesitation_note: "R 가드 — 망설임(hesitate)과 도움 청함(with_aaron)은 '덜 믿음' 이 아니다. 아론의 동행 자체가 하나님의 배려였다 (출 4:14-16). 혼자 해내라는 압박을 서사에 싣지 않는다."
    next: 5

  - id: 5
    title: 홍해 앞에서
    type: interaction
    interaction: gesture_sequence
    duration_sec: 60
    scripture_ref: ex-14:13
    extras:
      anchor: 책임의 무게·신뢰
      steps:
        - { id: lift_staff, label: "지팡이를 들고 손을 뻗는다" }
      one_action_only: true
      teaching_note: "\"너희는 두려워하지 말고 가만히 서서 여호와께서 오늘 너희를 위하여 행하시는 구원을 보라\" (출 14:13) — 이 씬의 한 동작은 성취가 아니라 신뢰의 표현이다."
    next: 6

  - id: 6
    title: 회복
    type: outro
    duration_sec: 30
    scripture_ref: ex-3:12
    # CROSS-MAPPING-VR-AR.md §3 — 모세가 빛내는 AR 1~7 가치 (●●●)
    linked_values: [3, 4, 6, 7]
    value_prompt: "모세의 광야 40년은 *기다림* 의 시간이었습니다. 오늘 *전도서 한 절* — 인생의 계절을 인정하는 시 — 을 읽어보세요."
    extras:
      anchor: 안식·동반
      static_monologue: "\"내가 반드시 너와 함께 있으리라\" (출 3:12). 부르심의 근거는 모세의 자격이 아니라 이 약속이었습니다. 오늘 무자격감이 크다면 — 그 감정은 모세의 감정이기도 했습니다."
      suffering_note: "R2 가드 — 광야 40년을 '지도자가 되기 위한 필수 코스' 로 미화하지 않는다. 기다림의 의미화는 회고적이며, 현재의 정체·지연을 견디라는 강요가 아니다."
      recovery_keys:
        ANXIOUS:   moses.recovery.fear
        LONELY:    moses.recovery.aloneness
        EXHAUSTED: moses.recovery.wilderness40
        SAD:       moses.recovery.companion
        CONFUSED:  moses.recovery.who_am_i
      crisis_reminder: "1393."   # R1 — 위기 감지 시 1번 정적 콘텐츠(일기+상담)로 라우팅
      next_scene_suggestion: "트랙 A — 전도서 '인생의 계절' 카드 또는 시편 90 (모세의 시)"
    next: null
