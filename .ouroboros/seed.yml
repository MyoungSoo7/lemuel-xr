ontology_schema:
  name: TheologyContentSafetyGate
  description: Domain model for theology gate v1 enforcement — gate declarations with
    T1_ axis prefix, L2 forbidden token matching, golden set fixture validation, Micrometer
    counter observability, and character roster coverage across the existing content
    safety framework
  fields:
  - name: gate_id
    type: string
    description: T1_-prefixed gate identifier in scene YAML safety_gates (e.g. T1_no_gnostic_dualism);
      distinct from R1-R5 mental-health namespace
    required: true
  - name: axis
    type: string
    description: Safety axis label — theology or mental_health; determines enforcement
      path, counter tags, and ChatOps routing
    required: true
  - name: enforcement_type
    type: string
    description: Gate enforcement mode — structural (prose check backed by verified_by)
      or token_lint (ForbiddenTokenScanner match)
    required: true
  - name: verified_by
    type: string
    description: Test method identifier backing a structural enforcement gate; meta-test
      validates this reference resolves to existing source
    required: true
  - name: forbidden_token
    type: string
    description: Narrow Korean surface-form phrase for L2 substring matching (e.g.
      갇혀 있는 감옥); must have empirical golden-set evidence
    required: true
  - name: fixture_id
    type: string
    description: Golden set fixture identifier matching filename in eval/grounding/v1/fixtures/;
      globally unique per GoldenSetIntegrityTest
    required: true
  - name: fixture_class
    type: string
    description: Golden set classification — heterodox (should be caught), orthodox
      (must not be caught), or structural (must not be caught)
    required: true
  - name: detection_status
    type: string
    description: Token lint cross-check result — CAUGHT_BY_TOKEN_LINT or MISSED_BY_TOKEN_LINT;
      determined by ForbiddenTokenScanner.scan against fixture meditationText
    required: true
  - name: rule_id
    type: string
    description: Opaque identifier for Micrometer counter tags and log correlation;
      never contains token literals due to unauthenticated actuator endpoint
    required: true
  - name: exemption_reason
    type: string
    description: Stated reason why a character is exempt from T-axis gate declaration;
      required when T-axis gates are absent — empty string is not valid exemption
    required: true
  - name: counter_layer
    type: string
    description: Gate layer dimension for content.gate.block counter — L1 (prompt
      guard) or L2 (token match); enables future L1 contribution measurement
    required: true
  - name: character_name
    type: string
    description: One of 12 gate-configured characters from scripts/gates/; roster
      completeness test enumerates this fixed set
    required: true
evaluation_principles:
- name: heterodox_recall
  description: All 7 heterodox fixtures in the 13-fixture golden set must be detected
    by L2 token matching; 7/7 is the v1 floor, measured against frozen fixture text
    only
  weight: 0.3
- name: orthodox_precision
  description: Zero false positives on 4 orthodox and 2 structural fixtures; a false
    positive blocks legitimate theological content and is as severe as a miss
  weight: 0.3
- name: user_indistinguishability
  description: Theology and mental-health blocking produce byte-identical user-facing
    responses; any observable difference enables user reverse-engineering of block
    reason
  weight: 0.2
- name: observability_from_zero
  description: Gate events measurable from registered-at-boot zero baseline on both
    code paths; counter absence and counter value 0 must be distinguishable
  weight: 0.1
- name: enforcement_integrity
  description: No silent pass-through — new characters cannot skip theology enforcement
    without explicit exemption; structural declarations must be machine-verifiable
    via verified_by links
  weight: 0.1
exit_conditions:
- name: golden_set_green
  description: Golden set token lint cross-check test passes with 7/7 heterodox recall
    and 0/6 false positives
  criteria: GoldenSetTokenLintCrossCheckTest and GoldenSetIntegrityTest pass; all
    heterodox fixtures show CAUGHT_BY_TOKEN_LINT status
- name: ci_unconditional
  description: All theology L2 tests execute in default CI without external API keys
  criteria: Tests pass with GEMINI_API_KEY unset; no @EnabledIfEnvironmentVariable
    annotation on theology test classes
- name: enforcement_complete
  description: All 12 gate-configured characters covered by T-axis declaration or
    explicit exemption; four axis predicates recognize T-prefix
  criteria: Roster completeness test passes; isConstraintAxis, AXIS regex, AXIS_RE,
    and g5d all match T1_ identifiers
- name: counter_registered
  description: content.gate.block counter queryable at boot with axis and layer dimensions
  criteria: Counter with axis=theology appears in actuator/prometheus output at application
    startup with value 0
